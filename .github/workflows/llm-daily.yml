# LLM 일일 문제 생성 배치 — 설계 docs/14, 결정 ADR-0006(개정).
#
# [왜 이 워크플로가 생겼나]
# 원래는 앱 안의 @Scheduled가 매일 06시에 돌았다. 그런데 이 앱은 개인 PC에서 뜨는 앱이라
# 그 시각에 PC나 앱이 꺼져 있으면 배치가 통째로 사라진다 — 실제로 겪었다(초안 0건).
# "예약 실행"의 주체를 상시 켜져 있는 곳으로 옮겨야 했고, 서버를 새로 띄우는 대신
# 이미 쓰고 있던 GitHub Actions를 썼다. 결과는 저장소에 커밋해 두고(택배함),
# 로컬 앱이 기동할 때 검수 대기함으로 흡수한다(DraftImportRunner).
#
# [Actions를 배치 실행기로 써도 되는 이유]
# 사용자 대면 기능이 아니고 · 하루 밀려도 무해하며 · 멱등하고 · 결과물이 저장소 콘텐츠이고
# · 사설망 접근이 필요 없다. 이 조건을 벗어나는 작업(실시간·SLA 필요)이라면
# k8s CronJob이나 Cloud Scheduler를 써야 한다 — Actions의 schedule은 보장이 아니라 최선노력이다.
#
# [비용] 하루 1회 5문제 = 월 3천원 남짓. 공개 저장소라 러너 사용 시간은 무료.

name: LLM 일일 생성

on:
  schedule:
    # UTC 21:17 = 한국시간 06:17. 정시(:00)는 전 세계 워크플로가 몰려 가장 많이 밀리므로
    # 일부러 어중간한 분을 골랐다. 몇십 분 밀려도 무해한 작업이라 이 정도면 충분하다.
    - cron: '17 21 * * *'
  workflow_dispatch:
    # 수동 실행 — 비워 두면 예약 실행과 똑같이(날짜 순환으로) 동작한다.
    inputs:
      type:
        description: '무엇을 만들지 (auto = 4일 주기가 결정. 예약 실행과 같음)'
        type: choice
        required: false
        default: 'auto'
        options:
          - auto
          - problem
          - document
      topic:
        # 비워 두는 것이 평소 경로다 — 예약 실행은 generated/_topics.json(주제 대기열)에서
        # 위에서부터 하나씩 꺼내 쓰고, 그것도 비면 모델이 고른다. 여기 적는 주제는
        # "이번 한 번만"이라 대기열을 소모하지 않는다(DraftGeneratorCli.generateDocument).
        description: '문서 주제 (type=document일 때만). 비우면 주제 대기열(_topics.json) → 모델 자동 선택'
        required: false
        default: ''
      domain:
        description: '분야 (예: NETWORK). 비우면 날짜 순환'
        required: false
        default: ''
      difficulty:
        description: '난이도 (BEGINNER/INTERMEDIATE/ADVANCED). 비우면 날짜 순환'
        required: false
        default: ''
      count:
        description: '생성 개수. 비우면 application.yml의 batch-count'
        required: false
        default: ''
      date:
        description: '기준 날짜(YYYY-MM-DD). 비우면 오늘(한국 시간)'
        required: false
        default: ''
      force:
        description: 'batch-enabled=false여도 이번 한 번은 생성'
        type: boolean
        required: false
        default: false

# 최소 권한 원칙 — 결과 파일을 커밋해야 하므로 contents 쓰기만 준다.
# 기본값에 기대지 않고 명시하는 이유: 저장소 기본 권한 설정이 바뀌어도 이 워크플로가
# 필요 이상의 권한을 갖지 않게 못 박아 두기 위해서다.
permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌면 같은 날짜 파일을 두 번 만들려다 푸시가 충돌한다.
# cancel-in-progress를 false로 둔 이유: 진행 중인 생성을 죽이면 이미 지불한 API 요금이 버려진다.
concurrency:
  group: llm-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 어댑티브 사고(thinking)를 켜 둬서 5문제면 수 분까지 걸릴 수 있다.
    # 그래도 상한을 둬야 무언가 매달렸을 때 러너 시간을 무한정 쓰지 않는다.
    timeout-minutes: 20

    # MySQL·Redis 서비스 컨테이너가 없다: DraftGeneratorCli는 Spring을 띄우지 않고
    # 생성기만 직접 만들어 호출하므로 DB가 필요 없다(그래서 빠르고 싸다).

    steps:
      # 서드파티 액션은 태그가 아니라 커밋 SHA로 고정한다.
      # 이 job에는 ANTHROPIC_API_KEY가 환경변수로 들어오는데, 같은 job에서 도는 액션은
      # 그 값을 읽을 수 있다. 태그(@v4)는 언제든 다른 커밋을 가리키게 바뀔 수 있으므로,
      # 액션이 탈취되면 키가 새어 나간다. SHA 고정은 이 공급망 위험에 대한 표준 대응이다.
      # (버전을 올릴 때는 SHA와 옆의 주석을 함께 바꾼다.)
      - name: 저장소 코드 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: JDK 21 설치
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # 리포에 커밋된 gradlew는 실행 권한 비트가 없어(윈도우에서 생성됨) 리눅스 러너에서
      # "Permission denied"가 난다 — ci-cd.yml과 같은 처리.
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # 무엇을 만들지는 CLI가 날짜로 정한다(4일 주기: 0일차 문서, 1~3일차 초·중·고급 문제 — docs/15).
      # 워크플로가 요일을 계산해 분기하지 않는 이유: 같은 판단이 셸과 자바 두 곳에 생기면
      # 언젠가 어긋나 "문서일인데 문제가 나오는" 날이 온다. 규칙은 GenerationSchedule 한 곳에만 둔다.
      - name: 생성 (문서/문제는 주기가 결정)
        env:
          # SDK와 ClaudeProblemGenerator가 이 이름의 환경변수를 직접 읽는다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 수동 입력값을 셸 명령에 직접 박지 않고 환경변수로 받는 이유: 입력에 따옴표나
          # 세미콜론이 들어오면 명령이 조작될 수 있다(스크립트 인젝션). 값으로만 다루면 안전하다.
          IN_DOMAIN: ${{ inputs.domain }}
          IN_DIFFICULTY: ${{ inputs.difficulty }}
          IN_COUNT: ${{ inputs.count }}
          IN_DATE: ${{ inputs.date }}
          # 예약 실행에서는 inputs가 비어 있으므로 force는 항상 꺼진 상태로 넘어간다 —
          # 중단 스위치를 예약 실행이 스스로 무시하는 일은 구조적으로 불가능하다.
          IN_FORCE: ${{ inputs.force }}
          # 예약 실행에서는 inputs가 비어 type이 빈 문자열로 넘어간다 → CLI가 주기로 판단한다.
          # 수동 실행에서 'auto'를 고른 경우도 같아야 하므로 빈 값으로 바꿔 넘긴다 —
          # CLI 입장에서 "지정 안 함"과 "auto"는 같은 뜻이고, 그 판단을 여기서 한 번만 한다.
          IN_TYPE: ${{ inputs.type == 'auto' && '' || inputs.type }}
          # 주제는 "TCP 혼잡 제어"처럼 공백이 들어간다. -PdraftArgs는 공백으로 인자를 쪼개므로
          # 거기 실으면 단어 단위로 찢어진다 — CLI가 환경변수로 직접 읽게 한다(DraftGeneratorCli 주석).
          DRAFT_TOPIC: ${{ inputs.topic }}
        run: |
          ./gradlew generateDrafts --no-daemon --console=plain \
            -PdraftArgs="--domain=${IN_DOMAIN} --difficulty=${IN_DIFFICULTY} --count=${IN_COUNT} --date=${IN_DATE} --force=${IN_FORCE} --type=${IN_TYPE}"

      - name: 결과 커밋 & 푸시
        run: |
          # 앞의 "gradlew 실행 권한 부여" 스텝(chmod +x)이 파일 모드를 100644 → 100755로
          # 바꿔 놓는다. git은 실행 권한 비트도 추적하므로 이게 "커밋되지 않은 수정"으로 남고,
          # 그 상태에서는 rebase가 거부된다 — 첫 실행이 정확히 이걸로 실패했다
          # ("cannot pull with rebase: You have unstaged changes").
          # 모드 변경을 추적하지 않게 해서 원인 자체를 없앤다. ci-cd.yml은 커밋을 하지 않아
          # 같은 chmod를 쓰고도 이 문제가 드러나지 않았다.
          git config core.fileMode false

          # 생성된 게 없으면(같은 날짜 파일이 이미 있어 건너뛴 경우) 조용히 끝낸다 —
          # 빈 커밋을 남기면 히스토리만 지저분해진다.
          if [ -z "$(git status --porcelain generated)" ]; then
            echo "새로 생성된 파일 없음 — 커밋 건너뜀"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated

          # 커밋 메시지에 무엇이 만들어졌는지 적는다. 4일 주기라 날마다 다른 것이 나오는데
          # 메시지가 늘 "문제 초안"이면 로그만 보고는 그날 무엇이 나왔는지 알 수 없다.
          # 판단 근거는 실제로 추가된 파일 경로다 — 주기를 셸에서 다시 계산하면 어긋날 수 있다.
          if git diff --cached --name-only | grep -q '^generated/documents/'; then
            KIND="개념 문서 초안"
          else
            KIND="문제 초안"
          fi
          git commit -m "chore(llm): $(TZ=Asia/Seoul date +%F) ${KIND} 자동 생성"

          # 그 사이 사람이 푸시했을 수 있다. generated/ 아래 새 파일만 추가하므로 내용 충돌은
          # 사실상 없지만, 뒤처진 상태로는 푸시가 거부되므로 rebase로 맞춰 준다.
          # --autostash는 보험이다: 빌드가 작업 트리에 무언가를 남겨도 rebase가 멈추지 않는다.
          # 위 core.fileMode 설정이 알려진 원인을 없애지만, 모르는 원인까지 막아 둔다 —
          # 이 스텝이 실패하면 이미 지불한 API 요금이 결과 없이 버려지기 때문(첫 실행에서 실제로 겪음).
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 실행 결과를 Actions 요약 화면에 남긴다 — 로그를 뒤지지 않고 무엇이 만들어졌는지 보려고.
      - name: 요약 남기기
        if: always()
        run: |
          echo "### LLM 일일 생성 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 generated/ 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || echo "(생성 디렉터리 없음)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
