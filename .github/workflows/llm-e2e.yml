# LLM 실 API 감시 테스트 — 주 1회 + 필요할 때 수동 실행.
#
# 왜 ci-cd.yml과 분리했나: 이 워크플로는 실행할 때마다 Claude API 요금이 든다(1회 약 100원).
# 매 push·PR마다 도는 ci-cd.yml에 넣으면 커밋 한 번에 돈이 나가므로, 트리거를 분리하는 것이
# 비용 통제의 핵심이다. ci-cd.yml은 손대지 않았다.
#
# 무엇을 감시하나: 우리가 코드를 고치지 않아도 깨지는 것들 — 모델 은퇴(404), 키 만료(401),
# 구조화 출력 스키마 변경, 지출 한도 초과(429). 일일 생성 배치는 실패해도 로그만 남기고
# 조용히 넘어가기 때문에(LlmGenerationScheduler), 이 워크플로가 사실상 유일한 알림 경로다.
# GitHub Actions는 워크플로 실패 시 저장소 소유자에게 자동으로 메일을 보낸다.
name: LLM E2E

on:
  workflow_dispatch:        # Actions 탭에서 버튼으로 즉시 실행 (설정 바꾼 뒤 확인용)
  schedule:
    # 매주 월요일 00:00 UTC = 한국시간 월요일 09:00.
    # 주 1회인 이유: 이 사고들은 "언젠가 갑자기" 일어나고 하루 이틀 늦게 알아도 치명적이지 않다.
    # 매일 돌리면 감시 비용이 배치 비용에 육박해 배보다 배꼽이 커진다.
    - cron: '0 0 * * 1'

jobs:
  llm-e2e:
    runs-on: ubuntu-latest
    # 어댑티브 사고(thinking)를 켜 둬서 응답이 수십 초 걸릴 수 있다. 그래도 10분이면 충분하고,
    # 무언가 매달려 있을 때 러너 시간을 무한정 쓰지 않도록 상한을 둔다.
    timeout-minutes: 10

    # MySQL·Redis 서비스 컨테이너가 없다: 이 테스트는 Spring 컨텍스트를 띄우지 않고
    # ClaudeProblemGenerator만 직접 만들어 호출하므로 DB가 필요 없다(그래서 빠르고 싸다).
    steps:
      - name: 저장소 코드 받기
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # 리포에 커밋된 gradlew는 실행 권한 비트가 없어(윈도우에서 생성됨) 리눅스 러너에서
      # "Permission denied"가 난다 — ci-cd.yml과 같은 처리.
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 실 API 테스트 실행
        env:
          # SDK와 ClaudeProblemGenerator가 이 이름의 환경변수를 직접 읽는다.
          # 키가 비어 있으면 테스트는 실패가 아니라 "건너뜀"으로 끝난다(@EnabledIfEnvironmentVariable).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./gradlew test --tests '*ClaudeProblemGeneratorE2ETest' --no-daemon

      - name: 테스트 리포트 업로드 (실패 시에도)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-e2e-results
          path: build/reports/tests/test
          retention-days: 14
