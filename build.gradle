plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'project.study'
version = '0.0.1-SNAPSHOT'
description = 'study_project'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ── 한글(비ASCII) 프로젝트 경로 우회 ────────────────────────────────
// Windows 사용자명이 한글이면(예: C:\Users\홍길동\...) Gradle 테스트 워커 JVM이
// 클래스패스의 비ASCII 경로를 디코딩하지 못해 ClassNotFoundException으로 테스트가
// 실행조차 안 된다. 프로젝트 경로에 비ASCII 문자가 있을 때만 빌드 출력(컴파일된
// 클래스·리소스)을 ASCII 경로로 옮겨 이 문제를 피한다.
//   - 경로가 전부 ASCII인 환경(다른 PC/CI)에서는 이 블록이 건너뛰어져 기본 build/ 사용 → 이식성 유지.
//   - 의존성(jar)은 GRADLE_USER_HOME을 ASCII 경로로 두어 함께 해결한다(README/07 참고).
if (!(projectDir.absolutePath ==~ /\p{ASCII}+/)) {
    layout.buildDirectory.set(file("C:/Users/Public/gradle-builds/${rootProject.name}"))
}

repositories {
    mavenCentral()
}

dependencies {
    // ── MVP 핵심 ──────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Flyway (스키마 버전 관리) — MySQL 8은 flyway-mysql 모듈 필요, 버전은 Boot BOM 관리
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DevTools (선택)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // JWT (jjwt 0.12.x) — 명시 버전 필요
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Swagger / OpenAPI (Boot 3.x 대응 2.x)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // [캐싱 레이어 / 로드맵2] Redis — 문서 캐싱 + refresh 토큰 저장소
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // [최적화 레이어 / 로드맵1] QueryDSL — SQL을 자바 코드로 타입 안전하게 작성하는 도구.
    // 문서 목록의 N+1 제거 + 목록 프로젝션(본문 제외)에 사용 (docs/08 실측 근거).
    // Spring Boot 3(jakarta EE)에서는 :jakarta 분류자가 필수 — 없으면 javax.* 기준이라 컴파일 실패.
    // annotationProcessor가 컴파일 시 엔티티마다 Q클래스(QDocument 등)를 생성한다.
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // [LLM 문제 생성 / B안] Anthropic 공식 Java SDK — Claude API 호출.
    // 구조화 출력(record 클래스 → JSON 스키마 강제)으로 문제를 항상 같은 형태로 받는다.
    // 설계는 docs/13, 결정 배경은 ADR-0006. API 키는 ANTHROPIC_API_KEY 환경변수로만 주입.
    implementation 'com.anthropic:anthropic-java:2.34.0'

    // [모니터링] Actuator (포트폴리오 가점)
    // implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── 테스트 ────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers (통합테스트 작성 시 주석 해제 / 버전은 Boot BOM 관리)
    // testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // testImplementation 'org.testcontainers:junit-jupiter'
    // testImplementation 'org.testcontainers:mysql'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── 로컬 실행 시 API 키 주입 ─────────────────────────────────────
//
// AnthropicClientHolder는 System.getenv("ANTHROPIC_API_KEY")를 직접 읽는다(SDK 규약).
// 그래서 application.yml이나 application-local.properties로는 줄 수 없고, 앱을 띄우는
// 프로세스의 환경변수로 넣어야 한다.
//
// [왜 전역 환경변수로 두지 않는가]
// 사용자 환경변수(User scope)에 두면 이 PC의 <모든> 프로그램이 그 키를 본다. 실제로
// Claude Code CLI가 그것을 감지해 "이 키를 쓸까요?"라고 묻고, 승인하면 코딩 세션 요금이
// csquiz와 같은 콘솔 예산($10/월)에서 빠진다. 예산이 마르면 일일 배치가 조용히 죽는데
// (오류 메일도 안 온다) 원인이 엉뚱한 곳에 있어 찾기까지 며칠 걸린다.
//
// [그래서 어디에 두는가]
// Gradle 홈의 gradle.properties — 저장소 <바깥>이라 커밋될 수 없고, Gradle이 앱을 띄울
// 때만 읽는다. .gitignore에 뭔가를 더 적을 필요도 없다(저장소 안에 파일을 두면 언젠가
// 실수로 커밋된다 — 공개 저장소라 그 순간 키가 인터넷에 공개된다).
//
//   <GRADLE_USER_HOME>\gradle.properties
//   anthropicApiKey=sk-ant-api03-...
//
// 경로를 "~/.gradle"로 적지 않은 이유: 이 PC는 GRADLE_USER_HOME이 C:\Users\Public\gradle-home으로
// 바뀌어 있다. 기본 경로에 파일을 두면 Gradle이 <아예 보지 않는데> 오류도 안 나고
// "키가 없다"는 안내만 뜬다 — 실제로 그렇게 한 번 헛짚었다. 자기 PC의 값은 이렇게 확인한다:
//   PowerShell> $env:GRADLE_USER_HOME    (비어 있으면 ~/.gradle 이 기본값)
//
// 환경변수가 이미 있으면 그쪽을 존중한다 — CI나 다른 실행 방식과 부딪히지 않게.
// 둘 다 없으면 앱은 정상적으로 뜨고 생성 기능만 LLM_004(503)로 막힌다.
// ── 로컬 실행용 개발 비밀값 ───────────────────────────────────────
//
// application.yml에서 jwt.secret과 admin.password의 기본값을 없앴다 — 저장소가 공개라
// 거기 적힌 값은 곧 "누구나 아는 값"이고, 서명 키가 알려지면 로그인 없이 관리자 토큰을
// 만들 수 있기 때문이다(2026-08-20 보안 점검). 대신 값이 없으면 앱이 뜨지 않는다.
//
// [그래서 로컬은 어떻게 도나]
// 이 블록이 bootRun에만 값을 넣어 준다. 핵심은 <b>jar 실행에는 끼어들지 않는다</b>는 것이다 —
// 운영은 도커/서버에서 java -jar로 뜨므로 Gradle이 관여할 자리가 없고, 환경변수를 안 주면
// 그대로 실패한다. 즉 아래 개발용 값은 <b>내 PC의 bootRun에서만</b> 살아 있다.
//
// [왜 개발용 값을 여기 적어 두나 — 공개돼도 괜찮은가]
// 괜찮다. 이 값으로 서명된 토큰은 이 값을 쓰는 서버에서만 통하는데, 그런 서버는
// 개발자 PC의 bootRun뿐이다. 반대로 이 값을 안 적으면 저장소를 새로 받은 사람이
// 아무것도 못 돌린다 — 그 불편을 감수할 만큼의 이득이 없다.
// 진짜 비밀(운영 키, API 키)은 여전히 저장소 바깥에 둔다(위 anthropicApiKey 주석).
//
// 환경변수나 Gradle 속성이 있으면 그쪽을 존중한다 — 운영 값으로 로컬 재현을 해 볼 수 있게.
tasks.named('bootRun') {
    String apiKey = project.findProperty('anthropicApiKey') ?: System.getenv('ANTHROPIC_API_KEY')
    if (apiKey) {
        environment 'ANTHROPIC_API_KEY', apiKey
    } else {
        doFirst {
            logger.lifecycle('[csquiz] ANTHROPIC_API_KEY가 없습니다 — AI 생성 기능만 503으로 막힙니다. ' +
                    '~/.gradle/gradle.properties 에 anthropicApiKey=... 를 넣으세요.')
        }
    }

    // HS384로 서명하므로 384비트(48바이트) 이상이어야 한다. 짧으면 부팅 단계에서 바로 터진다.
    environment 'JWT_SECRET', project.findProperty('jwtSecret')
            ?: System.getenv('JWT_SECRET')
            ?: 'csquiz-local-development-only-signing-key-not-used-in-production-0123456789'
    environment 'ADMIN_PASSWORD', project.findProperty('adminPassword')
            ?: System.getenv('ADMIN_PASSWORD')
            ?: 'admin1234'
}

// ── 일일 문제 생성 배치 (docs/14) ─────────────────────────────────
// GitHub Actions(.github/workflows/llm-daily.yml)가 매일 이 태스크를 실행해 문제를 만들고
// generated/YYYY-MM-DD.json으로 커밋한다. 로컬에서 손으로 돌려볼 수도 있다:
//   .\gradlew.bat generateDrafts -PdraftArgs="--domain=NETWORK --count=1"
//
// bootRun이 아니라 JavaExec인 이유: 이 진입점은 Spring 컨텍스트를 띄우지 않는다(DB 불필요).
// bootRun으로 돌리면 MySQL 연결을 요구해서 러너에 DB 컨테이너를 붙여야 한다 —
// "생성만 하는 작업에 DB를 왜 띄우나"라는 문제가 생긴다. 자세한 배경은 DraftGeneratorCli 주석.
tasks.register('generateDrafts', JavaExec) {
    group = 'llm'
    description = 'Claude로 하루치 문제를 생성해 generated/ 아래 JSON으로 저장한다'
    mainClass = 'project.study.study_project.llm.cli.DraftGeneratorCli'
    // 메인 소스셋의 런타임 클래스패스 — application.yml(모델·후보 도메인)도 여기 포함된다
    classpath = sourceSets.main.runtimeClasspath

    // 인자는 한 덩어리 문자열로 받는다. Gradle의 -P는 값 하나만 넘길 수 있어서,
    // 여러 옵션을 주려면 공백으로 이어 붙인 뒤 여기서 쪼개는 방식이 가장 단순하다.
    if (project.hasProperty('draftArgs')) {
        String raw = project.property('draftArgs').toString().trim()
        if (!raw.isEmpty()) {
            args raw.split(/\s+/)
        }
    }
}

// 프롬프트 평가 하네스 — 프롬프트를 고쳤을 때 나아졌는지 몇 분 만에 재는 도구.
//
//   .\gradlew.bat evalPrompt -PevalArgs="--label=before"
//   (프롬프트 수정)
//   .\gradlew.bat evalPrompt -PevalArgs="--label=after"
//   → eval/ 아래 두 보고서를 나란히 놓고 본다
//
// 예약 실행에 딸려 들어가지 않도록 일부러 별도 태스크로 뒀다. 실제 API를 부르므로
// (기본 9문제 ≈ 하루치 배치의 두 배) check/build에 엮으면 요금이 조용히 새어 나간다.
// 배치의 중단 스위치도 보지 않는다 — 배치를 꺼 둔 채 프롬프트를 고치는 상황이
// 바로 이 도구가 필요한 때이기 때문. 자세한 배경은 PromptEvalCli 주석.
tasks.register('evalPrompt', JavaExec) {
    group = 'llm'
    description = '고정된 근거 문서로 세 난이도를 생성해 채점하고 eval/에 보고서를 남긴다'
    mainClass = 'project.study.study_project.llm.cli.PromptEvalCli'
    classpath = sourceSets.main.runtimeClasspath

    if (project.hasProperty('evalArgs')) {
        String raw = project.property('evalArgs').toString().trim()
        if (!raw.isEmpty()) {
            args raw.split(/\s+/)
        }
    }
}
