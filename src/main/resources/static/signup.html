<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container narrow">
  <h1>회원가입</h1>
  <!-- 앞 화면(소개)에서 "가입하면 무엇이 되는지"를 읽고 왔는데, 정작 가입 화면에는 입력 칸
       셋만 있었다. 입력하다 손을 멈춘 사람에게 왜 하고 있었는지를 다시 말해 주는 한 줄이다.
       이메일을 안 받는다는 사실도 여기서 미리 말한다 — 아래 경고와 짝이 되는 정보이고,
       "이메일 없이 가입되네?"를 확인하려고 칸을 다시 훑지 않아도 된다. -->
  <p class="meta">아이디와 비밀번호만 있으면 됩니다. 이메일은 받지 않습니다.
    가입하면 매일 10문제가 준비되고, 틀린 문제는 복습으로 돌아옵니다.</p>
  <!-- 실패가 여기 뜬다. aria-live="assertive"는 <읽던 것을 끊고 지금 이걸 읽으라>는 뜻이다.
       polite는 하던 말이 끝난 뒤에 읽는데, 그 사이 사용자는 이미 다음 칸으로 넘어가 있다.
       가입 실패는 <더 진행할 수 없다>는 뜻이라 끊어도 되는 몇 안 되는 알림이다. -->
  <div id="message" role="alert" aria-live="assertive"></div>

  <form id="signupForm" class="card">
    <div class="field">
      <label for="username">아이디 (영문·숫자·밑줄 4~20자)</label>
      <!-- 규칙을 라벨에 적어 두는 이유: 서버도 같은 규칙으로 막지만(SignupRequest),
           제출한 뒤에 알려 주면 다시 입력하게 된다. pattern은 브라우저가 먼저 걸러 준다. -->
      <input type="text" id="username" required autocomplete="username"
             pattern="[A-Za-z0-9_]{4,20}" title="영문·숫자·밑줄(_)로 4~20자">
    </div>
    <div class="field">
      <label for="password">비밀번호 (8자 이상, 영문+숫자 포함)</label>
      <!-- 서버(SignupRequest)와 <같은 정규식>이다. 아이디에는 pattern이 있는데 비밀번호에는
           없어서, 규칙이 라벨에만 적혀 있고 어긋난 값은 서버를 다녀와야 알 수 있었다.
           앞을 내다보는 검사(?=...)는 HTML pattern에서도 그대로 동작한다. -->
      <input type="password" id="password" required autocomplete="new-password"
             pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
             title="8자 이상이며 영문과 숫자를 포함해야 합니다">
    </div>
    <div class="field">
      <label for="password2">비밀번호 확인</label>
      <!-- [이 칸이 왜 필요한가]
           이 앱에는 비밀번호를 되찾을 방법이 <아예 없다>. 이메일을 받지 않으므로
           재설정 메일을 보낼 곳이 없고, 그것은 서버 설계상 그렇다(SignupRequest).
           게다가 가입에 성공하면 곧바로 자동 로그인되기 때문에, 오타로 가입해도
           그 자리에서는 아무 이상이 없다 — 다음에 로그인할 때 비로소 막힌다.
           그때는 무엇을 잘못 쳤는지 기억할 방법이 없다. 오타 한 번이 계정을 영구히
           잃게 만드는 구조라, 확인 칸은 편의가 아니라 안전장치다. -->
      <input type="password" id="password2" required autocomplete="new-password">
      <!-- 불일치는 제출 전에 이 자리에 뜬다. 제출 버튼을 막는 대신 글로 알리는 이유:
           눌리지 않는 버튼은 <왜 안 되는지>를 말해 주지 않는다. -->
      <div class="field-error" id="pw2Error" hidden>비밀번호가 서로 다릅니다.</div>
    </div>

    <!-- [비밀번호 보기]
         확인 칸은 오타를 <잡아 주지만> 어디를 틀렸는지는 안 알려 준다 — 두 번 다 같은 오타를
         치면 통과하기까지 한다. 눈으로 확인할 수 있으면 애초에 어긋날 일이 줄고, 특히
         폰에서 그렇다(가상 키보드는 오타가 잦고 화면은 점만 보여 준다).
         두 칸을 <함께> 여닫는다. 하나만 열면 "지금 보이는 게 어느 칸이지"를 되묻게 된다. -->
    <label class="pw-reveal">
      <input type="checkbox" id="pwReveal"> 비밀번호 보기
    </label>

    <!-- [되찾을 수 없다는 사실을 <가입 전에> 말한다]
         이 앱은 이메일을 받지 않으므로 재설정 메일을 보낼 곳이 없다(SignupRequest).
         지금까지 그 사실은 <코드 주석에만> 있었다 — 정작 그것 때문에 계정을 잃는 사람은
         주석을 읽지 않는다. 게다가 가입 직후 자동 로그인되므로 오타로 가입해도 그 자리에서는
         아무 이상이 없고, 다음 로그인에서야 막힌다. 그때는 무엇을 잘못 쳤는지 알 길이 없다.
         알려야 하는 시점은 <적어 두거나 기억할 수 있는> 지금뿐이다. -->
    <p class="meta signup-warn">
      비밀번호를 잊으면 되찾을 수 없습니다. 이메일을 받지 않아 재설정 메일을 보낼 곳이 없습니다 —
      브라우저에 저장하거나 따로 적어 두세요.
    </p>

    <button type="submit" id="submitBtn" style="width:100%">가입하기</button>
  </form>

  <p class="meta">이미 계정이 있으신가요? <a href="/login.html">로그인</a></p>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 회원가입 페이지 — 가입 성공 시 같은 계정으로 곧바로 로그인까지 해 준다.
 * (가입 → 로그인 화면 → 또 입력의 번거로움 제거. 실패해도 가입은 된 상태라 로그인 페이지로 안내) */
renderShell({ title: "회원가입" });

/* 두 비밀번호가 같은지 본다.
 *
 * <입력하는 동안>에도 검사하지만, 두 번째 칸에 손을 댄 뒤부터만 한다. 처음부터 켜면
 * 첫 글자를 치자마자 "서로 다릅니다"가 떠서, 아직 다 치지도 않은 사람을 나무라게 된다.
 *
 * 브라우저의 setCustomValidity도 함께 쓴다. 그래야 폼 제출이 실제로 막히고,
 * 화면의 글과 브라우저의 판단이 <같은 사실>을 말하게 된다. */
const pw = document.getElementById("password");
const pw2 = document.getElementById("password2");
const pw2Error = document.getElementById("pw2Error");
let pw2Touched = false;

function checkPasswordMatch() {
  const mismatch = pw2.value !== "" && pw.value !== pw2.value;
  pw2.setCustomValidity(mismatch ? "비밀번호가 서로 다릅니다." : "");
  pw2Error.hidden = !(mismatch && pw2Touched);
  pw2.classList.toggle("invalid", mismatch && pw2Touched);
}

pw2.addEventListener("input", () => { pw2Touched = true; checkPasswordMatch(); });
// 첫 칸을 나중에 고치는 경우도 있다 — 그때도 판단이 따라와야 한다.
pw.addEventListener("input", checkPasswordMatch);

/* 두 비밀번호 칸을 함께 여닫는다.
 *
 * type을 바꾸는 것이 값에는 영향을 주지 않는다 — 브라우저가 같은 input의 value를 그대로 든다.
 * autocomplete는 그대로 두는데, new-password는 <칸의 역할>을 말하는 값이라 보이는지 여부와
 * 무관하다. 열어 둔 채로 제출해도 문제될 것이 없어 되돌리지 않는다. */
document.getElementById("pwReveal").addEventListener("change", e => {
  const type = e.target.checked ? "text" : "password";
  pw.type = type;
  pw2.type = type;
});

document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("message");

  // 서버에 보내기 전에 한 번 더 본다. 입력 중 검사만 믿으면, 붙여넣기처럼
  // input 이벤트를 거치지 않는 경로로 어긋난 값이 그대로 나갈 수 있다.
  pw2Touched = true;
  checkPasswordMatch();
  if (pw.value !== pw2.value) {
    pw2.focus();
    return;
  }

  btn.disabled = true;
  msg.innerHTML = "";
  // 서버도 소문자로 낮춰 저장하므로(AuthService) 여기서도 맞춰 보낸다 —
  // 대문자로 가입해 놓고 화면에는 소문자가 뜨는 어긋남을 없앤다.
  const username = document.getElementById("username").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  try {
    await api("/api/auth/signup", { method: "POST", body: JSON.stringify({ username, password }) });
    try {
      // 가입 직후 자동 로그인
      const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ username, password }) });
      setLogin(data.accessToken, data.refreshToken, username);
      location.href = "/";
    } catch (loginErr) {
      location.href = "/login.html"; // 자동 로그인만 실패한 드문 경우: 수동 로그인으로
    }
  } catch (err) {
    // 검증 실패(VALIDATION_ERROR)면 어떤 칸이 왜 틀렸는지 필드 단위로 보여준다
    const details = (err.fieldErrors || []).map(f => `<li>${escapeHtml(f.reason)}</li>`).join("");
    msg.innerHTML = `<div class="alert error">${escapeHtml(err.message)}${details ? `<ul style="margin:6px 0 0">${details}</ul>` : ""}</div>`;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
