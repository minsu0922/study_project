<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container narrow">
  <h1>회원가입</h1>
  <div id="message"></div>

  <form id="signupForm" class="card">
    <div class="field">
      <label for="username">아이디 (영문·숫자·밑줄 4~20자)</label>
      <!-- 규칙을 라벨에 적어 두는 이유: 서버도 같은 규칙으로 막지만(SignupRequest),
           제출한 뒤에 알려 주면 다시 입력하게 된다. pattern은 브라우저가 먼저 걸러 준다. -->
      <input type="text" id="username" required autocomplete="username"
             pattern="[A-Za-z0-9_]{4,20}" title="영문·숫자·밑줄(_)로 4~20자">
    </div>
    <div class="field">
      <label for="password">비밀번호 (8자 이상, 영문+숫자 포함)</label>
      <input type="password" id="password" required autocomplete="new-password">
    </div>
    <button type="submit" id="submitBtn" style="width:100%">가입하기</button>
  </form>

  <p class="meta">이미 계정이 있으신가요? <a href="/login.html">로그인</a></p>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 회원가입 페이지 — 가입 성공 시 같은 계정으로 곧바로 로그인까지 해 준다.
 * (가입 → 로그인 화면 → 또 입력의 번거로움 제거. 실패해도 가입은 된 상태라 로그인 페이지로 안내) */
renderShell({ title: "회원가입" });

document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("message");
  btn.disabled = true;
  msg.innerHTML = "";
  // 서버도 소문자로 낮춰 저장하므로(AuthService) 여기서도 맞춰 보낸다 —
  // 대문자로 가입해 놓고 화면에는 소문자가 뜨는 어긋남을 없앤다.
  const username = document.getElementById("username").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  try {
    await api("/api/auth/signup", { method: "POST", body: JSON.stringify({ username, password }) });
    try {
      // 가입 직후 자동 로그인
      const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ username, password }) });
      setLogin(data.accessToken, data.refreshToken, username);
      location.href = "/";
    } catch (loginErr) {
      location.href = "/login.html"; // 자동 로그인만 실패한 드문 경우: 수동 로그인으로
    }
  } catch (err) {
    // 검증 실패(VALIDATION_ERROR)면 어떤 칸이 왜 틀렸는지 필드 단위로 보여준다
    const details = (err.fieldErrors || []).map(f => `<li>${escapeHtml(f.reason)}</li>`).join("");
    msg.innerHTML = `<div class="alert error">${escapeHtml(err.message)}${details ? `<ul style="margin:6px 0 0">${details}</ul>` : ""}</div>`;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
