<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개념 문서 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<!-- 셸(기둥·탭바·상단바): js/shell.js의 renderShell()이 채운다
     — 화면마다 메뉴 HTML을 복붙하면 화면이 하나 늘 때마다 빠뜨릴 자리가 같이 는다 -->
<div id="shell"></div>

<main class="container">
  <h1>개념 문서</h1>

  <!-- 필터: 도메인 선택 시 목록을 다시 불러온다. 태그 필터는 UI 단순화를 위해 생략(API는 지원) -->
  <div class="filters">
    <div class="field">
      <label for="domainFilter">도메인</label>
      <select id="domainFilter"></select>
    </div>
  </div>

  <div id="message"></div>
  <div id="docList"></div>

  <!-- 이전/다음 페이지 (PageResponse의 page/totalPages/hasNext 사용) -->
  <div class="pager" id="pager" hidden>
    <button id="prevBtn" class="btn-outline">이전</button>
    <span class="info" id="pageInfo"></span>
    <button id="nextBtn" class="btn-outline">다음</button>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 문서 목록 페이지 (v2에서 index.html → documents.html로 이동 — 홈은 퀴즈 시작 화면이 됐다)
 * GET /api/documents?domain=&page= 를 불러와 카드 목록으로 그린다.
 * 상태는 "현재 페이지 번호 + 선택한 도메인" 두 개뿐이라 전역 변수로 충분하다. */
renderShell({ active: "docs", title: "개념 문서" });

const domainFilter = document.getElementById("domainFilter");
fillSelect(domainFilter, DOMAINS, "전체 도메인");

let page = 0; // 0부터 시작 (백엔드 Pageable 규칙과 동일)

async function loadDocs() {
  const msg = document.getElementById("message");
  msg.innerHTML = "";
  try {
    const params = new URLSearchParams({ page });
    if (domainFilter.value) params.set("domain", domainFilter.value);
    const data = await api("/api/documents?" + params);

    // 제목 아래 부제 한 줄. edition이 없으면 빈 문자열이라 마크업 자체가 생기지 않는다.
    // 여기는 배지가 아니라 부제라 api.js의 editionBadge를 그대로 쓰지 않는다. 다만
    // "심화편인가"를 가르는 비교는 공용 함수에 맡긴다 — 그 낱말이 두 곳에 박혀 있으면
    // 표시 이름을 바꾼 날 한쪽만 고쳐지고, 증상은 색이 조용히 틀리는 것뿐이다.
    const editionSubtitle = (edition) => edition
      ? `<p class="doc-sub"><span class="edition${isAdvancedEdition(edition) ? " advanced" : ""}">${escapeHtml(edition)}</span></p>`
      : "";

    const list = document.getElementById("docList");
    if (data.content.length === 0) {
      list.innerHTML = `<p class="meta">문서가 없습니다.</p>`;
    } else {
      // 목록은 본문(contentMd) 없이 요약만 온다 — 본문은 클릭해서 상세에서 읽는다(docs/03)
      //
      // edition("입문편"/"심화편")은 짝이 실제로 있을 때만 서버가 채워 준다(2026-09-03).
      // 두 편은 제목이 <똑같으므로> 이 줄이 없으면 목록에 같은 이름이 두 번 서서 구별되지 않는다.
      // 한 편짜리 옛 문서에는 null이 오고, 그때는 부제를 아예 그리지 않는다 —
      // 짝이 없는데 "입문편"이라 적으면 읽는 사람이 없는 심화편을 찾아 나선다.
      // 카드 <전체>가 링크다. 예전에는 div에 onclick을 걸고 제목만 <a>였는데,
      // 그러면 마우스로는 카드 어디나 눌리지만 <키보드로는 제목 링크에만> 갈 수 있었다.
      // 겉모습(카드 전체가 눌린다)과 조작할 수 있는 것이 어긋난 상태다.
      //
      // tabindex와 키 처리를 div에 붙이는 방법도 있지만 <a>로 만드는 쪽을 골랐다.
      // 그래야 브라우저가 공짜로 주는 것을 그대로 받는다 — 초점, 엔터, 가운데 클릭으로
      // 새 탭, 오른쪽 눌러 주소 복사, 방문한 링크 표시. 손으로 다시 만들면 그중 몇은
      // 반드시 빠진다.
      //
      // 제목의 안쪽 <a>는 없앴다. 링크 안에 링크는 넣을 수 없다(HTML이 허용하지 않고,
      // 스크린리더는 하나의 링크를 두 번 읽는다).
      list.innerHTML = data.content.map(d => `
        <a class="card clickable" href="/document.html?slug=${encodeURIComponent(d.slug)}">
          <!-- h2다. 화면 제목(h1) 바로 아래 단계라 h3이면 한 칸을 건너뛴다 —
               스크린리더의 제목 목록에서 층위가 어긋나 "빠진 제목이 있나"로 읽힌다.
               생김새는 .card h2가 .card h3과 같게 잡아 준다. -->
          <h2>${escapeHtml(d.title)}</h2>
          ${editionSubtitle(d.edition)}
          <span class="badge">${escapeHtml(d.domainLabel)}</span>
          ${d.tags.map(t => `<span class="badge gray">#${escapeHtml(t)}</span>`).join("")}
          <div class="meta">수정: ${formatDate(d.updatedAt)}</div>
        </a>`).join("");
    }

    // 페이지 버튼: 전체가 1페이지면 숨긴다(불필요한 UI 제거)
    const pager = document.getElementById("pager");
    pager.hidden = data.totalPages <= 1;
    document.getElementById("pageInfo").textContent = `${data.page + 1} / ${Math.max(data.totalPages, 1)}`;
    document.getElementById("prevBtn").disabled = data.page === 0;
    document.getElementById("nextBtn").disabled = !data.hasNext;
  } catch (e) {
    msg.innerHTML = `<div class="alert error">문서를 불러오지 못했습니다: ${escapeHtml(e.message)}</div>`;
  }
}

domainFilter.addEventListener("change", () => { page = 0; loadDocs(); }); // 필터 바꾸면 1페이지부터
document.getElementById("prevBtn").addEventListener("click", () => { page--; loadDocs(); });
document.getElementById("nextBtn").addEventListener("click", () => { page++; loadDocs(); });

loadDocs();
</script>
</body>
</html>
