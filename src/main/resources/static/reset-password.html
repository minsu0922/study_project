<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 재설정 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지(wrong-answers.html의 같은 주석 참고). */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container narrow">
  <h1>비밀번호 재설정</h1>
  <p class="meta" id="resetIntro">가입할 때 받은 <b>복구 코드</b>로 비밀번호를 새로 정합니다.
    이 앱은 이메일을 받지 않아 재설정 메일을 보내지 않습니다.</p>

  <div id="message" role="alert" aria-live="assertive"></div>

  <form id="resetForm" class="card">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" required autocomplete="username">
    </div>
    <div class="field">
      <label for="code">복구 코드</label>
      <input type="text" id="code" required autocomplete="off" spellcheck="false"
             placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" style="font-family:Consolas,monospace">
    </div>
    <div class="field">
      <label for="newPw">새 비밀번호 (8자 이상, 영문+숫자 포함)</label>
      <input type="password" id="newPw" required autocomplete="new-password"
             pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" title="8자 이상이며 영문과 숫자를 포함해야 합니다">
    </div>
    <div class="field">
      <label for="newPw2">새 비밀번호 확인</label>
      <input type="password" id="newPw2" required autocomplete="new-password">
      <div class="field-error" id="pw2Error" hidden>비밀번호가 서로 다릅니다.</div>
    </div>
    <label class="pw-reveal">
      <input type="checkbox" id="pwReveal"> 비밀번호 보기
    </label>
    <button type="submit" id="submitBtn" style="width:100%">비밀번호 다시 정하기</button>
  </form>

  <!-- 성공하면 폼 자리에 새 복구 코드를 보여 준다. 쓴 코드는 서버가 버렸다. -->
  <div class="card" id="done" hidden>
    <b>비밀번호를 바꿨습니다.</b>
    <p class="meta" style="margin-top:8px">방금 쓴 복구 코드는 더 통하지 않습니다.
      아래가 <b>새 복구 코드</b>입니다. 지금 적어 두세요 — 이 화면을 떠나면 다시 볼 수 없습니다.</p>
    <div class="recovery-code" id="newCode"></div>
    <a class="btn" href="/login.html" style="margin-top:12px; display:inline-block">로그인하러 가기</a>
  </div>

  <p class="meta warn-note" id="resetHelp">복구 코드도 없다면 계정을 되찾을 방법이 없습니다.
    로그인이 되는 동안 마이페이지에서 코드를 다시 받아 둘 수 있습니다.</p>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
renderShell({ title: "비밀번호 재설정" });

document.getElementById("pwReveal").addEventListener("change", e => {
  const type = e.target.checked ? "text" : "password";
  document.getElementById("newPw").type = type;
  document.getElementById("newPw2").type = type;
});

document.getElementById("resetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("newPw");
  const pw2 = document.getElementById("newPw2");
  const mismatch = pw.value !== pw2.value;
  document.getElementById("pw2Error").hidden = !mismatch;
  if (mismatch) { pw2.focus(); return; }

  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("message");
  btn.disabled = true;
  msg.innerHTML = "";
  try {
    const data = await api("/api/auth/password-reset", {
      method: "POST",
      body: JSON.stringify({
        username: document.getElementById("username").value.trim().toLowerCase(),
        recoveryCode: document.getElementById("code").value.trim(),
        newPassword: pw.value,
      }),
    });
    ["resetForm", "resetIntro", "resetHelp"].forEach(id => document.getElementById(id).hidden = true);
    document.getElementById("newCode").textContent = data.recoveryCode;
    document.getElementById("done").hidden = false;
  } catch (err) {
    // AUTH_006: 아이디가 없는 것과 코드가 틀린 것을 서버가 일부러 한 문구로 답한다
    showErrorAlert(msg, err);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
