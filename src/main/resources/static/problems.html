<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문제 목록 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container problem-list">
  <!-- 자유 퀴즈로 가는 입구(2026-08-29 메뉴 개편). 예전에는 상단 메뉴에 "자유 퀴즈"가
       따로 있었는데, 이 화면과 하는 일이 같아서(둘 다 풀 것을 고른다) 이름만으로는 어디로
       들어가야 하는지 안 갈렸다. 여기로 옮기니 관계가 분명해진다 —
       <목록에서 하나 고르기>가 기본이고, <아무거나 열 문제>는 그 옆의 다른 길이다. -->
  <div class="page-head">
    <h1>문제</h1>
    <a class="btn btn-outline" href="/quiz.html">무작위로 10문제 →</a>
  </div>
  <div id="message"></div>

  <div id="ui" hidden>
    <!-- 통계 카드 넷. 스트릭은 없다 — 주 3회 페이스에서 매주 끊겨 잘하고 있는데
         실패한 것처럼 보이는 숫자가 된다. 대신 "이번 주"를 쓴다(docs/12). -->
    <div class="pl-stats" id="stats"></div>

    <div class="pl-body">
      <aside class="pl-side">
        <h2>분야</h2>
        <div class="pl-domains" id="domains"></div>

        <h2 class="second">난이도</h2>
        <div class="pl-levels" id="levels"></div>
      </aside>

      <div class="pl-main">
        <!-- 상태 필터는 사이드바가 아니라 목록 바로 위에 둔다. 한쪽에 필터가 여덟 종
             쌓이면 목록이 아니라 설정 화면이 된다(스펙 §2.3). -->
        <!-- 검색은 상태 칩 <위>에 둔다. 칩은 "어느 묶음을 볼까"이고 검색은 "그 안에서
             무엇을 찾을까"라, 좁히는 순서대로 놓아야 눈이 위에서 아래로 흐른다.
             둘은 함께 걸린다 — "틀린 문제 중에 TIME_WAIT"가 되는 것이 자연스럽다. -->
        <!-- 문서에서 넘어왔을 때만 뜬다. 걸려 있다는 사실과 푸는 법을 같은 자리에 —
             표시가 없으면 "문제가 왜 이것뿐이지"가 된다(문서 목록의 태그 줄과 같은 판단). -->
        <div id="docFilter" hidden></div>

        <form class="pl-search" id="searchForm" role="search">
          <label for="q" class="visually-hidden">문제 검색</label>
          <input type="search" id="q" placeholder="지문·제목에서 찾기"
                 autocomplete="off" enterkeyhint="search">
          <button type="submit" class="btn-outline btn-sm">찾기</button>
        </form>

        <div class="pl-chips" id="chips" role="radiogroup" aria-label="풀이 상태"></div>

        <div class="pl-head" aria-hidden="true">
          <span class="pl-state"></span>
          <span class="pl-title">제목</span>
          <span class="pl-type">유형</span>
          <span class="pl-lv">난이도</span>
          <span class="pl-when">마지막</span>
        </div>
        <div id="list"></div>
        <div class="pl-pager" id="pager" hidden>
          <button id="prevBtn" class="btn-outline">이전</button>
          <span class="info" id="pageInfo"></span>
          <button id="nextBtn" class="btn-outline">다음</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 문제 목록 — "다음에 풀 문제 하나를 30초 안에 고르게 하는 것"이 이 화면의 유일한 목적이다
 * (docs/18). 그래서 여기 있는 값은 전부 그 선택에 쓰이는 것만 있다:
 * 무엇을 안 풀었나(상태) · 언제 마지막으로 건드렸나 · 지금 복습할 때인가.
 *
 * [토큰은 이제 공용이다 — 2026-08-29 개편 4단계]
 * 이 화면은 한동안 --pl-* 접두사로 가둔 섬이었다. 스펙의 토큰 이름이 기존 것과
 * 부딪혀서(--accent 주황 ↔ 파랑, --radius 14 ↔ 8px), 화면 하나를 고치려다 앱 전체가
 * 바뀌는 일을 막으려는 격리였다. 개편 1~3단계에서 그 충돌이 다 풀려 공용으로 흡수했다.
 * 브랜드색은 인디고다(C안) — 이 화면만 파랑을 쓰던 상태가 사라졌다.
 *
 * [로그인 필수]
 * 이 목록의 모든 줄이 "나와의 관계"를 달고 있다 — 맞혔나, 언제 풀었나, 복습할 때인가.
 * 그것을 뺀 목록은 그냥 카탈로그이고 그건 자유 퀴즈가 이미 하는 일이다. */

renderShell({ active: "problems", title: "문제" });

const DOMAIN_PREVIEW = 5;   // 사이드바 기본 노출 수 — 12개를 다 펴면 사이드바가 본문보다 길어진다
const PAGE_SIZE = 20;

/* 상태 필터 넷. 값이 null이면 서버에 안 보낸다(= 전체). */
const STATES = [
  ["", "전체"],
  ["UNSOLVED", "안 푼 문제"],
  ["WRONG", "틀린 문제"],
  ["DUE", "복습 대기"],     // 이것만 state가 아니라 reviewDue 파라미터로 나간다
];

const LEVELS = [["BEGINNER", "초급"], ["INTERMEDIATE", "중급"], ["ADVANCED", "고급"]];

/* 화면 상태 — 화면 안에서 필터를 바꿔도 주소는 그대로다. 이 화면은 "지금 뭘 풀지"
 * 고르는 자리라 링크로 공유할 일이 없고, 클릭마다 주소가 바뀌면 뒤로가기가
 * 필터 되돌리기가 되어 "홈으로 못 돌아가는" 화면이 된다.
 *
 * <b>다만 들어올 때의 domain 하나만 받는다</b>(2026-08-29). 홈의 "이 분야가 비어 있습니다"
 * 줄이 이 화면으로 보내는데, 그냥 목록만 열면 사용자가 방금 고른 분야를 여기서 <다시>
 * 골라야 한다 — 누른 것이 아무 일도 안 한 것처럼 보인다. 받기만 하고 쓰지는 않으므로
 * 위 판단(주소를 상태로 쓰지 않는다)은 그대로다. */
let selectedDomain = incomingDomain();
let selectedLevels = new Set();
let selectedState = "";
let page = 0;
/* 들어올 때 분야가 지정됐으면 사이드바를 펼친 채로 연다. 12개 중 앞 5개만 보이는 상태에서
 * 뒤쪽 분야(예: 프론트엔드CS)로 들어오면 목록은 걸러졌는데 <걸린 필터가 화면에 없어>
 * 문제가 몇 개 없는 것처럼 보인다. */
let domainsExpanded = selectedDomain !== null;
let summary = null;

/**
 * 주소의 domain 파라미터를 읽어 검증한다 — 홈에서 넘어오는 경로에서만 쓴다.
 *
 * 아는 값이 아니면 버린다. 서버는 어차피 파싱에 실패해 400을 주지만, 그러면 목록이
 * 통째로 에러가 된다 — 주소 한 글자 오타로 화면이 죽는 것보다 필터 없이 여는 편이 낫다.
 */
function incomingDomain() {
  const v = new URLSearchParams(location.search).get("domain");
  return v && DOMAINS.some(d => d[0] === v) ? v : null;
}

/* 문서에서 넘어왔을 때 걸리는 근거 문서.
 *
 * 주소에서 읽는다 — 문서 화면의 "이 문서로 만든 문제 풀기"가 링크로 넘긴다.
 * 화면 안에서 고르는 필터가 아니라 <들어올 때 정해지는> 것이라 변수로 두고,
 * 푸는 방법은 "전체 문제 보기" 링크 하나다(칩을 하나 더 만들면 다른 필터들과
 * 성격이 달라 헷갈린다). */
const fromDocument = new URLSearchParams(location.search).get("documentSlug");

/** 지금 걸린 검색어. 빈 문자열이면 안 거른다(서버도 같은 규칙). */
let keyword = "";

/* [이 둘을 여기 둔 이유 — 2026-09-08]
 *
 * 아래 loadList()가 쓰는 값인데, 그 함수는 이 파일이 다 읽히기 <전에> 초기화 블록에서
 * 불린다. let/const는 선언 전에 읽으면 "임시 사각지대"에서 ReferenceError를 낸다.
 *
 * 실제로 그렇게 터뜨렸다. 증상이 고약했다 — 오류는 콘솔에만 나고 화면은 <조용히 빈
 * 목록>이었다. 게다가 검색 칸에 뭔가 쳐서 다시 부르면 그때는 스크립트 평가가 끝난
 * 뒤라 <잘 동작한다>. "눌러 보면 되는데 처음 열면 비어 있는" 상태라, 눌러 보는
 * 확인만으로는 못 잡는다.
 *
 * 함수 선언(function)은 통째로 끌어올려지지만 값은 안 그렇다 — 값은 쓰는 곳보다 위에. */

if (!isLoggedIn()) {
  document.getElementById("message").innerHTML =
    `<div class="alert info">문제 목록은 <b>내 풀이 기록</b>을 함께 보여 주는 화면이라 로그인이 필요합니다.
     <a href="/login.html">로그인하기</a></div>`;
} else {
  document.getElementById("ui").hidden = false;
  initFilters();
  loadSummary();
  renderDocFilter();
  loadList();
}

/* ═══════════ 통계 카드 + 사이드바 ═══════════ */

async function loadSummary() {
  try {
    summary = await api("/api/me/study-summary");
  } catch (e) {
    // 통계를 못 불러왔다고 목록까지 막지 않는다 — 이 화면의 본체는 목록이다.
    summary = null;
  }
  renderStats();
  renderDomains();
}

/**
 * 통계 카드 넷.
 *
 * 정답률이 null이면 "0%"로 채우지 않는다 — 0%는 "다 틀렸다"는 뜻이라, 아직 시작도 안 한
 * 사람에게 정반대 신호를 준다. 숫자 자리에 이유를 적는다.
 */
function renderStats() {
  const s = summary?.stats;
  const box = document.getElementById("stats");
  if (!s) {
    box.innerHTML = `<div class="pl-stat"><div class="num none">통계를 불러오지 못했습니다</div></div>`;
    return;
  }
  const cards = [
    // 목록에 ✗로 표시되는 문제도 여기 포함된다 — 예전에는 맞힌 수를 써서,
    // 같은 화면 위쪽이 "푼 문제 0"인데 아래 목록에는 ✗가 붙어 있었다.
    [String(s.attemptedTotal), "푼 문제"],
    [s.correctRate === null ? null : s.correctRate + "%", "정답률"],
    [String(s.solvedThisWeek), "이번 주"],
    [String(s.reviewDue), "복습 대기"],
  ];
  box.innerHTML = cards.map(([value, label]) => `
    <div class="pl-stat">
      <div class="num${value === null ? " none" : ""}">${value === null ? "아직 기록 없음" : escapeHtml(value)}</div>
      <div class="label">${label}</div>
    </div>`).join("");
}

/**
 * 분야 목록 — 이름 + 맞힌 개수 + 진척 바.
 *
 * <b>분모를 쓰지 않는다.</b> 배치가 매일 문제를 더하므로 "18/42" 같은 분수는 분모가 계속
 * 커져 어제 40%가 오늘 37%가 된다. 아무것도 잘못하지 않았는데 뒷걸음질치는 표시가 된다.
 * 그래서 개수는 절대값으로 적고, 바는 <b>이 사람 안에서의 상대 비교</b>로만 쓴다
 * (가장 많이 푼 분야를 100%로).
 */
function renderDomains() {
  const rows = summary?.domains ?? [];
  const max = rows.reduce((m, d) => Math.max(m, d.solved), 0);
  const shown = domainsExpanded ? rows : rows.slice(0, DOMAIN_PREVIEW);

  const html = shown.map(d => `
    <button class="pl-domain" data-domain="${d.domain}"
            aria-pressed="${selectedDomain === d.domain}">
      <span class="row"><span class="name">${escapeHtml(d.label)}</span><span class="n">${d.solved}</span></span>
      <span class="pl-bar"><i style="width:${max === 0 ? 0 : Math.round(d.solved / max * 100)}%"></i></span>
    </button>`).join("");

  const more = rows.length > DOMAIN_PREVIEW
    ? `<button class="pl-more" id="moreBtn">${domainsExpanded ? "접기" : `+ ${rows.length - DOMAIN_PREVIEW}개 더 보기`}</button>`
    : "";

  document.getElementById("domains").innerHTML = html + more;
}

function initFilters() {
  document.getElementById("levels").innerHTML = LEVELS.map(([v, l]) =>
    `<button class="pl-level" data-lv="${v}" aria-pressed="false">${l}</button>`).join("");

  document.getElementById("chips").innerHTML = STATES.map(([v, l]) =>
    `<button class="pl-chip" role="radio" data-state="${v}"
             aria-checked="${v === selectedState}">${l}</button>`).join("");

  // 이벤트 위임 — 사이드바는 다시 그려지므로 버튼마다 붙이면 그릴 때마다 다시 붙여야 한다.
  document.getElementById("domains").addEventListener("click", e => {
    const more = e.target.closest("#moreBtn");
    if (more) { domainsExpanded = !domainsExpanded; renderDomains(); return; }
    const btn = e.target.closest(".pl-domain");
    if (!btn) return;
    // 같은 분야를 다시 누르면 해제 — 필터를 지우는 별도 버튼 없이 되돌릴 수 있다.
    selectedDomain = selectedDomain === btn.dataset.domain ? null : btn.dataset.domain;
    page = 0;
    renderDomains();
    loadList();
  });

  document.getElementById("levels").addEventListener("click", e => {
    const btn = e.target.closest(".pl-level");
    if (!btn) return;
    const lv = btn.dataset.lv;
    selectedLevels.has(lv) ? selectedLevels.delete(lv) : selectedLevels.add(lv);
    btn.setAttribute("aria-pressed", String(selectedLevels.has(lv)));
    page = 0;
    loadList();
  });

  document.getElementById("chips").addEventListener("click", e => {
    const btn = e.target.closest(".pl-chip");
    if (!btn) return;
    selectedState = btn.dataset.state;
    document.querySelectorAll("#chips .pl-chip").forEach(c =>
      c.setAttribute("aria-checked", String(c.dataset.state === selectedState)));
    page = 0;
    loadList();
  });

  /* 검색은 <제출할 때만> 보낸다(입력할 때마다가 아니다).
   *
   * 한 글자마다 부르면 "TIME_WAIT"를 치는 동안 아홉 번 다녀오고, 그중 여덟 번의 답은
   * 도착하자마자 버려진다. 기다리게 했다가 보내는 방법(디바운스)도 있지만, 그러면
   * <언제 찾아지는지>가 사람에게 안 보인다. 엔터나 버튼은 "지금 찾는다"가 분명하다.
   *
   * 칸을 비우고 제출하면 검색이 풀린다 — 지우는 것도 같은 동작이라 배울 것이 하나다. */
  document.getElementById("searchForm").addEventListener("submit", e => {
    e.preventDefault();
    keyword = document.getElementById("q").value.trim();
    page = 0;   // 3쪽을 보다가 검색하면 결과가 1쪽뿐인데 3쪽을 달라고 하게 된다
    loadList();
  });

  document.getElementById("prevBtn").addEventListener("click", () => { page--; loadList(); });
  document.getElementById("nextBtn").addEventListener("click", () => { page++; loadList(); });
}

/* ═══════════ 목록 ═══════════ */

/**
 * 난이도는 <b>서버가 여러 개를 못 받는다</b>(파라미터가 하나다). 여러 개를 고르면 화면에서
 * 거른다 — 다중 선택이 세 개뿐이라 한 판(20줄)에서 걸러도 손해가 크지 않고, 서버에
 * IN 절을 여는 것보다 지금은 이쪽이 싸다. <b>다만 쪽 수가 실제와 어긋난다</b>는 대가가 있어,
 * 거르는 중에는 그 사실을 목록 위에 적는다.
 */

/** 근거 문서로 걸려 있으면 그 사실을 목록 위에 적는다. */
function renderDocFilter() {
  const box = document.getElementById("docFilter");
  if (!fromDocument) return;
  box.hidden = false;
  box.innerHTML = `<span class="meta">개념 문서로 좁힘</span>
    <a class="badge" href="/document.html?slug=${encodeURIComponent(fromDocument)}">그 문서 읽기 ↗</a>
    <a class="meta" href="/problems.html">전체 문제 보기 →</a>`;
}

function levelParam() {
  return selectedLevels.size === 1 ? [...selectedLevels][0] : null;
}

async function loadList() {
  const params = new URLSearchParams({ page: String(page), size: String(PAGE_SIZE) });
  if (selectedDomain) params.set("domain", selectedDomain);
  const lv = levelParam();
  if (lv) params.set("difficulty", lv);
  if (selectedState === "DUE") params.set("reviewDue", "true");
  else if (selectedState) params.set("state", selectedState);
  if (keyword) params.set("keyword", keyword);
  if (fromDocument) params.set("documentSlug", fromDocument);

  let data;
  try {
    data = await api("/api/problems?" + params.toString());
  } catch (e) {
    document.getElementById("list").innerHTML =
      `<div class="pl-empty">목록을 불러오지 못했습니다.<br><span class="meta">${escapeHtml(e.message)}</span></div>`;
    document.getElementById("pager").hidden = true;
    return;
  }

  // 난이도를 둘 이상 골랐을 때만 화면에서 한 번 더 거른다(levelParam 주석).
  const rows = selectedLevels.size > 1
    ? data.content.filter(p => selectedLevels.has(p.difficulty))
    : data.content;

  renderList(rows, data);
  renderPager(data);
}

function renderList(rows, data) {
  const box = document.getElementById("list");
  if (rows.length === 0) {
    box.innerHTML = emptyStateHtml();
    return;
  }
  box.innerHTML = rows.map(p => {
    const lvLabel = difficultyLabel(p.difficulty);
    return `
    <a class="pl-row" href="/quiz.html?problemId=${p.id}" data-lv="${p.difficulty}">
      <span class="pl-state">${stateIcon(p.state)}</span>
      <span class="pl-title">${p.title
        ? escapeHtml(p.title)
        : `<span style="color:var(--muted)">(제목 없음 — 관리 화면에서 채울 수 있습니다)</span>`}</span>
      <span class="pl-type">${escapeHtml(typeLabel(p.type))}</span>
      <span class="pl-lv"><span class="pl-badge" data-lv="${p.difficulty}">${lvLabel}</span></span>
      <span class="pl-when">${whenLabel(p.lastAttemptedAt)}</span>
      ${p.reviewDue ? `<span class="pl-due">복습</span>` : ""}
      <span class="pl-meta-line">${lvLabel} · ${escapeHtml(typeLabel(p.type))} · ${whenLabel(p.lastAttemptedAt)}</span>
    </a>`;
  }).join("");

  // 화면에서 거른 경우 쪽 수가 실제와 어긋난다 — 감추지 말고 적는다.
  if (selectedLevels.size > 1) {
    box.insertAdjacentHTML("afterbegin",
      `<div class="pl-empty" style="padding:8px 14px; text-align:left">
         <span class="meta">난이도를 둘 이상 골라 이 쪽에서만 걸렀습니다 —
         쪽 수는 전체(${data.totalElements}건) 기준입니다.</span>
       </div>`);
  }
}

/**
 * 상태 아이콘 — <b>색으로만 알리지 않는다</b>(스펙 §4). 기호와 aria-label을 함께 쓴다.
 * 색을 구분하기 어려운 사람에게 초록 동그라미와 빨간 가위표는 같은 회색 동그라미다.
 */
function stateIcon(state) {
  if (state === "CORRECT") return `<span aria-label="맞힌 문제" title="맞힌 문제" style="color:var(--lv1-solid)">✓</span>`;
  if (state === "WRONG") return `<span aria-label="틀린 문제" title="틀린 문제" style="color:var(--lv3-solid)">✗</span>`;
  return `<span aria-label="안 푼 문제" title="안 푼 문제" style="color:var(--muted)">○</span>`;
}

/** 마지막 시도일 — 오늘/어제는 글자로, 그 뒤는 날짜로. "3일 전"까지 세지 않는 이유는
 *  이 열의 폭이 74px이고, 오래된 것은 정확한 날짜가 더 쓸모 있기 때문이다. */
function whenLabel(iso) {
  if (!iso) return `<span style="color:var(--muted)">—</span>`;
  const d = new Date(iso);
  const today = new Date();
  const days = Math.floor((today.setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 86400000);
  if (days <= 0) return "오늘";
  if (days === 1) return "어제";
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

/**
 * 빈 상태 — 상황마다 다른 말을 한다(스펙 §6).
 * "아직 아무것도 없어요" 같은 사과조 문구는 쓰지 않는다.
 */
function emptyStateHtml() {
  /* 검색이 걸려 있으면 <그 말을 먼저> 한다. 필터와 검색이 함께 걸렸어도 방금 친 것은
     검색어이므로, "조건에 맞는 문제가 없습니다"보다 "그 말로는 없습니다"가 먼저 와야
     사람이 무엇을 지워야 할지 안다. 검색어를 그대로 보여 주는 것도 그래서다 —
     오타로 못 찾은 것인지 정말 없는 것인지는 친 말을 봐야 안다. */
  if (keyword) {
    return `<div class="pl-empty">'${escapeHtml(keyword)}'로 찾은 문제가 없습니다
      <div class="act"><button class="btn-outline" id="resetBtn">검색·필터 지우기</button></div></div>`;
  }
  if (selectedState === "DUE") {
    return `<div class="pl-empty">복습할 문제가 없습니다
      <div class="act"><a class="btn" href="/quiz.html">새 문제 풀기</a></div></div>`;
  }
  if (selectedDomain || selectedLevels.size > 0 || selectedState) {
    return `<div class="pl-empty">조건에 맞는 문제가 없습니다
      <div class="act"><button class="btn-outline" id="resetBtn">필터 초기화</button></div></div>`;
  }
  return `<div class="pl-empty">이 분야는 아직 문제를 만들지 않았습니다</div>`;
}

// 필터 초기화 — 빈 상태 안의 버튼이라 위임으로 받는다(그릴 때마다 새로 생긴다).
document.getElementById("list")?.addEventListener("click", e => {
  if (!e.target.closest("#resetBtn")) return;
  e.preventDefault();
  selectedDomain = null;
  selectedLevels.clear();
  selectedState = "";
  keyword = "";                                  // 검색어도 함께 지운다
  document.getElementById("q").value = "";       // 칸에 남아 있으면 지워진 줄 모른다
  page = 0;
  document.querySelectorAll("#levels .pl-level").forEach(b => b.setAttribute("aria-pressed", "false"));
  document.querySelectorAll("#chips .pl-chip").forEach(c =>
    c.setAttribute("aria-checked", String(c.dataset.state === "")));
  renderDomains();
  loadList();
});

function renderPager(data) {
  document.getElementById("pager").hidden = data.totalPages <= 1;
  document.getElementById("pageInfo").textContent =
    `${data.page + 1} / ${Math.max(data.totalPages, 1)} — 전체 ${data.totalElements}건`;
  document.getElementById("prevBtn").disabled = data.page === 0;
  document.getElementById("nextBtn").disabled = !data.hasNext;
}
</script>
</body>
</html>
