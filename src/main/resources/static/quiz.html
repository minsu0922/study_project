<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자유 퀴즈 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container">
  <!-- 화면 1: 설정(필터 고르고 시작) — 시작하면 숨기고 플레이어를 보여준다.
       v1은 필터+문제 나열이 한 화면에 있었지만, v2는 "설정 → 풀이 → 결과"의
       단계 구조라 화면을 통째로 전환한다(시험지를 받으면 문제에만 집중). -->
  <section id="setup">
    <!-- "자유"가 이름에 들어가는 이유: 오늘의 퀴즈(시스템이 골라줌)와의 차이를
         이름만으로 설명하기 위함(UX 1단계 개편). 아래 안내 한 줄이 그 차이를 굳힌다. -->
    <h1>자유 퀴즈</h1>
    <p class="meta" style="margin-top:-6px">분야·난이도를 직접 골라 원하는 만큼 풉니다 —
      매일 추천 세트는 <a href="/daily.html">오늘의 퀴즈</a>에서.</p>
    <div id="loginNotice"></div>

    <div class="card">
      <div class="filters" style="margin-bottom:0">
      <!-- label에 for를 반드시 적는다. 글자를 칸 위에 <놓기만> 하면 눈에는 짝으로
           보이지만 그건 배치일 뿐이고, 스크린리더에게는 이름 없는 칸 넷이 된다.
           라벨을 누르면 칸이 잡히는 것도 for가 있어야 생긴다(손가락 표적이 넓어진다). -->
        <div class="field"><label for="fDomain">도메인</label><select id="fDomain"></select></div>
        <div class="field"><label for="fLevel">난이도</label><select id="fLevel"></select></div>
        <div class="field"><label for="fType">유형</label><select id="fType"></select></div>
        <div class="field"><label for="fSize">문제 수</label>
          <select id="fSize"><option>5</option><option selected>10</option><option>20</option></select>
        </div>
      </div>
      <div style="text-align:center;margin-top:18px">
        <button id="startBtn" class="btn-lg">퀴즈 시작 🚀</button>
      </div>
    </div>
    <div id="message"></div>
  </section>

  <!-- 화면 2: 플레이어(js/player.js가 이 안을 통째로 그린다) -->
  <section id="player" hidden></section>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/report.js"></script>
<script src="/js/player.js"></script>
<script>
/* 퀴즈 페이지 — 흐름:
 *   1) 설정 화면에서 필터 선택 → [퀴즈 시작] → GET /api/quiz
 *   2) startPlayer()가 한 문제씩 진행(제출 API는 플레이어가 호출)
 *   3) 결과 화면의 [새 퀴즈 만들기] → 설정 화면 복귀
 * 정답·해설은 서버가 절대 미리 안 내려준다(docs/03) — 채점 응답에서만 온다. */
renderShell({ active: "problems", title: "자유 퀴즈" });

fillSelect(document.getElementById("fDomain"), DOMAINS, "전체");
fillSelect(document.getElementById("fLevel"), DIFFICULTIES, "전체");
fillSelect(document.getElementById("fType"), TYPES, "전체");

// 한 판 문제 수는 설정 화면에서 고른 값으로 시작한다(없으면 10 — PREF_DEFAULTS).
// 여기서 <읽기만> 한다: 이 화면에서 바꾼 값은 이번 판에만 쓰이고 저장하지 않는다.
// "이번엔 5개만"이 다음부터의 기본값이 되면, 설정 화면에서 정한 값이 조용히 덮인다.
document.getElementById("fSize").value = getPref("csquiz_quizsize");

/* 비로그인 안내 — 2026-09-08에 <말이 뒤집혔다>.
 *
 * 전에는 "채점(제출)은 로그인해야 가능합니다"였다. 같은 날 비로그인 채점이 열리면서
 * (player.js submit → /api/quiz/{id}/check) 그 문장이 거짓이 됐다. 화면이 자기 앱을
 * 잘못 설명하면, 그 말을 믿고 로그인하러 갔다가 돌아오지 않는 사람이 생긴다.
 *
 * 지금 로그인이 여는 것은 채점이 아니라 <기록>이다 — 이력·복습 사다리·오늘의 퀴즈.
 * 랜딩과 채점 결과 줄도 같은 말을 한다(같은 것을 화면마다 다르게 적으면 무엇이
 * 진짜인지 알 수 없다). */
if (!isLoggedIn()) {
  document.getElementById("loginNotice").innerHTML =
    `<div class="alert info">가입 없이 풀고 채점까지 볼 수 있어요.
     <b>기록과 복습</b>은 로그인해야 남습니다. <a href="/signup.html">가입하기</a></div>`;
}

const setupEl = document.getElementById("setup");
const playerEl = document.getElementById("player");

document.getElementById("startBtn").addEventListener("click", start);

/* 문제 목록에서 한 건을 골라 들어온 경우 — /quiz.html?problemId=42 (docs/18, 2026-08-29).
 *
 * 목록 화면의 유일한 목적이 "다음에 풀 문제 하나를 고르게 하는 것"인데, 고른 뒤에 갈 곳이
 * 없으면 그 화면은 아무 일도 하지 못한다. 설정 화면을 건너뛰고 그 문제 하나로 바로 시작한다.
 *
 * 서버가 한 칸짜리 세트로 돌려주므로(QuizService.getOne) 플레이어는 평소 흐름을 그대로 탄다. */
const requestedId = new URLSearchParams(location.search).get("problemId");
if (requestedId) {
  startSingle(requestedId);
}

async function startSingle(problemId) {
  const msg = document.getElementById("message");
  try {
    const data = await api("/api/quiz/" + encodeURIComponent(problemId));
    setupEl.hidden = true;
    playerEl.hidden = false;
    startPlayer(playerEl, data.problems, {
      // 한 문제를 풀고 나면 돌아갈 곳은 설정 화면이 아니라 <온 곳>이다.
      exitLabel: "문제 목록으로",
      onExit: () => { location.href = "/problems.html"; },
    });
  } catch (e) {
    msg.innerHTML = `<div class="alert error">${escapeHtml(e.message)}
      <div style="margin-top:8px"><a href="/problems.html">문제 목록으로 돌아가기</a></div></div>`;
  }
}

async function start() {
  const msg = document.getElementById("message");
  msg.innerHTML = "";
  try {
    const params = new URLSearchParams({ size: document.getElementById("fSize").value });
    for (const [param, id] of [["domain", "fDomain"], ["level", "fLevel"], ["type", "fType"]]) {
      const v = document.getElementById(id).value;
      if (v) params.set(param, v);
    }
    const data = await api("/api/quiz?" + params);
    if (data.problems.length === 0) {
      msg.innerHTML = `<div class="alert info">조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.</div>`;
      return;
    }
    // 설정 화면 → 플레이어 화면 전환
    setupEl.hidden = true;
    playerEl.hidden = false;
    startPlayer(playerEl, data.problems, {
      exitLabel: "새 퀴즈 만들기",
      onExit: () => {           // 결과 화면에서 복귀: 플레이어를 비우고 설정을 다시 보여준다
        playerEl.hidden = true;
        playerEl.innerHTML = "";
        setupEl.hidden = false;
        window.scrollTo({ top: 0 });
      },
    });
  } catch (e) {
    msg.innerHTML = `<div class="alert error">문제를 불러오지 못했습니다: ${escapeHtml(e.message)}</div>`;
  }
}
</script>
</body>
</html>
