<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
<!-- marked: 마크다운 → HTML 변환 라이브러리(CDN).
     문서 본문(contentMd)이 마크다운이라 그대로 두면 #, ``` 같은 기호가 날것으로 보인다.
     직접 파서를 만드는 건 과설계라 검증된 라이브러리를 쓴다.
     CDN이 안 될 때(오프라인)를 대비해 아래 스크립트에서 폴백(순수 텍스트 표시)을 둔다. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>
<div id="shell"></div>

<main class="container">
  <div id="message"></div>
  <article id="doc" hidden>
    <h1 id="title"></h1>
    <p class="doc-sub" id="edition" hidden></p>
    <div id="badges" style="margin-bottom:12px"></div>

    <!-- 목차 — 본문 위, 접힌 채로. 자세한 판단은 buildToc 주석. -->
    <details class="doc-toc" id="toc" hidden>
      <summary id="tocSummary">목차</summary>
      <nav aria-label="문서 목차"><ol id="tocList"></ol></nav>
    </details>

    <div class="doc-body" id="body"></div>

    <!-- 다 읽은 사람이 갈 곳. 자세한 판단은 renderPracticeLink 주석. -->
    <div id="practice" hidden></div>
    <a class="next-edition" id="nextEdition" hidden></a>
    <p class="meta" id="source" style="margin-top:12px"></p>
  </article>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 문서 상세 페이지 — URL의 ?slug=... 로 문서 하나를 불러온다.
 * slug는 사람이 읽는 영문 식별자(예 osi-7-layer)라 URL 공유가 쉽다(docs/01). */
renderShell({ active: "docs", title: "개념 문서" });

/* 편(입문/심화) 부제와 짝으로 가는 링크.
 *
 * 서버는 <짝이 실제로 있을 때만> edition과 counterpartSlug를 채운다(2026-09-03).
 * 둘을 한 조건으로 묶어 쓰는 이유: 따로 보면 "부제는 있는데 링크가 없는" 화면이 나올 수 있고,
 * 그건 읽는 사람에게 다른 편이 어딘가 있다고 말해 놓고 갈 길을 안 알려 주는 셈이다.
 *
 * 링크를 두 군데 두는 것은 시점이 다르기 때문이다. 위쪽(부제 옆)은 <잘못 들어온 사람>이
 * 바로 옮겨 타는 자리이고, 아래쪽 카드는 <다 읽은 사람>이 이어서 읽는 자리다.
 * 아래쪽만 두면 심화편에 잘못 들어온 초보자가 9,000자를 헤맨 뒤에야 입문편을 만난다. */
function renderEdition(d) {
  if (!d.edition || !d.counterpartSlug) {
    return; // 한 편짜리 문서 — 없는 짝을 가리키느니 아무 말도 안 하는 편이 낫다
  }
  const advanced = d.edition === "심화편";
  const otherName = advanced ? "입문편" : "심화편";
  const href = "/document.html?slug=" + encodeURIComponent(d.counterpartSlug);

  const sub = document.getElementById("edition");
  sub.innerHTML =
    `<span class="edition${advanced ? " advanced" : ""}">${escapeHtml(d.edition)}</span>` +
    `<a href="${href}">${escapeHtml(otherName)} 보기 →</a>`;
  sub.hidden = false;

  const next = document.getElementById("nextEdition");
  next.href = href;
  // 같은 제목의 다른 편이므로 제목을 다시 적어도 도움이 안 된다. 무엇이 다른지를 적는다.
  next.innerHTML =
    `<span class="label">${advanced ? "기초부터 다시" : "이어서 읽기"}</span>` +
    `<span class="name">${escapeHtml(d.title)} · ${escapeHtml(otherName)}</span>` +
    `<span class="hint">${advanced
      ? "이 글이 어려우면 개념부터 설명하는 입문편이 있습니다."
      : "같은 주제가 실무에서 어떻게 깨지는지, 면접에서 어떻게 물어보는지를 다룹니다."}</span>`;
  next.hidden = false;
}

async function loadDoc() {
  const slug = new URLSearchParams(location.search).get("slug");
  const msg = document.getElementById("message");
  if (!slug) {
    msg.innerHTML = `<div class="alert error">문서 주소가 올바르지 않습니다. <a href="/documents.html">목록으로</a></div>`;
    return;
  }
  try {
    const d = await api("/api/documents/" + encodeURIComponent(slug));
    document.title = d.title + " — csquiz";
    document.getElementById("title").textContent = d.title;
    renderEdition(d);
    /* 태그 배지는 <링크>다 — 2026-09-08.
     *
     * 지금까지 배지는 누를 수 없는 글씨였다. 서버는 태그 필터를 처음부터 받고 있었는데
     * 화면 어디에도 그 입구가 없어서, "이 태그의 다른 글"로 가려면 목록으로 돌아가
     * 도메인으로 대충 좁히는 수밖에 없었다.
     *
     * 입구를 목록이 아니라 <여기>에 둔 이유: 태그가 필요해지는 순간은 문서를 고를 때가
     * 아니라 <다 읽고 나서>다. "이거 재미있네, 비슷한 거 더" 하는 자리가 글의 끝이다.
     * 게다가 목록의 카드는 이제 카드 전체가 링크라, 그 안에 태그 링크를 넣으면
     * 링크 안의 링크가 된다(접근성 점검에서 방금 고친 그 문제다).
     *
     * 도메인 배지는 링크로 만들지 않는다. 도메인은 목록의 셀렉트로 고르는 것이고,
     * 같은 일을 하는 입구가 둘이면 어느 쪽이 "지금 걸린 것"인지 흐려진다. */
    document.getElementById("badges").innerHTML =
      `<span class="badge">${escapeHtml(d.domainLabel)}</span>` +
      d.tags.map(t => {
        const q = encodeURIComponent(t);
        return `<a class="badge gray tag-link" href="/documents.html?tag=${q}"
                   title="#${escapeHtml(t)} 태그가 달린 문서 모아 보기">#${escapeHtml(t)}</a>`;
      }).join("");

    const bodyEl = document.getElementById("body");
    if (window.marked) {
      // 마크다운 → HTML. 본문은 우리(관리자)가 시드로 넣은 신뢰 콘텐츠라 그대로 렌더링한다.
      // (외부 사용자가 문서를 작성하는 기능이 생기면 그때는 sanitize(정화) 라이브러리 필수)
      bodyEl.innerHTML = marked.parse(d.contentMd);
    } else {
      // CDN 실패 폴백: 마크다운 원문을 줄바꿈만 살려 보여준다 (안 예쁘지만 읽을 수는 있게)
      bodyEl.innerHTML = `<pre style="white-space:pre-wrap">${escapeHtml(d.contentMd)}</pre>`;
    }

    buildToc(bodyEl);
    renderPracticeLink(d);

    if (d.source) {
      document.getElementById("source").innerHTML =
        `출처: <a href="${escapeHtml(d.source)}" target="_blank" rel="noopener">${escapeHtml(d.source)}</a>`;
    }
    document.getElementById("doc").hidden = false;
  } catch (e) {
    const text = e.code === "DOC_001" ? "존재하지 않는 문서입니다." : e.message;
    msg.innerHTML = `<div class="alert error">${escapeHtml(text)} <a href="/documents.html">목록으로</a></div>`;
  }
}
loadDoc();

/**
 * 목차 — 본문의 <h2>를 훑어 만든다.
 *
 * <h2>왜 필요했나</h2>
 *
 * <p>문서 한 편이 9,000자를 넘는다. 그런데 훑을 장치가 없어서, 읽다가 자리를 잃으면
 * 처음부터 스크롤해야 했다. 이 문서들의 존재 이유가 "틀린 자리에서 바로 읽는 것"인데,
 * 그때 필요한 것은 통독이 아니라 <b>해당 절로 바로 가기</b>다.
 *
 * <h2>왜 h2만인가</h2>
 *
 * <p>문서는 h2 아래 h3까지 있는데 h3까지 넣으면 목차가 서른 줄이 된다. 목차가 본문만큼
 * 길면 그것도 훑어야 하는 글이 된다. 절 이름만으로 어디쯤인지 알 수 있으면 충분하다.
 *
 * <h2>왜 접어 두나</h2>
 *
 * <p>절이 열두 개라 펼쳐 두면 본문이 한 화면 아래로 밀린다. 문서를 연 사람의 첫 목적은
 * <b>읽는 것</b>이지 고르는 것이 아니다. 대신 요약 줄에 절 수를 적어("목차 · 12절")
 * 여기 무엇이 있는지 눌러 보지 않고도 알 수 있게 했다.
 *
 * <h2>id를 여기서 붙인다</h2>
 *
 * <p>marked가 만든 제목에는 id가 없다. 앵커로 가려면 id가 있어야 하므로 훑으면서 붙인다.
 * 값은 순번이다 — 제목 글자로 만들면 한글이 주소에 퍼센트 인코딩으로 길게 늘어지고,
 * 같은 이름의 절이 둘이면 충돌한다.
 */
function buildToc(bodyEl) {
  const 절 = [...bodyEl.querySelectorAll("h2")];
  if (절.length < 3) return;   // 두 절짜리 문서에 목차는 군더더기다

  절.forEach((h, i) => { h.id = "sec-" + (i + 1); });

  document.getElementById("tocSummary").textContent = `목차 · ${절.length}절`;
  document.getElementById("tocList").innerHTML = 절
    .map(h => `<li><a href="#${h.id}">${escapeHtml(h.textContent.trim())}</a></li>`)
    .join("");
  document.getElementById("toc").hidden = false;
}

/**
 * "이 문서로 만든 문제 풀기" — 다 읽은 사람이 갈 곳.
 *
 * <p>학습 고리가 <b>한쪽으로만</b> 돌고 있었다. 문제를 틀리면 채점 결과에 "이 문제의
 * 개념 문서 읽기"가 붙는데, 반대가 없었다 — 읽고 나서 할 수 있는 다음 행동이 메뉴로
 * 돌아가 도메인을 다시 고르는 것뿐이었다.
 *
 * <p><b>도메인이 아니라 문서로</b> 잇는다. "네트워크 문제 풀기"는 방금 읽은 것과
 * 상관없는 문제를 잔뜩 준다. 문제에는 근거 문서({@code documentSlug})가 붙어 있으니
 * 그것으로 정확히 좁힌다.
 *
 * <p><b>개수를 먼저 세어 보고</b> 그린다. 0개인 문서가 실제로 있는데(문서가 먼저 생기고
 * 문제는 나중에 배치가 만든다), 눌러서 빈 목록을 보는 것보다 링크가 아예 없는 편이 낫다.
 *
 * <p>로그인하지 않은 사람에게는 안 그린다. 문제 목록이 보호 경로라 눌러도 로그인
 * 화면으로 튕긴다 — 갈 수 없는 곳으로 가는 문을 보여 주지 않는다.
 */
async function renderPracticeLink(d) {
  if (!isLoggedIn()) return;
  try {
    const r = await api(`/api/problems?documentSlug=${encodeURIComponent(d.slug)}&size=1`);
    if (!r.totalElements) return;
    document.getElementById("practice").innerHTML = `
      <a class="btn" href="/problems.html?documentSlug=${encodeURIComponent(d.slug)}">
        이 문서로 만든 문제 ${r.totalElements}개 풀기 →</a>`;
    document.getElementById("practice").hidden = false;
  } catch (e) {
    // 개수를 못 세면 조용히 넘어간다 — 이 링크는 있으면 좋은 것이지 본문의 일부가 아니다
  }
}
</script>
</body>
</html>
