<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복습 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container side-page">
  <!-- 화면 1: 오늘의 복습 카드 + 틀린 문제 목록 -->
  <section id="overview">
    <h1>복습</h1>
    <!-- 복습과 오답노트를 한 화면으로 합쳤다(2026-10-20). 두 탭이 같은 문제 집합을 각자 늘어놓고
         있었다 — 사다리에 오르는 문제가 곧 틀린 문제라서다. 위 카드가 오늘 할 일의 입구이고,
         아래 목록이 기록이다. 줄은 단계·다음 복습일을 말하고, 펼치면 내 답·해설이 나온다. -->
    <p class="meta">틀렸던 문제를 <b>1일 → 3일 → 7일 → 14일 → 30일</b> 간격으로 다시 만나요.
      맞힐 때마다 간격이 늘고, 다섯 번 통과하면 졸업 (틀리면 한 칸만 내려가요)<br>
      복습은 <b>그 날 아침부터</b> 열려요. 밤늦게 푼 문제도 다음 날이면 올라옵니다.</p>

    <div id="message"></div>
    <div id="todayBox"></div>

    <!-- 로그인해야 내용이 생기는 구역이라 비로그인에는 통째로 감춘다 -->
    <div class="review-list" id="statusBlock" hidden>
      <h2>틀린 문제</h2>
      <p class="meta">틀린 적 있는 문제 전부예요. 줄을 누르면 내 답·해설이 펼쳐지고 다시 풀 수 있어요.</p>
      <div class="pl-body">
        <aside class="pl-side" aria-label="분야와 상태">
          <h2>분야 <span class="pl-unit">문제 수</span></h2>
          <div class="pl-domains" id="domains"></div>
          <h2 class="second">상태</h2>
          <div class="pl-tags" id="statuses"></div>
        </aside>
        <div class="pl-main">
          <div class="filters" role="search">
            <div class="field field-search"><label for="q">검색 <span class="meta">(제목·지문)</span></label>
              <input type="search" id="q" maxlength="50" placeholder="예: TIME_WAIT" enterkeyhint="search"></div>
            <div class="field field-reset"><label>&nbsp;</label>
              <button type="button" id="filterResetBtn" class="btn-outline">필터 지우기</button></div>
          </div>
          <div id="list"></div>
          <div class="pager" id="pager" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 화면 2: 복습 플레이어(js/player.js) — [복습 시작]을 누르면 전환 -->
  <section id="player" hidden></section>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/report.js"></script>
<script src="/js/bookmark.js"></script>
<script src="/js/room-link.js"></script>
<script src="/js/player.js"></script>
<script>
/* 복습 페이지 (docs/10) — 흐름:
 *   1) GET /api/me/reviews/today 로 "오늘 풀 문제"를 조회 (빈 목록 = 오늘 할 일 없음, 정상)
 *   2) [복습 시작] → 퀴즈와 같은 플레이어로 진행. 제출도 같은 POST /api/quiz/submit
 *   3) 아래 틀린 문제 목록 — 줄은 GET /api/me/reviews(단계·다음 복습일),
 *      펼칠 내용은 GET /api/me/wrong-answers/of(그 쪽에 보이는 문제의 내 답·해설)로 한 번에 받는다.
 * 전부 로그인 필수. */
renderShell({ active: "review", title: "복습" });

const overviewEl = document.getElementById("overview");
const playerEl = document.getElementById("player");
let page = 0;
/* 옆 기둥에서 고른 분야·상태(null이면 전체)와 거기 적을 수.
   아래 loadStatus()가 파일을 다 읽기 전에 불리므로 쓰는 곳보다 위에 둔다(let은 선언 전에 읽으면 오류) */
let selectedDomain = null;
let selectedStatus = null;
let counts = null;
/** "오늘" 칩의 수 — [복습 시작] 카드가 받은 totalElements를 그대로 쓴다(같은 조건이라 같은 수다) */
let dueTotal = null;
/** 메뉴의 "오답노트"(#list)로 들어왔으면 첫 목록을 그린 뒤 그 자리로 내린다 */
let scrollToListOnce = location.hash === "#list";

/* 한 판에 내보내는 복습 문제 수. 서버 상한은 50이지만
   상한을 다 쓰는 것과 사람이 한자리에서 풀 수 있는 양은 다른 문제다. */
const SESSION_SIZE = 20;
/** 목록 한 쪽에 10문제. 접힌 줄 10개가 한 화면에 들어와 아래 쪽 번호까지 보인다 */
const PAGE_SIZE = 10;

if (!isLoggedIn()) {
  document.getElementById("message").innerHTML =
    `<div class="alert info">복습은 <b>내 계정의 기록</b>이라 로그인이 필요합니다.
     <a href="/login.html">로그인하기</a></div>
     <p class="meta">계정이 없어도 <a href="/quiz.html">자유 퀴즈</a>는 바로 풀 수 있어요 —
       가입한 뒤부터 틀린 문제가 이 사다리에 올라갑니다.</p>`;
} else {
  loadToday();
  loadStatus();
}

/* ── 오늘의 복습 박스 ── */
async function loadToday() {
  const box = document.getElementById("todayBox");
  showLoading(box);
  try {
    // 밀린 복습이 많아도 한 판은 20문제까지. 오래 밀린 순이라 앞에서 떼면 "제일 급한 것부터 한 판"이다.
    const data = await api(`/api/me/reviews/today?size=${SESSION_SIZE}`);
    dueTotal = data.totalElements;
    renderSide();
    if (data.totalElements === 0) {
      showStatusBlock(await renderNothingDue(box));
      return;
    }
    showStatusBlock(true);
    const inSession = data.content.length;
    const rest = data.totalElements - inSession;
    box.innerHTML = `
      <div class="card" style="text-align:center;padding:28px">
        <b>오늘 복습할 문제 ${inSession}개를 골랐어요</b>
        <div class="meta" style="margin-top:4px">오래 밀린 문제부터 차례로 나와요${
          rest > 0 ? `<br>남은 ${rest}개는 이 판을 끝내면 이어서 나와요 — 한 번에 다 안 해도 돼요` : ""}</div>
        <button id="startReviewBtn" class="btn-lg" style="margin-top:12px">복습 시작 →</button>
      </div>`;
    document.getElementById("startReviewBtn").addEventListener("click", () => {
      overviewEl.hidden = true;
      playerEl.hidden = false;
      startPlayer(playerEl, data.content, {
        reviewMode: true,
        // 여기서 같은 문제를 다시 풀면 한 번 더 채점되어 사다리가 또 움직인다.
        // 해설을 다시 읽고 싶으면 아래 목록에서 줄을 펼친다(사다리를 건드리지 않는다).
        retry: false,
        exitLabel: "복습 화면으로",
        onExit: backToOverview,
      });
    });
  } catch (e) {
    showErrorAlert(box, e, "복습 목록을 불러오지 못했습니다");
    showStatusBlock(true);   // 오늘 몫을 못 읽었어도 목록은 따로 읽을 수 있다
  } finally {
    clearLoading(box);
  }
}

function showStatusBlock(show) {
  document.getElementById("statusBlock").hidden = !show;
}

/**
 * 오늘 할 복습이 없을 때 — 왜 없는지를 가른다(2026-09-09).
 * 사다리가 빈 사람(가입 직후), 기다리는 문제가 있는 사람, 전부 졸업한 사람에게 하는 말이 다르다.
 * 정렬이 nextReviewAt 오름차순이라 한 건만 받으면 그것이 가장 가까운 예정일이다.
 *
 * @return 아래 목록 구역을 보여 줄지 — 한 번이라도 사다리에 오른 문제가 있으면 true
 */
async function renderNothingDue(box) {
  let waiting = null;
  let all = null;
  try {
    waiting = await api("/api/me/reviews?status=LEARNING&size=1");
    if (waiting.totalElements === 0) all = await api("/api/me/reviews?size=1");
  } catch (e) {
    // 못 세면 졸업 문구로 돌아간다 — 안내 한 줄 때문에 화면이 비면 안 된다.
  }

  const count = waiting?.totalElements || 0;
  if (count === 0 && all && all.totalElements === 0) {
    box.innerHTML = `
      <div class="card" style="text-align:center;padding:28px">
        <b>아직 복습할 문제가 없어요</b>
        <div class="meta" style="margin-top:4px">퀴즈에서 틀린 문제가 다음 날부터 여기에 올라와요.</div>
        <a class="btn" style="margin-top:12px" href="/daily.html?start=1">오늘의 퀴즈 풀기</a>
      </div>`;
    return false;
  }
  if (count === 0) {
    box.innerHTML = `
      <div class="card" style="text-align:center;padding:28px">
        <b>복습할 문제가 없어요!</b>
        <div class="meta" style="margin-top:4px">${all
          ? "사다리의 문제를 모두 졸업했어요. 새로 틀린 문제가 생기면 여기에 올라와요."
          : "문제를 틀리면 여기 사다리에 올라와요."}</div>
        <a class="btn" style="margin-top:12px" href="/quiz.html?start=1">퀴즈 풀러 가기</a>
      </div>`;
    return true;
  }

  const on = shortDay(waiting.content[0].nextReviewAt);
  box.innerHTML = `
    <div class="card" style="text-align:center;padding:28px">
      <b>오늘 몫은 끝났어요</b>
      <div class="meta" style="margin-top:4px">${count}개가 사다리에서 기다리는 중 —
        가장 이른 복습은 <b>${escapeHtml(on)}</b>부터예요.</div>
      <a class="btn" style="margin-top:12px" href="/quiz.html?start=1">새 문제 풀러 가기</a>
    </div>`;
  return true;
}

/** 플레이어 결과 화면에서 복귀 — 방금 푼 결과가 반영되게 카드·목록·수를 다시 불러온다. */
function backToOverview() {
  playerEl.hidden = true;
  playerEl.innerHTML = "";
  overviewEl.hidden = false;
  page = 0;
  loadToday();
  loadStatus();
  loadCounts();
  window.scrollTo({ top: 0 });
}

/* ── 틀린 문제 목록 ── */

/**
 * 이 쪽에 보이는 문제들의 오답 카드(내 답·해설)를 한 번에 받는다.
 * 실패해도 목록은 그린다 — 줄의 단계·다음 복습일은 이미 받았고, 펼친 자리에서만 비어 보인다.
 */
async function loadWrongCards(problemIds) {
  const map = new Map();
  if (problemIds.length === 0) return map;
  try {
    const items = await api(`/api/me/wrong-answers/of?problemIds=${problemIds.join(",")}`);
    items.forEach(w => map.set(w.problemId, w));
  } catch { /* 펼친 자리에서 안내한다 */ }
  return map;
}

/** 줄의 "언제" 글자 — 지금 풀면 단계에 반영되는지를 함께 말한다(ReviewService.onSubmission) */
function whenOf(r) {
  const on = shortDay(r.nextReviewAt);
  // 졸업생의 nextReviewAt은 재확인 예정일이다. 서버 due는 졸업생에게 늘 false라 여기서 비교한다.
  const recheckDue = r.status === "GRADUATED" && new Date(r.nextReviewAt) <= new Date();
  const ready = r.due || recheckDue;
  const text = r.status === "GRADUATED"
    ? (recheckDue ? "재확인할 때예요" : `졸업 · ${on}에 한 번 재확인`)
    : r.due ? "오늘 복습" : `다음 복습 ${on}`;
  return { ready, text };
}

function rowHtml(r, w) {
  const stageBadge = r.status === "GRADUATED"
    ? `<span class="badge green">졸업</span>`
    : `<span class="badge orange">${r.stage + 1}단계</span>`;
  const { ready, text } = whenOf(r);
  // 예정일 전에 맞히면 단계는 그대로다. 단추 이름이 그 차이를 미리 말한다
  const solve = `<a class="btn" href="/quiz.html?problemId=${r.problemId}"
      title="${ready ? "맞히면 다음 단계로 올라가요" : "복습 날 전이라 맞혀도 단계는 그대로예요"}">${
      ready ? "지금 풀기" : "미리 풀어 보기"}</a>`;

  const body = w ? `
      <span class="badge gray">${escapeHtml(typeLabel(w.type))}</span>
      <span class="meta">${shortDay(w.lastSubmittedAt)}에 마지막으로 틀림</span>
      <p class="wa-question">${escapeHtml(w.question)}</p>
      ${codeBlockHtml(w.code, w.codeFocusLine)}
      <div style="color:var(--wrong-fg)">내 답: ${escapeHtml(w.myAnswer)}</div>
      <!-- 서술형은 한 줄 정답이 없다. 모범 답안은 아래 해설 줄에 나온다. -->
      ${w.correctAnswer ? `<div style="color:var(--correct-fg)">정답: ${escapeHtml(w.correctAnswer)}</div>` : ""}
      ${w.myAnswerRationale ? `<div class="meta" style="margin-top:6px;color:var(--wrong-fg)">
        왜 틀렸나: ${escapeHtml(w.myAnswerRationale)}</div>` : ""}
      ${w.explanation ? `<div class="meta" style="margin-top:6px; white-space:pre-wrap">${escapeHtml(w.explanation)}</div>` : ""}
      ${w.documentSlug ? `<div class="meta" style="margin-top:6px">${icon("book")} <a href="/document.html?slug=${
        encodeURIComponent(w.documentSlug)}">이 문제의 개념 문서 읽기</a></div>` : ""}`
    : `<p class="wa-question">${escapeHtml(r.question)}</p>
       <p class="meta">내 답·해설을 불러오지 못했어요. 다시 풀어 보면 채점 화면에서 볼 수 있어요.</p>`;

  return `
    <details class="list-row wa-item${ready ? " ready" : ""}">
      <summary>
        <!-- 제목이 있으면 제목. 옛 문제는 제목이 없어 지문으로 대신한다(docs/18) -->
        <span class="list-row-title wa-title">${escapeHtml(r.title || r.question)}</span>
        <span class="meta"><span class="list-row-domain">${escapeHtml(r.domainLabel)}</span>${
          w ? difficultyBadge(w.difficulty) : ""}${stageBadge}<span class="rv-when">${text}</span></span>
      </summary>
      <div class="wa-body">
        ${body}
        <div class="wa-actions">${solve}${bookmarkButton("PROBLEM", r.problemId)}</div>
        <!-- 제보 입구. "왜 틀렸지" 하고 다시 읽다가 문제 쪽이 틀렸다는 것을 깨닫는 자리가 대개 여기다 -->
        ${reportBlock(r.problemId)}
        <div>${roomLink(r.problemId)}</div>
      </div>
    </details>`;
}

async function loadStatus() {
  const list = document.getElementById("list");
  showLoading(list);
  try {
    const params = new URLSearchParams({ page, size: PAGE_SIZE });
    const filters = filterParams({ q: "q" });
    if (selectedStatus === "DUE") filters.set("due", "true");
    else if (selectedStatus) filters.set("status", selectedStatus);
    if (selectedDomain) filters.set("domain", selectedDomain);
    filters.forEach((v, k) => params.set(k, v));
    const data = await api("/api/me/reviews?" + params);
    // 줄을 그리기 전에 펼칠 내용까지 받는다. 나중에 채우면 배지가 덜컥거리며 나타난다
    const cards = await loadWrongCards(data.content.map(r => r.problemId));

    if (data.content.length === 0) {
      showEmpty(list, filters.toString()
        ? "조건에 맞는 문제가 없어요 — 필터를 지우면 전체가 보여요."
        : "아직 틀린 문제가 없어요. 퀴즈에서 문제를 틀리면 자동으로 여기에 올라와요.");
    } else {
      list.innerHTML = data.content.map(r => rowHtml(r, cards.get(r.problemId))).join("");
      hydrateBookmarks(list);
      drawProblemDiagrams(list);
    }
    pager.update(data);
    if (scrollToListOnce) {
      scrollToListOnce = false;
      document.getElementById("statusBlock").scrollIntoView({ block: "start" });
    }
  } catch (e) {
    showErrorAlert(list, e, "불러오지 못했습니다");
  } finally {
    clearLoading(list);
  }
}

/* ── 옆 기둥: 분야(문제 수)와 상태(오늘·복습 중·졸업) ── */
const STATUSES = [["DUE", "오늘 복습"], ["LEARNING", "복습 중"], ["GRADUATED", "졸업"]];

function statusCount(v) {
  if (v === "DUE") return dueTotal;
  if (!counts) return null;
  return v === "LEARNING" ? counts.learning : counts.graduated;
}

function renderSide() {
  const byDomain = new Map((counts?.domains ?? []).map(d => [d.domain, d.count]));
  document.getElementById("domains").innerHTML = DOMAINS.map(([code, label]) => `
    <button type="button" class="pl-domain" data-domain="${code}" aria-pressed="${selectedDomain === code}">
      <span class="row"><span class="name">${escapeHtml(label)}</span>${
        counts ? `<span class="n">${byDomain.get(code) ?? 0}</span>` : ""}</span></button>`).join("");
  document.getElementById("statuses").innerHTML = STATUSES.map(([v, label]) => {
    const n = statusCount(v);
    return `<button type="button" class="pl-level" data-status="${v}" aria-pressed="${selectedStatus === v}">${label}${
      n != null ? ` <span class="n">${n}</span>` : ""}</button>`;
  }).join("");
}

/** 수는 플레이어에서 돌아올 때도 바뀐다(졸업·새 오답). 그래서 목록을 다시 부를 때 함께 부른다 */
async function loadCounts() {
  try { counts = await api("/api/me/reviews/counts"); } catch (e) { /* 수 없이 이름만 */ }
  renderSide();
}

document.getElementById("domains").addEventListener("click", e => {
  const btn = e.target.closest(".pl-domain");
  if (!btn) return;
  selectedDomain = selectedDomain === btn.dataset.domain ? null : btn.dataset.domain;
  page = 0; renderSide(); loadStatus();
});
document.getElementById("statuses").addEventListener("click", e => {
  const btn = e.target.closest("[data-status]");
  if (!btn) return;
  selectedStatus = selectedStatus === btn.dataset.status ? null : btn.dataset.status;
  page = 0; renderSide(); loadStatus();
});

wireFilterBar({
  search: "q", reset: "filterResetBtn",
  onReset: () => { selectedDomain = null; selectedStatus = null; renderSide(); },
  onChange: () => { page = 0; loadStatus(); },
});
if (isLoggedIn()) domainsReady.then(loadCounts);
const pager = mountPager(document.getElementById("pager"), p => {
  page = p; loadStatus();
  document.getElementById("statusBlock").scrollIntoView({ block: "start" });
});
</script>
</body>
</html>
