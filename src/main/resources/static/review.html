<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복습 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container">
  <!-- 화면 1: 오늘의 복습 요약 + 시작 버튼 + 내 복습 현황 -->
  <section id="overview">
    <h1>복습</h1>
    <!-- 구역 탭 — 복습과 오답노트는 <한 구역>이다(2026-08-29 메뉴 개편).
         둘 다 "틀린 문제를 다시 보는" 자리인데 상단 메뉴에 나란히 있어서, 어느 쪽을
         눌러야 하는지가 이름만 봐서는 안 갈렸다. 복습 화면이 아예 "해설을 다시 읽고
         싶으면 → 오답노트"라고 안내하고 있었다 — 화면이 스스로 반쪽이라고 말한 셈이다.
         메뉴에서는 하나로 묶고, 오가는 것은 여기서 한다. -->
    <div class="tabs">
      <a class="tab-btn active" href="/review.html">복습 일정</a>
      <a class="tab-btn " href="/wrong-answers.html">오답노트</a>
    </div>

    <p class="meta">틀렸던 문제를 <b>1일 → 3일 → 7일 → 14일 → 30일</b> 간격으로 다시 만나요.
      맞힐 때마다 간격이 늘고, 다섯 번 통과하면 졸업 🎓 (틀리면 한 칸만 내려가요)<br>
      <!-- 학습일 경계(2026-09-05) 안내 — "어제 틀렸는데 왜 아직 안 뜨지?"를 없애는 한 줄. -->
      복습은 <b>그 날 아침부터</b> 열려요. 밤늦게 푼 문제도 다음 날이면 올라옵니다.</p>

    <div id="message"></div>
    <div id="todayBox"></div>

    <!-- 로그인해야 내용이 생기는 구역이라 비로그인에는 통째로 감춘다 — 2026-09-09.
         전에는 제목·설명·상태 드롭다운이 빈 껍데기로 남아, 고를 것이 없는 필터만 덩그러니 있었다. -->
    <div class="review-list" id="statusBlock" hidden>
      <h2>내 복습 현황</h2>
      <!-- "오답노트로 가라"는 안내를 뺐다(2026-08-29). 위 구역 탭이 같은 말을 하고 있어서,
           남겨 두면 같은 이동을 두 곳에서 권하는 셈이 된다. -->
      <p class="meta">여기서는 <b>몇 단계인지·다음 복습이 언제인지</b>만 보여요.</p>
      <div class="filters">
        <div class="field" style="max-width:200px">
          <label for="statusFilter">상태</label>
          <select id="statusFilter">
            <option value="">전체</option>
            <option value="LEARNING">복습 중</option>
            <option value="GRADUATED">졸업 🎓</option>
          </select>
        </div>
      </div>
      <div id="list"></div>
      <!-- id가 pager*인 이유 — 2026-09-09.
           이 화면은 <같은 문서에> 복습 플레이어를 얹는다. 그런데 플레이어도 채점 뒤
           [다음 문제] 버튼을 id="nextBtn"으로 만든다(player.js). 그래서 한 문서에 같은 id가
           둘 생겼고, document.querySelector("#nextBtn")은 <먼저 나오는> 이 페이저 버튼을
           잡았다 — 플레이어를 조작하려는 코드가 조용히 엉뚱한 버튼을 누른다.
           플레이어 안쪽은 mountEl 범위로 찾아 무사했지만, 유효하지 않은 HTML이고
           다음에 이 화면을 건드리는 사람이 같은 함정에 빠진다. 화면 쪽 이름을 비켜 준다. -->
      <div class="pager" id="pager" hidden>
        <button id="pagerPrev" class="btn-outline">이전</button>
        <span class="info" id="pageInfo"></span>
        <button id="pagerNext" class="btn-outline">다음</button>
      </div>
    </div>
  </section>

  <!-- 화면 2: 복습 플레이어(js/player.js) — [복습 시작]을 누르면 전환 -->
  <section id="player" hidden></section>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/report.js"></script>
<script src="/js/player.js"></script>
<script>
/* 복습 페이지 (로드맵 4 — docs/10) — 흐름:
 *   1) GET /api/me/reviews/today 로 "오늘 풀 문제"를 조회 (빈 목록 = 오늘 할 일 없음, 정상)
 *   2) [복습 시작] → 퀴즈와 같은 플레이어로 진행. 제출도 같은 POST /api/quiz/submit —
 *      채점 결과가 서버에서 자동으로 사다리 승급/리셋에 반영된다(별도 복습 제출 API 없음).
 *   3) 아래에는 전체 현황(GET /api/me/reviews) — 문제별로 몇 단계인지, 다음 복습이 언제인지.
 * 복습은 "내 기록"이라 전부 로그인 필수. */
renderShell({ active: "review", title: "복습" });

const overviewEl = document.getElementById("overview");
const playerEl = document.getElementById("player");
let page = 0;

/* 한 판에 내보내는 복습 문제 수(2026-09-05). 20인 이유는 오답노트 한 페이지와 같은 수라
   "한 번에 다루는 양"의 감각이 사이트 안에서 일정하기 때문이다. 서버 상한은 50이지만
   상한을 다 쓰는 것과 사람이 한자리에서 풀 수 있는 양은 다른 문제다. */
const SESSION_SIZE = 20;

if (!isLoggedIn()) {
  // 위 사다리 설명은 남긴다 — 이 화면에서 비로그인에게도 뜻이 있는 유일한 내용이고,
  // "가입하면 무엇이 생기는지"를 말해 주는 자리이기도 하다.
  document.getElementById("message").innerHTML =
    `<div class="alert info">복습은 <b>내 계정의 기록</b>이라 로그인이 필요합니다.
     <a href="/login.html">로그인하기</a></div>
     <p class="meta">계정이 없어도 <a href="/quiz.html">자유 퀴즈</a>는 바로 풀 수 있어요 —
       가입한 뒤부터 틀린 문제가 이 사다리에 올라갑니다.</p>`;
} else {
  document.getElementById("statusBlock").hidden = false;
  loadToday();
  loadStatus();
}

/* ── 오늘의 복습 박스 ── */
async function loadToday() {
  const box = document.getElementById("todayBox");
  try {
    // 한 판은 SESSION_SIZE(20)문제까지만 받는다(2026-09-05).
    // 전에는 50개를 받아 한 번에 다 풀렸다. 며칠 안 들어오면 "복습 47문제"가 뜨는데,
    // 그 숫자를 본 사람은 시작을 미루고, 미루면 다음 날 더 쌓인다. 밀린 복습이 사람을
    // 쫓아내는 흔한 실패다. 서버가 오래 밀린 순으로 주므로 앞에서 20개를 떼면
    // "제일 급한 것부터 한 판"이 된다.
    const data = await api(`/api/me/reviews/today?size=${SESSION_SIZE}`);
    if (data.totalElements === 0) {
      await renderNothingDue(box);
      return;
    }
    // 밀린 게 한 판을 넘으면 "전부"가 아니라 "이번 판 몫"을 앞세운다. 47개를 들이미는 대신
    // 20개를 보여 주고 남은 건 괄호로 밀어 두는 것만으로도 시작하기가 훨씬 쉬워진다.
    const inSession = data.content.length;
    const rest = data.totalElements - inSession;
    box.innerHTML = `
      <div class="card" style="text-align:center;padding:28px">
        <div style="font-size:1.6rem">📅</div>
        <b>오늘 복습할 문제 ${inSession}개를 골랐어요</b>
        <div class="meta" style="margin-top:4px">오래 밀린 문제부터 차례로 나와요${
          rest > 0 ? `<br>남은 ${rest}개는 이 판을 끝내면 이어서 나와요 — 한 번에 다 안 해도 돼요` : ""}</div>
        <button id="startReviewBtn" class="btn-lg" style="margin-top:12px">복습 시작 ✍️</button>
      </div>`;
    document.getElementById("startReviewBtn").addEventListener("click", () => {
      overviewEl.hidden = true;
      playerEl.hidden = false;
      startPlayer(playerEl, data.content, {
        reviewMode: true,                 // 문항에 "복습 N단계" 배지 + 승급/리셋 안내 문구
        // 복습에서도 "같은 문제 다시 풀기"는 감춘다 — 2026-09-09(오늘의 퀴즈와 같은 판단).
        // 여기서 다시 풀면 같은 문제가 <한 번 더 채점되어> 사다리가 또 움직인다.
        // 방금 맞힌 문제를 그 자리에서 또 맞히면 간격이 두 칸 늘어나는 셈인데, 그건
        // "시간을 두고 다시 만나서 기억을 재는" 이 기능의 전제를 스스로 무너뜨린다.
        // 해설을 한 번 더 읽고 싶은 사람은 오답노트로 간다(사다리를 건드리지 않는다).
        retry: false,
        exitLabel: "복습 현황으로",
        onExit: backToOverview,
      });
    });
  } catch (e) {
    box.innerHTML = `<div class="alert error">복습 목록을 불러오지 못했습니다: ${escapeHtml(e.message)}</div>`;
  }
}

/**
 * 오늘 할 복습이 없을 때 — <b>왜 없는지</b>를 가른다(2026-09-09).
 *
 * <p>전에는 무조건 "🎉 오늘 복습할 문제가 없어요!"였다. 그런데 방금 다섯 문제를 틀린
 * 사람에게도 같은 축하가 떴다. 사다리의 첫 칸이 하루 뒤라 오늘 대기가 0인 것뿐인데,
 * 화면 위쪽은 축하하고 바로 아래 목록에는 "다음 복습: 내일부터"가 다섯 줄 있었다.
 * 🎉는 <b>다 해냈다</b>는 뜻이라, 아무것도 안 한 사람에게 붙으면 신호가 값을 잃는다.
 *
 * <p>기다리는 것이 있는지는 <b>학습 중(LEARNING)</b>만 세어서 판단한다. 졸업한 항목은
 * 사다리를 끝낸 것이라 "기다리는 복습"이 아니고(재확인은 별개의 권유다), 전체를 세면
 * 졸업만 남은 사람에게도 "N개가 기다립니다"라고 말하게 된다.
 *
 * <p>정렬이 nextReviewAt 오름차순으로 고정돼 있어(ReviewItemRepository) 한 건만 받으면
 * 그것이 곧 <b>가장 가까운 예정일</b>이다 — 목록을 다 받아 최솟값을 찾을 이유가 없다.
 */
async function renderNothingDue(box) {
  let waiting = null;
  try {
    waiting = await api("/api/me/reviews?status=LEARNING&size=1");
  } catch (e) {
    // 못 세면 예전 문구로 돌아간다 — 안내 한 줄 때문에 화면이 비면 안 된다.
  }

  const count = waiting?.totalElements || 0;
  if (count === 0) {
    box.innerHTML = `
      <div class="card" style="text-align:center;padding:28px">
        <div style="font-size:1.6rem">🎉</div>
        <b>복습할 문제가 없어요!</b>
        <div class="meta" style="margin-top:4px">문제를 틀리면 여기 사다리에 올라와요.</div>
        <a class="btn" style="margin-top:12px" href="/quiz.html?start=1">퀴즈 풀러 가기</a>
      </div>`;
    return;
  }

  const on = formatDate(waiting.content[0].nextReviewAt).substring(0, 10);
  box.innerHTML = `
    <div class="card" style="text-align:center;padding:28px">
      <div style="font-size:1.6rem">🌱</div>
      <b>오늘 몫은 끝났어요</b>
      <div class="meta" style="margin-top:4px">${count}개가 사다리에서 기다리는 중 —
        가장 이른 복습은 <b>${escapeHtml(on)}</b>부터예요.</div>
      <a class="btn" style="margin-top:12px" href="/quiz.html?start=1">새 문제 풀러 가기</a>
    </div>`;
}

/** 플레이어 결과 화면에서 복귀 — 방금 푼 결과가 반영되게 요약·현황·배지를 다시 불러온다. */
function backToOverview() {
  playerEl.hidden = true;
  playerEl.innerHTML = "";
  overviewEl.hidden = false;
  page = 0;
  loadToday();
  loadStatus();
  window.scrollTo({ top: 0 });
}

/* ── 내 복습 현황 표 ── */
async function loadStatus() {
  const list = document.getElementById("list");
  try {
    const params = new URLSearchParams({ page });
    const status = document.getElementById("statusFilter").value;
    if (status) params.set("status", status);
    const data = await api("/api/me/reviews?" + params);

    if (data.content.length === 0) {
      list.innerHTML = `<div class="card meta">아직 복습 기록이 없어요.
        퀴즈에서 문제를 틀리면 자동으로 여기에 올라와요.</div>`;
    } else {
      // 표 대신 카드 — 모바일에서 표는 옆으로 잘리기 쉽고, 항목당 정보가 4~5개뿐이라 카드가 읽기 편하다
      // 지문은 "어느 문제인지 알아볼" 식별용으로만 — 한 줄 말줄임 + 흐린 색.
      // 지문·정답·해설을 크게 보여주는 건 오답노트의 역할이라, 여기서 지문을 키우면
      // 두 페이지가 똑같아 보인다(메뉴 역할 분리 — 이 페이지의 본론은 단계/다음 복습일).
      list.innerHTML = data.content.map(r => {
        const stageBadge = r.status === "GRADUATED"
          ? `<span class="badge green">졸업 🎓</span>`
          : `<span class="badge orange">${r.stage + 1}단계</span>`;
        // 예정 시각은 "그 날 새벽 4시"라 시·분을 그대로 보여주면 "9/6 04:00"이 된다 —
        // 새벽 4시에 일어나라는 말로 읽힌다. 실제로 중요한 건 <어느 날부터 열리는가>이므로
        // 날짜만 쓴다(2026-09-05 학습일 경계 도입과 함께).
        const on = formatDate(r.nextReviewAt).substring(0, 10);

        // 졸업생은 nextReviewAt이 "재확인 예정일"이다(2026-09-05). 서버의 due 값은 졸업생에게
        // 늘 false라 여기서 직접 비교한다 — due는 "오늘의 복습 대상"이라는 뜻이고, 재확인은
        // 그 목록에 넣지 않기로 한 별개의 권유이기 때문이다.
        const recheckDue = r.status === "GRADUATED" && new Date(r.nextReviewAt) <= new Date();

        const dueLabel = r.status === "GRADUATED"
          ? (recheckDue
              // 링크는 문제 지목 풀이 경로다. 틀리면 자동으로 사다리에 다시 오르고,
              // 맞히면 다음 재확인으로 미뤄진다 — 어느 쪽이든 서버가 알아서 처리한다.
              ? `<a href="/quiz.html?problemId=${r.problemId}" style="color:var(--review);font-weight:700"
                   >오래 안 봤어요 — 다시 확인해볼까요? 🔍</a>`
              : `복습 끝! ${on}에 한 번만 다시 확인해요 🎓`)
          : r.due ? `<span style="color:var(--review);font-weight:700">지금 복습할 시간!</span>`
                  : `다음 복습: ${on}부터`;
        return `
          <div class="card">
            <div style="margin-bottom:4px">
              <span class="badge">${escapeHtml(r.domainLabel)}</span>
              ${stageBadge}
              ${r.reviewCount > 0 ? `<span class="badge gray">복습 ${r.reviewCount}회</span>` : ""}
            </div>
            <!-- 제목이 있으면 제목. 지문은 상황 서술로 시작하는 일이 많아 한 줄로 자르면
                 무엇을 묻는지 알 수 없다(문제 목록이 제목 컬럼을 만든 이유, docs/18).
                 옛 문제는 제목이 없으므로 그때만 지문으로 대신한다. -->
            <div class="meta one-line" title="${escapeHtml(r.question)}">${escapeHtml(r.title || r.question)}</div>
            <div style="margin-top:4px;font-size:.86rem">${dueLabel}</div>
          </div>`;
      }).join("");
    }

    const pager = document.getElementById("pager");
    pager.hidden = data.totalPages <= 1;
    document.getElementById("pageInfo").textContent = `${data.page + 1} / ${Math.max(data.totalPages, 1)}`;
    document.getElementById("pagerPrev").disabled = data.page === 0;
    document.getElementById("pagerNext").disabled = !data.hasNext;
  } catch (e) {
    const text = e.status === 401
      ? `로그인이 만료됐습니다. <a href="/login.html">다시 로그인해 주세요.</a>`
      : `불러오지 못했습니다: ${escapeHtml(e.message)}`;
    list.innerHTML = `<div class="alert error">${text}</div>`;
  }
}

document.getElementById("statusFilter").addEventListener("change", () => { page = 0; loadStatus(); });
document.getElementById("pagerPrev").addEventListener("click", () => { page--; loadStatus(); });
document.getElementById("pagerNext").addEventListener("click", () => { page++; loadStatus(); });
</script>
</body>
</html>
