<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토론 글 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다(이유는 wrong-answers.html의 같은 자리 주석). */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container">
  <!-- 돌아갈 곳. 글은 방 안에 있고 방은 문제에 딸려 있어, 위로 가는 길이 여기 하나다. -->
  <p class="meta" id="backLink"></p>

  <div id="message" role="alert"></div>

  <article class="card post" id="post" hidden></article>

  <form id="editForm" class="card" hidden>
    <div class="field">
      <label for="editCategory">말머리</label>
      <select id="editCategory" required></select>
    </div>
    <div class="field">
      <label for="editTitle">제목 (2~100자)</label>
      <input type="text" id="editTitle" required minlength="2" maxlength="100">
    </div>
    <div class="field">
      <label for="editBody">내용 (5,000자까지)</label>
      <textarea id="editBody" rows="8" required maxlength="5000"></textarea>
    </div>
    <div id="editMessage" role="alert"></div>
    <div class="row-actions">
      <button type="submit" id="editSubmit">저장</button>
      <button type="button" id="editCancel" class="btn-outline">취소</button>
    </div>
  </form>

  <div id="comments"></div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/discussion.js"></script>
<script>
/* 토론 글 한 건 — 본문과 댓글.
 *   GET    /api/quiz/posts/{id}   글(공개). 지운 글은 404, 가린 글은 제목·본문 없이 온다
 *   PUT    /api/me/posts/{id}     수정(글쓴이만)
 *   DELETE /api/me/posts/{id}     삭제(글쓴이만)
 * 댓글은 discussion.js가 맡는다. 여기서는 붙일 자리만 낸다. */
renderShell({ active: "community", title: "토론 글" });

const postId = new URLSearchParams(location.search).get("id");
const message = document.getElementById("message");
const article = document.getElementById("post");
const editForm = document.getElementById("editForm");
let post = null;

function showError(text) {
  message.innerHTML = `<div class="alert error">${escapeHtml(text)}</div>`;
}

function roomHref() {
  return "/discussion.html?problemId=" + encodeURIComponent(post.problemId);
}

function renderPost() {
  document.getElementById("backLink").innerHTML = `<a href="${roomHref()}">← 토론방으로</a>`;
  article.hidden = false;
  if (post.status !== "VISIBLE") {
    article.innerHTML = `<div class="meta">관리자가 가린 글입니다.</div>`;
    return;
  }
  document.title = `${post.title} — csquiz`;
  article.innerHTML = `
    <div>${postCategoryChip(post.category, post.categoryLabel)}</div>
    <h1 class="post-title">${escapeHtml(post.title)}</h1>
    <div class="meta">${escapeHtml(post.nickname || "탈퇴한 사용자")} · ${formatDate(post.createdAt)}${
      post.edited ? " · 수정됨" : ""}</div>
    <div class="post-body">${escapeHtml(post.body)}</div>
    ${post.mine ? `<div class="disc-tools">
      <button type="button" id="editBtn">수정</button>
      <button type="button" id="deleteBtn">삭제</button>
    </div>` : ""}
    ${!post.mine && isLoggedIn() ? `<div class="disc-tools">
      <button type="button" id="reportBtn">신고</button>
    </div><div id="reportSlot"></div>` : ""}`;
}

/* 글 신고. 사유 목록은 댓글 신고와 같은 것을 쓴다(discussion.js의 COMMENT_REPORT_REASONS). */
function openReportForm() {
  document.getElementById("reportSlot").innerHTML = `<form class="disc-form" id="reportForm">
    <select required>
      <option value="">신고 사유를 골라 주세요</option>
      ${COMMENT_REPORT_REASONS.map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`).join("")}
    </select>
    <input type="text" maxlength="500" placeholder="덧붙일 말 (선택)">
    <div class="disc-actions">
      <button type="submit" class="btn-sm">신고 보내기</button>
      <button type="button" class="btn-sm btn-outline" id="reportCancel">취소</button>
    </div>
  </form>`;
}

/** 이미 신고한 글(DISCUSSION_007)은 실패가 아니라 안내다 — 빨갛게 칠하지 않는다. */
async function sendPostReport(form) {
  const slot = document.getElementById("reportSlot");
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    await api("/api/me/post-reports", { method: "POST", body: JSON.stringify({
      postId: post.id,
      reason: form.querySelector("select").value,
      detail: form.querySelector("input").value }) });
    slot.innerHTML = `<div class="meta">신고를 보냈습니다. 확인하겠습니다.</div>`;
  } catch (err) {
    if (err.code === "DISCUSSION_007") {
      slot.innerHTML = `<div class="meta">${escapeHtml(err.message)}</div>`;
    } else {
      btn.disabled = false;
      showError(err.message);
    }
  }
}

async function load() {
  post = await api("/api/quiz/posts/" + encodeURIComponent(postId));
  renderPost();
  // 가린 글은 댓글도 오지 않는다. 빈 댓글 칸을 내면 "댓글이 없다"로 읽힌다.
  if (post.status === "VISIBLE") {
    document.getElementById("comments").innerHTML = commentsBlock(post.id, post.problemId);
  }
}

article.addEventListener("submit", e => {
  if (e.target.id !== "reportForm") return;
  e.preventDefault();
  sendPostReport(e.target);
});

article.addEventListener("click", async e => {
  if (e.target.id === "reportBtn") { openReportForm(); return; }
  if (e.target.id === "reportCancel") { document.getElementById("reportSlot").innerHTML = ""; return; }
  if (e.target.id === "editBtn") {
    document.getElementById("editCategory").value = post.category;
    document.getElementById("editTitle").value = post.title;
    document.getElementById("editBody").value = post.body;
    editForm.hidden = false;
    article.hidden = true;
    document.getElementById("editTitle").focus();
    return;
  }
  // 삭제는 두 번 눌러야 지워진다 — 확인 창은 습관적으로 넘기게 된다(댓글 삭제와 같은 방식).
  if (e.target.id === "deleteBtn") {
    const del = e.target;
    if (!del.dataset.armed) {
      del.dataset.armed = "1";
      del.textContent = "정말 삭제";
      setTimeout(() => { delete del.dataset.armed; del.textContent = "삭제"; }, 5000);
      return;
    }
    try {
      await api("/api/me/posts/" + post.id, { method: "DELETE" });
      location.href = roomHref();
    } catch (err) { showError(err.message); }
  }
});

document.getElementById("editCancel").addEventListener("click", () => {
  editForm.hidden = true;
  article.hidden = false;
});

editForm.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("editSubmit");
  const msg = document.getElementById("editMessage");
  btn.disabled = true;
  msg.innerHTML = "";
  try {
    post = await api("/api/me/posts/" + post.id, { method: "PUT", body: JSON.stringify({
      category: document.getElementById("editCategory").value,
      title: document.getElementById("editTitle").value,
      body: document.getElementById("editBody").value }) });
    editForm.hidden = true;
    renderPost();
  } catch (err) {
    msg.innerHTML = `<div class="alert error">${escapeHtml(err.message)}${
      (err.fieldErrors || []).map(f => `<div>${escapeHtml(f.reason)}</div>`).join("")}</div>`;
  } finally {
    btn.disabled = false;
  }
});

fillSelect(document.getElementById("editCategory"), POST_CATEGORIES);

if (!postId) {
  showError("어느 글인지 알 수 없습니다.");
} else {
  load().catch(e => {
    showError(e.message);
    // 지운 글이면 어느 방의 글이었는지도 알 수 없다. 커뮤니티로 길을 낸다.
    document.getElementById("backLink").innerHTML = `<a href="/community.html">← 커뮤니티로</a>`;
  });
}
</script>
</body>
</html>
