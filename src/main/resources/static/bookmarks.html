<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>북마크 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지(review.html의 같은 주석 참고). */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container my-layout">
  <!-- "나" 구역 사이드바 — 내 기록·풀이 이력·북마크·알림·계정·설정을 오간다(shell.js renderMySide) -->
  <nav class="my-side" id="mySide" aria-label="내 메뉴"></nav>
  <div class="my-body">
  <h1>북마크</h1>
  <p class="meta">다시 보려고 담아 둔 문제와 문서입니다. 최근에 담은 것이 위에 옵니다.</p>

  <!-- 문제와 문서를 한 목록에 섞지 않는다. 누르면 가는 곳이 다르고(풀이 화면 / 읽는 화면),
       한쪽만 찾으러 온 사람이 다른 쪽을 건너뛰며 훑어야 한다. -->
  <div class="tabs" id="typeTabs">
    <button class="tab-btn active" data-type="PROBLEM">문제</button>
    <button class="tab-btn" data-type="DOCUMENT">문서</button>
  </div>

  <!-- 필터 줄은 모든 목록이 같은 모양이다(api.js wireFilterBar). 탭은 그대로 둔다 —
       문제와 문서는 거르는 조건이 아니라 서로 다른 목록이다 -->
  <div class="filters" role="search">
    <div class="field field-search"><label for="q">검색 <span class="meta" id="qScope">(제목·지문)</span></label>
      <input type="search" id="q" maxlength="50" placeholder="예: TIME_WAIT" enterkeyhint="search"></div>
    <div class="field field-reset"><label>&nbsp;</label>
      <button type="button" id="filterResetBtn" class="btn-outline">필터 지우기</button></div>
  </div>

  <div id="message"></div>
  <div id="list"></div>
  <div class="pager" id="pager" hidden></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/bookmark.js"></script>
<script>
renderShell({ active: "me", title: "북마크" });
renderMySide("bookmarks");

if (!isLoggedIn()) {
  document.getElementById("message").innerHTML =
    `<div class="alert info">북마크는 <b>내 계정의 기록</b>이라 로그인이 필요합니다.
     <a href="/login.html">로그인하기</a></div>`;
} else {
  init();
}

async function init() {
  await domainsReady;   // 분야 표기 이름을 쓰려면 목록이 먼저 와야 한다(api.js)
  let type = "PROBLEM";
  let page = 0;
  const list = document.getElementById("list");

  // 제목이 없는 문제는 지문이 통째로 온다 — 목록 한 줄에 맞게 자른다.
  const short = s => s.length > 80 ? s.slice(0, 80) + "…" : s;

  function row(b) {
    const href = b.type === "PROBLEM"
      ? `/quiz.html?problemId=${b.targetId}`
      : `/document.html?slug=${encodeURIComponent(b.slug)}`;
    // 공용 줄 목록(.list-row). 북마크 단추가 줄 안에 있어 줄 전체를 링크로 두지 않는다.
    return `
      <div class="list-row split">
        <span class="list-row-main">
          <a class="list-row-title" href="${href}">${escapeHtml(short(b.title))}</a>
          <span class="meta"><span class="list-row-domain">${escapeHtml(domainLabel(b.domain))}</span>${
            b.difficulty ? difficultyBadge(b.difficulty) : ""}담은 날 ${shortDay(b.createdAt)}</span>
        </span>
        <span class="list-row-end">${bookmarkButton(b.type, b.targetId)}</span>
      </div>`;
  }

  async function load() {
    const msg = document.getElementById("message");
    msg.innerHTML = "";
    showLoading(list);
    try {
      const filters = filterParams({ q: "q" });
      const data = await api(`/api/me/bookmarks?type=${type}&page=${page}` + (filters.toString() ? "&" + filters : ""));
      if (data.content.length === 0) {
        showEmpty(list, filters.toString()
          ? "검색어에 맞는 북마크가 없습니다 — 필터를 지우면 전체가 보입니다."
          : type === "PROBLEM"
          ? "담아 둔 문제가 없습니다. 문제를 풀고 채점 결과 아래의 ☆ 북마크를 눌러 보세요."
          : "담아 둔 문서가 없습니다. 문서 제목 아래의 ☆ 북마크를 눌러 보세요.");
      } else {
        list.innerHTML = data.content.map(row).join("");
      }
      // 이 목록에 있는 것은 전부 담긴 것이라 서버에 다시 묻지 않고 바로 채운다.
      list.querySelectorAll("[data-bookmark]").forEach(b => paintBookmark(b, true));
      pager.update(data);
    } catch (e) {
      showErrorAlert(msg, e, "불러오지 못했습니다");
    } finally {
      clearLoading(list);
    }
  }

  document.getElementById("typeTabs").addEventListener("click", e => {
    const btn = e.target.closest("[data-type]");
    if (!btn || btn.dataset.type === type) return;
    type = btn.dataset.type;
    page = 0;
    document.querySelectorAll("#typeTabs .tab-btn")
      .forEach(b => b.classList.toggle("active", b === btn));
    // 문서는 제목만 찾는다. 본문까지 보면 담아 둔 문서 몇 편에서도 거의 다 걸린다
    document.getElementById("qScope").textContent = type === "PROBLEM" ? "(제목·지문)" : "(제목)";
    load();
  });

  wireFilterBar({ search: "q", reset: "filterResetBtn", onChange: () => { page = 0; load(); } });

  const pager = mountPager(document.getElementById("pager"), p => { page = p; load(); });
  load();
}
</script>
</body>
</html>
