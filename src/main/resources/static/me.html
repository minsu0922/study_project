<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container">
  <h1>마이페이지</h1>
  <!-- "2026년 7월 12일에 시작 · 57일째" 같은 줄을 두려다 뺐다.
       가입일을 주는 API가 없고, 없는 값을 만들어 채우면 화면이 거짓말을 한다.
       필요해지면 그때 서버에 한 필드를 더한다. -->

  <div class="stat-row" id="stats"></div>

  <div class="section-label">
    <span>분야별</span>
    <span class="seg" id="sortSeg">
      <button class="seg-btn active" data-sort="solved">진도순</button>
      <button class="seg-btn" data-sort="name">이름순</button>
    </span>
  </div>
  <div class="progress-grid" id="progList"></div>

  <div class="section-label" id="weakLabel" hidden><span>약한 곳</span></div>
  <div id="weakSpot"></div>

  <div class="section-label"><span>더 보기</span></div>
  <div class="setting-row" style="border-top:0">
    <div>
      <b>오답노트</b>
      <div class="meta">틀린 문제와 내가 쓴 답을 다시 읽습니다</div>
    </div>
    <a class="btn btn-outline" href="/wrong-answers.html">열기</a>
  </div>
  <div class="setting-row">
    <div>
      <b>설정</b>
      <div class="meta">테마·글자 크기·퀴즈 기본값</div>
    </div>
    <a class="btn btn-outline" href="/settings.html">열기</a>
  </div>

  <!-- ═══ 계정 ═══ 2026-09-08에 설정 화면에서 옮겨 왔다.
       옮긴 이유: 설정 화면이 <취향과 계정> 두 가지를 담고 있었다. 앞의 둘(화면·퀴즈)은
       이 브라우저에만 저장되는 취향이고, 뒤의 둘(비밀번호·탈퇴)은 서버의 내 계정을 건드리는
       일이다. 성격이 다른 것을 한 화면에 두니 "설정"이라는 이름이 절반만 맞았다.

       화면을 새로 만들지 않고 이 화면을 넓힌 이유: "내 것"을 보는 화면이 이미 둘(기록·설정)
       인데 셋이 되면 "비밀번호 어디서 바꾸지"의 후보가 셋으로 는다. 이 화면은 원래
       <나에 대한 것>을 모으는 자리라, 계정이 여기 오면 이름과 내용이 맞아떨어진다. -->
  <div class="section-label"><span>계정</span></div>
  <div class="setting-row" style="border-top:0">
    <div id="accountLine"></div>
    <!-- id가 아니라 data-action이다. 로그아웃이 놓이는 자리가 여럿이라(여기 · 콘솔 띠)
         id로 잡으면 문서에 같은 id가 둘 이상 생기고, getElementById가 그중 하나만
         돌려주는 바람에 <보이는 버튼이 안 눌리는> 일이 실제로 있었다(shell.js 주석). -->
    <button class="btn btn-outline" data-action="logout">로그아웃</button>
  </div>

  <!-- 비밀번호 변경 — 접어 둔다. 자주 하는 일이 아니라 늘 펼쳐 두면
       이 화면이 기록이 아니라 폼으로 읽힌다. -->
  <details class="setting-row" style="display:block" id="pwPanel">
    <summary><b>비밀번호 변경</b></summary>
    <div id="pwMessage" role="alert" aria-live="assertive"></div>
    <form id="pwForm" style="margin-top:10px; max-width:420px">
      <div class="field">
        <label for="curPw">지금 비밀번호</label>
        <input type="password" id="curPw" required autocomplete="current-password">
      </div>
      <div class="field">
        <label for="newPw">새 비밀번호 (8자 이상, 영문+숫자 포함)</label>
        <input type="password" id="newPw" required autocomplete="new-password"
               pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
               title="8자 이상이며 영문과 숫자를 포함해야 합니다">
      </div>
      <div class="field">
        <label for="newPw2">새 비밀번호 확인</label>
        <input type="password" id="newPw2" required autocomplete="new-password">
        <div class="field-error" id="pw2Error" hidden>비밀번호가 서로 다릅니다.</div>
      </div>
      <!-- 가입·로그인 화면과 같은 장치다(그쪽 주석 참고). 여기서는 칸이 셋이라
           오타 한 번의 값이 가장 크다 — 지금 비밀번호를 틀리면 아무것도 안 바뀌고,
           새 비밀번호를 잘못 치면 <다음 로그인에서야> 알게 된다. -->
      <label class="pw-reveal">
        <input type="checkbox" id="pwReveal"> 비밀번호 보기
      </label>
      <button type="submit" id="pwSubmit">비밀번호 바꾸기</button>
    </form>

    <!-- 못 하는 것을 숨기지 않는다. 이 앱은 이메일을 안 받으므로 재설정 메일을 보낼
         곳이 없다 — 구현을 미룬 것이 아니라 지금 구조에서 불가능하다.
         모르면 잊은 뒤에야 알게 되고, 그때는 늦다. -->
    <p class="meta warn-note" style="margin-top:12px">
      비밀번호를 <b>잊었을 때 되찾는 방법은 아직 없습니다</b> —
      이 앱은 이메일을 받지 않아 재설정 메일을 보낼 곳이 없습니다.
      바꾸려면 지금 비밀번호를 알고 있어야 합니다.
    </p>
  </details>

  <div class="section-label"><span>위험한 일</span></div>
  <details class="setting-row" style="display:block; border-top:0" id="byePanel">
    <summary><b>회원 탈퇴</b></summary>
    <p class="meta" style="margin-top:8px">
      계정과 <b>내 학습 기록이 전부 사라집니다</b> — 풀이 기록, 복습 일정, 오답노트,
      오늘의 퀴즈, 보낸 제보까지. <b>되돌릴 수 없고</b> 되살려 줄 방법도 없습니다.
    </p>
    <div id="byeMessage" role="alert" aria-live="assertive"></div>
    <form id="byeForm" style="margin-top:10px; max-width:420px">
      <div class="field">
        <label for="byePw">확인을 위해 비밀번호를 입력하세요</label>
        <input type="password" id="byePw" required autocomplete="current-password">
      </div>
      <!-- 두 번 눌러야 지워진다(armedDelete와 같은 생각). 첫 누름은 "정말?"이고
           둘째 누름이 진짜다 — confirm 창을 띄우는 것보다 되돌리기 쉽다. -->
      <button type="submit" class="danger" id="byeSubmit">탈퇴하기</button>
    </form>
  </details>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 마이페이지 — 홈이 "오늘 뭐부터 하지"라면 이 화면은 "나 얼마나 왔지"와 "내 계정"이다.
 * ("내 기록"이었다. 2026-09-08에 계정 구역이 설정 화면에서 옮겨 오면서 이름이 넓어졌다.)
 *
 * [왜 홈과 나누나]
 * 두 질문의 답은 다른 속도로 바뀐다. 오늘 할 일은 하루에 여러 번 보고, 전체 진도는
 * 일주일에 한 번 본다. 한 화면에 두면 자주 보는 것이 가끔 보는 것에 밀린다 —
 * 홈에서 진도를 여섯 개로 줄이고 나머지를 여기로 넘긴 이유이기도 하다.
 *
 * [활동 격자(잔디밭)를 안 넣는다]
 * 붙일 자리지만 뺐다. 이 앱은 이미 스트릭(연속 며칠)을 안 쓰기로 정했다 —
 * 목표 페이스가 주 3회라 주마다 끊기고, 잘하고 있는데 실패한 것처럼 보이는 숫자가
 * 되기 때문이다(docs/12). 격자도 같은 종류의 압박이라 같은 이유로 뺀다.
 *
 * [폰에서 이 화면이 "나" 탭이다]
 * 탭 다섯이 상한이라 설정을 따로 못 걸었다. 그래서 아래 "더 보기"에 입구를 둔다 —
 * 사이드바에서는 설정이 따로 서 있어 이 줄이 없어도 되지만, 좁은 화면에서는 여기가
 * 유일한 길이다. 넓은 화면에서 한 번 더 보이는 것은 그 대가다.
 *
 * [요청은 하나다]
 * study-summary가 통계와 분야별을 함께 준다. 이 화면이 필요로 하는 것이 그 둘뿐이라
 * 새 API를 만들지 않았다. */
if (!isLoggedIn()) {
  // 남의 기록을 볼 화면이 아니다. 비로그인으로 오면 로그인부터.
  location.href = "/login.html";
} else {
  renderShell({ active: "me", title: "마이페이지" });
  loadMe();

  document.getElementById("sortSeg").addEventListener("click", e => {
    const btn = e.target.closest(".seg-btn");
    if (!btn) return;
    document.querySelectorAll("#sortSeg .seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    drawProgress(btn.dataset.sort);
  });

  // ── 계정 구역 (2026-09-08에 설정 화면에서 옮겨 왔다) ──
  document.getElementById("accountLine").innerHTML =
    `<b>${escapeHtml(localStorage.getItem(USERNAME_KEY) || "")}</b>
     <div class="meta">${isAdmin() ? "관리자" : "일반 사용자"}</div>`;

  // 로그아웃은 셸과 <같은 함수>를 쓴다. 복사해 두면 서버 토큰 폐기가 빠진 사본이 생겨,
  // 이 화면에서 로그아웃했을 때만 서버에 14일짜리 출입증이 남는 상태가 된다.
  wireLogout();
  wirePasswordChange();
  wireWithdraw();
}

/**
 * 비밀번호 변경.
 *
 * <p>확인 칸 검사는 가입 화면과 <b>같은 방식</b>이다 — 두 번째 칸에 손을 댄 뒤부터만
 * 말하고, 브라우저의 setCustomValidity로 제출 자체를 막는다. 화면의 글과 브라우저의
 * 판단이 같은 사실을 말하게 하려는 것이다(signup.html 주석).
 *
 * <p>성공하면 <b>폼을 지운다.</b> 값이 남아 있으면 "저장이 된 건가" 싶어 한 번 더 누르게
 * 되는데, 두 번째 누름은 지금 비밀번호가 이미 바뀌었으므로 실패한다 — 성공 뒤에 실패
 * 메시지를 보는 흐름이 된다.
 */
function wirePasswordChange() {
  const cur = document.getElementById("curPw");
  const pw = document.getElementById("newPw");
  const pw2 = document.getElementById("newPw2");
  const err = document.getElementById("pw2Error");
  const msg = document.getElementById("pwMessage");
  const btn = document.getElementById("pwSubmit");
  let touched = false;

  function match() {
    const 다름 = pw2.value !== "" && pw.value !== pw2.value;
    pw2.setCustomValidity(다름 ? "비밀번호가 서로 다릅니다." : "");
    err.hidden = !(다름 && touched);
    pw2.classList.toggle("invalid", 다름 && touched);
  }
  pw2.addEventListener("input", () => { touched = true; match(); });
  pw.addEventListener("input", match);

  // 칸 셋을 함께 여닫는다 — 하나만 열면 "지금 보이는 게 어느 칸이지"를 되묻게 된다.
  document.getElementById("pwReveal").addEventListener("change", e => {
    const type = e.target.checked ? "text" : "password";
    [cur, pw, pw2].forEach(el => el.type = type);
  });

  document.getElementById("pwForm").addEventListener("submit", async e => {
    e.preventDefault();
    touched = true; match();
    if (pw.value !== pw2.value) { pw2.focus(); return; }

    btn.disabled = true;
    msg.innerHTML = "";
    try {
      await api("/api/me/password", { method: "PATCH", body: JSON.stringify({
        currentPassword: cur.value, newPassword: pw.value }) });
      // 값을 지운다 — 위 주석 참고
      [cur, pw, pw2].forEach(el => { el.value = ""; el.classList.remove("invalid"); });
      err.hidden = true;
      msg.innerHTML = `<div class="alert" style="background:var(--correct-bg); color:var(--correct-fg)">
        비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 쓰세요.</div>`;
    } catch (e2) {
      msg.innerHTML = `<div class="alert error">${escapeHtml(e2.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });
}

/**
 * 탈퇴 — <b>두 번 눌러야</b> 지워진다.
 *
 * <p>confirm 창을 안 쓰는 이유: 그 창은 습관적으로 엔터를 눌러 넘기게 된다. 버튼 글자가
 * "정말 지웁니다"로 바뀌는 방식은 <b>화면에 남아</b> 있어서, 손이 멈춘 자리에서 무엇을
 * 하려던 참인지 다시 읽게 된다. 관리 화면의 armedDelete가 같은 생각이다.
 *
 * <p>되돌리는 것도 쉽다 — 다른 곳을 누르거나 5초를 두면 원래대로 돌아온다.
 */
function wireWithdraw() {
  const form = document.getElementById("byeForm");
  const btn = document.getElementById("byeSubmit");
  const msg = document.getElementById("byeMessage");
  const 원래글 = btn.textContent;
  let 준비됨 = false;
  let 타이머 = null;

  function 되돌리기() {
    준비됨 = false;
    btn.textContent = 원래글;
    clearTimeout(타이머);
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!준비됨) {
      준비됨 = true;
      btn.textContent = "한 번 더 누르면 정말 지웁니다";
      타이머 = setTimeout(되돌리기, 5000);
      return;
    }
    되돌리기();
    btn.disabled = true;
    msg.innerHTML = "";
    try {
      await api("/api/me", { method: "DELETE", body: JSON.stringify({
        password: document.getElementById("byePw").value }) });
      // 서버에서 계정이 사라졌으므로 이 브라우저의 토큰도 함께 버린다.
      // 안 지우면 다음 요청이 401을 받고 "로그인이 풀렸다"로 보인다 — 탈퇴한 사실이
      // 아니라 오류처럼 읽힌다.
      clearLogin();
      location.href = "/";
    } catch (e2) {
      msg.innerHTML = `<div class="alert error">${escapeHtml(e2.message)}</div>`;
      btn.disabled = false;
    }
  });
}

/** 이 화면이 그리는 모든 것의 출처. 정렬을 바꿀 때 다시 부르지 않으려고 들고 있는다. */
let summary = null;

async function loadMe() {
  try {
    summary = await api("/api/me/study-summary");
  } catch (e) {
    document.getElementById("stats").innerHTML =
      `<p class="meta">기록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>`;
    return;
  }

  const s = summary.stats;
  // 전체 문제 수는 분야별 분모를 더해서 낸다 — 따로 부를 API가 없고, 이미 온 값이다.
  const totalAll = summary.domains.reduce((a, d) => a + d.total, 0);

  document.getElementById("stats").innerHTML = [
    // 제출한 문제 수다(맞힌 수가 아니다). 맞힌 수는 아래 "분야별"이 말한다.
    ["푼 문제", `${s.attemptedTotal}<span class="of"> / ${totalAll}</span>`, ""],
    ["정답률", s.correctRate === null ? null : s.correctRate + "%", ""],
    ["이번 주", String(s.solvedThisWeek), ""],
    ["복습 대기", String(s.reviewDue), s.reviewDue > 0 ? " due" : ""],
  ].map(([label, v, extra]) => `
    <div class="stat">
      <div class="label">${label}</div>
      <div class="num${v === null ? " none" : extra}">${v === null ? "아직 기록 없음" : v}</div>
    </div>`).join("");

  drawProgress("solved");
  drawWeakSpot();
}

/**
 * 분야별 — <b>열둘을 전부</b> 그린다.
 *
 * <p>홈은 여섯만 보여 주고 문제가 0개인 분야를 뺀다. 여기는 다르다 —
 * "이 분야는 아직 문제가 없다"도 이 화면에서는 정보다. 무엇이 준비돼 있고 무엇이
 * 비어 있는지가 "나 얼마나 왔지"의 답에 포함된다.
 *
 * <p><b>정렬이 둘뿐인 이유.</b> 정답률순도 자연스러운 후보지만 <b>서버가 분야별 정답률을
 * 주지 않는다</b>. 없는 값으로 만든 정렬은 화면에서만 그럴듯하고 눌러도 순서가 안 바뀐다.
 * 있는 값으로 할 수 있는 것만 둔다.
 */
function drawProgress(sort) {
  const list = [...summary.domains].sort(
    sort === "solved"
      ? (a, b) => b.solved - a.solved
      : (a, b) => a.label.localeCompare(b.label, "ko"));

  document.getElementById("progList").innerHTML = list.map(d => {
    // 분모가 0이면 막대를 0으로 둔다. 0으로 나누면 NaN이 style에 들어가 막대가 사라진다.
    const pct = d.total > 0 ? Math.round(d.solved / d.total * 100) : 0;
    // 문제가 없는 분야는 숫자 대신 그렇다고 말한다 — "0 / 0"은 읽는 사람이 뜻을 지어내야 한다.
    const num = d.total === 0
      ? `<span class="of">준비 중</span>`
      : `${d.solved} <span class="of">/ ${d.total}</span>`;
    return `<div class="progress-item">
      <div class="row">
        <span class="name">${escapeHtml(d.label)}</span>
        <span class="num">${num}</span>
      </div>
      <div class="bar" role="progressbar" aria-label="${escapeHtml(d.label)} 진도"
           aria-valuenow="${d.solved}" aria-valuemin="0" aria-valuemax="${d.total}"
        ><i style="width:${pct}%"></i></div>
    </div>`;
  }).join("");
}

/**
 * 약한 곳 — 손을 가장 덜 댄 분야 하나.
 *
 * <p><b>왜 정답률이 아니라 진도인가.</b> "약한 곳"의 정의로는 정답률이 더 맞지만 서버가
 * 분야별 정답률을 주지 않는다. 없는 값을 추측해서 보여 주느니 있는 값으로 정직한 말을
 * 한다 — 그래서 화면에도 "가장 적게 푼 분야"라고 그대로 적는다.
 * (분야별 정답률이 생기면 여기부터 바꾼다.)
 *
 * <p>문제가 0개인 분야는 후보에서 뺀다. 안 그러면 아직 문제를 안 만든 분야가 늘 1등이 되고,
 * 그 분야로 보내 봐야 풀 것이 없다.
 *
 * <p>다 풀었으면 이 구역을 통째로 감춘다 — 약한 곳이 없는데 억지로 하나를 고르면
 * 잘하고 있는 사람에게 없는 문제를 만들어 주는 셈이다.
 */
function drawWeakSpot() {
  const candidates = summary.domains.filter(d => d.total > 0 && d.solved < d.total);
  if (candidates.length === 0) return;

  const weak = candidates.reduce((a, b) =>
    (a.solved / a.total) <= (b.solved / b.total) ? a : b);

  document.getElementById("weakLabel").hidden = false;
  document.getElementById("weakSpot").innerHTML = `
    <div class="card" style="display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap">
      <div style="flex:1;min-width:180px">
        <b>${escapeHtml(weak.label)}</b>
        <div class="meta">가장 적게 푼 분야예요 — ${weak.total}문제 중 ${weak.solved}개</div>
      </div>
      <a class="btn btn-outline" href="/problems.html?domain=${encodeURIComponent(weak.domain)}">
        이 분야만 풀기</a>
    </div>`;
}
</script>
