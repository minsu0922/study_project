<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풀이 이력 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지(wrong-answers.html의 같은 주석 참고). */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container">
  <h1>풀이 이력</h1>
  <!-- 오답노트와 다른 점을 첫 줄에 말한다. 둘 다 "지난 풀이"라 이름만으로는 안 갈린다. -->
  <p class="meta">맞힌 것까지 포함해 내가 낸 답을 최근 순으로 보여 줍니다.
    틀린 문제의 해설을 다시 읽으려면 <a href="/wrong-answers.html">오답노트</a>로 가세요.</p>

  <div class="tabs" id="resultTabs">
    <button class="tab-btn active" data-correct="">전체</button>
    <button class="tab-btn" data-correct="true">맞힌 것</button>
    <button class="tab-btn" data-correct="false">틀린 것</button>
  </div>

  <div id="message"></div>
  <div id="list"></div>
  <div class="pager" id="pager" hidden></div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
renderShell({ active: "me", title: "풀이 이력" });

if (!isLoggedIn()) {
  document.getElementById("message").innerHTML =
    `<div class="alert info">풀이 이력은 <b>내 계정의 기록</b>이라 로그인이 필요합니다.
     <a href="/login.html">로그인하기</a></div>`;
} else {
  init();
}

async function init() {
  await domainsReady;   // 분야 표기 이름을 쓰려면 목록이 먼저 와야 한다(api.js)
  let correct = "";
  let page = 0;
  const list = document.getElementById("list");
  // 제목이 없는 문제는 지문이 통째로 온다 — 목록 한 줄에 맞게 자른다.
  const short = s => s.length > 80 ? s.slice(0, 80) + "…" : s;

  async function load() {
    const msg = document.getElementById("message");
    msg.innerHTML = "";
    try {
      const params = new URLSearchParams({ page });
      if (correct) params.set("correct", correct);
      const data = await api("/api/me/submissions?" + params);
      list.innerHTML = data.content.length === 0
        ? `<div class="card">아직 기록이 없습니다. <a href="/quiz.html">퀴즈를 풀러 가볼까요?</a></div>`
        : data.content.map(s => `
          <div class="card">
            <div style="margin-bottom:6px">
              <!-- 색과 글자를 함께 쓴다. 초록·빨강을 못 가리는 사람은 색만으로 결과를 알 수 없다. -->
              <span class="badge ${s.correct ? "green" : "orange"}">${s.correct ? "✓ 정답" : "✕ 오답"}</span>
              <span class="badge">${escapeHtml(domainLabel(s.domain))}</span>
              ${difficultyBadge(s.difficulty)}
            </div>
            <h3><a href="/quiz.html?problemId=${s.problemId}">${escapeHtml(short(s.title))}</a></h3>
            <div class="meta" style="margin-top:6px">푼 날: ${formatDate(s.submittedAt)}</div>
          </div>`).join("");
      pager.update(data);
    } catch (e) {
      const text = e.status === 401
        ? `로그인이 만료됐습니다. <a href="/login.html">다시 로그인해 주세요.</a>`
        : `불러오지 못했습니다: ${escapeHtml(e.message)}`;
      msg.innerHTML = `<div class="alert error">${text}</div>`;
    }
  }

  document.getElementById("resultTabs").addEventListener("click", e => {
    const btn = e.target.closest("[data-correct]");
    if (!btn || btn.dataset.correct === correct) return;
    correct = btn.dataset.correct;
    page = 0;
    document.querySelectorAll("#resultTabs .tab-btn")
      .forEach(b => b.classList.toggle("active", b === btn));
    load();
  });

  const pager = mountPager(document.getElementById("pager"), p => { page = p; load(); });
  load();
}
</script>
</body>
</html>
