<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풀이 이력 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지(review.html의 같은 주석 참고). */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container my-layout">
  <!-- "나" 구역 사이드바 — 내 기록·풀이 이력·북마크·알림·계정·설정을 오간다(shell.js renderMySide) -->
  <nav class="my-side" id="mySide" aria-label="내 메뉴"></nav>
  <div class="my-body">
  <h1>풀이 이력</h1>
  <!-- 오답노트와 다른 점을 첫 줄에 말한다. 둘 다 "지난 풀이"라 이름만으로는 안 갈린다. -->
  <p class="meta">맞힌 것까지 포함해 내가 낸 답을 최근 순으로 보여 줍니다.
    틀린 문제의 해설을 다시 읽으려면 <a href="/review.html#list">복습 화면의 틀린 문제</a>에서 펼쳐 보세요.</p>

  <!-- 필터 줄은 모든 목록이 같은 모양이다(api.js wireFilterBar): 검색 → 고르기 → 필터 지우기.
       결과(맞힘·틀림)는 탭이었는데, 분야와 함께 거르는 조건이라 고르기 칸으로 옮겼다 -->
  <div class="filters" role="search">
    <div class="field field-search"><label for="q">검색 <span class="meta">(제목·지문)</span></label>
      <input type="search" id="q" maxlength="50" placeholder="예: TIME_WAIT" enterkeyhint="search"></div>
    <div class="field"><label for="resultFilter">결과</label>
      <select id="resultFilter">
        <option value="">전체</option>
        <option value="true">맞힌 것</option>
        <option value="false">틀린 것</option>
      </select>
    </div>
    <div class="field"><label for="domainFilter">분야</label><select id="domainFilter"></select></div>
    <div class="field field-reset"><label>&nbsp;</label>
      <button type="button" id="filterResetBtn" class="btn-outline">필터 지우기</button></div>
  </div>

  <div id="message"></div>
  <div id="list"></div>
  <div class="pager" id="pager" hidden></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
renderShell({ active: "me", title: "풀이 이력" });
renderMySide("history");

if (!isLoggedIn()) {
  document.getElementById("message").innerHTML =
    `<div class="alert info">풀이 이력은 <b>내 계정의 기록</b>이라 로그인이 필요합니다.
     <a href="/login.html">로그인하기</a></div>`;
} else {
  init();
}

async function init() {
  await domainsReady;   // 분야 표기 이름을 쓰려면 목록이 먼저 와야 한다(api.js)
  let page = 0;
  fillSelect(document.getElementById("domainFilter"), DOMAINS, "전체");
  const list = document.getElementById("list");
  // 제목이 없는 문제는 지문이 통째로 온다 — 목록 한 줄에 맞게 자른다.
  const short = s => s.length > 80 ? s.slice(0, 80) + "…" : s;

  async function load() {
    const msg = document.getElementById("message");
    msg.innerHTML = "";
    showLoading(list);
    try {
      const params = new URLSearchParams({ page });
      const filters = filterParams({ q: "q", correct: "resultFilter", domain: "domainFilter" });
      filters.forEach((v, k) => params.set(k, v));
      const data = await api("/api/me/submissions?" + params);
      if (data.content.length === 0) {
        showEmpty(list, filters.toString()
          ? "조건에 맞는 기록이 없습니다 — 필터를 지우면 전체가 보입니다."
          : `아직 기록이 없습니다. <a href="/quiz.html">퀴즈를 풀러 가볼까요?</a>`);
      } else list.innerHTML = data.content.map(s => `
          <a class="list-row split" href="/quiz.html?problemId=${s.problemId}">
            <span class="list-row-main">
              <span class="list-row-title">${escapeHtml(short(s.title))}</span>
              <span class="meta"><span class="list-row-domain">${escapeHtml(domainLabel(s.domain))}</span>${
                difficultyBadge(s.difficulty)}푼 날 ${shortDay(s.submittedAt)}</span>
            </span>
            <!-- 색과 글자를 함께 쓴다. 초록·빨강을 못 가리는 사람은 색만으로 결과를 알 수 없다. -->
            <!-- 배지로 두지 않는다. 오답 배지(주황·빨강)가 같은 줄의 중급·고급 배지와 같은 색이 된다. -->
            <span class="list-row-end ${s.correct ? "is-correct" : "is-wrong"}">${s.correct ? "✓ 정답" : "✕ 오답"}</span>
          </a>`).join("");
      pager.update(data);
    } catch (e) {
      showErrorAlert(msg, e, "불러오지 못했습니다");
    } finally {
      clearLoading(list);
    }
  }

  wireFilterBar({
    search: "q", selects: ["resultFilter", "domainFilter"], reset: "filterResetBtn",
    onChange: () => { page = 0; load(); },
  });

  const pager = mountPager(document.getElementById("pager"), p => { page = p; load(); });
  load();
}
</script>
</body>
</html>
