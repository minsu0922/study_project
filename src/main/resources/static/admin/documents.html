<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 문서 관리 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지.
   자세한 이유는 사용자 화면의 같은 주석 참고. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <!-- 제목은 <기둥 메뉴와 같은 말>이다. 눌러서 간 곳의 이름이 메뉴와 다르면
       "여기가 맞나"를 한 번 되묻게 된다.

       예전에는 일곱 화면이 전부 "관리자"였다. 콘솔이 탭 하나짜리 화면이던 시절의
       잔재인데, 지금은 띠에 "csquiz 관리"가 있고 기둥이 현재 화면을 표시하므로
       같은 말을 세 번째로 하는 셈이었다. 게다가 스크린리더의 제목 목록에서
       일곱 화면이 모두 "관리자"라 어느 화면인지 구별할 수 없었다. -->
  <h1>문서</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>

    <!-- 문제 화면과 같은 처방으로 접어 둔다 — 2026-09-08.
         문서는 문제보다 더 손으로 만들지 않는다: GitHub Actions가 4일에 한 편 쓰고,
         사람은 검수에서 승인만 한다. 여기서 하는 일은 <이미 있는 문서를 고치는 것>인데
         등록 폼(본문 마크다운 칸이 열 줄이다)이 늘 펼쳐져 목록을 밀어내고 있었다.
         수정으로 들어오면 저절로 펼쳐진다(editDocument). -->
    <details class="card form-panel" id="dFormPanel">
      <summary id="dFormTitle">새 문서 등록</summary>
      <div id="dMessage"></div>
      <div class="filters">
        <div class="field"><label>도메인</label><select id="dDomain"></select></div>
        <div class="field"><label>slug (영문 소문자·숫자·하이픈)</label><input type="text" id="dSlug" placeholder="tcp-3-way-handshake"></div>
      </div>
      <div class="field"><label>제목</label><input type="text" id="dTitle"></div>
      <div class="field"><label>본문 (마크다운)</label><textarea id="dContent" rows="12" style="width:100%; font-family:Consolas,monospace"></textarea></div>
      <div class="filters">
        <div class="field"><label>태그 (쉼표 구분, 없는 태그는 자동 생성)</label><input type="text" id="dTags" placeholder="tcp, network"></div>
        <div class="field"><label>출처 URL (선택)</label><input type="text" id="dSource"></div>
      </div>
      <button id="dSubmitBtn">등록</button>
      <button id="dCancelBtn" class="btn-outline" hidden>수정 취소</button>
    </details>

    <h3>문서 목록 <span class="meta">(행을 누르면 위 폼에서 수정 · [보기]는 실제 문서 화면 · [MD 복사]는 본문 마크다운을 클립보드로)</span></h3>
    <!-- 표·페이저·빈 상태는 admin-table.js가 통째로 그린다. 여기는 자리만 둔다. -->
    <div id="documentList"></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-table.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 문서 관리 — 개념 문서 등록·수정·삭제.
 *
 * AI가 만든 문서는 여기서 쓰지 않는다. 그쪽은 "AI 검수" 화면에서 승인해야 정식 문서가 되고,
 * 승인된 뒤에야 이 목록에 나타난다 — 검수를 건너뛸 수 있는 길을 만들지 않기 위해서다. */

let editingDocumentId = null;

if (initAdminPage("documents")) {
  initDocumentForm();
  loadDocuments();
}

function initDocumentForm() {
  fillSelect(document.getElementById("dDomain"), DOMAINS);
  document.getElementById("dSubmitBtn").addEventListener("click", submitDocument);
  document.getElementById("dCancelBtn").addEventListener("click", resetDocumentForm);
}

async function submitDocument() {
  const msg = document.getElementById("dMessage");
  try {
    const body = JSON.stringify({
      domain: document.getElementById("dDomain").value,
      title: document.getElementById("dTitle").value,
      slug: document.getElementById("dSlug").value.trim(),
      contentMd: document.getElementById("dContent").value,
      source: document.getElementById("dSource").value || null,
      tags: document.getElementById("dTags").value.split(",").map(s => s.trim()).filter(Boolean),
    });
    if (editingDocumentId) {
      await api("/api/admin/documents/" + editingDocumentId, { method: "PUT", body });
      showOk(msg, "수정 완료");
    } else {
      await api("/api/admin/documents", { method: "POST", body });
      showOk(msg, "등록 완료");
    }
    resetDocumentForm();
    loadDocuments();
  } catch (e) {
    showError(msg, e);
  }
}

function resetDocumentForm() {
  // 수정을 취소하면 폼도 접는다 — 문제 화면과 같은 규칙이다.
  document.getElementById("dFormPanel").open = false;
  editingDocumentId = null;
  document.getElementById("dFormTitle").textContent = "새 문서 등록";
  document.getElementById("dSubmitBtn").textContent = "등록";
  document.getElementById("dCancelBtn").hidden = true;
  ["dTitle", "dSlug", "dContent", "dTags", "dSource"].forEach(id => document.getElementById(id).value = "");
}

/**
 * 문서 목록.
 *
 * <p>조회는 <b>공개 API를 재사용</b>한다(관리 전용 목록 API를 따로 두지 않은 이유는
 * AdminDocumentService 주석 참고).
 *
 * <p>예전에는 {@code size=100}으로 통째로 받고 페이저가 아예 없었다. 문서가 100편을
 * 넘기는 날 <b>조용히 잘린다</b> — 화면 어디에도 "더 있다"는 표시가 없어 알아차릴 방법이
 * 없었다. 공용 렌더러로 옮기며 쪽을 나눈다.
 *
 * <p>열 구성은 그대로다. 제목이 wrap이고 slug가 그 아래 회색 작은 글씨인 것은 2026-08-23의
 * 판단이다 — 폭은 "가장 많이 읽는 것"에 줘야 하는데, 짧은 slug가 열 하나를 차지하고
 * 정작 제목이 두세 줄로 접히고 있었다.
 */
function loadDocuments() {
  return renderAdminTable("#documentList", {
    url: "/api/documents",
    columns: [
      { head: "ID", width: "60px", cell: d => d.id },
      { head: "제목", wrap: true, cell: d => `
          <!-- 배지를 제목 <바로 옆>에 둔다. 두 편은 제목이 글자까지 같아서 목록에서는
               같은 줄이 둘 있는 것으로 보이고, 그 둘을 가르는 것이 이 배지다. slug 줄에
               붙여 봤더니 좁은 칸에서 slug가 세 줄로 접히며 배지가 맨 아래로 밀려,
               정작 가리키는 제목에서 멀어졌다. -->
          ${escapeHtml(d.title)} ${editionBadge(d.edition)}
          <div class="meta">/${escapeHtml(d.slug)}</div>` },
      { head: "도메인", width: "90px", cell: d => escapeHtml(d.domainLabel) },
      // wrap이 <반드시> 있어야 한다. 표의 width는 요청일 뿐이고, 칸 안이 nowrap이면
      // 내용이 그 요청을 밀어낸다 — 태그가 넷이면 이 칸이 180px가 아니라 400px를 먹고,
      // 표 전체가 자리보다 넓어져 <오른쪽 끝의 삭제 버튼이 잘렸다>.
      //
      // 제목 칸은 접히는데 태그 칸은 안 접히던 것이 문제였다. 접혀야 할 것과 아닌 것이
      // 뒤바뀌어 있었다 — 제목은 읽어야 하니 넓어야 하고, 태그는 있는지만 보면 된다.
      { head: "태그", width: "180px", wrap: true,
        cell: d => d.tags.map(t => `<span class="badge gray">#${escapeHtml(t)}</span>`).join(" ") },
      { head: "수정", width: "100px", className: "meta", cell: d => escapeHtml(shortDate(d.updatedAt)) },
      { head: "", width: "220px", className: "row-actions", cell: () => `
          <button class="btn-outline" data-action="copy-md" title="본문 마크다운을 클립보드에 복사">MD 복사</button>
          <button class="btn-outline" data-action="view">보기</button>
          <button class="danger" data-action="delete">삭제</button>` },
    ],
    // 행 전체가 "수정"이고, 버튼이 눌리면 그쪽이 이긴다(렌더러가 버튼을 먼저 판별한다).
    onRowClick: (d, action, btn) => {
      // 보기는 새 탭으로 — 편집 중에 관리 화면을 잃지 않게 한다(돌아올 자리가 폼 상태를 들고 있다)
      if (action === "view") { window.open("/document.html?slug=" + encodeURIComponent(d.slug), "_blank"); return; }
      if (action === "copy-md") { copyMarkdown(btn, d.slug); return; }
      if (action === "delete") { deleteDocument(btn, d.id); return; }
      editDocument(d.slug, d.id);
    },
    emptyText: "등록된 문서가 없습니다. 위 폼으로 직접 쓰거나, AI 검수 화면에서 초안을 승인하세요.",
  });
}

/**
 * 본문 마크다운을 클립보드로 — 문서를 블로그에 옮겨 붙이려고 만들었다(2026-08-23).
 *
 * <p><b>왜 목록이 아니라 단건 API를 부르나.</b> 목록 응답에는 본문이 없다(DocumentListItem).
 * 목록에 본문을 실으면 100편이 뜨는 이 화면이 매번 수십만 자를 받아 오는데, 정작 쓰는 것은
 * 눌린 한 편뿐이다. 그래서 누른 순간에만 한 번 더 다녀온다 — {@code editDocument}가
 * 같은 이유로 같은 API를 부른다.
 *
 * <p><b>왜 파일이나 DB에서 뽑지 않고 화면에서 복사하나.</b> {@code generated/documents/*.json}은
 * <b>검수 화면에서 고치기 전</b>의 원문이다. 승인하며 문장을 손봤다면 그 파일은 낡았고,
 * 최신본은 DB에만 있다. 화면이 보여 주는 것이 곧 DB의 값이므로 여기서 복사하면
 * "어느 쪽이 최신이지"를 따질 일이 없어진다.
 */
async function copyMarkdown(btn, slug) {
  try {
    const d = await api("/api/documents/" + encodeURIComponent(slug));
    await copyToClipboard(btn, d.contentMd);
  } catch (e) {
    // 복사 자체의 실패는 copyToClipboard가 버튼 문구로 알린다. 여기 오는 것은 조회 실패다 —
    // 원인이 다르므로(문서가 지워졌거나 로그인이 풀렸다) 폼 위 알림에 그대로 띄운다.
    showError(document.getElementById("dMessage"), e);
  }
}

async function editDocument(slug, id) {
  // 고치러 들어온 사람에게 "폼을 펼치라"는 한 걸음을 시키지 않는다.
  document.getElementById("dFormPanel").open = true;
  const d = await api("/api/documents/" + encodeURIComponent(slug)); // 본문은 단건 API에만 있다
  editingDocumentId = id;
  document.getElementById("dFormTitle").textContent = `문서 수정 (ID ${id})`;
  document.getElementById("dSubmitBtn").textContent = "수정 저장";
  document.getElementById("dCancelBtn").hidden = false;
  document.getElementById("dDomain").value = d.domain;
  document.getElementById("dTitle").value = d.title;
  document.getElementById("dSlug").value = d.slug;
  document.getElementById("dContent").value = d.contentMd;
  document.getElementById("dTags").value = d.tags.join(", ");
  document.getElementById("dSource").value = d.source ?? "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteDocument(btn, id) {
  armedDelete(btn, async () => {
    try {
      await api("/api/admin/documents/" + id, { method: "DELETE" });
      loadDocuments();
    } catch (e) {
      showError(document.getElementById("dMessage"), e);
    }
  });
}
</script>
</body>
</html>
