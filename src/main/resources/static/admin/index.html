<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 대시보드 — csquiz</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="nav"></header>

<main class="container admin">
  <h1>관리자</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <div class="tabs" id="adminNav"></div>

    <!-- ═══ 지금 할 일 (2026-08-29) ═══
         예전에는 여기에 누적 수 넷(회원·문서·문제·제출)이 있었다. 매일 봐도 다음 행동을
         정해 주지 않는 숫자들이라, 행동을 부르는 값으로 갈아 끼우고 누적 수는 아래 한 줄로
         내렸다. 이 줄은 <다 0이면 오늘 손댈 것이 없다>는 뜻이 되게 방향을 맞췄다. -->
    <div class="todo-row" id="todoRow"></div>
    <div class="meta" id="totals" style="margin:-4px 0 24px"></div>

    <h3>출제 현황 <span class="meta">(도메인 × 난이도 · 진할수록 많다 · 칸을 누르면 그 칸으로 AI 생성)</span></h3>
    <div class="table-wrap"><table class="grid heatmap" id="matrixTable"></table></div>

    <h3>AI 초안 승인율 <span class="meta">(모델·프롬프트를 바꿨을 때 품질이 올랐는지 보는 저울 — 검수 대기는 분모에서 제외 · 행을 누르면 검수함)</span></h3>
    <div class="table-wrap"><table class="grid" id="llmReviewTable"></table></div>

    <!-- ═══ 학습 통계 — 표본이 쌓이면 열린다 ═══
         제출 2건에 정답률 0%는 통계가 아니라 우연이다. 그런데 막대 하나짜리 차트와
         74행이 "기록 없음"인 표가 화면 절반을 먹고 있었다. 임계 아래면 접어 두고 몇 건
         남았는지만 적는다 — 자리를 비워 두는 것도 정보다("아직 볼 것이 없다"). -->
    <details id="learningStats">
      <summary id="learningSummary">학습 통계</summary>

      <h3 style="margin-top:20px">도메인별 정답률
        <select id="domainSort" class="sort-select">
          <option value="asc">낮은 순 — 약한 영역부터</option>
          <option value="desc">높은 순 — 너무 쉬운 영역부터</option>
        </select>
        <span class="meta">(DB 뷰 domain_stats)</span>
      </h3>
      <div class="card" id="domainChart" style="padding:14px 16px"></div>

      <h3>문제별 정답률
        <select id="problemSort" class="sort-select">
          <option value="asc">낮은 순 — 어렵거나 오답 후보부터</option>
          <option value="desc">높은 순 — 너무 쉬운 문제부터</option>
          <option value="attempts">제출 많은 순 — 표본이 큰 것부터</option>
        </select>
        <span class="meta">(행을 누르면 수정)</span>
      </h3>
      <div class="table-wrap"><table class="grid" id="statsTable"></table></div>
    </details>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 관리자 대시보드 — 한 화면에서 "지금 무엇이 비어 있나"를 보고 그 자리로 떠나는 곳.
 *
 * 접근 제어는 세 겹이다.
 *   1) 이 화면의 isAdmin(): 장식 — JWT payload는 조작할 수 있다.
 *   2) 정적 파일: AdminGateFilter가 관리자 쿠키를 검사하고 없으면 404.
 *   3) 데이터: SecurityConfig가 /api/admin/** 를 hasRole(ADMIN)으로 막는다.
 * 2번이 이번에 추가된 겹이다. 1·3만 있던 시절에는 화면 파일 자체는 누구나 받아 볼 수 있었다. */
/* 마지막으로 받은 통계 — 정렬을 바꿀 때 서버를 다시 부르지 않으려고 들고 있는다.
 *
 * [왜 서버 정렬이 아닌가] 서버 쪽 주석이 이미 답을 적어 뒀다: "정렬은 화면 요구라 SQL에 두지
 * 않는다 — 뷰는 표현 중립을 유지한다"(AdminStatsService). 게다가 대시보드는 네 가지를 한 번에
 * 받아 오는 구조라, 정렬 하나 바꾸자고 전부를 다시 받는 것은 낭비다. 행도 수십 개 규모다. */
let dashboardStats = { domains: [], problems: [] };

if (initAdminPage("dashboard")) {
  document.getElementById("domainSort").addEventListener("change",
    () => renderDomainChart(dashboardStats.domains));
  document.getElementById("problemSort").addEventListener("change",
    () => renderProblemStats(dashboardStats.problems));
  loadDashboard();
}

async function loadDashboard() {
  try {
    const d = await api("/api/admin/dashboard");

    // 누적 수는 한 줄로 — 배경 정보다. 크게 두면 행동을 부르는 숫자(위 할 일 줄)가 묻힌다.
    document.getElementById("totals").textContent =
      `회원 ${d.totals.users} · 문서 ${d.totals.documents} · 문제 ${d.totals.problems} · 제출 ${d.totals.submissions}`;

    dashboardStats = { domains: d.domainStats, problems: d.problemStats };
    renderTodo(d.todo);
    renderMatrix(d.problemMatrix);
    renderLlmReview(d.llmReview);
    renderLearningStats(d);
  } catch (e) {
    document.getElementById("guard").innerHTML = `<div class="alert error">대시보드 로딩 실패: ${escapeHtml(e.message)}</div>`;
  }
}

/**
 * 오늘 할 일 줄 — 값이 0이면 회색으로 조용히, 있으면 눈에 띄게(2026-08-29 신설).
 *
 * <p><b>왜 누적 수를 밀어냈나.</b> 회원 4명·문제 76개는 매일 봐도 다음 행동을 정해 주지
 * 않는다. 검수 대기 8건은 본 즉시 무엇을 할지가 정해진다. 둘을 같은 줄에 같은 크기로 두면
 * 행동을 부르는 숫자가 배경 숫자에 묻힌다.
 *
 * <p><b>빈 칸은 서버가 센다.</b> 처음에는 화면에서 세려 했는데 틀린 답이 나왔다 —
 * 화면의 분야 목록은 12개인데 배치가 채우는 후보는 8개라, 그대로 세면 <b>채울 계획도 없는
 * 칸까지 "빈 칸"</b>으로 잡힌다(36칸 중 27개). 늘 커다란 숫자가 떠 있으면 사람은 그 타일을
 * 아예 안 보게 된다. 기준이 되는 목록({@code batch-domains})은 서버 설정이므로 셈도 서버가 한다.
 *
 * <p><b>배치 스위치를 띄우는 이유.</b> 꺼져 있으면 초안이 하나도 안 들어오는데 지금까지
 * 화면 어디에도 그 사실이 없었다 — 검수함이 빈 것이 "다 처리했다"인지 "배치가 꺼져 있다"인지
 * 구별할 수 없었다. 이 저장소가 이미 한 번 당한 종류의 침묵이다(docs/14).
 */
function renderTodo(todo) {
  const pendingReview = todo.pendingProblemDrafts + todo.pendingDocumentDrafts;
  const needsFixing = todo.untitledProblems + todo.missingRationale;

  const tiles = [
    { label: "검수 대기", value: pendingReview, href: "/admin/llm.html",
      hint: `문제 ${todo.pendingProblemDrafts} · 문서 ${todo.pendingDocumentDrafts}` },
    { label: "빈 칸", value: todo.emptyCells, href: null,
      hint: `배치가 채우는 ${todo.plannedCells}칸 중 출제가 없는 칸` },
    { label: "손볼 문제", value: needsFixing, href: "/admin/problems.html",
      hint: `제목 없음 ${todo.untitledProblems} · 오답 설명 없음 ${todo.missingRationale}` },
  ];

  const tileHtml = tiles.map(t => {
    const cls = t.value === 0 ? "todo-tile done" : "todo-tile";
    const inner = `<div class="num">${t.value}</div>
                   <div class="label">${t.label}</div>
                   <div class="hint">${escapeHtml(t.hint)}</div>`;
    // 0이면 갈 곳이 없으므로 링크를 걸지 않는다 — 눌렀는데 할 일이 없는 화면이 열리면
    // "왜 데려왔지"가 된다.
    return (t.href && t.value > 0)
      ? `<a class="${cls}" href="${t.href}">${inner}</a>`
      : `<div class="${cls}">${inner}</div>`;
  }).join("");

  // 배치 상태는 숫자가 아니라 상태라 타일과 다른 모양으로 둔다 — 같은 모양이면
  // "꺼짐"이 0건처럼 읽혀 좋은 소식으로 오해된다.
  //
  // 2026-09-01에 뒤에 링크를 붙였다. 이 줄은 "켜졌나 꺼졌나"까지만 답하는데, 실제로 알고 싶은
  // 것은 대개 그다음이다 — 오늘 무엇이 나오나, 만들어졌는데 아직 안 들어온 파일이 있나.
  // 그 답은 배치 화면에 있으므로 여기서 바로 갈 수 있게 한다(줄 자체는 그대로 둔다 —
  // 배치가 꺼진 것은 현황을 볼 때 함께 알아야 하는 사실이라 링크 뒤로 숨기지 않는다).
  const batch = todo.batchEnabled
    ? `<span class="batch-state on">일일 배치 켜짐 — 매일 06:17(KST)</span>`
    : `<span class="batch-state off">일일 배치 <b>꺼짐</b> — 새 초안이 들어오지 않습니다
       (<code>llm.generation.batch-enabled</code>)</span>`;

  document.getElementById("todoRow").innerHTML = tileHtml
    + `<div class="batch-row">${batch} <a href="/admin/batch.html">배치 현황 →</a></div>`;
}

/**
 * 학습 통계를 열지 말지 — 표본이 임계 미만이면 접어 둔다(2026-08-29).
 *
 * <p>제출 2건에 정답률 0%는 통계가 아니라 우연이다. 그런데 막대 하나짜리 차트와 74행이
 * "기록 없음"인 표가 화면 절반을 먹고 있었다. 자리를 비워 두는 것도 정보다 —
 * "아직 볼 것이 없다"를 말해 주는 편이, 볼 것이 없는 그림을 크게 그려 두는 것보다 낫다.
 *
 * <p>임계 20건은 근거가 있는 값이 아니라 <b>눈금</b>이다. 문제 76개에 20건이면 한 문제당
 * 제출이 채 하나가 안 되니 여전히 표본이라 부르기 어렵지만, 그쯤부터는 도메인 두셋에
 * 값이 생겨 "어디가 약한가"의 모양은 보이기 시작한다. 값을 늘리는 것보다 <b>지금 몇 건인지
 * 함께 적는 것</b>이 과신을 막는 데 더 낫다고 봤다.
 */
const LEARNING_STATS_MIN_SUBMISSIONS = 20;

function renderLearningStats(d) {
  const submissions = d.totals.submissions;
  const enough = submissions >= LEARNING_STATS_MIN_SUBMISSIONS;
  const panel = document.getElementById("learningStats");

  document.getElementById("learningSummary").innerHTML = enough
    ? `학습 통계 <span class="meta">(제출 ${submissions}건)</span>`
    : `학습 통계 <span class="meta">— 제출 ${submissions}건.
       ${LEARNING_STATS_MIN_SUBMISSIONS}건쯤부터 읽을 만해집니다(펼쳐 볼 수는 있습니다)</span>`;
  panel.open = enough;

  renderDomainChart(d.domainStats);
  renderProblemStats(d.problemStats);
}

/* 현황판: 행=도메인(전체 고정), 열=난이도. 데이터 없는 칸도 0으로 그려서 "빈 곳"을 드러낸다.
 * 칸을 누르면 그 도메인·난이도가 채워진 채로 AI 검수 화면이 열린다 — 이 표를 보는 이유가
 * "어디가 비었나"이고, 본 다음에 하는 일이 정확히 "그 칸을 채우는 것"이라 한 번에 잇는다. */
function renderMatrix(matrix) {
  const cellMap = {};
  matrix.forEach(c => cellMap[c.domain + "|" + c.difficulty] = c.count);

  /* 색 농도 — 한 가지 색으로 <많을수록 진하게>(2026-08-29).
   *
   * [왜 색을 입혔나] 이 표에 묻는 질문은 하나다 — "어디가 비었나". 24칸 숫자 격자에서 0을
   * 눈으로 찾는 것보다, 진하기로 칠해 빈 칸이 흰 구멍으로 남게 하는 편이 빠르다.
   *
   * [왜 한 가지 색인가] 값이 "문제 수"라는 크기 하나뿐이다. 크기에 여러 색을 쓰면(무지개)
   * 어느 색이 큰지를 따로 외워야 한다. 밝기 순서는 외울 것이 없다.
   *
   * [숫자를 지우지 않는다] 색만으로 상태를 알리면 색 구분이 어려운 사람에게는 아무 신호도
   * 아니다. 색은 훑기용, 숫자는 읽기용 — 둘 다 있어야 한다.
   *
   * [최댓값 기준] 절대 눈금(예: 10개=최대)을 쓰면 문제가 늘수록 표 전체가 새까매져 대비가
   * 사라진다. 그 표의 최댓값을 100%로 잡으면 언제 봐도 상대 분포가 보인다. */
  const counts = Object.values(cellMap);
  const max = counts.length ? Math.max(...counts) : 0;
  const shade = n => {
    if (n === 0) return "";
    // 0.10~0.72 사이로 눌러 둔다. 아래를 0으로 두면 1개짜리 칸이 빈 칸과 구별되지 않고,
    // 위는 <글씨가 읽히는 선>이다 — 0.72에서 본문 색(#111827) 대비가 4.65:1로 AA를 넘고,
    // 더 진하게 하면 흰 글씨로 갈아타야 하는데 그 경계에서 흰색도 4.5를 못 넘긴다.
    // 색을 한 칸 덜 쓰고 글씨를 한 색으로 유지하는 편이 낫다.
    //
    // 색은 이 프로젝트의 --primary(#4f46e5)를 그대로 쓴다. 차트만 다른 색을 쓰면
    // 화면 안에서 "이 파랑은 무슨 뜻이지"가 하나 늘어난다.
    const t = max === 0 ? 0 : 0.10 + (n / max) * 0.62;
    return ` style="background: rgba(79, 70, 229, ${t.toFixed(2)})"`;
  };

  const table = document.getElementById("matrixTable");
  table.innerHTML =
    `<tr><th>도메인</th>${DIFFICULTIES.map(([, l]) => `<th>${l}</th>`).join("")}<th>합계</th></tr>` +
    DOMAINS.map(([dv, dl]) => {
      let sum = 0;
      const cells = DIFFICULTIES.map(([lv, ll]) => {
        const n = cellMap[dv + "|" + lv] || 0; sum += n;
        return `<td class="click-cell ${n === 0 ? "zero" : ""}"${shade(n)}
                    data-domain="${dv}" data-difficulty="${lv}"
                    title="${dl} · ${ll} — 문제 ${n}개. 누르면 이 칸으로 AI 생성">${n}</td>`;
      }).join("");
      return `<tr><td>${dl}</td>${cells}<td><b>${sum}</b></td></tr>`;
    }).join("");

  // 위임 한 번으로 30칸을 다 받는다 — 칸마다 onclick 문자열을 심으면 값이 바뀔 때마다
  // HTML 안의 코드까지 같이 고쳐야 한다.
  table.onclick = e => {
    const cell = e.target.closest(".click-cell");
    // 폼만 채우고 요청은 보내지 않는다 — 생성은 돈이 드는 동작이라 "누르자마자 호출"은 위험하다.
    // 2026-08-29부터 생성은 별도 화면이라 goLlm이 아니라 goGenerate로 간다.
    if (cell) goGenerate({ domain: cell.dataset.domain, difficulty: cell.dataset.difficulty });
  };
}

/**
 * AI 초안 승인율 표 — 문제와 문서를 한 표에 두되 "종류" 열로 구분한다.
 *
 * [왜 두 표로 안 나눴나] 행이 모델 수만큼(보통 1~2줄)뿐이라 표를 둘로 쪼개면 제목만
 * 늘어나고 비교는 오히려 어려워진다. 종류 열 하나면 "같은 모델인데 문서만 승인율이 낮다"가
 * 한눈에 보인다 — 이 표를 보는 이유가 정확히 그것이다.
 *
 * [승인율이 null인 경우] 아직 아무도 검수하지 않은 상태다. 0%(전부 거절)와 정반대 신호라
 * "0%"로 뭉개면 안 된다 — 서버가 null로 내려보내고 화면도 다른 말로 적는다.
 */
function renderLlmReview(review) {
  const rows = [
    ...(review?.problems ?? []).map(s => ["문제", s]),
    ...(review?.documents ?? []).map(s => ["문서", s]),
  ];

  const table = document.getElementById("llmReviewTable");
  if (rows.length === 0) {
    // 초안이 하나도 없는 상태. 빈 표를 그리면 "고장 났나?"로 읽히므로 이유를 적어 준다.
    table.innerHTML = `<tr><td class="meta">아직 생성된 초안이 없습니다. 배치가 돌면 여기에 모델별 승인율이 쌓입니다.</td></tr>`;
    table.onclick = null;   // 앞서 그린 행의 핸들러가 남아 빈 표를 눌러도 반응하지 않게
    return;
  }

  // 행을 누르면 그 종류의 검수함으로 간다. 검수 대기가 남아 있으면 대기 목록을, 없으면
  // 승인 목록을 연다 — 이 표에서 사람이 다음에 하려는 일이 그 둘 중 하나다.
  table.innerHTML =
    `<tr><th>종류</th><th>모델</th><th>검수 대기</th><th>승인</th><th>거절</th><th>승인율</th></tr>` +
    rows.map(([kind, s]) => `
      <tr class="click-row" data-kind="${kind === "문제" ? "problem" : "document"}"
          data-status="${s.pending > 0 ? "PENDING" : "APPROVED"}" title="${kind} 검수함 열기">
        <td>${kind}</td>
        <td>${escapeHtml(s.model)}</td>
        <td class="${s.pending === 0 ? "zero" : ""}">${s.pending}</td>
        <td>${s.approved}</td>
        <td>${s.rejected}</td>
        <td>${s.approvalRate === null ? '<span class="meta">검수 전</span>' : s.approvalRate + "%"}</td>
      </tr>`).join("");

  // 상태 필터까지 맞춰 놓고 넘긴다(가서 또 고르게 하지 않는다).
  table.onclick = e => {
    const tr = e.target.closest(".click-row");
    if (tr) goLlm({ kind: tr.dataset.kind, status: tr.dataset.status });
  };
}

/**
 * 문제별 정답률 표.
 *
 * <p>기본 정렬은 정답률 낮은 순. 이 표를 보는 이유가 "어느 문제가 문제인가"이기 때문이다.
 * 서버가 준 순서(ID 순)를 그대로 그리면 60문제 중 정답률 20%짜리를 눈으로 찾아야 한다.
 *
 * <p><b>정렬을 고를 수 있게 했다(2026-08-29).</b> 낮은 순만으로는 답이 안 나오는 질문이 둘 있다 —
 * "너무 쉬운 문제는 없나"(높은 순)와 "그 숫자를 믿어도 되나"(제출 많은 순). 2회 제출에 0%는
 * 통계가 아니라 우연이라, 표본이 큰 것부터 보는 눈이 따로 필요하다.
 *
 * <p>기록 없는 문제(correctRate === null)는 <b>어느 정렬에서도</b> 맨 아래다. 0%(다 틀렸다)와
 * "아직 아무도 안 풀었다"는 정반대 신호인데, 섞이면 이 표가 거짓말을 한다.
 */
function renderProblemStats(stats) {
  const mode = document.getElementById("problemSort").value;
  const sorted = [...stats].sort((a, b) => {
    // 기록 없는 문제는 정렬 기준과 무관하게 늘 맨 아래다. 0%(다 틀렸다)와 "아직 아무도
    // 안 풀었다"는 정반대 신호라, 어느 방향으로 정렬하든 섞이면 표가 거짓말을 한다.
    if (a.correctRate === null || b.correctRate === null) {
      if (a.correctRate === null && b.correctRate === null) return 0;
      return a.correctRate === null ? 1 : -1;
    }
    if (mode === "attempts") return b.attempts - a.attempts;
    return mode === "desc" ? b.correctRate - a.correctRate : a.correctRate - b.correctRate;
  });
  const table = document.getElementById("statsTable");
  table.innerHTML =
    `<tr><th>ID</th><th>문제</th><th>도메인</th><th>유형</th><th>제출</th><th>정답</th><th>정답률</th></tr>` +
    sorted.map(s => `
      <tr class="click-row" data-id="${s.problemId}" title="이 문제를 수정">
        <td>${s.problemId}</td>
        <td class="wrap">${escapeHtml(cut(s.question, 40))}</td>
        <td>${escapeHtml(domainLabel(s.domain))}</td>
        <td>${escapeHtml(typeLabel(s.type))}</td>
        <td>${s.attempts}</td>
        <td>${s.correctCount}</td>
        <td>${s.correctRate === null ? '<span class="meta">기록 없음</span>' : s.correctRate + "%"}</td>
      </tr>`).join("");

  table.onclick = e => {
    const tr = e.target.closest(".click-row");
    if (tr) goProblemEdit(Number(tr.dataset.id));
  };
}

/**
 * 도메인별 정답률 가로 막대 차트 — 데이터 출처는 DB 뷰 domain_stats(R__ 마이그레이션).
 *
 * [왜 가로 막대인가] 비교 대상이 "도메인"이라는 범주 6~10개이고 값이 0~100%로
 * 상한이 있다 — 범주 비교는 막대가 정석이고, 한글 라벨은 가로형이어야 안 잘린다.
 * 시리즈가 하나(정답률)뿐이라 범례는 두지 않는다(제목이 곧 범례).
 *
 * [정렬] 기본은 정답률 낮은 순 — 이 화면의 첫 질문이 "어느 영역이 약한가"이기 때문.
 * 높은 순도 고를 수 있다(2026-08-29): 정답률이 유독 높은 칸은 <문제가 너무 쉽다>는 신호라
 * 출제를 손볼 후보가 된다. 정렬은 화면의 관심사라 서버/뷰가 아니라 여기서 한다.
 *
 * [표본 수 표기] 2회 제출에 0%는 통계가 아니라 우연이다. 라벨 옆에 제출 수를
 * 함께 적어 작은 표본의 극단값을 과신하지 않게 한다.
 */
function renderDomainChart(rows) {
  const box = document.getElementById("domainChart");
  if (!rows || rows.length === 0) {
    box.innerHTML = `<div class="meta">아직 제출 데이터가 없습니다. 제출이 쌓이면 도메인별 정답률이 여기 표시됩니다.</div>`;
    return;
  }
  const desc = document.getElementById("domainSort").value === "desc";
  const sorted = [...rows].sort((a, b) =>
    desc ? b.accuracyPct - a.accuracyPct : a.accuracyPct - b.accuracyPct);
  box.innerHTML = sorted.map((r, i) => `
    <div class="hbar-row" data-i="${i}">
      <div class="hbar-label">${escapeHtml(domainLabel(r.domain))}<span class="n">${r.submissionCount}회</span></div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.min(Math.max(r.accuracyPct, 0), 100)}%"></div></div>
      <div class="hbar-value">${r.accuracyPct}%</div>
    </div>`).join("");

  /* 호버 툴팁 — 화면에 다 적으면 시끄러운 상세 수치(정답/문제/도전자)는 툴팁으로.
   * 툴팁 하나를 공유하고 행마다 내용만 바꾼다. innerHTML이 아니라 textContent 조립이
   * 아니어도 되는 이유: 아래 문자열은 전부 숫자와 우리가 만든 라벨뿐(사용자 입력 없음). */
  let tip = document.getElementById("chartTip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "chartTip";
    tip.className = "chart-tip";
    tip.hidden = true;
    document.body.appendChild(tip);
  }
  box.querySelectorAll(".hbar-row").forEach(row => {
    const r = sorted[Number(row.dataset.i)];
    row.addEventListener("mouseenter", () => {
      tip.innerHTML = `<b>${escapeHtml(domainLabel(r.domain))}</b><br>
        정답 ${r.correctCount} / 제출 ${r.submissionCount} (${r.accuracyPct}%)<br>
        풀린 문제 ${r.attemptedProblemCount}개 · 도전자 ${r.solverCount}명`;
      tip.hidden = false;
    });
    row.addEventListener("mousemove", e => {
      // 커서 오른쪽 아래 12px — 커서에 딱 붙이면 툴팁이 커서를 가린다
      tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = (e.clientY + 12) + "px";
    });
    row.addEventListener("mouseleave", () => { tip.hidden = true; });
  });
}
</script>
</body>
