<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · AI 품질 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지.
   자세한 이유는 사용자 화면의 같은 주석 참고. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <h1>AI 품질</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <p class="meta" style="margin-bottom:12px">AI가 만든 초안이 검수를 얼마나 통과하는지 봅니다.
      승인율은 <b>검수를 마친 것</b> 중의 비율입니다 — 대기까지 넣으면 검수를 미루기만 해도 떨어져,
      모델 품질이 아니라 검수 속도를 재게 됩니다.</p>

    <!-- 두 표는 같은 승인율을 다른 축으로 자른다. 예전에는 하나는 현황에, 하나는 배치 현황에 있었다. -->
    <div class="card">
      <h3>최근 30일 <span class="meta">(들어온 문제 초안 기준)</span></h3>
      <div id="harvest" class="meta">불러오는 중…</div>
    </div>

    <div class="card">
      <h3>모델별 <span class="meta">(전체 기간 · 모델이나 프롬프트를 바꿨을 때 품질이 올랐는지 보는 저울 · 행을 누르면 검수함)</span></h3>
      <div class="table-wrap" style="margin-bottom:0"><table class="grid" id="llmReviewTable"></table></div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* AI 품질 — 초안 승인율(2026-10-15 신설). 현황 화면의 "AI 초안 승인율"과 배치 현황의
 * "② 나온 것이 승인됐나"가 같은 것을 두 화면에서 보여 주고 있어 한곳에 모았다.
 * 배치 현황에는 "① 요청한 만큼 나왔나"(생산량)만 남는다 — 그건 기계 상태다. */

if (initAdminPage("quality")) {
  loadHarvest();
  loadModelTable();
}

/* 둘을 따로 부른다. 한쪽 API가 실패해도 다른 표는 보여야 한다. */
async function loadHarvest() {
  const el = document.getElementById("harvest");
  try {
    renderHarvest(await api("/api/admin/batch-status"));
  } catch (e) {
    el.textContent = "불러오지 못했습니다: " + e.message;
  }
}

async function loadModelTable() {
  try {
    renderLlmReview((await api("/api/admin/dashboard")).llmReview);
  } catch (e) {
    document.getElementById("llmReviewTable").innerHTML =
      `<tr><td class="meta">불러오지 못했습니다: ${escapeHtml(e.message)}</td></tr>`;
  }
}

/* 들여오기 이력은 "몇 건 들어왔나"까지만 답한다. 열 건이 들어와도 아홉이 거절되면
 * 배치는 돈만 쓰고 아무것도 못 늘린 것인데, 그 구분을 이 막대가 보여 준다. */
function renderHarvest(s) {
  const h = s.harvest;
  const el = document.getElementById("harvest");
  if (h.generated === 0) {
    el.innerHTML = `최근 ${h.days}일 동안 만들어진 문제 초안이 없습니다.`
      + (s.enabled ? "" : ` 배치가 꺼져 있으니 당연한 결과입니다.`);
    return;
  }
  const pct = n => (n / h.generated * 100).toFixed(1);
  const reviewed = h.approved + h.rejected;
  const rate = reviewed === 0
    ? `<span class="meta">아직 검수한 것이 없습니다</span>`
    : `승인율 <b>${Math.round(h.approved / reviewed * 100)}%</b> <span class="meta">(검수한 ${reviewed}건 기준)</span>`;

  el.innerHTML = `
    <div class="harvest-bar">
      <i class="ap" style="width:${pct(h.approved)}%"></i>
      <i class="rj" style="width:${pct(h.rejected)}%"></i>
      <i class="pd" style="width:${pct(h.pending)}%"></i>
    </div>
    <div class="harvest-nums">
      <span>생성 <b>${h.generated}</b>건</span>
      <span>승인 <b>${h.approved}</b></span>
      <span>거절 <b>${h.rejected}</b></span>
      <span>대기 <b>${h.pending}</b></span>
      <span>${rate}</span>
    </div>`;
}

/**
 * 모델별 승인율 — 문제와 문서를 한 표에 두되 "종류" 열로 구분한다. 행이 모델 수만큼뿐이라
 * 표를 나누면 비교가 오히려 어렵다("같은 모델인데 문서만 낮다"가 한눈에 보여야 한다).
 * 승인율 null은 아직 아무도 검수하지 않은 상태다. 0%(전부 거절)와 정반대 신호라 다른 말로 적는다.
 */
function renderLlmReview(review) {
  const rows = [
    ...(review?.problems ?? []).map(s => ["문제", s]),
    ...(review?.documents ?? []).map(s => ["문서", s]),
  ];

  const table = document.getElementById("llmReviewTable");
  if (rows.length === 0) {
    table.innerHTML = `<tr><td class="meta">아직 생성된 초안이 없습니다. 배치가 돌면 여기에 모델별 승인율이 쌓입니다.</td></tr>`;
    table.onclick = null;
    return;
  }

  table.innerHTML =
    `<tr><th>종류</th><th>모델</th><th>검수 대기</th><th>승인</th><th>거절</th><th>승인율</th></tr>` +
    rows.map(([kind, s]) => `
      <tr class="click-row" data-kind="${kind === "문제" ? "problem" : "document"}"
          data-status="${s.pending > 0 ? "PENDING" : "APPROVED"}" title="${kind} 검수함 열기">
        <td>${kind}</td>
        <td>${escapeHtml(s.model)}</td>
        <td class="${s.pending === 0 ? "zero" : ""}">${s.pending}</td>
        <td>${s.approved}</td>
        <td>${s.rejected}</td>
        <td>${s.approvalRate === null ? '<span class="meta">검수 전</span>' : s.approvalRate + "%"}</td>
      </tr>`).join("");

  // 검수 대기가 남아 있으면 대기 목록을, 없으면 승인 목록을 연다
  table.onclick = e => {
    const tr = e.target.closest(".click-row");
    if (tr) goLlm({ kind: tr.dataset.kind, status: tr.dataset.status });
  };
}
</script>
</body>
</html>
