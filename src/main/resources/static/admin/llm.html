<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · AI 검수 — csquiz</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="nav"></header>

<main class="container admin">
  <h1>관리자</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <div class="tabs" id="adminNav"></div>


    <!-- 승인·거절 실패 메시지 자리. 예전에는 생성 폼의 gMessage를 같이 썼는데, 생성이
         다른 화면으로 떠나면서(2026-08-29) 그 요소가 없어졌다 — 이름도 하는 일에 맞춘다. -->
    <div id="reviewMessage"></div>

    <h3 id="problem-drafts">문제 초안</h3>
    <!-- 필터 넷(2026-08-29). 그전에는 상태 하나뿐이라 검수 대기 47건이 한 줄로 쏟아졌다.
         검수의 실제 단위는 "오늘 들어온 전부"가 아니라 <이 문서로 만든 것들>이다 —
         같은 문서에서 나온 다섯을 나란히 봐야 서로 겹치는지, 난이도가 실제로 갈리는지 보인다. -->
    <div class="filters" style="margin-bottom:12px">
      <div class="field"><label>상태</label>
        <select id="gStatusFilter">
          <option value="PENDING">검수 대기</option>
          <option value="APPROVED">승인됨</option>
          <option value="REJECTED">거절됨</option>
        </select>
      </div>
      <div class="field"><label>분야</label><select id="fDomain"></select></div>
      <div class="field"><label>난이도</label><select id="fDifficulty"></select></div>
      <div class="field"><label>근거 문서</label><select id="fDocument"></select></div>
    </div>

    <!-- 유형 쏠림 알림(2026-08-25) — 초안 하나만 봐서는 알 수 없어 목록 위에 따로 둔다.
         카드마다 붙이면 다섯 장에 같은 말이 다섯 번 뜬다. -->
    <div id="kindBalance" hidden style="margin-bottom:12px"></div>

    <!-- ═══ 일괄 승인 바 ═══
         검수 대기 목록에서만 나타난다. 승인됨·거절됨 목록에는 체크박스 자체가 없다 —
         이미 처리된 것을 다시 승인할 길은 없어서(서버가 409로 막는다) 있어 봐야 오해만 준다. -->
    <div id="bulkBar" class="card" hidden style="margin-bottom:12px">
      <!-- .row-actions를 쓰지 않는다: 그 클래스는 <td>에도 붙어야 해서 일부러 flex가 아니다
           (style.css 441줄 주석). 여기는 표 밖이라 flex를 직접 준다. -->
      <div style="display:flex; align-items:center; flex-wrap:wrap; gap:10px">
        <label style="display:flex; align-items:center; gap:6px; margin:0">
          <input type="checkbox" id="bulkAll"> <span>전체 선택</span>
        </label>
        <span class="meta" id="bulkCount">0건 선택됨</span>
        <span style="flex:1"></span>
        <button id="bulkApproveBtn" disabled>선택 승인</button>
      </div>
      <div id="bulkResult"></div>
    </div>

    <div id="draftList"></div>
    <!-- 페이저(2026-08-29 신설). 그전에는 size=50 한 판만 불러 놓고 <잘렸다는 표시도 없었다> —
         승인됨이 114건이라 64건은 화면에서 볼 방법 자체가 없었다. 문제 관리 화면에는 이미
         같은 모양의 페이저가 있어서, 한 콘솔 안에서 규칙이 갈려 있기도 했다. -->
    <div class="pager" id="dPager" hidden>
      <button id="dPrevBtn" class="btn-outline">이전</button>
      <span class="info" id="dPageInfo"></span>
      <button id="dNextBtn" class="btn-outline">다음</button>
    </div>

    <!-- ═══ 개념 문서 검수 (docs/15) ═══
         문제와 달리 "생성 요청" 버튼이 없다. 문서 생성은 GitHub Actions에서만 돌린다 —
         한 편에 1~2분·$0.2가 드는 작업이라 화면에 버튼을 두면 실수로 누르기 쉽고,
         누른 뒤에는 응답이 올 때까지 화면이 멈춰 있어야 한다. -->
    <h3 id="document-drafts" style="margin-top:36px">개념 문서 초안
      <select id="gdStatusFilter" style="margin-left:10px">
        <option value="PENDING">검수 대기</option>
        <option value="APPROVED">승인됨</option>
        <option value="REJECTED">거절됨</option>
      </select>
    </h3>
    <p class="meta">GitHub Actions가 만든 문서를 앱이 켜질 때 가져옵니다. 승인해야만 정식 문서가 되어 사이트에 보입니다.
      자동 검증에서 <b>차단</b> 항목이 걸린 초안은 승인할 수 없고, <b>경고</b>는 보고 판단하시면 됩니다.</p>
    <div id="docDraftList"></div>
    <div class="pager" id="ddPager" hidden>
      <button id="ddPrevBtn" class="btn-outline">이전</button>
      <span class="info" id="ddPageInfo"></span>
      <button id="ddNextBtn" class="btn-outline">다음</button>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* AI 검수 — 모델이 만든 문제와 문서를 사람이 보고 승인·거절하는 곳.
 *
 * [왜 문제와 문서를 한 화면에 두나]
 * 하는 일이 같다 — 읽고, 판단하고, 승인 또는 거절한다. 검수는 대개 "오늘 들어온 것"을
 * 한 번에 처리하는 작업이라 둘을 오가는 비용이 없는 편이 낫다. 대신 목록은 확실히 갈라
 * 놓고(제목 두 개), 대시보드에서 넘어올 때는 주소로 어느 쪽인지 지정한다.
 *
 * [주소로 상태를 받는다]
 *   ?domain=OS&difficulty=BEGINNER   현황판 빈 칸에서 옴 → 생성 폼을 채워 둔다(요청은 안 보낸다)
 *   ?kind=problem|document&status=…  승인율 표에서 옴 → 그쪽 목록을 그 필터로 연다 */


/**
 * 자주 쓰는 거절 사유 — 한 번 눌러 채운다(2026-08-29 신설).
 *
 * <p><b>왜 만들었나.</b> 사유는 다음 생성 프롬프트에 되먹여지는데(docs/14) <b>선택 입력</b>이라
 * 비운 채 거절하기 쉬웠다. 실제로 5건이 그렇게 나가 그 배치의 되먹임이 0이 됐다.
 * 적는 데 드는 손이 곧 비어 있는 이유였다.
 *
 * <p><b>왜 문구를 여기서 정해 두나.</b> 모델에게 갈 문장이라 매번 다르게 쓰면 <b>되먹임이
 * 흩어진다</b>. 같은 지적이 같은 문장으로 쌓여야 "이 실수가 반복된다"는 신호가 된다.
 * 그때그때 다듬을 수 있게 입력란은 그대로 두고, 칩은 출발점만 준다.
 *
 * <p>목록은 이 저장소가 실제로 겪은 결함에서 뽑았다 — 정답 길이 편향(22문항 중 18개),
 * 보기 겹침, 암기 확인, 문서 밖 내용, 오답 설명이 반박이 아닌 재설명.
 */
const REJECT_REASONS = [
  "정답이 유독 길어 지문을 읽지 않고도 찍힌다",
  "오답 보기가 서로 겹쳐 정답이 둘로 읽힌다",
  "단순 암기 확인이라 실무 판단을 묻지 않는다",
  "근거 문서에 없는 내용을 지어냈다",
  "오답 설명이 왜 틀렸는지가 아니라 보기를 다시 설명한다",
];

/* 한 판에 보여 줄 초안 수. 문제는 카드가 짧아 20장까지 훑을 만하고, 문서는 본문 미리보기가
 * 붙어 한 장이 화면을 거의 채우므로 10장으로 둔다. 예전에는 각각 50·20을 <한 번만> 불렀는데,
 * 그건 상한이 아니라 "그 뒤는 없는 셈 치기"였다. */
const DRAFT_PAGE_SIZE = 20;
const DOC_DRAFT_PAGE_SIZE = 10;

/* 지금 보고 있는 쪽수. 상태 필터를 바꾸면 0으로 되돌린다 — 3쪽을 보다 필터를 바꾸면
 * 그쪽 목록의 3쪽이 열리는데, 사람이 기대하는 것은 언제나 새 목록의 첫 쪽이다. */
let draftPage = 0;
let docDraftPage = 0;

if (initAdminPage("llm")) {
  initReviewControls();
  initBulkApprove();
  applyDeepLink();
  loadDocumentSlugFilter();
  loadDrafts();
  loadDocDrafts();
}

/** 목록 필터·페이저 배선. 생성 폼은 2026-08-29에 /admin/generate.html로 떠났다. */
function initReviewControls() {
  // 목록 필터 셋 — 첫 옵션은 "전체"(빈 값). 서버는 빈 값을 안 보내면 조건을 걸지 않는다.
  const fd = document.getElementById("fDomain");
  fd.innerHTML = `<option value="">전체</option>`;
  DOMAINS.forEach(([v, l]) => fd.insertAdjacentHTML("beforeend", `<option value="${v}">${l}</option>`));
  const ff = document.getElementById("fDifficulty");
  ff.innerHTML = `<option value="">전체</option>`;
  DIFFICULTIES.forEach(([v, l]) => ff.insertAdjacentHTML("beforeend", `<option value="${v}">${l}</option>`));

  // 필터를 바꾸면 첫 쪽부터 — 보던 쪽수를 들고 넘어가면 "빈 3쪽"이 열릴 수 있다.
  // 상태가 바뀌면 근거 문서 목록도 다시 받는다: 검수 대기에 걸린 문서와 승인됨에 걸린
  // 문서가 다르기 때문이다. 안 바꾸면 고를 수는 있는데 결과가 0건인 항목이 남는다.
  document.getElementById("gStatusFilter").addEventListener("change", () => {
    draftPage = 0;
    loadDocumentSlugFilter();
    loadDrafts();
  });
  ["fDomain", "fDifficulty", "fDocument"].forEach(id =>
    document.getElementById(id).addEventListener("change", () => { draftPage = 0; loadDrafts(); }));
  document.getElementById("gdStatusFilter").addEventListener("change", () => { docDraftPage = 0; loadDocDrafts(); });

  document.getElementById("dPrevBtn").addEventListener("click", () => { draftPage--; loadDrafts(); });
  document.getElementById("dNextBtn").addEventListener("click", () => { draftPage++; loadDrafts(); });
  document.getElementById("ddPrevBtn").addEventListener("click", () => { docDraftPage--; loadDocDrafts(); });
  document.getElementById("ddNextBtn").addEventListener("click", () => { docDraftPage++; loadDocDrafts(); });
}

/**
 * 페이저 한 벌을 그린다 — 문제·문서 목록이 같은 함수를 쓴다.
 *
 * <p><b>전체 건수를 함께 적는 것</b>이 이 함수의 요점이다. "1 / 6"만 보여 주면 몇 건인지
 * 모르고, 그전에는 그 표시조차 없어 <b>잘렸다는 사실 자체가 안 보였다</b>. 사람이 알아야
 * 하는 것은 쪽수가 아니라 "아직 몇 건 남았나"다.
 *
 * <p>쪽이 하나뿐이면 통째로 감춘다. 늘 떠 있으면 누를 수 없는 버튼 두 개가 자리만 먹는다.
 *
 * @param prefix 요소 id 접두사(d = 문제 초안, dd = 개념 문서 초안)
 */
function renderPager(prefix, data) {
  const pager = document.getElementById(prefix + "Pager");
  pager.hidden = data.totalPages <= 1;
  document.getElementById(prefix + "PageInfo").textContent =
    `${data.page + 1} / ${Math.max(data.totalPages, 1)} — 전체 ${data.totalElements}건`;
  document.getElementById(prefix + "PrevBtn").disabled = data.page === 0;
  document.getElementById(prefix + "NextBtn").disabled = !data.hasNext;
}

/**
 * 마지막 한 건을 처리해 빈 쪽이 된 경우 앞 쪽으로 물러난다.
 *
 * <p>3쪽의 마지막 초안을 승인하면 3쪽은 사라지는데, 그대로 다시 부르면 <b>빈 목록</b>이
 * 뜬다 — 방금 잘 처리했는데 "초안이 없습니다"가 보이니 뭔가 잘못된 줄 안다.
 *
 * @returns 물러났으면 true(호출부는 다시 불러야 한다)
 */
function stepBackIfEmpty(page, data) {
  return page > 0 && data.content.length === 0;
}



/**
 * 주소에 담겨 온 상태를 화면에 반영한다.
 *
 * <p>?domain=&difficulty= 는 이제 여기로 오지 않는다 — 그건 생성 폼을 채우라는 뜻이고,
 * 생성은 /admin/generate.html로 떠났다(2026-08-29). 이 화면이 받는 것은 "어느 목록을
 * 어떤 필터로 열지"뿐이다.
 */
function applyDeepLink() {
  const kind = param("kind");
  const status = param("status");
  if (!kind || !status) return;

  const filterId = kind === "document" ? "gdStatusFilter" : "gStatusFilter";
  document.getElementById(filterId).value = status;
  // 문서 목록은 화면 아래쪽이라 그냥 열면 안 보인다. 넘어온 의도가 "그걸 보자"이므로 데려간다.
  document.getElementById(kind === "document" ? "document-drafts" : "problem-drafts")
    .scrollIntoView({ behavior: "smooth" });
}

/* ═══════════ 문제 생성 ═══════════ */



/* ═══════════ 문제 초안 검수 ═══════════ */

/**
 * 초안 하나의 자동 검증 경고 상자 — 2026-08-25 신설. 없으면 빈 문자열.
 *
 * 문서 초안에는 처음부터 있던 것이 문제 초안에는 없었다. 검사(ProblemItemRule)는 2026-08-13부터
 * 있었지만 부르는 곳이 배치 CLI뿐이라, 관리 화면에서 만든 문제는 아무 경고도 받지 않았다.
 * 일일 배치를 꺼 둔 지금은 모든 생성이 화면 경로라 검사가 사실상 하나도 안 돌고 있었다.
 *
 * 문서 쪽과 달리 <차단 상자가 없다>. 문제는 규약 위반이면 저장 자체가 안 되므로
 * (ProblemItemRule.defectOf) 화면에 뜬 초안은 이미 차단을 통과한 것들이다.
 */
function warningBoxOf(d) {
  const checks = d.checks ?? [];
  if (checks.length === 0) return "";
  return `
    <div class="alert" style="margin:10px 0">
      ${checks.map(c => `⚠ ${escapeHtml(c.message)}`).join("<br>")}
    </div>`;
}

/**
 * 유형 쏠림 알림 — 2026-08-25 신설. 목록 맨 위에 한 줄.
 *
 * [왜 서버가 아니라 화면에서 세나]
 * 이건 <배치 단위> 판정이다. 초안 하나만 보고는 알 수 없고(비교형 하나는 아무 문제도 아니다),
 * 서버의 응답 DTO는 항목 하나씩 담는다. 목록을 통째로 손에 든 것은 화면뿐이라 여기서 센다.
 *
 * [왜 검수 대기 목록에서만 보여주나]
 * 승인·거절이 끝난 목록에 "상황형이 하나뿐"이라고 알려 봐야 고칠 방법이 없다.
 * 게다가 그 목록은 여러 날의 배치가 섞여 있어 애초에 세는 것이 뜻이 없다.
 *
 * 기준(2)은 서버의 ProblemItemRule.SITUATION_MAX_PER_BATCH와 같아야 한다. 두 곳에 적힌 숫자라
 * 갈라질 수 있는데, 갈라지면 화면은 조용한데 배치 요약만 경고하는 상태가 된다.
 *
 * [최소에서 최대로 뒤집었다 — 2026-08-25]
 * 처음에는 "상황형이 사라지는 것"을 막으려 했는데, 실물은 정반대였다. 5문제 중 5개가 상황형이었고
 * 이어서 1건씩 세 번 더 뽑았는데 세 번 다 상황형이었다. 막아야 할 쪽은 전부를 차지하는 쪽이다.
 *
 * [배치가 아니라 "검수 대기 전체"를 센다]
 * 서버의 batchWarningsOf는 한 번의 생성 결과만 보지만 여기는 목록 전체를 본다. 실제로 문제가
 * 되는 것이 그쪽이기 때문이다 — 1건씩 나눠 뽑으면 배치마다 상황형 1개라 서버는 조용한데,
 * 쌓아 놓고 보면 다섯 개가 전부 상황형이다. 그래서 문구에도 "검수 대기"라고 적어 둔다.
 */
function renderKindBalance(drafts, status) {
  const box = document.getElementById("kindBalance");
  if (status !== "PENDING" || drafts.length === 0) {
    box.hidden = true;
    return;
  }
  const lines = [];

  // ① 유형 쏠림 — 중급만. 초급은 나눌 것이 없고, 고급은 상황형이 주력이라 상한이 없다.
  const intermediate = drafts.filter(d => d.difficulty === "INTERMEDIATE" && d.questionKind);
  if (intermediate.length) {
    const counts = {};
    intermediate.forEach(d => { counts[d.questionKindLabel] = (counts[d.questionKindLabel] ?? 0) + 1; });
    const summary = Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(" · ");
    const situations = intermediate.filter(d => d.questionKind === "SITUATION").length;
    lines.push(situations > 2
      ? { bad: true, html: `⚠ 검수 대기 중급 ${intermediate.length}건 중 <b>상황 적용형이 ${situations}건</b>입니다 (상한 2건).`
          + ` 나머지는 비교·인과·판정·순서로 채우세요. 지금 형태 — ${escapeHtml(summary)}` }
      : { bad: false, html: `검수 대기 중급 ${intermediate.length}건의 형태 — ${escapeHtml(summary)}` });
  }

  // ② 문형 반복 — 난이도별로 따로 센다. 초급과 중급이 같은 물음을 쓰는 것은 문제가 아니고,
  //    같은 난이도 안에서 겹치는 것이 문제다(학습자는 한 세트를 이어서 푼다).
  //
  //    서버의 ProblemItemRule.batchWarningsOf도 같은 것을 재지만 그쪽은 <한 번의 생성>만 본다.
  //    1건씩 나눠 뽑으면 배치마다 물음이 하나라 서버는 조용한데, 쌓아 놓고 보면 다섯이 같다.
  //    목록을 통째로 손에 든 것은 화면뿐이라 여기서도 잰다(유형 쏠림과 같은 판단).
  for (const level of ["BEGINNER", "INTERMEDIATE", "ADVANCED"]) {
    const tails = drafts.filter(d => d.difficulty === level)
      .map(d => closingQuestionOf(d.question)).filter(Boolean);
    const shared = new Map();
    for (let i = 0; i < tails.length; i++) {
      for (let j = i + 1; j < tails.length; j++) {
        const s = sharedTailOf(tails[i], tails[j]);
        if (s) shared.set(s, (shared.get(s) ?? 0) + 1);
      }
    }
    shared.forEach((_, tail) => {
      const n = tails.filter(t => t.endsWith(tail)).length;
      lines.push({
        bad: true,
        html: `⚠ ${escapeHtml(difficultyLabel(level))} ${n}건이 사실상 같은 물음으로 끝납니다 —`
          + ` "<b>${escapeHtml(tail)}</b>". 문형이 같으면 개념이 아니라 형식이 외워집니다.`,
      });
    });
  }

  if (lines.length === 0) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  box.className = lines.some(l => l.bad) ? "alert error" : "alert";
  box.innerHTML = lines.map(l => l.html).join("<br>");
}

/**
 * 지문의 마지막 물음 문장. 물음표로 끝나지 않으면 null.
 * 서버의 ProblemItemRule.questionTailOf와 같은 규칙이어야 한다 — 갈라지면 화면과 배치가
 * 같은 초안을 두고 다른 말을 한다. 한 문장짜리 지문은 통째로 비교되는 것도 그쪽과 같다
 * (초급의 "○○의 정의로 옳은 것은?" 반복은 정상이라 잡지 않는다).
 */
function closingQuestionOf(question) {
  if (!question) return null;
  const flat = question.replace(/\s+/g, " ").trim();
  if (!flat.endsWith("?")) return null;
  const cut = Math.max(flat.lastIndexOf("."), flat.lastIndexOf("!"), flat.lastIndexOf("。"));
  return flat.slice(cut + 1).trim();
}

/**
 * 두 물음이 사실상 같으면 겹치는 부분, 아니면 null.
 * 서버의 ProblemItemRule.sharedTailOf와 같은 규칙이어야 한다.
 *
 * 완전 일치로는 부족했다 — 고급 실물에서 "가장 적절한 조치는?"과 "이 상황에서 가장 적절한
 * 조치는?"이 나왔는데, 문자열로는 다르지만 학습자에게는 같은 물음이다. 앞에 말 몇 개만
 * 붙이면 빠져나가는 검사는 있으나 마나다.
 *
 * "끝 N글자 비교"로 하지 않은 이유: 그러면 초급의 "○○의 정의로 옳은 것은?"이 매번 걸린다.
 * 그 반복은 정상이라 잡으면 안 된다. 한쪽이 다른 쪽의 <접미사>인지만 본다.
 */
function sharedTailOf(a, b) {
  const [shorter, longer] = a.length <= b.length ? [a, b] : [b, a];
  if (shorter.length < 8) return null;   // "옳은 것은?"(6자) 같은 공통 꼬리는 세지 않는다
  return longer.endsWith(shorter) ? shorter : null;
}

/**
 * 근거 문서 필터를 채운다 — <b>지금 상태에 실제로 있는</b> slug만 서버가 준다.
 *
 * <p>등록 문서 전체를 넣지 않는 이유: 초안이 걸린 문서는 그중 일부라, 전부 보여 주면
 * 고르는 족족 "0건"이 나온다. 고를 수 있는 것만 있는 목록이 고르고 나서 실망하지 않는다.
 *
 * <p>고르고 있던 값이 새 목록에도 있으면 유지한다 — 상태를 잠깐 바꿔 봤다고 문서 선택이
 * 풀리면, 바뀐 줄 모르고 "왜 전체가 나오지" 하게 된다.
 *
 * <p>실패해도 조용히 넘어간다. 필터 하나를 못 채웠다고 검수 목록까지 막을 이유는 없다.
 */
async function loadDocumentSlugFilter() {
  const sel = document.getElementById("fDocument");
  const keep = sel.value;
  const status = document.getElementById("gStatusFilter").value;
  try {
    const slugs = await api(`/api/admin/llm-problems/document-slugs?status=${status}`);
    // 값은 slug 그대로지만 <보이는 글>에는 편을 붙인다(2026-09-05). 두 편은 제목이 같고
    // slug 끝의 -advanced로만 갈려서, 그대로 찍으면 줄 끝 글자를 눈으로 찾아야 한다.
    sel.innerHTML = `<option value="">전체</option>`
      + slugs.map(s => `<option value="${escapeHtml(s)}">${slugWithEdition(s)}</option>`).join("");
    sel.value = slugs.includes(keep) ? keep : "";
  } catch (e) {
    sel.innerHTML = `<option value="">전체</option>`;
  }
}

/** 지금 걸려 있는 목록 필터를 쿼리 문자열로. 빈 값은 아예 넘기지 않는다(서버가 조건을 건너뛴다). */
function draftFilterQuery() {
  const params = new URLSearchParams();
  for (const [key, id] of [["domain", "fDomain"], ["difficulty", "fDifficulty"], ["documentSlug", "fDocument"]]) {
    const value = document.getElementById(id).value;
    if (value) params.set(key, value);
  }
  const query = params.toString();
  return query ? "&" + query : "";
}

/**
 * @param jumpToLast 방금 생성한 직후면 true — 마지막 쪽으로 옮긴다.
 *                   검수 목록은 <오래된 순>이라(FIFO, DraftImportRunner.scan 참고) 새로 만든
 *                   초안이 맨 뒤에 붙는다. 그대로 첫 쪽을 보여 주면 "생성 완료"라고 해 놓고
 *                   방금 만든 것이 화면 어디에도 없다. 쪽수는 한 번 불러 봐야 알 수 있어서
 *                   요청이 한 번 더 가는데, 생성 자체가 수십 초라 체감되지 않는다.
 */
async function loadDrafts(jumpToLast = false) {
  const status = document.getElementById("gStatusFilter").value;
  const data = await api(`/api/admin/llm-problems?status=${status}&size=${DRAFT_PAGE_SIZE}&page=${draftPage}`
    + draftFilterQuery());
  const box = document.getElementById("draftList");

  if (jumpToLast && data.totalPages > 0 && draftPage !== data.totalPages - 1) {
    draftPage = data.totalPages - 1;
    return loadDrafts();
  }
  if (stepBackIfEmpty(draftPage, data)) {
    draftPage--;
    return loadDrafts();
  }
  if (data.content.length === 0) {
    box.innerHTML = `<div class="empty-state">해당 상태의 초안이 없습니다.<br>
      검수 대기가 비었다면 오늘 몫은 다 처리한 것입니다 — 다음 배치는 매일 06:17(KST)에 돕니다.</div>`;
    renderPager("d", data);
    syncBulkBar();   // 목록이 비면 일괄 승인 바도 함께 접힌다
    return;
  }
  // 초안은 표가 아니라 카드로 — 검수는 지문·보기·해설을 통째로 읽어야 하는 작업이라
  // 행 하나로 요약하면 결국 펼쳐 보는 클릭만 늘어난다.
  box.innerHTML = data.content.map(d => {
    // 오답 설명(V15)은 보기 바로 아래 붙여 보여 준다. 따로 모아 두면 검수자가 "이 설명이
    // 어느 보기 것이지?"를 눈으로 짝지어야 하는데, 그게 정확히 번호 지목을 막은 이유다.
    // 옛 초안은 이 값이 없고, 그때는 줄이 안 생기므로 화면이 예전 그대로다.
    // 짝짓기는 한 줄이 한 쌍이라 오른쪽을 함께 보여 줘야 검수가 된다(V16). 오른쪽만 따로
    // 모아 두면 "이 설명이 어느 용어 것이지?"를 다시 눈으로 짝지어야 하는데, 그건 이 화면이
    // 오답 설명을 보기 아래 붙인 이유와 똑같은 문제다.
    // 순서 배열은 여기서 번호(1..N)를 찍는다 — 아래 정답 줄의 "3|2|1|4"가 이 번호를 가리킨다.
    const ordering = d.type === "ORDERING";
    const choices = (d.choices ?? []).map((c, i) =>
      `<li>${ordering ? `<b>${i + 1}.</b> ` : ""}${c.correct ? "✅ " : ""}${escapeHtml(c.text)}${
        c.matchText ? `<div class="meta" style="margin-top:2px">↔ ${escapeHtml(c.matchText)}</div>` : ""
      }${
        c.rationale ? `<div class="meta" style="margin-top:2px">↳ ${escapeHtml(c.rationale)}</div>` : ""
      }</li>`).join("");
    const actions = d.status === "PENDING" ? `
      <div class="row-actions" style="margin-top:10px">
        <button onclick="approveDraft(this, ${d.id})">승인 → 문제 등록</button>
        <button class="danger" onclick="openReject(${d.id})">거절</button>
      </div>
      <div id="rejectForm-${d.id}" hidden style="margin-top:10px">
        <input id="rejectReason-${d.id}" type="text" maxlength="500"
               placeholder="거절 사유 (선택) — 아래에서 고르거나 직접 적으세요"
               onkeydown="if (event.key === 'Enter') confirmReject(document.getElementById('rejectConfirm-${d.id}'), ${d.id})"
               style="width:100%">
        <!-- 사유 문구는 버튼의 글자에서 직접 읽는다(fillReason). 문자열을 onclick 인자로
             끼워 넣으면 따옴표가 든 문구 하나에 화면이 깨진다 — 문제 목록에서 겪은 사고와 같다. -->
        <div class="reject-chips">
          ${REJECT_REASONS.map(r =>
            `<button type="button" class="chip" onclick="fillReason(${d.id}, this)">${escapeHtml(r)}</button>`).join("")}
        </div>
        <div class="meta" style="margin:4px 0 6px">
          사유는 다음 문제 생성 프롬프트에 그대로 반영됩니다(docs/14). 비워도 거절은 되지만, 되먹임에는 쓰이지 않습니다.
        </div>
        <div class="row-actions">
          <button id="rejectConfirm-${d.id}" class="danger" onclick="confirmReject(this, ${d.id})">거절 확정</button>
          <button onclick="closeReject(${d.id})">취소</button>
        </div>
      </div>` : `
      <div class="meta" style="margin-top:10px">
        ${d.status === "APPROVED" ? `승인됨 → 문제 ID ${d.approvedProblemId}` : `거절됨${d.rejectReason ? " — " + escapeHtml(d.rejectReason) : ""}`}
      </div>
      ${d.status === "REJECTED" ? `
      <!-- 복구는 거절된 것에만 붙인다. 승인된 초안은 이미 정식 문제를 만들었으므로
           되돌리면 중복 등록으로 이어진다(서버도 409로 막지만, 애초에 버튼을 안 보여준다). -->
      <div class="row-actions" style="margin-top:6px">
        <button class="btn-outline" onclick="restoreDraft(this, ${d.id})">검수함으로 되돌리기</button>
      </div>` : ""}`;
    // 체크박스는 검수 대기 카드에만. 라벨로 감싸 "#12" 배지까지 클릭 영역이 되게 한다 —
    // 여러 건을 훑으며 찍는 작업이라 표적이 작으면 손이 아프다.
    const pick = d.status === "PENDING"
      ? `<label style="display:inline-flex; align-items:center; gap:6px; margin-right:6px">
           <input type="checkbox" class="bulk-pick" value="${d.id}">
           <span class="badge gray">#${d.id}</span>
         </label>`
      : `<span class="badge gray">#${d.id}</span>`;
    return `
      <div class="card" style="margin-bottom:12px">
        <div>
          ${pick}
          <span class="badge gray">${escapeHtml(d.domainLabel)}</span>
          ${difficultyBadge(d.difficulty)}
          <span class="badge gray">${escapeHtml(typeLabel(d.type))}</span>
          ${d.questionKindLabel ? `<span class="badge">${escapeHtml(d.questionKindLabel)}</span>` : ""}
          <span class="meta">${escapeHtml(d.model)}</span>
        </div>
        ${warningBoxOf(d)}
        ${d.documentSlug ? `
        <!-- 근거 문서 링크(2단계) — 검수자가 "이 문제가 문서와 맞나"를 바로 대조할 수 있게 한다.
             문서가 아직 승인 전이면 링크가 404가 되는데, 그건 정상 상황이라 막지 않는다:
             초안 문제가 초안 문서보다 먼저 검수될 수 있고, 그 순서를 강제할 이유가 없다. -->
        <div class="meta" style="margin-top:6px">
          근거 문서: <a href="/document.html?slug=${encodeURIComponent(d.documentSlug)}" target="_blank">${slugWithEdition(d.documentSlug)}</a>
        </div>` : ""}
        <!-- 목록 제목(V13) — 검수자가 "이 제목으로 목록에 뜬다"를 지문과 나란히 보게 둔다.
             비었으면 그 사실을 적는다. 조용히 감추면 제목 없는 문제가 그대로 승인되고,
             학습자 목록에는 상황 서술 조각이 뜬다. -->
        <div class="meta" style="margin-top:8px">
          목록 제목: ${d.title ? `<b>${escapeHtml(d.title)}</b>` : "<i>(없음 — 승인 전에 붙이는 편이 낫다)</i>"}
        </div>
        <p style="margin:6px 0 6px; white-space:pre-wrap"><b>${escapeHtml(d.question)}</b></p>
        ${choices ? `<ul style="margin:6px 0">${choices}</ul>` : ""}
        ${d.answer ? `<div>정답: <b>${escapeHtml(d.answer)}</b></div>` : ""}
        ${d.explanation ? `<div class="meta" style="white-space:pre-wrap; margin-top:6px">${escapeHtml(d.explanation)}</div>` : ""}
        ${actions}
      </div>`;
  }).join("");

  renderKindBalance(data.content, status);
  renderPager("d", data);

  // 목록을 다시 그리면 체크 상태는 사라진다(카드가 통째로 새로 만들어지므로).
  // 일부러 복원하지 않는다 — 방금 승인·거절로 목록이 바뀐 직후인데 예전 선택이 되살아나면
  // "내가 무엇을 고른 상태인지"가 화면과 어긋난다. 선택은 늘 지금 보이는 것에서 다시 한다.
  syncBulkBar();
}

/* ═══════════ 일괄 승인 ═══════════
 *
 * [왜 만들었나]
 * 배치가 매일 5~10건을 만들어 놓는데, 대부분은 읽어 보면 그냥 통과다. 그걸 카드마다
 * 버튼을 눌러 승인하면 한 건당 왕복 요청이 하나씩 붙고, 그때마다 목록이 다시 그려져
 * 읽던 자리를 잃는다. 읽는 일(사람)과 등록하는 일(서버)을 떼어 놓는 것이 이 기능이다.
 *
 * [일괄 거절은 없다]
 * 거절 사유가 다음 생성 프롬프트로 되먹여지는 구조라(docs/14) 사유 없는 무더기 거절은
 * 그 되먹임을 끊는다. 거절은 지금처럼 한 건씩, 사유와 함께 받는다.
 *
 * [선택은 서버가 아니라 화면이 정한다]
 * "검수 대기 전부 승인" 버튼을 두지 않았다. 그러면 화면을 연 뒤 배치가 새로 넣은 초안까지
 * 사람이 읽지도 않은 채 정식 문제가 된다. 체크한 것 = 눈으로 지나간 것이라는 관계를 지킨다. */

function initBulkApprove() {
  // 카드는 loadDrafts가 매번 새로 만든다. 체크박스마다 리스너를 붙이면 그릴 때마다 다시
  // 붙여야 하므로, 바뀌지 않는 부모(draftList) 한 곳에서 이벤트를 받는다(이벤트 위임).
  document.getElementById("draftList").addEventListener("change", e => {
    if (e.target.classList.contains("bulk-pick")) syncBulkBar();
  });

  document.getElementById("bulkAll").addEventListener("change", e => {
    pickBoxes().forEach(cb => { cb.checked = e.target.checked; });
    syncBulkBar();
  });

  document.getElementById("bulkApproveBtn").addEventListener("click", e => {
    // 되돌리기 어려운 동작이라 2단계 확인(admin-common.js의 armedDelete와 같은 방식).
    // 승인은 삭제는 아니지만 되돌리려면 등록된 문제를 일일이 지워야 해서 값이 비슷하다.
    const n = pickedIds().length;
    armedDelete(e.target, bulkApprove, `${n}건 정말 승인?`);
  });
}

/** 지금 화면의 체크박스들 — 검수 대기 목록일 때만 존재한다. */
function pickBoxes() {
  return Array.from(document.querySelectorAll("#draftList .bulk-pick"));
}

function pickedIds() {
  return pickBoxes().filter(cb => cb.checked).map(cb => Number(cb.value));
}

/** 선택 상태를 바에 반영한다 — 체크할 때마다, 목록을 다시 그릴 때마다 부른다. */
function syncBulkBar() {
  const boxes = pickBoxes();
  const picked = boxes.filter(cb => cb.checked).length;
  const bar = document.getElementById("bulkApproveBtn");

  document.getElementById("bulkBar").hidden = boxes.length === 0;
  document.getElementById("bulkCount").textContent = `${picked}건 선택됨 (전체 ${boxes.length}건)`;
  bar.disabled = picked === 0;
  bar.textContent = picked === 0 ? "선택 승인" : `선택 ${picked}건 승인`;
  // 전체 선택 체크는 "모두 골랐나"를 비추기만 한다 — 하나를 풀면 자동으로 풀린다
  document.getElementById("bulkAll").checked = boxes.length > 0 && picked === boxes.length;
}

/**
 * 선택한 초안들을 한 요청으로 승인한다.
 *
 * <p>응답은 <b>성공/실패가 섞여</b> 온다(서버가 건별 트랜잭션으로 처리하기 때문).
 * 그래서 "전부 됐다"와 "몇 건은 안 됐다"를 갈라 보여 준다 — 실패를 요약 숫자에만 묻어 두면
 * 다음 배치 때 같은 초안이 계속 남아 있는 이유를 아무도 모르게 된다.
 */
async function bulkApprove() {
  const ids = pickedIds();
  if (ids.length === 0) return;

  const btn = document.getElementById("bulkApproveBtn");
  const result = document.getElementById("bulkResult");
  btn.disabled = true;
  btn.textContent = `승인 중… (${ids.length}건)`;
  result.innerHTML = "";

  try {
    const res = await api("/api/admin/llm-problems/approve-batch", {
      method: "POST",
      body: JSON.stringify({ ids }),
    });

    if (res.failed.length === 0) {
      showOk(result, `${res.approved.length}건 승인 완료 — 정식 문제로 등록됐습니다.`);
    } else {
      // 실패 목록은 사라지지 않게 둔다(showOk는 2.5초 뒤 지워진다) — 읽고 손봐야 할 정보다
      result.innerHTML = `
        <div class="alert error" style="margin-top:10px">
          <b>${res.approved.length}건 승인, ${res.failed.length}건 실패</b>
          <ul style="margin:6px 0 0; padding-left:18px">
            ${res.failed.map(f => `<li>#${f.draftId} — ${escapeHtml(f.message)}</li>`).join("")}
          </ul>
        </div>`;
    }
    loadDrafts();
    refreshAdminBadges();
  } catch (e) {
    // 여기로 오는 것은 요청 자체가 실패한 경우(검증 위반·서버 장애). 건별 실패는 위에서 처리된다.
    showError(result, e);
  } finally {
    syncBulkBar();   // loadDrafts가 비동기라 버튼 문구를 여기서 한 번 더 맞춰 준다
  }
}

/**
 * 처리한 카드 <한 장만> 그 자리에서 결과로 바꾼다 — 목록을 다시 그리지 않는다(2026-08-29).
 *
 * <p><b>왜 다시 그리지 않나.</b> 승인 한 건마다 목록을 새로 그리면 읽던 자리를 잃는다.
 * 20장을 훑으며 처리하는 작업이라, 열 번째 카드를 승인할 때마다 맨 위로 되돌아가는 셈이었다.
 * 일괄 승인을 만들 때 이미 적어 둔 문제인데("읽는 일과 등록하는 일을 떼어 놓는다")
 * 정작 단건 경로에는 적용되지 않고 있었다.
 *
 * <p><b>처리한 카드를 남겨 두는 것이 맞나.</b> 맞다. 지금 필터가 "검수 대기"인데 승인된
 * 카드가 남아 있는 것은 목록과 서버가 어긋난 상태지만, 사람에게는 <b>방금 무엇을 했는지</b>가
 * 보이는 편이 낫다. 쪽을 옮기거나 필터를 건드리면 정리된다.
 */
function markCardDone(btn, resultHtml) {
  const card = btn.closest(".card");
  if (!card) return;
  card.classList.add("draft-done");
  // 체크박스만 걷어낸다(배지 #12는 남긴다). 처리한 것을 다시 고르면 일괄 승인이 409로 실패한다.
  card.querySelector(".bulk-pick")?.remove();
  // 버튼 줄과 거절 폼을 결과 한 줄로 갈아 끼운다.
  card.querySelectorAll(".row-actions, [id^=rejectForm-]").forEach(el => el.remove());
  card.insertAdjacentHTML("beforeend",
    `<div class="meta" style="margin-top:10px">${resultHtml}</div>`);
  syncBulkBar();   // 선택 가능한 카드가 줄었으니 "n건 선택됨"도 다시 센다
}

async function approveDraft(btn, id) {
  btn.disabled = true;
  try {
    const problem = await api(`/api/admin/llm-problems/${id}/approve`, { method: "POST" });
    markCardDone(btn, `✅ 승인됨 → 문제 #${problem.id}`);
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    showError(document.getElementById("reviewMessage"), e);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

/* ── 거절: 사유 입력 → 확정 ──
 * 사유를 받는 이유: 거절 사유는 다음 생성 프롬프트에 되먹여져 같은 실수를 줄인다(docs/14).
 * 예전에는 빈 바디로 바로 거절해서, 백엔드·DB·표시 코드가 다 준비돼 있는데도 사유가 항상 비었다.
 *
 * armedDelete(버튼 두 번 누르기) 대신 입력 폼을 쓰는 이유:
 *  - 폼이 펼쳐지고 "거절 확정"을 눌러야 하므로 2단계 확인이라는 안전장치는 그대로다.
 *  - 사유는 한 줄로 끝나지 않을 수 있어 입력란이 필요하고, 그렇다면 3초 후 원복되는
 *    armed 방식과는 섞이지 않는다(적는 동안 타이머가 끝나 버린다).
 * 브라우저 prompt()를 쓰지 않는 것은 이 프로젝트의 기존 원칙 그대로 — 팝업은 흐름을 끊고
 * 자동화·테스트를 막는다(admin-common.js의 armedDelete 주석 참고). */
function openReject(id) {
  document.getElementById(`rejectForm-${id}`).hidden = false;
  document.getElementById(`rejectReason-${id}`).focus();
}

function closeReject(id) {
  document.getElementById(`rejectForm-${id}`).hidden = true;
}

/** 칩을 눌러 사유를 채운다. 문구는 버튼의 글자에서 읽는다 — 따옴표가 든 문구도 안전하다. */
function fillReason(id, btn) {
  const input = document.getElementById(`rejectReason-${id}`);
  input.value = btn.textContent.trim();
  input.focus();
}

async function confirmReject(btn, id) {
  btn.disabled = true;
  const reason = document.getElementById(`rejectReason-${id}`).value.trim();
  try {
    // 사유가 비면 아예 키를 넘기지 않는다 — 백엔드가 빈 문자열을 null로 정규화하긴 하지만,
    // "안 적었다"를 빈 문자열로 보내는 것보다 필드를 빼는 쪽이 의도가 분명하다.
    await api(`/api/admin/llm-problems/${id}/reject`, {
      method: "POST",
      body: JSON.stringify(reason ? { reason } : {}),
    });
    // 거절 이력은 남는다(초안을 지우지 않는다, docs/13). 카드도 그 자리에 남겨
    // 무엇을 왜 버렸는지 보이게 둔다 — 사유를 적어 놓고 사라지면 확인할 길이 없다.
    markCardDone(btn, `거절됨${reason ? " — " + escapeHtml(reason) : " <b>(사유 없음 — 되먹임에 쓰이지 않습니다)</b>"}`);
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    showError(document.getElementById("reviewMessage"), e);
  }
}

/* 거절 취소 — 초안을 검수 대기로 되돌린다.
 *
 * 되돌린 뒤 목록을 다시 부르면 그 초안은 화면에서 사라진다(지금 보고 있는 필터가 "거절됨"이므로).
 * 없어진 것처럼 보여 당황스러울 수 있어 필터를 검수 대기로 바꿔 준다 —
 * 되돌린 것이 어디로 갔는지 눈으로 확인시켜 주는 편이 친절하다. */
async function restoreDraft(btn, id) {
  btn.disabled = true;
  try {
    await api(`/api/admin/llm-problems/${id}/restore`, { method: "POST" });
    document.getElementById("gStatusFilter").value = "PENDING";
    // 필터가 바뀌었으니 쪽수도 처음으로 — 거절됨 3쪽에서 되돌렸다고 검수 대기 3쪽을 열 이유가 없다.
    draftPage = 0;
    loadDrafts();
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    showError(document.getElementById("reviewMessage"), e);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

/* ═══════════ 개념 문서 초안 검수 (docs/15) ═══════════
 *
 * 본문을 마크다운으로 렌더링하지 않고 <pre>에 원문 그대로 보여주는 것이 의도적 선택이다.
 *  - 검수자가 봐야 하는 것은 "최종 화면"이 아니라 "저장될 내용"이다. 렌더링하면
 *    검증기가 지적한 HTML 태그가 눈앞에서 사라져(브라우저가 실행해 버려) 확인할 수가 없다.
 *  - 무엇보다 승인 전 문서는 아직 검증을 통과하지 않은 남의 글이다. 그걸 innerHTML로
 *    넣는 순간 관리자 페이지가 XSS 표적이 된다 — 우리가 막으려는 바로 그 문제다.
 * 마크다운 원문은 어차피 대부분 산문이라 그대로도 잘 읽힌다. */
async function loadDocDrafts() {
  const status = document.getElementById("gdStatusFilter").value;
  const data = await api(`/api/admin/llm-documents?status=${status}&size=${DOC_DRAFT_PAGE_SIZE}&page=${docDraftPage}`);
  const box = document.getElementById("docDraftList");

  if (stepBackIfEmpty(docDraftPage, data)) {
    docDraftPage--;
    return loadDocDrafts();
  }
  if (data.content.length === 0) {
    box.innerHTML = `<div class="empty-state">해당 상태의 초안이 없습니다.<br>
      개념 문서는 4일에 한 편만 만들어집니다(1일차 문서 → 2~4일차 그 문서로 문제).</div>`;
    box.onclick = null;
    renderPager("dd", data);
    return;
  }
  box.innerHTML = data.content.map(d => {
    const blocking = d.checks.filter(c => c.severity === "BLOCKING");
    const warnings = d.checks.filter(c => c.severity === "WARNING");

    // 차단은 눈에 띄게, 경고는 옆에 조용히 — 둘을 같은 모양으로 보여주면
    // "빨간 게 늘 있으니 그러려니" 하게 되어 차단의 의미가 사라진다.
    const blockingBox = blocking.length ? `
      <div class="alert error" style="margin:10px 0">
        <b>승인 불가</b><ul style="margin:6px 0 0; padding-left:18px">
          ${blocking.map(c => `<li>${escapeHtml(c.message)}</li>`).join("")}
        </ul>
      </div>` : "";
    const warningBox = warnings.length ? `
      <div class="meta" style="margin:8px 0">
        ${warnings.map(c => `⚠ ${escapeHtml(c.message)}`).join("<br>")}
      </div>` : "";

    const actions = d.status === "PENDING" ? `
      <div class="row-actions" style="margin-top:10px">
        <button onclick="approveDocDraft(this, ${d.id})" ${d.blocked ? "disabled" : ""}>승인 → 문서 등록</button>
        <button class="danger" onclick="openDocReject(${d.id})">거절</button>
      </div>
      <div id="docRejectForm-${d.id}" hidden style="margin-top:10px">
        <input id="docRejectReason-${d.id}" type="text" maxlength="500"
               placeholder="거절 사유 (선택) — 예: 캐시 무효화 설명이 사실과 다름"
               onkeydown="if (event.key === 'Enter') confirmDocReject(document.getElementById('docRejectConfirm-${d.id}'), ${d.id})"
               style="width:100%">
        <div class="row-actions" style="margin-top:6px">
          <button id="docRejectConfirm-${d.id}" class="danger" onclick="confirmDocReject(this, ${d.id})">거절 확정</button>
          <button onclick="closeDocReject(${d.id})">취소</button>
        </div>
      </div>` : `
      <div class="meta" style="margin-top:10px">
        ${d.status === "APPROVED"
          ? `승인됨 → <a href="/document.html?slug=${encodeURIComponent(d.slug)}">문서 보기</a> (ID ${d.approvedDocumentId})`
          : `거절됨${d.rejectReason ? " — " + escapeHtml(d.rejectReason) : ""}`}
      </div>
      ${d.status === "REJECTED" ? `
      <!-- 문서를 되돌리면 배치의 "이 문서로는 문제를 만들지 마라" 목록에서도 빠진다.
           그래서 안내 문구를 함께 둔다 — 되돌리기의 파급이 검수함 밖까지 미치는 유일한 경우다. -->
      <div class="row-actions" style="margin-top:6px">
        <button class="btn-outline" onclick="restoreDocDraft(this, ${d.id})">검수함으로 되돌리기</button>
        <span class="meta">되돌리면 이 문서로 다시 문제를 만들 수 있게 됩니다</span>
      </div>` : ""}`;

    return `
      <div class="card" style="margin-bottom:12px">
        <div>
          <span class="badge gray">#${d.id}</span>
          <span class="badge gray">${escapeHtml(d.domainName)}</span>
          ${d.tags.map(t => `<span class="badge gray">${escapeHtml(t)}</span>`).join("")}
          <span class="meta">${escapeHtml(d.model)} · ${d.contentLength}자</span>
        </div>
        <h3 style="margin:10px 0 2px">${escapeHtml(d.title)}</h3>
        <div class="meta">/${escapeHtml(d.slug)}</div>
        ${blockingBox}${warningBox}
        ${sectionOutlineOf(d.contentMd)}
        <div class="doc-preview-bar">
          <span class="meta">본문 원문 (마크다운)</span>
          <button class="btn-outline" data-action="expand" data-target="pre-${d.id}">전체 펼치기</button>
        </div>
        <pre class="doc-preview" id="pre-${d.id}">${escapeHtml(d.contentMd)}</pre>
        ${actions}
      </div>`;
  }).join("");

  /* 본문 펼치기 — 기본은 60vh까지만 보이고, 누르면 제한을 푼다.
   * 왜 기본을 짧게 두나: 초안이 여러 건일 때 전부 4,000자로 펼쳐져 있으면 목록을
   * 훑는 것 자체가 불가능하다. 반대로 짧게만 두면 4,000자 중 화면에 들어오는 건
   * 앞부분뿐이라 뒤쪽 절(면접 질문 등)을 검수할 수가 없었다 — 그래서 둘 다 준다. */
  box.onclick = e => {
    const btn = e.target.closest("button[data-action=expand]");
    if (!btn) return;
    const pre = document.getElementById(btn.dataset.target);
    const expanded = pre.classList.toggle("expanded");
    btn.textContent = expanded ? "접기" : "전체 펼치기";
  };

  renderPager("dd", data);
}

/**
 * 본문에서 <b>절 제목만</b> 뽑아 한 줄로 보여 준다 — 2026-08-29 신설.
 *
 * <p><b>왜 필요한가.</b> 문서 한 편이 12,000자가 넘는데 이 화면은 그것을 {@code <pre>} 원문으로
 * 보여 준다. 렌더링하지 않는 판단은 옳다 — 승인 전 문서를 innerHTML에 넣는 순간 관리자
 * 화면이 XSS 표적이 된다. 다만 그 대가로 "어디에 무엇이 있는지"를 알려면 전체를 펼쳐
 * 훑는 수밖에 없었다. 목차는 <b>원문을 건드리지 않고</b> 그 질문에만 답한다.
 *
 * <p><b>{@code ##}만 뽑는다.</b> {@code ###}는 본론 안의 소제목이라 목차에 넣으면 오히려
 * 길어진다. 서버의 필수 절 검사와 인용 검사도 {@code ##} 단위라 기준이 같다.
 *
 * <p>제목은 사람이 아니라 <b>모델이 쓴 글</b>이므로 반드시 escapeHtml을 거친다 —
 * 이 화면이 원문을 렌더링하지 않는 이유가 그대로 여기에도 적용된다.
 */
function sectionOutlineOf(contentMd) {
  const sections = (contentMd ?? "").split("\n")
    .filter(line => line.startsWith("## "))
    .map(line => line.slice(3).trim())
    .filter(Boolean);
  if (sections.length === 0) return "";
  return `<div style="margin:8px 0">
    <span class="meta">절 ${sections.length}개:</span>
    ${sections.map(t => `<span class="badge gray">${escapeHtml(t)}</span>`).join(" ")}
  </div>`;
}

async function approveDocDraft(btn, id) {
  btn.disabled = true;
  try {
    const doc = await api(`/api/admin/llm-documents/${id}/approve`, { method: "POST" });
    // 문서 카드는 본문 미리보기 때문에 화면을 거의 채운다 — 목록을 다시 그리면
    // 스크롤이 통째로 튄다. 문제 쪽과 같은 이유로 카드만 바꾼다.
    markCardDone(btn, `✅ 승인됨 → <a href="/document.html?slug=${encodeURIComponent(doc.slug)}">문서 보기</a>`);
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    // slug 중복(DOC_002)이 여기서 자주 난다 — 같은 주제를 다시 뽑으면 slug도 같아지기 때문.
    // 메시지를 그대로 띄우고 화면 위로 올려 준다(카드가 길어 아래쪽 오류는 안 보인다).
    alertDocError(e);
  }
}

function openDocReject(id) {
  document.getElementById(`docRejectForm-${id}`).hidden = false;
  document.getElementById(`docRejectReason-${id}`).focus();
}

function closeDocReject(id) {
  document.getElementById(`docRejectForm-${id}`).hidden = true;
}

async function confirmDocReject(btn, id) {
  btn.disabled = true;
  const reason = document.getElementById(`docRejectReason-${id}`).value.trim();
  try {
    await api(`/api/admin/llm-documents/${id}/reject`, {
      method: "POST",
      body: JSON.stringify(reason ? { reason } : {}),
    });
    // 거절 이력은 남는다(초안을 지우지 않는다)
    markCardDone(btn, `거절됨${reason ? " — " + escapeHtml(reason) : ""} <span class="meta">— 이 문서로는 문제를 만들지 않습니다</span>`);
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    alertDocError(e);
  }
}

async function restoreDocDraft(btn, id) {
  btn.disabled = true;
  try {
    await api(`/api/admin/llm-documents/${id}/restore`, { method: "POST" });
    document.getElementById("gdStatusFilter").value = "PENDING";
    docDraftPage = 0;  // 필터가 바뀌면 쪽수도 처음으로
    loadDocDrafts();   // 필터를 바꿨으니 지금 다시 불러온다
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    alertDocError(e);
  }
}

/* 오류를 문서 목록 맨 위에 끼워 넣는다. 문제 쪽처럼 고정된 메시지 자리(reviewMessage)를 쓰지 않는
 * 이유는 그 자리가 화면 맨 위 생성 폼에 붙어 있어서다 — 문서 오류를 거기에 띄우면
 * 스크롤을 한참 올려야 보인다. */
function alertDocError(e) {
  const box = document.getElementById("docDraftList");
  const div = document.createElement("div");
  div.className = "alert error";
  div.textContent = e.message ?? "요청에 실패했습니다.";
  box.prepend(div);
  document.getElementById("document-drafts").scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
