<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 사용자 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <h1>사용자</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <form class="filters" id="searchForm">
      <div class="field">
        <label for="q">아이디 또는 닉네임</label>
        <input type="text" id="q" maxlength="20" placeholder="일부만 적어도 됩니다">
      </div>
      <label class="pw-reveal" style="margin:0 0 10px">
        <input type="checkbox" id="suspendedOnly"> 정지 중인 사람만
      </label>
      <button type="submit">찾기</button>
    </form>

    <!-- 표·전체 건수·페이저·빈 상태는 admin-table.js가 그린다. -->
    <div id="userList"></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-table.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 사용자 목록 — 가입한 사람을 최근 가입부터 한 줄씩.
 *   GET /api/admin/users?q=&suspendedOnly=&page=
 *
 * 이 화면에서는 찾기만 한다. 정지 같은 관리는 행을 눌러 들어간 상세(user.html)에서 한다 —
 * 목록의 한 줄에는 "이 사람을 정지해도 되는가"를 판단할 근거가 없다. */
if (initAdminPage("users")) {
  const params = new URLSearchParams(location.search);
  document.getElementById("q").value = params.get("q") || "";
  document.getElementById("suspendedOnly").checked = params.get("suspendedOnly") === "true";

  document.getElementById("searchForm").addEventListener("submit", e => {
    e.preventDefault();
    loadUsers({ page: 0 });
  });
  document.getElementById("suspendedOnly").addEventListener("change", () => loadUsers({ page: 0 }));
  loadUsers();
}

/* 버튼을 두지 않는다 — 행 전체가 상세로 가는 길이다(문제 목록과 같은 방식). */
function loadUsers(opts) {
  return renderAdminTable("#userList", {
    url: "/api/admin/users",
    filters: () => {
      const q = document.getElementById("q").value.trim();
      return (q ? `&q=${encodeURIComponent(q)}` : "")
        + (document.getElementById("suspendedOnly").checked ? "&suspendedOnly=true" : "");
    },
    columns: [
      { head: "아이디", cell: u => escapeHtml(u.username) },
      { head: "닉네임", cell: u => u.nickname ? escapeHtml(u.nickname) : `<span class="meta">(없음)</span>` },
      { head: "권한", width: "90px", cell: u => u.role === "ADMIN" ? `<span class="badge">관리자</span>` : "사용자" },
      { head: "가입일", width: "150px", cell: u => formatDate(u.createdAt) },
      { head: "상태", width: "200px", cell: statusCell },
    ],
    onRowClick: u => { location.href = "/admin/user.html?id=" + u.id; },
    emptyText: "조건에 맞는 사용자가 없습니다 — 검색어를 지우면 전체가 보입니다.",
  }, opts);
}

function statusCell(u) {
  if (!u.suspended) return `<span class="meta">정상</span>`;
  return `<span class="badge orange">정지 중</span> <span class="meta">${
    u.indefinite ? "무기한" : formatDate(u.suspendedUntil) + "까지"}</span>`;
}
</script>
</body>
</html>
