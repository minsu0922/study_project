<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 사용자 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <h1>사용자</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <!-- 필터 줄은 문제 관리 화면과 같은 모양이다. 치면 바로 찾으므로 찾기 단추는 두지 않는다 -->
    <div class="filters" style="margin-bottom:12px">
      <div class="field field-search"><label for="q">검색 <span class="meta">(아이디·닉네임)</span></label>
        <input type="search" id="q" maxlength="20" placeholder="일부만 적어도 됩니다"></div>
      <div class="field"><label for="fuStatus">상태</label>
        <select id="fuStatus">
          <option value="">전체</option>
          <option value="true">정지 중</option>
        </select>
      </div>
      <div class="field field-reset"><label>&nbsp;</label><button id="fuResetBtn" class="btn-outline">필터 지우기</button></div>
    </div>

    <!-- 표·전체 건수·페이저·빈 상태는 admin-table.js가 그린다. -->
    <div id="userList"></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-table.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 사용자 목록 — 가입한 사람을 최근 가입부터 한 줄씩.
 *   GET /api/admin/users?q=&suspendedOnly=&page=
 *
 * 이 화면에서는 찾기만 한다. 정지 같은 관리는 행을 눌러 들어간 상세(user.html)에서 한다 —
 * 목록의 한 줄에는 "이 사람을 정지해도 되는가"를 판단할 근거가 없다. */
if (initAdminPage("users")) {
  document.getElementById("fuStatus").value = param("suspendedOnly") === "true" ? "true" : "";
  wireFilterBar({
    search: "q", selects: ["fuStatus"], reset: "fuResetBtn",
    onChange: () => loadUsers({ page: 0 }),
  });
  loadUsers();
}

/* 버튼을 두지 않는다 — 행 전체가 상세로 가는 길이다(문제 목록과 같은 방식). */
function loadUsers(opts) {
  return renderAdminTable("#userList", {
    url: "/api/admin/users",
    filters: () => filterQuery({ q: "q", suspendedOnly: "fuStatus" }),
    columns: [
      { head: "아이디", cell: u => escapeHtml(u.username) },
      { head: "닉네임", cell: u => u.nickname ? escapeHtml(u.nickname) : `<span class="meta">(없음)</span>` },
      { head: "권한", width: "90px", cell: u => u.role === "ADMIN" ? `<span class="badge">관리자</span>` : "사용자" },
      { head: "가입일", width: "150px", cell: u => formatDate(u.createdAt) },
      { head: "상태", width: "200px", cell: statusCell },
    ],
    onRowClick: u => { location.href = "/admin/user.html?id=" + u.id; },
    emptyText: "조건에 맞는 사용자가 없습니다 — 필터를 지우면 전체가 보입니다.",
  }, opts);
}

function statusCell(u) {
  if (!u.suspended) return `<span class="meta">정상</span>`;
  return `<span class="badge orange">정지 중</span> <span class="meta">${
    u.indefinite ? "무기한" : formatDate(u.suspendedUntil) + "까지"}</span>`;
}
</script>
</body>
</html>
