<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 제보 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지.
   자세한 이유는 사용자 화면의 같은 주석 참고. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <!-- 제목은 <기둥 메뉴와 같은 말>이다. 눌러서 간 곳의 이름이 메뉴와 다르면
       "여기가 맞나"를 한 번 되묻게 된다.

       예전에는 일곱 화면이 전부 "관리자"였다. 콘솔이 탭 하나짜리 화면이던 시절의
       잔재인데, 지금은 띠에 "csquiz 관리"가 있고 기둥이 현재 화면을 표시하므로
       같은 말을 세 번째로 하는 셈이었다. 게다가 스크린리더의 제목 목록에서
       일곱 화면이 모두 "관리자"라 어느 화면인지 구별할 수 없었다. -->
  <h1>제보</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>

    <!-- 문제가 틀렸다는 말은 두 군데로 들어온다: 제보 버튼과 토론방의 "오류 지적" 글.
         한 화면에 모은다 — 따로 두면 토론방 쪽은 누가 찾아가 보기 전까지 묻힌다. -->
    <div class="tabs" id="sourceTabs">
      <button class="tab-btn active" data-source="reports">제보 <span id="reportsCount"></span></button>
      <button class="tab-btn" data-source="errata">토론방 오류 지적 <span id="errataCount"></span></button>
    </div>

    <!-- 이 화면이 하는 일과 안 하는 일을 맨 위에 적는다. 검수함과 나란히 있어 같은 화면으로
         읽히기 쉬운데, 여기서 누르는 버튼은 <문제를 고치지 않는다>. 그 오해를 그대로 두면
         "인정했는데 왜 문제가 그대로지"가 된다. -->
    <div class="alert info" id="reportsInfo" style="margin-bottom:16px">
      학습자가 올린 문제 오류 제보입니다. <b>인정</b>하면 그 사유가 다음 문제 생성 프롬프트에
      되먹여집니다(거절 사유와 같은 통로 · docs/14). <b>문제 자체는 고쳐지지 않습니다</b> —
      수정은 각 줄의 <b>문제 고치기</b>로 넘어가서 하세요.
    </div>

    <div class="tabs" id="statusTabs">
      <button class="tab-btn active" data-status="PENDING">대기</button>
      <button class="tab-btn" data-status="ACCEPTED">인정</button>
      <button class="tab-btn" data-status="DISMISSED">기각</button>
      <button class="tab-btn" data-status="">전체</button>
    </div>

    <!-- 토론방 글에는 인정·기각이 없다. 운영진이 댓글로 답했는지가 처리 표시다 —
         그 답은 글쓴이도 봐야 하므로 따로 적는 메모보다 댓글이 맞다. -->
    <div id="errataBar" hidden>
      <div class="alert info" style="margin-bottom:12px">
        토론방에 "오류 지적" 말머리로 올라온 글입니다. 맞는 지적이면 <b>문제 고치기</b>로 고치고,
        <b>글 보기</b>로 들어가 댓글로 답해 주세요. 운영진 댓글이 달린 글은 "답 전" 목록에서 빠집니다.
      </div>
      <div class="tabs" id="errataTabs">
        <button class="tab-btn active" data-unanswered="true">답 전</button>
        <button class="tab-btn" data-unanswered="false">전체</button>
      </div>
    </div>

    <div id="rMessage"></div>
    <div id="rList"></div>

    <!-- 전체 건수 + 페이저. 마크업은 admin-table.js의 renderAdminPager가 만든다 —
         쪽 넘기기는 목록의 생김새와 무관한 동작이라 카드든 표든 같은 것을 쓴다. -->
    <div class="pager-row" id="rPagerRow"></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-table.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 제보함 — V17.
 *
 * [왜 검수함과 별도 화면인가]
 * 하는 일은 닮았지만(읽고 판정한다) 판정의 뜻이 다르다. 검수는 "이걸 출제할까"이고
 * 여기는 "이미 출제된 것이 틀렸나"다. 후자는 판정 뒤에 <문제를 고치는 일>이 딸려 오는데,
 * 그 흐름을 검수함에 섞으면 20장을 훑어 넘기는 리듬이 매번 끊긴다.
 *
 * [기본 탭이 대기인 이유]
 * 이 화면을 여는 이유는 하나다 — 배지에 숫자가 떠서. 열자마자 그 숫자에 해당하는 목록이
 * 나와야 하고, 다 처리하면 빈 화면이 "오늘 할 일 없음"을 말한다(검수함과 같은 판단).
 */
let source = "reports";      // "reports"(제보) | "errata"(토론방 오류 지적)
let status = "PENDING";
let unanswered = "true";
let page = 0;

/* 메뉴의 배지는 두 쪽을 합친 수다. 어느 쪽에 할 일이 있는지는 탭에 따로 적는다 —
   합친 수만 보고 들어와 첫 탭이 비어 있으면 숫자가 틀린 것으로 읽힌다. */
document.addEventListener("admin:counts", e => {
  document.getElementById("reportsCount").textContent = e.detail.reports || "";
  document.getElementById("errataCount").textContent = e.detail.errata || "";
});

if (initAdminPage("reports")) {
  document.getElementById("statusTabs").addEventListener("click", e => {
    const btn = e.target.closest("[data-status]");
    if (!btn) return;
    document.querySelectorAll("#statusTabs .tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    status = btn.dataset.status;
    page = 0;
    load();
  });
  document.getElementById("sourceTabs").addEventListener("click", e => {
    const btn = e.target.closest("[data-source]");
    if (!btn || btn.dataset.source === source) return;
    document.querySelectorAll("#sourceTabs .tab-btn").forEach(b => b.classList.toggle("active", b === btn));
    source = btn.dataset.source;
    document.getElementById("reportsInfo").hidden = source !== "reports";
    document.getElementById("statusTabs").hidden = source !== "reports";
    document.getElementById("errataBar").hidden = source !== "errata";
    page = 0;
    load();
  });
  document.getElementById("errataTabs").addEventListener("click", e => {
    const btn = e.target.closest("[data-unanswered]");
    if (!btn) return;
    document.querySelectorAll("#errataTabs .tab-btn").forEach(b => b.classList.toggle("active", b === btn));
    unanswered = btn.dataset.unanswered;
    page = 0;
    load();
  });
  load();
}

async function load() {
  const msg = document.getElementById("rMessage");
  msg.innerHTML = "";
  try {
    if (source === "errata") {
      render(await api("/api/admin/errata-posts?" + new URLSearchParams({ unanswered, page })));
      return;
    }
    const params = new URLSearchParams({ page });
    if (status) params.set("status", status);
    const data = await api("/api/admin/reports?" + params);
    render(data);
  } catch (e) {
    showError(msg, e);
  }
}

function render(data) {
  const list = document.getElementById("rList");
  if (data.content.length === 0) {
    list.innerHTML = `<div class="card">${emptyText()}</div>`;
  } else {
    list.innerHTML = data.content.map(source === "errata" ? errataCard : card).join("");
  }

  /* 페이저는 표 목록과 <같은 것>을 쓴다. 이 화면은 카드 목록이지만(제보는 본문이 긴
   * 글이라 칸에 넣으면 잘린다) 쪽 넘기기는 목록의 생김새와 무관한 동작이다.
   *
   * renderAdminPager는 마크업만 만들고 동작은 안 붙인다 — 한 화면에 목록이 둘인 경우가
   * 있어(검수 화면) "어느 목록의 쪽을 넘기는가"는 부르는 쪽이 정해야 한다.
   *
   * 전체 건수를 왼쪽에 늘 적는다. 상태 탭을 옮겼을 때 "몇 건으로 좁혀졌나"가 곧 답인데,
   * 쪽수만으로는 알 수 없다(쪽이 하나면 페이저 자체가 숨는다). */
  const row = document.getElementById("rPagerRow");
  row.innerHTML = `
    <span class="meta">전체 ${data.totalElements}건</span>
    <span class="spacer"></span>
    ${renderAdminPager(data)}`;
  row.querySelectorAll("[data-page]").forEach(btn => {
    btn.addEventListener("click", () => { page = Number(btn.dataset.page); load(); });
  });
}

function emptyText() {
  if (source === "errata") {
    return unanswered === "true" ? "답을 기다리는 오류 지적 글이 없습니다. 👍" : "오류 지적 글이 없습니다.";
  }
  return status === "PENDING" ? "대기 중인 제보가 없습니다. 👍" : "해당하는 제보가 없습니다.";
}

/**
 * 토론방 오류 지적 글 한 장. 본문을 전문으로 싣는 이유는 제보 카드와 같다 — 맞는 지적인지를 여기서 판단한다.
 * 글쓴이를 보여 주는 점은 제보와 다르다. 토론방 글은 이미 닉네임을 걸고 공개된 글이다.
 */
function errataCard(p) {
  return `
    <div class="card ${p.staffReplied ? "draft-done" : ""}">
      <div style="margin-bottom:6px">
        <span class="badge ${p.staffReplied ? "green" : "orange"}">${p.staffReplied ? "답함" : "답 전"}</span>
        <span class="badge gray">댓글 ${p.commentCount}</span>
        <span class="meta">${formatDate(p.createdAt)}</span>
      </div>

      <div class="meta">문제: ${escapeHtml(p.problemTitle || "(제목 없음)")}
        · 글쓴이: ${escapeHtml(p.nickname || "탈퇴한 사용자")}</div>
      <h3>${escapeHtml(p.title)}</h3>
      <div style="white-space:pre-wrap; overflow-wrap:anywhere">${escapeHtml(p.body)}</div>

      <div class="row-actions" style="margin-top:10px">
        <a class="btn btn-outline" href="/admin/problems.html?edit=${p.problemId}"
           target="_blank" rel="noopener">문제 고치기 ↗</a>
        <a class="btn btn-outline" href="/post.html?id=${p.id}"
           target="_blank" rel="noopener">글 보기 ↗</a>
      </div>
    </div>`;
}

/**
 * 제보 한 장.
 *
 * <p>지문을 <b>전문</b>으로 싣는다. "이 지적이 맞나"를 여기서 판단해야 하는데 앞부분만
 * 잘라 두면 매번 문제 화면으로 건너가게 된다 — 판단에 필요한 것은 아끼지 않는다.
 *
 * <p>제보자는 보여 주지 않는다(서버가 아예 안 내려준다). 누가 냈는지가 보이면 판단이
 * 내용이 아니라 사람에 끌린다.
 */
function card(r) {
  const done = r.status !== "PENDING";
  // 처리된 카드의 모양은 검수함과 같은 클래스를 쓴다(.draft-done — 흐림 + 왼쪽 띠).
  // 이름에 draft가 들어 있지만 뜻은 "이 카드는 처리가 끝났다"이고, 두 화면에서 같은
  // 상태가 같은 모양으로 보여야 한다. 이름만 맞추려고 같은 규칙을 하나 더 만들지 않는다.
  return `
    <div class="card ${done ? "draft-done" : ""}" id="report-${r.id}">
      <div style="margin-bottom:6px">
        <span class="badge ${statusClass(r.status)}">${statusLabel(r.status)}</span>
        <span class="badge">${escapeHtml(r.reasonLabel)}</span>
        <span class="meta">${formatDate(r.createdAt)}</span>
      </div>

      <h3>${escapeHtml(r.problemTitle || "(제목 없음)")}</h3>
      <div class="meta" style="white-space:pre-wrap;margin-bottom:8px">${escapeHtml(r.question)}</div>

      ${r.detail ? `<div class="alert info" style="margin:8px 0">
        제보자 한마디: ${escapeHtml(r.detail)}</div>` : ""}
      ${r.adminNote ? `<div class="meta">처리 메모: ${escapeHtml(r.adminNote)}</div>` : ""}

      ${done ? "" : `<input id="note-${r.id}" type="text" maxlength="500"
             placeholder="처리 메모 (선택) — 특히 기각할 때 '왜 아니라고 봤나'를 남겨 두세요"
             style="margin-top:10px">`}

      <div class="row-actions" style="margin-top:10px">
        <!-- 문제 고치기를 <판정 버튼 옆에> 둔다. 인정한 뒤 무엇을 해야 하는지가
             그 자리에 보이지 않으면, 인정만 눌러 두고 문제는 그대로 남는다.

             [새 탭으로 연다 — 2026-09-08]
             버튼이었고 같은 탭에서 이동했다. ↗는 "밖으로 나간다"는 표시인데 실제 동작이
             달랐고, 무엇보다 <제보함은 여러 건을 훑으며 처리하는 화면>이다. 한 건 고치러
             갔다 오면 목록 맨 위부터 다시 훑어야 하고, 옆 카드에 적어 두던 처리 메모도
             사라진다(이 화면이 목록을 다시 그리지 않는 이유와 같은 문제다).
             퀴즈 플레이어의 개념 문서 링크가 새 탭인 것과 같은 판단이다.

             button이 아니라 a인 이유: 가운데 클릭·Ctrl 클릭·"새 창에서 열기"가 공짜로 따라온다.
             그 셋은 여러 건을 처리하는 사람이 실제로 쓰는 동작이다. -->
        <a class="btn btn-outline" href="/admin/problems.html?edit=${r.problemId}"
           target="_blank" rel="noopener">문제 고치기 ↗</a>
        ${done ? "" : `
          <button onclick="resolve(${r.id}, 'accept', this)">인정</button>
          <button class="btn-outline" onclick="resolve(${r.id}, 'dismiss', this)">기각</button>`}
      </div>
    </div>`;
}

function statusLabel(s) {
  return s === "PENDING" ? "대기" : s === "ACCEPTED" ? "인정" : "기각";
}
function statusClass(s) {
  return s === "PENDING" ? "orange" : s === "ACCEPTED" ? "green" : "gray";
}

/**
 * 인정·기각.
 *
 * <p><b>목록을 다시 그리지 않는다.</b> 처리한 카드만 그 자리에서 바꾼다(검수함의
 * markCardDone과 같은 방식) — 여러 건을 훑으며 처리하는 화면에서 매번 다시 그리면
 * 읽던 자리를 잃는다.
 *
 * <p>배지는 갱신한다. 대기 수가 줄어든 것이 메뉴에 바로 보여야 "얼마나 남았나"를
 * 화면을 옮기지 않고 알 수 있다.
 */
async function resolve(id, action, btn) {
  const note = document.getElementById("note-" + id)?.value ?? "";
  btn.disabled = true;
  try {
    const updated = await api(`/api/admin/reports/${id}/${action}`, {
      method: "POST",
      body: JSON.stringify({ note }),
    });
    document.getElementById("report-" + id).outerHTML = card(updated);
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    showError(document.getElementById("rMessage"), e);
  }
}
</script>
</body>
</html>
