<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 주제 상세 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <p class="meta"><a id="backLink" href="/admin/topics.html">← 주제 대기열</a></p>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <div id="tdMessage"></div>
    <div class="card topic-head" id="head" hidden></div>
    <div class="card" id="brief" hidden></div>

    <!-- 수정은 이 화면에서 한다. 목록으로 보내면 저장 뒤 보던 지시로 돌아올 길이 없었다 -->
    <div class="card topic-edit" id="editCard" hidden>
      <h2>주제 수정</h2>
      <div class="filters">
        <div class="field"><label for="eDomain">분야</label><select id="eDomain"></select></div>
        <div class="field" style="flex:1 1 320px"><label for="eTopic">주제 범위</label><input type="text" id="eTopic"></div>
      </div>
      <!-- 줄바꿈이 곧 칸 구분이라 한 줄 input이면 지시가 깨진다 -->
      <div class="field"><label for="eMemo">작성 지시 <span class="meta">("핵심 개념:"과 "설명할 것:" 줄이 둘 다 있어야 모델에 실립니다)</span></label>
        <textarea id="eMemo" rows="9" style="width:100%"></textarea></div>
      <div class="topic-actions">
        <button id="eSaveBtn">저장</button>
        <button id="eCancelBtn" class="btn-outline">취소</button>
      </div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 주제 한 줄 — 작성 지시를 칸별로 넓게 보고, 수정·복사·이력 지우기·삭제를 한다.
 *   GET    /api/admin/topic-queue/{id}
 *   PATCH  /api/admin/topic-queue/{id}
 *   POST   /api/admin/topic-queue/{id}/reset-usage
 *   DELETE /api/admin/topic-queue/{id}
 * 목록(topics.html)은 순서만 다룬다. */
const topicId = param("id");
const message = document.getElementById("tdMessage");

/** mermaid 이름 → 화면 이름. 메모의 "그림:" 줄 끝 괄호에 적는다. */
const DIAGRAM_KINDS = { "flowchart": "흐름도", "sequenceDiagram": "순서도", "stateDiagram-v2": "상태도" };

/** 지금 보고 있는 주제. 수정 폼을 채우고 분야가 바뀌었는지 볼 때 쓴다. */
let current = null;

/** 다음 문서일. 다음 차례인 개념 주제에만 붙인다. 못 받아도 화면은 그대로 뜬다. */
let nextDocumentDate = "";

if (initAdminPage("topics")) {
  if (!/^\d+$/.test(topicId || "")) {
    showErrorAlert(message, "어느 주제인지 알 수 없습니다. 목록에서 다시 들어와 주세요.");
  } else {
    wireEditForm();
    api("/api/admin/batch-status")
      .then(s => { nextDocumentDate = s.nextDocumentDate || ""; })
      .catch(() => {})
      .finally(reload);
  }
}

function reload() {
  return api(`/api/admin/topic-queue/${topicId}`).then(render).catch(e => showError(message, e));
}

function topicFile(t) {
  return t.kind === "CODE" ? "generated/_code-topics.json" : "generated/_topics.json";
}

function render(t) {
  current = t;
  const list = "/admin/topics.html" + (t.kind === "CODE" ? "?kind=CODE" : "");
  document.getElementById("backLink").href = list;
  document.title = `관리자 · ${t.topic} — csquiz`;

  const used = !!t.lastUsedAt;
  const when = t.next && t.kind === "CONCEPT" && nextDocumentDate ? ` · ${escapeHtml(nextDocumentDate)}` : "";
  const head = document.getElementById("head");
  head.innerHTML = `
    <div>
      <span class="badge gray">${escapeHtml(t.domainLabel)}</span>
      ${t.kind === "CODE" ? `<span class="badge gray">코드 문제 주제</span>` : ""}
      ${t.next ? `<span class="badge orange">다음 차례${when}</span>` : ""}
    </div>
    <h1>${escapeHtml(t.topic)}</h1>
    <div class="topic-facts">
      <span>꺼낼 차례 <b>${t.position}번째</b></span>
      <span>사용 <b>${used ? `${t.usedCount}편 · 마지막 ${escapeHtml(t.lastUsedAt)}` : "아직 안 씀"}</b></span>
    </div>
    <div class="topic-actions">
      <button class="btn-outline" id="editBtn">수정</button>
      <button class="btn-outline" id="copyBtn" title="Actions 수동 실행에 넣을 값을 복사합니다">실행값 복사</button>
      ${used ? `<button class="btn-outline" id="resetBtn" title="사용 기록을 지워 '아직 안 씀'으로 되돌립니다">이력 지우기</button>` : ""}
      <button class="danger" id="deleteBtn">삭제</button>
    </div>`;
  head.hidden = false;

  document.getElementById("editBtn").addEventListener("click", openEdit);
  document.getElementById("copyBtn").addEventListener("click", () => copyWorkflowInputs(t));
  // 배치는 문서를 만들기로 정한 때 기록을 찍는다. 그 문서가 거절되면 기록만 남아 차례가
  // 영영 안 돌아오므로 되돌릴 문이 필요하다. 잃는 것이 날짜 한 칸이라 2단계 확인은 걸지 않는다.
  document.getElementById("resetBtn")?.addEventListener("click", async () => {
    try {
      await api(`/api/admin/topic-queue/${t.id}/reset-usage`, { method: "POST" });
      showOk(message, `사용 기록을 지웠습니다. ${topicFile(t)}을 커밋하세요.`);
      await reload();
    } catch (err) {
      showError(message, err);
    }
  });
  // 2단계 확인 — 다시 적으면 그만이지만, 몇 편 썼는지의 기록은 되살릴 수 없다
  document.getElementById("deleteBtn").addEventListener("click", e =>
    armedAction(e.currentTarget, async () => {
      try {
        await api(`/api/admin/topic-queue/${t.id}`, { method: "DELETE" });
        // 목록이 "파일을 커밋하세요" 안내를 띄우게 표시를 달아 보낸다
        location.href = list + (list.includes("?") ? "&" : "?") + "deleted=1";
      } catch (err) {
        showError(message, err);
      }
    }));

  renderBrief(t.memo);
}

/* ═══════════ 수정 ═══════════ */

function wireEditForm() {
  // 분야 목록은 서버 응답을 기다렸다 다시 채운다. 폴백 목록에는 방금 추가한 분야가 없다
  const fill = () => {
    const sel = document.getElementById("eDomain");
    const keep = sel.value;
    fillDomainSelect(sel);
    if (keep) sel.value = keep;
  };
  fill();
  domainsReady.then(fill);
  document.getElementById("eSaveBtn").addEventListener("click", saveEdit);
  document.getElementById("eCancelBtn").addEventListener("click", closeEdit);
}

function openEdit() {
  document.getElementById("eDomain").value = current.domain;
  document.getElementById("eTopic").value = current.topic;
  document.getElementById("eMemo").value = current.memo || "";
  showEditing(true);
  document.getElementById("eTopic").focus();
}

function closeEdit() {
  showEditing(false);
}

/** 수정 중에는 위 카드 둘을 감춘다. 같은 값이 두 벌 보이면 어느 쪽이 저장될지 헷갈린다 */
function showEditing(on) {
  document.getElementById("editCard").hidden = !on;
  document.getElementById("head").hidden = on;
  document.getElementById("brief").hidden = on;
}

async function saveEdit() {
  const topic = document.getElementById("eTopic").value.trim();
  if (!topic) { showError(message, new Error("주제 범위를 입력해 주세요.")); return; }
  const domain = document.getElementById("eDomain").value;

  // 분야는 이 범위로 만들 문서와 그 문서를 근거로 삼는 사흘치 문제의 분야까지 정한다.
  // 서버는 막지 않는다. 막으면 잘못 고른 분야를 고칠 길이 삭제 후 재등록뿐이고, 그러면 사용 기록이 날아간다
  if (domain !== current.domain
      && !confirm("분야를 바꾸면 이 범위로 만들 문서와 사흘치 문제의 분야가 함께 바뀝니다. 계속할까요?")) {
    return;
  }
  try {
    await api(`/api/admin/topic-queue/${current.id}`, {
      method: "PATCH",
      body: JSON.stringify({
        domain,
        topic,
        memo: document.getElementById("eMemo").value.trim() || null,
      }),
    });
    showOk(message, `수정했습니다. 사용 기록과 순서는 그대로입니다. ${topicFile(current)}을 커밋하세요.`);
    showEditing(false);
    await reload();
  } catch (e) {
    showError(message, e);   // 같은 범위가 이미 있으면 409(TOPIC_002)가 그대로 보인다
  }
}

/* ═══════════ 실행값 복사 ═══════════
 * 이 화면에서 워크플로를 직접 부르지 않는다. 앱이 GitHub 토큰을 들고 있어야 하는데,
 * 없애려는 수고(세 칸 옮겨 적기)에 비해 값이 안 맞는다.
 * type이 늘 document인 이유: 대기열은 문서일에만 쓰이고, 뒤따르는 문제일은 주제를 받지 않는다. */
async function copyWorkflowInputs(t) {
  const code = t.kind === "CODE";
  const text = code
    ? `topic=${t.topic}`
    : [`type=document`, `domain=${t.domain}`, `topic=${t.topic}`].join("\n");
  try {
    await navigator.clipboard.writeText(text);
    showOk(message, code
      ? "복사했습니다. Actions → LLM 코드 문제 → Run workflow 에 넣으세요."
      : "복사했습니다. Actions → llm-daily → Run workflow 에 넣으세요.");
  } catch (e) {
    // 클립보드는 권한·보안 컨텍스트에 따라 막힌다. 그때는 눈으로 옮겨 적게 값을 보여 준다
    showOk(message, `복사가 막혀 있습니다. 아래 값을 옮겨 적으세요:\n${text}`);
  }
}

/* ═══════════ 작성 지시 ═══════════ */

function renderBrief(memo) {
  const box = document.getElementById("brief");
  box.hidden = false;
  if (!memo) {
    box.innerHTML = `<h2>작성 지시</h2>
      <p class="meta">작성 지시가 없습니다. 모델이 주제 문장만 보고 범위를 정합니다.</p>`;
    return;
  }
  const { valid, fields, questions } = parseTopicMemo(memo);
  if (!valid) {
    box.innerHTML = `<h2>작성 지시 <span class="badge gray">지시 아님 · 모델에 안 실림</span></h2>
      <p class="meta">"핵심 개념:"과 "설명할 것:" 줄이 둘 다 있어야 모델에 실립니다. 지금은 메모로만 남습니다.</p>
      <p class="brief-raw">${escapeHtml(memo)}</p>`;
    return;
  }

  const section = (title, body, note = "") => `
    <section class="brief-section">
      <h3>${title}${note ? ` <span class="meta">· ${note}</span>` : ""}</h3>
      ${body}
    </section>`;

  let html = `<h2>작성 지시 <span class="badge green">모델에 실림</span></h2>`;
  html += section("핵심 개념", `<div class="brief-chips">${
    splitTopLevel(fields["핵심 개념"]).map(c => `<span>${escapeHtml(c)}</span>`).join("")}</div>`);
  html += section("설명할 것", `<ol class="brief-questions">${
    questions.map(q => `<li>${escapeHtml(q)}</li>`).join("")}</ol>`, "입문편에만 실림 · 이 순서대로 다룸");
  if (fields["다루지 않을 것"]) html += section("다루지 않을 것", text(fields["다루지 않을 것"]), "이름만 꺼냄");
  if (fields["실물"]) html += section("실물", text(fields["실물"]));
  html += section("그림", diagramOf(fields["그림"]), "입문편에만 실림");
  box.innerHTML = html;
}

/** "그림:" 줄 — 끝 괄호의 mermaid 이름을 배지로 뗀다. 비었으면 모델이 고른다. */
function diagramOf(value) {
  if (!value) return `<p class="brief-text meta">지정 안 함 · 모델이 고름</p>`;
  const m = value.match(/^(.*)\((flowchart|sequenceDiagram|stateDiagram-v2)\)\s*$/);
  if (!m) return text(value);
  return `<div class="brief-diagram"><span class="badge">${DIAGRAM_KINDS[m[2]]}</span>
    <span class="brief-text">${escapeHtml(m[1].trim())}</span></div>`;
}

function text(s) { return `<p class="brief-text">${escapeHtml(s)}</p>`; }

/** 쉼표로 나누되 괄호 안의 쉼표는 지나친다. 예: "가상 서버(인스턴스, VM), 요금" → 두 개 */
function splitTopLevel(s) {
  const out = [];
  let depth = 0, cur = "";
  for (const ch of s) {
    if (ch === "(") depth++;
    if (ch === ")") depth = Math.max(0, depth - 1);
    if (ch === "," && depth === 0) { out.push(cur.trim()); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur.trim());
  return out.filter(Boolean);
}
</script>
</body>
</html>
