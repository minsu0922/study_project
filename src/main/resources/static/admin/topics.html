<!--
  2026-08-29: 주제 범위는 생성 화면 안으로 들어갔다.

  주제를 정하는 것은 생성의 <입력>이지 별개 작업이 아닌데, 메뉴 맨 끝에 있어 실제 순서

  [왜 파일을 지우지 않고 넘겨 주나]

  그때 사람이 얻는 정보는 "없다"뿐이라 어디로 갔는지 알 수 없다. 넘겨 주면 옛 주소를
  아는 사람이 새 자리를 한 번에 배운다. 비용은 이 열몇 줄이 전부다.

  [자바스크립트가 아니라 meta refresh인 이유]
  이 화면은 로그인 상태를 볼 필요가 없다 — 어디로 가야 하는지는 누가 오든 같다.
  스크립트를 붙이면 admin-common.js를 부르게 되고, 그러면 넘겨 주기 하나 때문에
  가드·네비·배지가 전부 딸려 온다.
-->
