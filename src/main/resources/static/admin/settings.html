<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 분야 설정 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지.
   자세한 이유는 사용자 화면의 같은 주석 참고. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <!-- 제목은 기둥 메뉴의 이름과 같은 말을 쓴다(batch.html의 같은 주석 참고) —
       눌러서 간 곳의 제목이 메뉴 이름과 다르면 "여기가 맞나"를 되묻게 된다. -->
  <h1>분야 설정</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>

    <!-- 저장 성공/실패 안내가 여기 뜬다. 다른 화면의 #message와 달리 <b>자동으로
         사라지지 않는다</b> — showSavedNotice 주석 참고. -->
    <div id="sMessage"></div>

    <!-- 좌: 분야 목록 / 우: 다음 7일 미리보기(sticky). 두 칸으로 나눈 이유는
         css/style.css의 "분야 설정 화면" 절 — 세로로 쌓으면 미리보기가 목록 맨 아래에 깔려,
         체크를 바꾼 결과를 보려고 스크롤을 끝까지 내려야 했다. -->
    <div class="settings-layout">

      <!-- 이 화면의 본체. 분야 하나가 한 줄이고, 이름·힌트는 "편집"을 눌러 그 줄 아래로 펼친다.
           저장은 줄마다 따로 한다(PUT /{domain}이 분야 하나만 받는다 — 버튼이 하나면
           "무엇을 저장했는지"가 흐려진다). 저장 버튼은 그 줄에 바뀐 것이 있을 때만 뜬다. -->
      <div class="card">
        <h3>분야 목록</h3>
        <p class="meta">
          <b>순서(▲▼)</b>는 누르는 즉시 반영됩니다. <b>켜기·이름·힌트</b>는 줄에 뜨는 <b>저장</b>을 눌러야 반영됩니다.
          번호는 순환에서 몇 번째인지이고, 꺼진 분야는 순환에 끼지 않아 번호가 없습니다.
        </p>
        <div id="sList">불러오는 중…</div>
      </div>

      <!-- 순서가 곧 날짜 순환이라, 한 줄만 올려도 앞으로 며칠 동안 무엇이 나올지가 통째로
           밀린다. 예전에 순환이 분야 두 개에 갇혀 나머지 여섯이 개념 문서를 영영 못 받던
           사고가 여기서 났다(DraftGeneratorCli 주석) — 그 일이 다시 나면 저장 전에 보이게
           둔다. 그래서 <b>화면에 늘 떠 있는</b> 오른쪽 칸에 둔다 — 체크·순서를 바꿀 때마다
           곧장 다시 그려야 그 순간에 보인다. -->
      <div class="card settings-preview">
        <h3>다음 7일</h3>
        <p class="meta">저장 전이라도 지금 화면의 켜짐·순서로 계산합니다.</p>
        <div id="sPreview">불러오는 중…</div>
      </div>

    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
// 미리보기 일수를 상수로 뺀다 — 서버 컨트롤러의 DEFAULT_PREVIEW_DAYS(7)와 같은 값을
// 화면에서도 그대로 쓴다. 다르면 "다음 7일"이라는 제목과 실제로 부르는 일수가 어긋난다.
const PREVIEW_DAYS = 7;
const WEEKDAY = ["일", "월", "화", "수", "목", "금", "토"];

// 마지막으로 켜진 분야를 끄려 할 때의 안내 — 서버 ErrorCode.DOMAIN_002와 같은 문장이다.
// 분야를 전부 끄는 것은 배치를 멈추는 방법이 아니다. 멈추는 스위치는 batch-enabled 하나이고,
// 두 번째 정지 수단을 인정하면 CLI와 앱이 그 상태를 서로 다르게 읽는 일이 또 생긴다(docs/21).
const LAST_DOMAIN_MESSAGE =
  "마지막으로 켜진 분야는 끌 수 없습니다. 배치를 멈추려면 분야를 끄지 말고 " +
  "llm.generation.batch-enabled를 false로 두세요.";

// 마지막으로 불러온 서버 상태 — sortOrder 오름차순 그대로 둔다. 렌더링이 이 순서를
// 그대로 DOM 순서로 옮기므로, 나중에 "화면에 지금 놓인 순서"를 다시 읽을 때
// DOM만 훑으면 된다(별도의 순서 상태를 이중으로 들고 다닐 필요가 없다).
let settingsRows = [];

if (initAdminPage("settings")) {
  wireSettingsList();
  loadSettings();
}

/** 목록을 다시 불러와 그린다 — 저장·순서 이동 뒤에도 이 함수 하나로 최신 상태를 맞춘다. */
async function loadSettings() {
  const msg = document.getElementById("sMessage");
  try {
    settingsRows = await api("/api/admin/domain-settings");
    renderSettings();
    await recomputePreview();
  } catch (e) {
    showError(msg, e);
  }
}

/* ── 분야 목록 ──────────────────────────────────────────────────────── */

function renderSettings() {
  const el = document.getElementById("sList");
  el.innerHTML = settingsRows
    .map((row, i) => domainRowHtml(row, i === 0, i === settingsRows.length - 1))
    .join("");
  renumber();
}

/**
 * 줄 하나 — 위는 늘 보이는 한 줄(.domain-line), 아래는 "편집"을 눌러야 펼치는 칸(.domain-edit).
 *
 * <p><b>왜 둘로 나눴나(2026-09-22).</b> 처음에는 이름·힌트 입력칸·프롬프트 문장·저장 버튼을
 * 분야마다 다 펼쳐 둬서 한 분야가 여섯 줄 남짓이었고, 열한 분야면 화면 서너 장이었다.
 * 그런데 자주 만지는 것은 켜기와 순서뿐이고 이름·힌트는 가끔이다. 자주 만지는 것만 줄에 두면
 * 열한 줄이 한 화면에 들어오고, 옆의 7일 미리보기와 나란히 보인다.
 *
 * <p><b>접혀 있어도 입력칸은 DOM에 둔다.</b> 저장({@link saveDomain})은 이 줄의 입력칸 값을
 * 읽는다. 펼칠 때마다 새로 그리면 접었다 편 사이에 고치던 값이 날아간다 — 그래서 CSS로만 숨긴다.
 *
 * <p><b>저장 버튼은 바뀐 것이 있을 때만 뜬다.</b> 열한 줄에 저장 버튼이 늘 떠 있으면
 * "어느 줄을 저장해야 하나"가 안 보인다. 바뀐 줄에만 뜨고, 그 줄에 왼쪽 막대가 붙는다
 * ({@link refreshRowState}).
 */
function domainRowHtml(row, isFirst, isLast) {
  const hint = row.hint || "";
  const remain = 500 - hint.length;
  const preview = row.promptPreview
    ? escapeHtml(row.promptPreview)
    : "(힌트 없음 — 프롬프트에 아무것도 붙지 않습니다)";
  const summary = hint
    ? `<span class="domain-hint-summary" title="${escapeHtml(hint)}">${escapeHtml(hint)}</span>`
    : `<span class="domain-hint-summary empty">힌트 없음</span>`;

  return `
    <div class="domain-row${row.enabled ? "" : " off"}" data-code="${row.code}">
      <div class="domain-line">
        <input type="checkbox" data-field="enabled" ${row.enabled ? "checked" : ""}
               aria-label="${escapeHtml(row.displayName)} 배치 순환에 넣기">
        <span class="row-actions move">
          <button type="button" class="btn-outline" data-action="up"
                  ${isFirst ? 'disabled title="맨 위입니다"' : 'title="한 칸 위로(즉시 반영)"'}>▲</button>
          <button type="button" class="btn-outline" data-action="down"
                  ${isLast ? 'disabled title="맨 아래입니다"' : 'title="한 칸 아래로(즉시 반영)"'}>▼</button>
        </span>
        <span class="domain-pos" data-role="pos" title="순환에서 몇 번째인지"></span>
        <span class="domain-name" title="${escapeHtml(row.displayName)} (${escapeHtml(row.code)})">${escapeHtml(row.displayName)}</span>
        ${summary}
        <span class="row-actions">
          <button type="button" data-action="save" hidden>저장</button>
          <button type="button" class="btn-outline" data-action="edit" aria-expanded="false">편집</button>
        </span>
      </div>

      <div class="domain-edit">
        <div class="field">
          <label>이름 <span class="code">— 코드 ${escapeHtml(row.code)} (배치 수동 실행의 domain 칸에 쓰는 값)</span></label>
          <input type="text" data-field="displayName" value="${escapeHtml(row.displayName)}">
        </div>
        <div class="field">
          <label>힌트 <span class="hint-remain${remain < 0 ? " over" : ""}" data-role="remain">${remain}자 남음</span></label>
          <!-- 일부러 maxlength를 안 둔다 — 500자를 넘겨 <b>타이핑까지는</b> 허용하고,
               넘은 순간 남은 글자 수를 빨갛게 바꾸고 저장 버튼을 잠가 "서버가 막기 전에"
               한계가 보이게 한다. maxlength로 조용히 잘라내면 이 신호가 없다. -->
          <textarea data-field="hint" rows="3">${escapeHtml(hint)}</textarea>
        </div>
        <!-- promptPreview를 원문 그대로 보여준다(AdminDomainSettingResponse Javadoc) — 앞 공백과
             괄호까지 포함한 값이라, 여기서 새로 조립하지 않고 서버 값을 그대로 옮긴다.
             이 값은 마지막으로 <b>저장된</b> 상태 기준이다 — 지금 타이핑 중인 값이 아니라
             실제로 지금 모델에게 보내는 값을 보여주는 것이 이 칸의 목적이다. -->
        <div class="domain-row-preview">
          지금 프롬프트에 붙는 문장: <code>${preview}</code>
        </div>
      </div>
    </div>`;
}

/**
 * 켜진 분야에만 순환 번호를 매긴다. 꺼진 분야는 "–".
 *
 * <p>목록 위치가 아니라 <b>순환 위치</b>를 보여 주는 이유: 이 화면에서 순서가 뜻을 갖는 곳은
 * 순환뿐이다. 꺼진 줄까지 세어 번호를 매기면 "3번인데 왜 셋째 날에 안 나오지"가 된다.
 * 체크를 바꿀 때마다(저장 전이라도) 다시 센다 — 옆 미리보기와 같은 기준이어야 한다.
 */
function renumber() {
  let n = 0;
  document.querySelectorAll(".domain-row").forEach(row => {
    const on = row.querySelector('[data-field="enabled"]').checked;
    row.querySelector('[data-role="pos"]').textContent = on ? String(++n) : "–";
  });
}

/**
 * 이 줄에 저장 안 한 변경이 있는지 따져, 저장 버튼·왼쪽 막대·흐림을 맞춘다.
 *
 * <p>기준은 마지막으로 불러온 서버 값(settingsRows)이다. 한 번 바꿨다가 되돌리면
 * 다시 "변경 없음"이 된다 — 버튼이 한 번 뜨면 계속 남는 식이면 무엇이 진짜 바뀐 줄인지
 * 가려낼 수 없다.
 */
function refreshRowState(row) {
  const orig = settingsRows.find(r => r.code === row.dataset.code);
  const enabled = row.querySelector('[data-field="enabled"]').checked;
  const name = row.querySelector('[data-field="displayName"]').value.trim();
  const hint = row.querySelector('[data-field="hint"]').value;
  const dirty = enabled !== orig.enabled
    || name !== orig.displayName
    || hint !== (orig.hint || "");

  row.classList.toggle("dirty", dirty);
  row.classList.toggle("off", !enabled);
  const saveBtn = row.querySelector('button[data-action="save"]');
  saveBtn.hidden = !dirty;
  saveBtn.disabled = hint.length > 500;
}

/** 편집칸을 펼치거나 접는다. 한 번에 한 줄만 펼친다 — 여럿 펼치면 다시 세로로 길어진다. */
function toggleEdit(row, btn) {
  const opening = !row.classList.contains("open");
  document.querySelectorAll(".domain-row.open").forEach(r => {
    r.classList.remove("open");
    r.querySelector('button[data-action="edit"]').setAttribute("aria-expanded", "false");
  });
  if (opening) {
    row.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    row.querySelector('[data-field="hint"]').focus();
  }
}

/** 목록 컨테이너에 이벤트를 한 번만 건다(위임) — 매 렌더링마다 다시 걸 필요가 없다. */
function wireSettingsList() {
  const el = document.getElementById("sList");

  // 입력하는 중에 곧장 상태를 맞춘다. change가 아니라 input인 이유는 "다 입력하고 포커스를
  // 옮겨야" 보이면 500자를 이미 넘긴 뒤에야 알고, 저장 버튼도 그제야 뜨기 때문이다.
  el.addEventListener("input", e => {
    const field = e.target.dataset.field;
    if (field === "hint") updateRemain(e.target);
    if (field === "hint" || field === "displayName") refreshRowState(e.target.closest(".domain-row"));
  });

  // 체크박스는 저장 없이도 번호와 미리보기에 곧장 반영된다 — "저장 전에 보이게 한다"는
  // 요구가 힌트·이름에는 해당하지 않는다(둘은 순환 계산에 안 쓰인다).
  el.addEventListener("change", e => {
    if (e.target.dataset.field !== "enabled") return;
    // 마지막으로 켜진 체크를 끄려 하면 되돌리고 안내한다 — 서버도 400(DOMAIN_002)으로 막지만,
    // 저장을 눌러야 알게 하면 그사이 미리보기가 "켜진 분야 없음"을 그려 마치 배치가 멈출 것처럼
    // 보인다. 실제로는 멈추지 않는다(배치를 멈추는 스위치는 batch-enabled 하나다).
    if (!e.target.checked && checkedDomains().length === 0) {
      e.target.checked = true;
      showLastDomainNotice();
      return;
    }
    refreshRowState(e.target.closest(".domain-row"));
    renumber();
    recomputePreview();
  });

  el.addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const row = btn.closest(".domain-row");
    const code = row.dataset.code;
    if (btn.dataset.action === "up") moveDomain(code, "UP");
    else if (btn.dataset.action === "down") moveDomain(code, "DOWN");
    else if (btn.dataset.action === "edit") toggleEdit(row, btn);
    else if (btn.dataset.action === "save") saveDomain(code, row, btn);
  });
}

/** 힌트칸 옆 "N자 남음"을 갱신한다. 500자 초과 시 저장 잠금은 refreshRowState가 맡는다. */
function updateRemain(textarea) {
  const row = textarea.closest(".domain-row");
  const remainEl = row.querySelector('[data-role="remain"]');
  const remain = 500 - textarea.value.length;
  remainEl.textContent = `${remain}자 남음`;
  remainEl.classList.toggle("over", remain < 0);
}

/**
 * 한 줄 저장 — enabled·displayName·hint를 한 번에 PUT한다(순서는 move의 몫).
 *
 * <p>성공하면 <b>전체를 다시 불러온다</b>. 서버가 돌려주는 값이 없어(edit은 Void) 새
 * promptPreview·hint 원문을 알 길이 이 재조회뿐이고, DomainHints.hintFor 조립 규칙을
 * 화면에서 흉내 내면 서버와 규칙이 두 곳으로 갈라져 언젠가 어긋난다. 다른 줄에 저장하지
 * 않은 입력이 있었다면 이 재조회로 함께 날아가는데 — 줄마다 저장 버튼이 있는 이 화면
 * 설계상 "고치고 바로 저장"이 정상 흐름이라 감수한다(batch.html 주석의 같은 판단).
 */
async function saveDomain(code, rowEl, btn) {
  const msg = document.getElementById("sMessage");
  const displayName = rowEl.querySelector('[data-field="displayName"]').value.trim();
  const hint = rowEl.querySelector('[data-field="hint"]').value;
  const enabled = rowEl.querySelector('[data-field="enabled"]').checked;

  // 저장 직전에 한 번 더 본다 — 기준은 화면의 체크가 아니라 <저장된> 상태(settingsRows)다.
  // 서버가 세는 것도 저장된 행이라, 다른 줄에서 체크만 켜 두고 저장 안 한 채 이 줄을 끄면
  // 화면 체크로는 통과하는데 서버에서 400이 난다. 같은 기준으로 먼저 막아 안내를 앞당긴다.
  if (!enabled && !settingsRows.some(r => r.code !== code && r.enabled)) {
    showLastDomainNotice();
    return;
  }

  btn.disabled = true;
  try {
    await api(`/api/admin/domain-settings/${code}`, {
      method: "PUT",
      body: JSON.stringify({ enabled, displayName, hint }),
    });
    await loadSettings();
    showSavedNotice(msg);
  } catch (e) {
    showError(msg, e);
    btn.disabled = false;
  }
}

/** 순서 이동 — 누르는 즉시 서버에 반영된다(맨 위/맨 아래에서는 조용히 아무 일도 안 한다). */
async function moveDomain(code, direction) {
  try {
    await api(`/api/admin/domain-settings/${code}/move`, {
      method: "POST",
      body: JSON.stringify({ direction }),
    });
    await loadSettings();
  } catch (e) {
    showError(document.getElementById("sMessage"), e);
  }
}

/**
 * 저장 후 안내 — 일부러 자동으로 사라지지 않는다(다른 화면의 showOk는 2.5초 뒤 지운다).
 *
 * <p>이 저장은 <b>DB만</b> 바꾼다. 클라우드 배치는 generated/_domain-settings.json을
 * 통해서만 이 값을 보고, 그 파일은 사람이 커밋해야 배치까지 닿는다(DomainSettingExporter
 * 주석) — 안내가 2.5초 만에 사라지면 "커밋해야 한다"는, 이 화면에서 가장 중요한 한 줄을
 * 놓치기 쉽다. 다음 저장이나 새로고침 전까지 남겨 둔다.
 */
function showSavedNotice(el) {
  el.innerHTML = `<div class="alert info">
    저장했습니다. <code>generated/_domain-settings.json</code>이 갱신됩니다 —
    <b>이 파일을 커밋해야 다음 배치부터 반영됩니다.</b>
  </div>`;
}

/* ── 다음 7일 미리보기 ─────────────────────────────────────────────── */

/**
 * 화면에 지금 놓인(아직 저장 안 했을 수도 있는) 켜짐·순서로 다음 PREVIEW_DAYS일을 다시
 * 계산해 그린다. DOM을 그대로 읽는 이유는 sortOrder(순서 이동은 즉시 반영)와 enabled
 * 체크(저장 전에도 미리보기에 반영)가 서로 다른 시점의 값이라, settingsRows 배열 하나로는
 * "지금 화면이 보여주는 상태"를 정확히 못 담기 때문이다 — DOM이 그 둘의 합이다.
 */
async function recomputePreview() {
  const el = document.getElementById("sPreview");
  const domains = checkedDomains();

  if (domains.length === 0) {
    // 체크 핸들러가 마지막 분야 끄기를 막으므로 정상 흐름에서는 오지 않는다. 그래도 문구는
    // 사실대로 둔다 — "하나는 켜야 배치가 돈다"고 적으면 전부 끄면 멈춘다는 뜻으로 읽힌다.
    el.innerHTML = `<p class="meta">${escapeHtml(LAST_DOMAIN_MESSAGE)}</p>`;
    return;
  }

  try {
    // List<Domain> 파라미터라 Spring이 domains=A&domains=B(반복)와 domains=A,B(쉼표) 둘 다
    // 같은 목록으로 바인딩한다. AdminDomainSettingController.preview의 Javadoc 예시는 쉼표
    // 꼴을 보여 주지만, 여기서는 반복 꼴을 쓴다 — 둘이 같은 모양이라서가 아니라 둘 다 동작해서다.
    const qs = domains.map(d => `domains=${encodeURIComponent(d)}`).join("&");
    const cells = await api(`/api/admin/domain-settings/preview?days=${PREVIEW_DAYS}&${qs}`);
    el.innerHTML = previewTableHtml(cells);
  } catch (e) {
    showError(el, e);
  }
}

/** 화면에서 지금 체크된 분야 코드 — 화면에 놓인 순서 그대로. */
function checkedDomains() {
  return Array.from(document.querySelectorAll(".domain-row"))
    .filter(row => row.querySelector('[data-field="enabled"]').checked)
    .map(row => row.dataset.code);
}

/** 마지막 분야 끄기를 막았다는 안내 — 서버 DOMAIN_002와 같은 말을 쓴다. */
function showLastDomainNotice() {
  showError(document.getElementById("sMessage"), { message: LAST_DOMAIN_MESSAGE });
}

/**
 * 미리보기 표. 칸을 넷(날짜·무엇·분야·난이도)에서 셋으로 줄였다(2026-09-22) — 오른쪽 300px
 * 칸에 네 칸을 넣으면 글자가 줄마다 꺾여 오히려 한눈에 안 읽힌다. "무엇"과 "난이도"는
 * 합칠 수 있다: 문서일에는 난이도가 없고(PreviewCell Javadoc), 문제일에는 난이도가 곧
 * 그날 무엇을 만드는지다.
 */
function previewTableHtml(cells) {
  return `<div class="table-wrap"><table class="grid">
    <thead><tr><th>날짜</th><th>분야</th><th>만드는 것</th></tr></thead>
    <tbody>${cells.map(previewRowHtml).join("")}</tbody>
  </table></div>`;
}

/**
 * 미리보기 한 줄. 문서일에는 difficulty가 null이다 — 지어낸 난이도 대신 "개념 문서"라고
 * 적는다. 난이도 칸이 따로 있던 때는 "—"로 비웠지만, 칸을 합친 지금은 그 자리에
 * 그날의 실제 산출물 이름이 들어가는 편이 정확하다.
 */
function previewRowHtml(c) {
  const what = c.documentDay
    ? `<b>개념 문서</b>`
    : `${escapeHtml(difficultyLabel(c.difficulty))} 문제`;
  return `<tr>
    <td>${formatPreviewDate(c.date)}</td>
    <td>${escapeHtml(domainLabel(c.domain))}</td>
    <td>${what}</td>
  </tr>`;
}

/** "2026-09-22" → "9/22 (월)". UTC 자정으로 파싱해 브라우저 시간대에 요일이 흔들리지 않게 한다
 *  (batch.html의 daysAgo와 같은 이유). */
function formatPreviewDate(iso) {
  const d = new Date(iso + "T00:00:00Z");
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()} (${WEEKDAY[d.getUTCDay()]})`;
}
</script>
</body>
</html>
