<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 출제 분포 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지.
   자세한 이유는 사용자 화면의 같은 주석 참고. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <h1>출제 분포</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <!-- 빈 칸 수는 서버가 센다. 화면의 분야 목록과 배치가 채우는 후보가 달라서, 화면에서 세면
         채울 계획도 없는 칸까지 "빈 칸"으로 잡힌다(옛 현황 화면 renderTodo 주석에서 옮김). -->
    <p class="meta" id="emptyCells" style="margin-bottom:12px"></p>
    <h3>분야 × 난이도 <span class="meta">(진할수록 많다 · 칸을 누르면 그 칸으로 직접 생성)</span></h3>
    <div class="table-wrap"><table class="grid heatmap" id="matrixTable"></table></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 출제 분포 — 승인된 문제가 분야·난이도 칸에 몇 개씩 있는지(2026-10-15에 현황 화면에서 독립).
 * 이 표에 묻는 질문은 "어디가 비었나" 하나이고, 본 다음에 하는 일은 그 칸을 채우는 것이라
 * 칸을 누르면 직접 생성 화면으로 간다. */

if (initAdminPage("distribution")) {
  loadDistribution();
}

async function loadDistribution() {
  try {
    const d = await api("/api/admin/dashboard");
    const t = d.todo;
    document.getElementById("emptyCells").innerHTML = t.emptyCells === 0
      ? `배치가 채우는 ${t.plannedCells}칸에 모두 문제가 있습니다.`
      : `배치가 채우는 ${t.plannedCells}칸 중 <b>${t.emptyCells}칸</b>에 아직 문제가 없습니다.`;
    renderMatrix(d.problemMatrix);
  } catch (e) {
    showErrorAlert(document.getElementById("guard"), e, "출제 분포를 불러오지 못했습니다");
  }
}

/* 행=분야(전체 고정), 열=난이도. 데이터 없는 칸도 0으로 그려서 "빈 곳"을 드러낸다. */
function renderMatrix(matrix) {
  const cellMap = {};
  matrix.forEach(c => cellMap[c.domain + "|" + c.difficulty] = c.count);

  /* 색 농도 — 한 가지 색으로 <많을수록 진하게>.
   * 값이 "문제 수"라는 크기 하나뿐이라 한 색의 밝기로 충분하다. 숫자는 지우지 않는다 —
   * 색만으로 알리면 색 구분이 어려운 사람에게는 신호가 아니다.
   * 최댓값을 100%로 잡아 문제가 늘어도 상대 분포가 보이게 한다. */
  const counts = Object.values(cellMap);
  const max = counts.length ? Math.max(...counts) : 0;
  const shade = n => {
    if (n === 0) return "";
    // 10~55% 사이로 누른다. 55%가 두 테마 모두 본문 글씨 대비 4.5를 넘는 상한이다
    // (어두운 테마 60%에서 4.43으로 깨졌다). color-mix는 칸의 실제 바탕(--card)과 섞어
    // 다크 모드에서도 같은 뜻이 된다 — 반투명 rgba는 흰 바탕을 가정한다.
    const pct = max === 0 ? 0 : 10 + (n / max) * 45;
    return ` style="background: color-mix(in srgb, var(--primary) ${pct.toFixed(0)}%, var(--card))"`;
  };

  const table = document.getElementById("matrixTable");
  table.innerHTML =
    `<tr><th>분야</th>${DIFFICULTIES.map(([, l]) => `<th>${l}</th>`).join("")}<th>합계</th></tr>` +
    DOMAINS.map(([dv, dl]) => {
      let sum = 0;
      const cells = DIFFICULTIES.map(([lv, ll]) => {
        const n = cellMap[dv + "|" + lv] || 0; sum += n;
        return `<td class="click-cell ${n === 0 ? "zero" : ""}"${shade(n)}
                    data-domain="${dv}" data-difficulty="${lv}"
                    title="${dl} · ${ll} — 문제 ${n}개. 누르면 이 칸으로 직접 생성">${n}</td>`;
      }).join("");
      return `<tr><td>${dl}</td>${cells}<td><b>${sum}</b></td></tr>`;
    }).join("");

  // 폼만 채우고 요청은 보내지 않는다 — 생성은 돈이 드는 동작이라 "누르자마자 호출"은 위험하다.
  table.onclick = e => {
    const cell = e.target.closest(".click-cell");
    if (cell) goGenerate({ domain: cell.dataset.domain, difficulty: cell.dataset.difficulty });
  };
}
</script>
</body>
</html>
