<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 사용자 상세 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <p class="meta"><a href="/admin/users.html">← 사용자 목록</a></p>
  <h1>사용자 상세</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <div id="uMessage"></div>
    <div class="card" id="profile" hidden></div>

    <!-- 정지 폼보다 위에 둔다. 판단의 근거를 먼저 보고 나서 누르게 한다. -->
    <div class="card" id="activity" hidden>
      <h3>활동</h3>
      <div class="user-stats" id="activityStats"></div>
      <h4>최근 글</h4>
      <div id="recentPosts"></div>
      <h4>최근에 받은 신고</h4>
      <div id="recentReports"></div>
    </div>

    <div class="card" id="roleCard" hidden>
      <h3>권한</h3>
      <div id="roleBody"></div>
    </div>

    <div class="card" id="suspension" hidden>
      <h3>글쓰기 정지</h3>
      <!-- 정지가 무엇을 막는지를 적는다. "정지"라는 말만 보면 로그인까지 막는 줄 안다. -->
      <p class="meta">글·댓글을 쓰고 고치는 것과 신고를 막습니다. 문제 풀이와 복습, 읽기는 그대로 됩니다.
        기간이 끝나면 저절로 풀리고, 사유는 정지된 사람에게 그대로 보입니다.</p>
      <div id="suspensionBody"></div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 사용자 한 명 — 이 사람을 두고 하는 관리가 모두 여기 모인다.
 *   GET  /api/admin/users/{id}
 *   GET  /api/admin/users/{id}/activity
 *   POST /api/admin/users/{id}/suspend   {days, reason}   days를 비우면 무기한
 *   POST /api/admin/users/{id}/unsuspend
 *   POST /api/admin/users/{id}/reset-nickname
 *   POST /api/admin/users/{id}/role      {role}
 *
 * 화면이 따로 있는 이유: 주소가 있어야 신고함의 "글쓴이 정지"가 이 사람에게 바로 온다. */
const params = new URLSearchParams(location.search);
const userId = params.get("id");
/** 신고함이 넘겨준 신고 사유. 정지 사유 칸에 미리 넣어 두고 관리자가 고쳐 쓴다. */
const presetReason = params.get("reason") || "";
const message = document.getElementById("uMessage");

/** 고를 수 있는 기간 — 값은 서버의 AdminUserService.ALLOWED_DAYS와 같다. 빈 값이 무기한이다. */
const SUSPEND_DAYS = [["1", "1일"], ["7", "7일"], ["30", "30일"], ["", "무기한"]];

if (initAdminPage("users")) {
  if (!/^\d+$/.test(userId || "")) {
    showErrorAlert(message, "어느 사용자인지 알 수 없습니다. 목록에서 다시 들어와 주세요.");
  } else {
    api("/api/admin/users/" + userId).then(render).catch(e => showError(message, e));
    // 따로 부른다 — 활동을 못 읽어도 정지·해제는 할 수 있어야 한다.
    api(`/api/admin/users/${userId}/activity`).then(renderActivity).catch(e => showError(message, e));
  }
}

function renderActivity(a) {
  const stat = (label, value, warn) => `
    <div class="user-stat${warn && value > 0 ? " warn" : ""}"><b>${value}</b><span>${label}</span></div>`;
  document.getElementById("activityStats").innerHTML =
      stat("글", a.postCount) + stat("댓글", a.commentCount)
    + stat("받은 신고", a.receivedReportCount, true) + stat("가려진 글·댓글", a.hiddenCount, true)
    + stat("풀어 본 문제", a.attemptedProblems) + stat("맞힌 문제", a.solvedProblems);

  // 줄은 그 글로 간다. 새 탭으로 여는 이유는 신고함과 같다 — 보던 자리를 잃지 않는다.
  document.getElementById("recentPosts").innerHTML = a.recentPosts.length === 0
    ? `<div class="meta">쓴 글이 없습니다.</div>`
    : a.recentPosts.map(p => `
        <a class="user-line" href="/post.html?id=${p.id}" target="_blank" rel="noopener">
          <span class="badge gray">${escapeHtml(p.categoryLabel)}</span>
          ${p.status === "HIDDEN" ? `<span class="badge orange">가려짐</span>` : ""}
          <span class="user-line-text">${escapeHtml(p.title)}</span>
          <span class="meta">${formatDate(p.createdAt)}</span>
        </a>`).join("")
      + (a.postCount > a.recentPosts.length
          ? `<div class="meta" style="margin-top:6px">최근 ${a.recentPosts.length}건만 보입니다.</div>` : "");

  document.getElementById("recentReports").innerHTML = a.recentReports.length === 0
    ? `<div class="meta">받은 신고가 없습니다.</div>`
    : a.recentReports.map(r => {
        const inner = `
          <span class="badge ${reportStatusClass(r.status)}">${reportStatusLabel(r.status)}</span>
          <span class="badge gray">${r.targetType === "POST" ? "글" : "댓글"}</span>
          <span class="badge">${escapeHtml(r.reasonLabel)}</span>
          <span class="user-line-text">${escapeHtml(r.excerpt)}</span>
          <span class="meta">${formatDate(r.createdAt)}</span>`;
        // 대상이 지워져 글을 알 수 없으면 링크 없이 줄만 낸다.
        return r.postId
          ? `<a class="user-line" href="/post.html?id=${r.postId}" target="_blank" rel="noopener">${inner}</a>`
          : `<div class="user-line">${inner}</div>`;
      }).join("")
      + (a.receivedReportCount > a.recentReports.length
          ? `<div class="meta" style="margin-top:6px">최근 ${a.recentReports.length}건만 보입니다.
               전체는 <a href="/admin/comments.html">토론 신고</a>에서 봅니다.</div>` : "");

  document.getElementById("activity").hidden = false;
}

/* 신고함(comments.html)과 같은 말과 색을 쓴다. */
function reportStatusLabel(s) { return s === "PENDING" ? "대기" : s === "ACCEPTED" ? "가림" : "기각"; }
function reportStatusClass(s) { return s === "PENDING" ? "orange" : s === "ACCEPTED" ? "green" : "gray"; }

function render(u) {
  document.title = `관리자 · ${u.nickname || u.username} — csquiz`;
  const admin = u.role === "ADMIN";

  const profile = document.getElementById("profile");
  profile.innerHTML = `
    <div style="margin-bottom:6px">
      <b style="font-size:1.15rem">${escapeHtml(u.nickname || "(닉네임 없음)")}</b>
      ${admin ? `<span class="badge">관리자</span>` : ""}
      ${u.suspended ? `<span class="badge orange">정지 중</span>` : ""}
    </div>
    <div class="meta">아이디 ${escapeHtml(u.username)} · 가입 ${formatDate(u.createdAt)}
      · 권한 ${admin ? "관리자" : "사용자"}</div>
    ${u.nickname ? `
      <div class="row-actions" style="margin-top:10px">
        <button class="btn-outline btn-sm" onclick="resetNickname(this)">닉네임 초기화</button>
        <span class="meta">부적절한 닉네임을 "사용자 + 번호"로 바꿉니다. 쓴 글과 댓글의 이름도 함께 바뀌고,
          본인이 마이페이지에서 다시 정할 수 있습니다.</span>
      </div>` : ""}`;
  profile.hidden = false;

  document.getElementById("roleBody").innerHTML = roleHtml(u, admin);
  document.getElementById("roleCard").hidden = false;

  document.getElementById("suspensionBody").innerHTML = suspensionHtml(u, admin);
  document.getElementById("suspension").hidden = false;
}

/* 못 바꾸는 경우에는 버튼 대신 이유를 적는다 — 눌러 보고 거절당하게 하지 않는다. 서버도 같은 규칙으로 막는다. */
function roleHtml(u, admin) {
  const now = `<div>지금 권한: <b>${admin ? "관리자" : "사용자"}</b></div>`;
  if (u.username === localStorage.getItem(USERNAME_KEY)) {
    return now + `<div class="meta" style="margin-top:6px">내 계정의 권한은 내가 바꿀 수 없습니다.
      다른 관리자가 바꿔야 합니다.</div>`;
  }
  if (admin) {
    return now + `
      <p class="meta">내리면 이 사람은 그 즉시 관리 화면의 기능을 쓸 수 없습니다.</p>
      <div class="row-actions">
        <button class="btn-outline" onclick="changeRole('USER', this)">사용자로 내리기</button>
      </div>`;
  }
  if (u.suspended) {
    return now + `<div class="meta" style="margin-top:6px">정지 중인 사용자는 관리자로 올릴 수 없습니다.
      정지를 먼저 풀어 주세요.</div>`;
  }
  return now + `
    <p class="meta">관리자는 문제·문서를 고치고 지울 수 있고, 다른 사용자를 정지하거나 관리자로 올릴 수 있습니다.
      올린 사람은 다시 로그인해야 관리 화면이 열립니다.</p>
    <div class="row-actions">
      <button class="btn-outline" onclick="changeRole('ADMIN', this)">관리자로 올리기</button>
    </div>`;
}

/* 정지 중이면 풀리는 날과 사유, 아니면 정지 폼. 관리자 계정에는 폼을 내지 않고 이유를 적는다 —
   눌러 보고 거절당하게 하지 않는다. */
function suspensionHtml(u, admin) {
  if (u.suspended) {
    return `
      <div>${u.indefinite ? "무기한 정지" : `${formatDate(u.suspendedUntil)}까지 정지`}
        · 사유: ${escapeHtml(u.suspendedReason)}</div>
      <div class="row-actions" style="margin-top:10px">
        <button class="btn-outline" onclick="unsuspendUser(this)">정지 해제</button>
      </div>`;
  }
  if (admin) return `<div class="meta">관리자 계정은 정지할 수 없습니다.</div>`;
  return `
    <div class="filters" style="margin:10px 0 0">
      <div class="field" style="flex:0 0 110px; min-width:110px">
        <label for="days">기간</label>
        <select id="days">
          ${SUSPEND_DAYS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label for="reason">사유 (정지된 사람에게 보입니다)</label>
        <input type="text" id="reason" maxlength="200" placeholder="예: 광고 글을 거듭 올림"
               value="${escapeHtml(presetReason)}">
      </div>
      <button onclick="suspendUser(this)">정지</button>
    </div>`;
}

async function suspendUser(btn) {
  const reasonEl = document.getElementById("reason");
  const reason = reasonEl.value.trim();
  if (!reason) {
    // 서버도 거절하지만 다녀오기 전에 알린다. 사유는 정지된 사람이 읽는 유일한 설명이다.
    showErrorAlert(message, "정지 사유를 적어 주세요.");
    reasonEl.focus();
    return;
  }
  const days = document.getElementById("days").value;
  await act(btn, () => api(`/api/admin/users/${userId}/suspend`, {
    method: "POST", body: JSON.stringify({ days: days ? Number(days) : null, reason }) }));
}

/* 되돌릴 수 없다 — 지운 닉네임은 어디에도 남지 않는다. 그래서 한 번 더 누르게 한다. */
function resetNickname(btn) {
  armedAction(btn, () => act(btn, () =>
    api(`/api/admin/users/${userId}/reset-nickname`, { method: "POST" })), "한 번 더 누르면 초기화");
}

function changeRole(role, btn) {
  armedAction(btn, () => act(btn, () => api(`/api/admin/users/${userId}/role`, {
    method: "POST", body: JSON.stringify({ role }) })),
    role === "ADMIN" ? "한 번 더 누르면 관리자로 올림" : "한 번 더 누르면 사용자로 내림");
}

async function unsuspendUser(btn) {
  await act(btn, () => api(`/api/admin/users/${userId}/unsuspend`, { method: "POST" }));
}

/* 처리 뒤에는 서버가 돌려준 상태로 화면을 다시 그린다. */
async function act(btn, fn) {
  message.innerHTML = "";
  btn.disabled = true;
  try {
    render(await fn());
  } catch (e) {
    btn.disabled = false;
    showError(message, e);
  }
}
</script>
</body>
</html>
