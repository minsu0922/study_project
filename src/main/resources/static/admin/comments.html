<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 토론 신고 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — FOUC 방지. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-shell">
<div id="shell"></div>

<main class="container admin">
  <h1>토론 신고</h1>
  <div id="guard"></div>

  <div id="adminUi" hidden>
    <!-- 이 화면의 두 버튼이 하는 일이 다르다는 것을 맨 위에 적는다. 가림은 글에, 기각은 신고에 한다. -->
    <div class="alert info" style="margin-bottom:16px">
      학습자가 신고한 토론방의 글과 댓글입니다. <b>가리기</b>는 그 글이나 댓글을 "관리자가 가린 글입니다"로
      바꾸고 같은 대상의 다른 신고도 함께 닫습니다. 글을 가리면 그 아래 댓글도 함께 안 보입니다.
      <b>기각</b>은 그대로 두고 이 신고만 닫습니다. 신고가 쌓여도 저절로 가려지지는 않습니다.
      같은 사람이 거듭 올리면 <b>글쓴이 정지</b>로 사용자 화면에서 쓰기를 막습니다.
    </div>

    <div class="tabs" id="statusTabs">
      <button class="tab-btn active" data-status="PENDING">대기</button>
      <button class="tab-btn" data-status="ACCEPTED">가림</button>
      <button class="tab-btn" data-status="DISMISSED">기각</button>
      <button class="tab-btn" data-status="">전체</button>
    </div>

    <div id="cMessage"></div>
    <div id="cList"></div>
    <div class="pager-row" id="cPagerRow"></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/admin-table.js"></script>
<script src="/admin/js/admin-common.js"></script>
<script>
/* 토론 신고함(글·댓글) — V21, V25. 제보함(reports.html)과 같은 뼈대다: 상태 탭, 카드 목록, 그 자리에서 판정. */
let status = "PENDING";
let page = 0;

if (initAdminPage("comments")) {
  document.getElementById("statusTabs").addEventListener("click", e => {
    const btn = e.target.closest("[data-status]");
    if (!btn) return;
    document.querySelectorAll("#statusTabs .tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    status = btn.dataset.status;
    page = 0;
    load();
  });
  load();
}

async function load() {
  const msg = document.getElementById("cMessage");
  msg.innerHTML = "";
  try {
    const params = new URLSearchParams({ page });
    if (status) params.set("status", status);
    render(await api("/api/admin/comment-reports?" + params));
  } catch (e) {
    showError(msg, e);
  }
}

function render(data) {
  document.getElementById("cList").innerHTML = data.content.length === 0
    ? `<div class="card">${status === "PENDING" ? "대기 중인 신고가 없습니다. 👍" : "해당하는 신고가 없습니다."}</div>`
    : data.content.map(card).join("");

  const row = document.getElementById("cPagerRow");
  row.innerHTML = `
    <span class="meta">전체 ${data.totalElements}건</span>
    <span class="spacer"></span>
    ${renderAdminPager(data)}`;
  row.querySelectorAll("[data-page]").forEach(btn => {
    btn.addEventListener("click", () => { page = Number(btn.dataset.page); load(); });
  });
}

/**
 * 신고 한 장. 글 본문을 전문으로 싣는다 — "가릴 글인가"를 여기서 판단해야 한다.
 * 신고자는 보여 주지 않는다(서버가 안 내려준다).
 */
function card(r) {
  const done = r.status !== "PENDING";
  // 가림·복구는 대상이 글이냐 댓글이냐에 따라 주소가 다르다.
  const isPost = r.targetType === "POST";
  const target = isPost ? `'posts', ${r.postId}` : `'comments', ${r.commentId}`;
  return `
    <div class="card ${done ? "draft-done" : ""}" id="creport-${r.id}">
      <div style="margin-bottom:6px">
        <span class="badge ${statusClass(r.status)}">${statusLabel(r.status)}</span>
        <span class="badge gray">${isPost ? "글" : "댓글"}</span>
        <span class="badge">${escapeHtml(r.reasonLabel)}</span>
        <span class="badge gray">상태: ${commentStatusLabel(r.targetStatus)}</span>
        ${r.editedAfterReport ? `<span class="badge orange">신고 뒤 수정됨</span>` : ""}
        <span class="meta">${formatDate(r.createdAt)}</span>
      </div>

      <div class="meta">문제: ${escapeHtml(r.problemTitle || "(제목 없음)")}
        · 글쓴이: ${escapeHtml(r.targetNickname || "탈퇴한 사용자")}
        ${r.targetSuspended ? `<span class="badge orange">글쓴이 정지 중</span>` : ""}</div>
      ${isPost && r.editedAfterReport ? "" /* 제목이 아래 "신고 당시"와 "지금"에 따로 나온다 */
        : `<div class="meta">${isPost ? "글 제목" : "댓글이 달린 글"}: ${escapeHtml(r.postTitle)}</div>`}
      ${bodyBlock(r, isPost)}

      ${r.detail ? `<div class="alert info" style="margin:8px 0">신고자 한마디: ${escapeHtml(r.detail)}</div>` : ""}
      ${r.adminNote ? `<div class="meta">처리 메모: ${escapeHtml(r.adminNote)}</div>` : ""}

      ${done ? "" : `<input id="cnote-${r.id}" type="text" maxlength="500"
             placeholder="기각 메모 (선택) — '왜 문제없다고 봤나'를 남겨 두세요" style="margin-top:10px">`}

      <div class="row-actions" style="margin-top:10px">
        <a class="btn btn-outline" href="/post.html?id=${r.postId}"
           target="_blank" rel="noopener">글 보기 ↗</a>
        ${done ? "" : `
          <button onclick="hideTarget(${target}, this)">가리기</button>
          <button class="btn-outline" onclick="dismissReport(${r.id}, this)">기각</button>`}
        ${r.targetStatus === "HIDDEN"
          ? `<button class="btn-outline" onclick="restoreTarget(${target}, this)">복구</button>` : ""}
        ${/* 처리한 신고도 대상이 보이는 중이면 가릴 수 있어야 한다. 없으면 복구나 기각을 잘못 눌렀을 때
             되돌릴 길이 없다 — 같은 사람은 같은 글을 다시 신고하지 못한다. */
          done && r.targetStatus === "VISIBLE"
          ? `<button class="btn-outline" onclick="hideTarget(${target}, this)">다시 가리기</button>` : ""}
        ${suspendLink(r)}
      </div>
    </div>`;
}

/**
 * 본문. 신고 뒤에 글쓴이가 고쳤으면 "신고 당시"와 "지금"을 나란히 낸다 — 판정은 신고된 내용으로 하고,
 * 지금 내용은 "고쳐서 이미 괜찮아졌는지"를 보는 데 쓴다. 안 고쳤으면 하나만 낸다.
 */
function bodyBlock(r, isPost) {
  const block = (label, title, body) => `
    <div style="margin:8px 0">
      ${label ? `<div class="meta">${label}</div>` : ""}
      ${title ? `<div><b>${escapeHtml(title)}</b></div>` : ""}
      <div style="white-space:pre-wrap; overflow-wrap:anywhere">${escapeHtml(body)}</div>
    </div>`;
  if (!r.editedAfterReport) return block("", "", r.targetBody);
  return block("신고 당시", isPost ? r.reportedTitle : "", r.reportedBody)
       + block("지금", isPost ? r.postTitle : "", r.targetBody);
}

/**
 * 글쓴이를 정지하러 가는 링크. 그 사람의 상세 화면으로 바로 간다. 정지 폼은 거기에 한 벌만 둔다 — 여기에도 두면 기간 선택지나
 * 문구가 언젠가 한쪽만 고쳐진다. 새 탭으로 여는 이유: 신고를 훑던 자리를 잃지 않는다.
 * 탈퇴한 글쓴이는 정지할 사람이 없어 링크를 내지 않는다.
 */
function suspendLink(r) {
  if (!r.targetUserId) return "";
  const params = new URLSearchParams({ id: r.targetUserId, reason: r.reasonLabel });
  return `<a class="btn btn-outline" href="/admin/user.html?${params}" target="_blank" rel="noopener">${
    r.targetSuspended ? "글쓴이 정지 보기 ↗" : "글쓴이 정지 ↗"}</a>`;
}

function statusLabel(s) { return s === "PENDING" ? "대기" : s === "ACCEPTED" ? "가림" : "기각"; }
function statusClass(s) { return s === "PENDING" ? "orange" : s === "ACCEPTED" ? "green" : "gray"; }
function commentStatusLabel(s) { return s === "VISIBLE" ? "보임" : s === "HIDDEN" ? "가려짐" : "삭제됨"; }

/* 가리기와 복구는 목록을 다시 읽는다. 같은 대상의 다른 신고 카드도 함께 바뀌기 때문이다.
 * kind는 "posts" 또는 "comments" — 서버 주소의 한 마디다. */
async function hideTarget(kind, id, btn) {
  await act(btn, () => api(`/api/admin/${kind}/${id}/hide`, { method: "POST" }), true);
}

async function restoreTarget(kind, id, btn) {
  await act(btn, () => api(`/api/admin/${kind}/${id}/restore`, { method: "POST" }), true);
}

/* 기각은 그 카드만 바꾼다 — 여러 건을 훑는 화면에서 매번 다시 그리면 읽던 자리를 잃는다. */
async function dismissReport(reportId, btn) {
  const note = document.getElementById("cnote-" + reportId)?.value ?? "";
  await act(btn, async () => {
    const updated = await api(`/api/admin/comment-reports/${reportId}/dismiss`, {
      method: "POST", body: JSON.stringify({ note }) });
    document.getElementById("creport-" + reportId).outerHTML = card(updated);
  }, false);
}

async function act(btn, fn, reload) {
  btn.disabled = true;
  try {
    await fn();
    if (reload) await load();
    refreshAdminBadges();
  } catch (e) {
    btn.disabled = false;
    showError(document.getElementById("cMessage"), e);
  }
}
</script>
</body>
</html>
