<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="갈림길. 스레드 1(나에서 친구로)과 스레드 2(친구에서 나로)의 길이 모두 1001번 락 앞으로 모인다. 스레드 1이 먼저 1001번과 2002번을 지나 송금을 마치고 두 락을 되돌린다. 스레드 2는 빈손으로 1001번 앞에서 기다리다가 열쇠가 돌아온 뒤 같은 길로 간다. 기다림이 한 방향으로만 흐른다">
<defs><marker id="deadlock-same-first-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker><marker id="deadlock-same-first-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-bad" fill="#dc2626"/></marker></defs>
<rect x="16" y="56" width="150" height="48" rx="6" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="30" y="78" class="f-t" fill="#0f172a" font-size="14" font-weight="700">스레드 1</text>
<text x="30" y="96" class="f-sm" fill="#556274" font-size="12">나 → 친구</text>
<rect x="16" y="206" width="150" height="48" rx="6" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="30" y="228" class="f-t" fill="#0f172a" font-size="14" font-weight="700">스레드 2</text>
<text x="30" y="246" class="f-sm" fill="#556274" font-size="12">친구 → 나</text>
<rect x="250" y="120" width="100" height="70" rx="6" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="300" y="150" class="f-new" fill="#4f46e5" font-size="14" text-anchor="middle" font-weight="700">1001번 락</text>
<text x="300" y="172" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">모두 여기부터</text>
<rect x="420" y="120" width="100" height="70" rx="6" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="470" y="160" class="f-new" fill="#4f46e5" font-size="14" text-anchor="middle" font-weight="700">2002번 락</text>
<rect x="548" y="120" width="80" height="70" rx="6" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="588" y="152" class="f-t" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">송금</text>
<text x="588" y="172" class="f-t" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">완료</text>
<path d="M166 82 L248 140" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#deadlock-same-first-head)"/>
<path d="M166 228 L248 180" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#deadlock-same-first-head)"/>
<path d="M350 155 H418" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#deadlock-same-first-head)"/>
<path d="M520 155 H546" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#deadlock-same-first-head)"/>
<text x="300" y="108" class="f-acc" fill="#4f46e5" font-size="12" text-anchor="middle" font-weight="700">① 스레드 1 먼저 획득</text>
<text x="498" y="108" class="f-acc" fill="#4f46e5" font-size="12" text-anchor="middle" font-weight="700">③ 2002번까지 잡고 마친 뒤 해제</text>
<text x="196" y="266" class="f-bad" fill="#dc2626" font-size="13" text-anchor="middle" font-weight="700">② 빈손으로 대기</text>
<path d="M300 192 V244 H588 V194" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#deadlock-same-first-head)"/>
<text x="444" y="266" class="f-acc" fill="#4f46e5" font-size="12" text-anchor="middle" font-weight="700">④ 열쇠가 돌아오면 스레드 2도 같은 순서로</text>
<text x="320" y="314" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">기다리는 쪽 손이 비어 있어 되돌아오는 화살표가 없다</text>
</svg>
