<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="사다리 그림. 앱이 키 k-7f3a를 실어 주문을 보내면 서버가 주문 101번을 만들고 키 장부에 k-7f3a는 주문 101이라고 적는다. 답이 중간에 사라져 앱이 같은 키로 다시 보내면, 서버는 장부를 보고 새 주문을 만들지 않고 주문 101번을 돌려준다. 주문 102번은 생기지 않는다">
