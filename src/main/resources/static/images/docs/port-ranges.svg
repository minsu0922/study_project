<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="0부터 65535까지를 한 줄로 늘어놓으면 잘 알려진 포트 0~1023은 맨 앞의 아주 좁은 조각이고, 1024~49151이 가장 넓으며, 49152~65535가 뒤쪽 4분의 1이다">
<defs><marker id="port-ranges-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="20" y="30" class="f-b" fill="#0f172a" font-size="15" font-weight="700">포트 번호 65,536개를 실제 크기대로 한 줄에 놓으면</text>
<rect x="20.0" y="96" width="9.4" height="54" class="f-arrow" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/>
