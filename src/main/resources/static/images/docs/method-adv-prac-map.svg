<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="실무 지도. 우리 앱의 재시도 코드에는 ① 어떤 상태 코드를 다시 보낼지와 ② 429에 얼마나 기다릴지가 있다. 중간 서버에는 ③ 실패한 POST를 다른 서버로 넘길지가, 주문 서버에는 ④ 멱등 키 저장소에 처리 중 상태까지 적을지가 있다. API를 설계하는 자리에는 ⑤ 메서드 고르기와 ⑥ 오류 상태 코드 고르기가 있다">
