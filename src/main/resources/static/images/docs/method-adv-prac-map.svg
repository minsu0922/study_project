<text x="354" y="266" class="f-t" fill="#0f172a" font-size="13">Retry-After를 지키고 없으면 백오프</text>
<circle cx="34" cy="287" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="34" y="292" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">3</text>
<text x="54" y="292" class="f-t" fill="#0f172a" font-size="13">POST는 다른 서버로 넘기지 않는다</text>
<circle cx="334" cy="287" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="334" y="292" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">4</text>
<text x="354" y="292" class="f-t" fill="#0f172a" font-size="13">키에 처리 중 상태와 시각을 적는다</text>
<circle cx="34" cy="313" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="34" y="318" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">5</text>
<text x="54" y="318" class="f-t" fill="#0f172a" font-size="13">증감은 키 실은 POST, 메일 링크는 GET</text>
<circle cx="334" cy="313" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="334" y="318" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">6</text>
<text x="354" y="318" class="f-t" fill="#0f172a" font-size="13">실패는 맞는 상태 코드로 보낸다</text>
</svg>
