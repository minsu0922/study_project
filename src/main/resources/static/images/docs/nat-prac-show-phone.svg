<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="집 그림. 노트북 192.168.0.12가 8080번으로 앱을 띄운다. 같은 와이파이의 휴대폰은 192.168.0.12:8080으로 바로 연다. LTE로 바깥에 있는 휴대폰은 사설 주소로 열지 못하고, 공유기 공인 주소의 8080번으로 들어와 포트 포워딩 줄을 따라 노트북에 닿는다. 노트북 주소는 DHCP에서 고정해 둔다">
<defs><marker id="nat-prac-show-phone-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<path d="M32 90 L220.0 40 L408 90 Z" class="f-house" fill="#f1f5f9" stroke="#556274" stroke-width="1.5"/>
<rect x="40" y="90" width="360" height="220" rx="0" class="f-house" fill="#f1f5f9" stroke="#556274" stroke-width="1.5"/>
<text x="60" y="110" class="f-sm" fill="#556274" font-size="12">집 안 · 사설 주소</text>
<g transform="translate(70 160) scale(1.3)"><rect x="8" y="2" width="44" height="30" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="13" y="7" width="34" height="20" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><path d="M2 36 h56 l-4 6 h-48 z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="108" y="236" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">노트북</text>
<text x="108" y="256" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">192.168.0.12:8080</text>
<text x="108" y="276" class="f-acc" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">DHCP에서 주소 고정</text>
<g transform="translate(250 130) scale(1.2)"><rect x="3" y="2" width="24" height="46" rx="5" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="7" y="8" width="16" height="30" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="15" cy="43" r="2" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="268" y="210" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">같은 와이파이</text>
<path d="M244 160 C200 160 180 170 160 178" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#nat-prac-show-phone-head)"/>
<text x="200" y="136" class="f-new" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">바로 연다</text>
<g transform="translate(300 230) scale(1.0)"><path d="M18 18 L12 2 M62 18 L68 2" class="f-line" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/><rect x="2" y="18" width="76" height="28" rx="6" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><circle cx="16" cy="32" r="3" class="f-dot" fill="#4f46e5"/><circle cx="28" cy="32" r="3" class="f-dot" fill="#4f46e5"/><circle cx="40" cy="32" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="340" y="300" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">공유기</text>
<rect x="430" y="220" width="196" height="70" rx="6" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="442" y="244" class="f-sm" fill="#556274" font-size="12">포트 포워딩</text>
<text x="442" y="268" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace">바깥 8080 →</text>
<text x="442" y="284" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace">192.168.0.12:8080</text>
<g transform="translate(560 60) scale(1.2)"><rect x="3" y="2" width="24" height="46" rx="5" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="7" y="8" width="16" height="30" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="15" cy="43" r="2" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="578" y="140" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">바깥 · LTE</text>
<path d="M556 110 C500 150 420 200 382 240" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#nat-prac-show-phone-head)"/>
<text x="578" y="160" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">공인 주소:8080</text>
<path d="M300 258 C240 250 190 230 160 214" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#nat-prac-show-phone-head)"/>
<text x="320" y="346" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">바깥에서 열 때만 포워딩 줄과 주소 고정을 더한다. 보여 주기가 끝나면 줄을 지운다</text>
</svg>
