<text x="34" y="312" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">3</text>
<text x="54" y="312" class="f-t" fill="#0f172a" font-size="13">헤더 길이는 길이 칸을 읽는다</text>
<circle cx="334" cy="307" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="334" y="312" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">4</text>
<text x="354" y="312" class="f-t" fill="#0f172a" font-size="13">큰 파일은 해시로 다시 확인</text>
