<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="실무 지도. 개발자 PC에서 ① 패킷 캡처 도구로 프레임을 층별로 벗겨 보고, ② traceroute로 거쳐 가는 라우터를 찾고, ③ 캡처 바이트를 직접 읽는 코드에서는 길이 칸을 읽는다. 서버 사이에는 ④ 큰 파일을 옮긴 뒤 해시로 확인할지가, 단말기와 수집 서버 사이에는 ⑤ 작은 데이터를 묶어 보낼지가 있다">
<defs><marker id="packet-adv-prac-map-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
