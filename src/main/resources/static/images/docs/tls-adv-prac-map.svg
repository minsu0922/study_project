<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="실무 지도. 로드 밸런서에는 ① 인증서 만료 관리와 ② 체인 파일, ④ TLS를 끝낼 위치, ⑤ HSTS, ⑥ 0-RTT 허용 범위가 모여 있다. 앱이 사내 API를 부르는 자리에는 ③ 신뢰 저장소에 사내 뿌리 인증서를 더하는 일이 있다">
