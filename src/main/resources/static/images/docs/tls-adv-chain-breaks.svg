<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="사슬 그림. 서버가 사이트 인증서와 중간 인증서를 내밀면, 클라이언트는 서명을 따라 올라가 신뢰 저장소의 뿌리 인증서와 맞춘다. 사이트 인증서에서는 만료일과 이름 목록이, 중간 인증서에서는 빠진 고리가, 신뢰 저장소에서는 사내 뿌리가 없는 것이, 클라이언트 쪽에서는 틀린 시계가 검증을 끊는다">
