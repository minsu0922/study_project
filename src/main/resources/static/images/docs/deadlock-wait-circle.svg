<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" role="img" aria-label="기다림의 원. 스레드 1은 1001번 락을 쥐고 2002번 락을 기다리고, 스레드 2는 2002번 락을 쥐고 1001번 락을 기다린다. 화살표를 따라가면 처음 자리로 돌아온다. 둘레에 상호 배제, 점유 대기, 비선점, 순환 대기 꼬리표가 붙어 있다">
<defs><marker id="deadlock-wait-circle-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker><marker id="deadlock-wait-circle-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-bad" fill="#dc2626"/></marker></defs>
<rect x="260" y="50" width="120" height="40" rx="6" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="320" y="76" class="f-t" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">스레드 1</text>
<rect x="260" y="290" width="120" height="40" rx="6" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
