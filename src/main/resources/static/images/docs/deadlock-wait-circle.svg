<text x="160" y="196" class="f-new" fill="#4f46e5" font-size="14" text-anchor="middle" font-weight="700">1001번 락</text>
<rect x="420" y="170" width="120" height="40" rx="6" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="480" y="196" class="f-new" fill="#4f46e5" font-size="14" text-anchor="middle" font-weight="700">2002번 락</text>
<path d="M262 90 L190 168" class="f-line" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
<text x="208" y="124" class="f-t" fill="#0f172a" font-size="12" text-anchor="end">쥐고 있음</text>
<path d="M378 90 L448 166" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#deadlock-wait-circle-head)"/>
<text x="424" y="122" class="f-acc" fill="#4f46e5" font-size="12" font-weight="700">기다림</text>
<path d="M450 212 L378 290" class="f-line" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
<text x="432" y="262" class="f-t" fill="#0f172a" font-size="12">쥐고 있음</text>
<path d="M262 290 L192 214" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#deadlock-wait-circle-head)"/>
<text x="216" y="262" class="f-acc" fill="#4f46e5" font-size="12" text-anchor="end" font-weight="700">기다림</text>
<text x="320" y="184" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">화살표를 따라가면</text>
<text x="320" y="204" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">처음 자리로 돌아온다</text>
<rect x="16" y="16" width="170" height="48" rx="6" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="28" y="37" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">상호 배제</text>
<text x="28" y="55" class="f-sm" fill="#556274" font-size="12">락마다 한 스레드만 쥠</text>
<rect x="454" y="16" width="170" height="48" rx="6" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="466" y="37" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">점유 대기</text>
<text x="466" y="55" class="f-sm" fill="#556274" font-size="12">쥔 채 기다림</text>
<rect x="16" y="330" width="170" height="48" rx="6" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="28" y="351" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">비선점</text>
