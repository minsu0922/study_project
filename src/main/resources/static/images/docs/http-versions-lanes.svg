<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 554" role="img" aria-label="세 컷 그림. HTTP/1.1은 연결 하나에서 요청 A가 끝나야 B와 C를 보낸다. HTTP/2는 A·B·C를 한 연결에 섞어 보내지만, B의 조각 하나가 사라지면 TCP가 순서를 맞추느라 A와 C도 함께 멈춘다. HTTP/3는 줄마다 따로 순서를 맞춰, B만 기다리고 A와 C는 먼저 도착한다">
<rect x="0" y="0" width="640" height="130" rx="8" class="f-panel" fill="#f1f5f9"/><text x="16" y="28" class="f-b" fill="#0f172a" font-size="15" font-weight="700">① HTTP/1.1: 연결 하나에서 하나씩</text>
<text x="16" y="70" class="f-sm" fill="#556274" font-size="13">연결 1</text>
<rect x="150" y="54" width="116" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="204.2" y="72" class="f-sm" fill="#556274" font-size="13">A</text>
<rect x="270" y="54" width="116" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="324.2" y="72" class="f-sm" fill="#556274" font-size="13">B</text>
<rect x="390" y="54" width="116" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="444.2" y="72" class="f-sm" fill="#556274" font-size="13">C</text>
<text x="16" y="110" class="f-sm" fill="#556274" font-size="13">A가 끝나야 B, B가 끝나야 C</text>
<rect x="0" y="142" width="640" height="200" rx="8" class="f-panel" fill="#f1f5f9"/><text x="16" y="170" class="f-b" fill="#0f172a" font-size="15" font-weight="700">② HTTP/2: 한 연결에 섞어 보내지만, 조각 하나에 모두 멈춘다</text>
<text x="16" y="210" class="f-sm" fill="#556274" font-size="13">스트림 A</text>
<rect x="150" y="192" width="76" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="184.2" y="210" class="f-sm" fill="#556274" font-size="13">A</text>
<rect x="230" y="192" width="156" height="26" rx="6" class="f-line" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><text x="236" y="210" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">기다림</text>
<rect x="390" y="192" width="76" height="26" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="414.0" y="210" class="f-sm" fill="#556274" font-size="13">A 끝</text>
<text x="16" y="246" class="f-sm" fill="#556274" font-size="13">스트림 B</text>
<rect x="150" y="228" width="76" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="184.2" y="246" class="f-sm" fill="#556274" font-size="13">B</text>
<rect x="230" y="228" width="36" height="26" rx="8" class="f-house" fill="#f1f5f9" stroke="#556274" stroke-width="1.5"/><line transform="rotate(45 248 241)" x1="240" y1="241" x2="256" y2="241" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 248 241)" x1="240" y1="241" x2="256" y2="241" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<rect x="270" y="228" width="116" height="26" rx="6" class="f-line" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><text x="276" y="246" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">기다림</text>
<rect x="390" y="228" width="76" height="26" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="414.0" y="246" class="f-sm" fill="#556274" font-size="13">B 끝</text>
<text x="16" y="282" class="f-sm" fill="#556274" font-size="13">스트림 C</text>
<rect x="150" y="264" width="76" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="184.2" y="282" class="f-sm" fill="#556274" font-size="13">C</text>
<rect x="230" y="264" width="156" height="26" rx="6" class="f-line" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><text x="236" y="282" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">기다림</text>
<rect x="390" y="264" width="76" height="26" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="414.0" y="282" class="f-sm" fill="#556274" font-size="13">C 끝</text>
<text x="16" y="328" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">TCP가 바이트 순서를 맞추느라 A와 C도 B의 다시 보낸 조각을 기다린다</text>
<rect x="0" y="354" width="640" height="200" rx="8" class="f-panel" fill="#f1f5f9"/><text x="16" y="382" class="f-b" fill="#0f172a" font-size="15" font-weight="700">③ HTTP/3: 줄마다 따로 순서를 맞춘다</text>
<text x="16" y="422" class="f-sm" fill="#556274" font-size="13">스트림 A</text>
<rect x="150" y="404" width="76" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="184.2" y="422" class="f-sm" fill="#556274" font-size="13">A</text>
<rect x="230" y="404" width="76" height="26" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="254.0" y="422" class="f-sm" fill="#556274" font-size="13">A 끝</text>
<text x="16" y="458" class="f-sm" fill="#556274" font-size="13">스트림 B</text>
<rect x="150" y="440" width="76" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="184.2" y="458" class="f-sm" fill="#556274" font-size="13">B</text>
<rect x="230" y="440" width="36" height="26" rx="8" class="f-house" fill="#f1f5f9" stroke="#556274" stroke-width="1.5"/><line transform="rotate(45 248 453)" x1="240" y1="453" x2="256" y2="453" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 248 453)" x1="240" y1="453" x2="256" y2="453" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<rect x="270" y="440" width="116" height="26" rx="6" class="f-line" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><text x="276" y="458" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">기다림</text>
<rect x="390" y="440" width="76" height="26" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="414.0" y="458" class="f-sm" fill="#556274" font-size="13">B 끝</text>
<text x="16" y="494" class="f-sm" fill="#556274" font-size="13">스트림 C</text>
<rect x="150" y="476" width="76" height="26" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="184.2" y="494" class="f-sm" fill="#556274" font-size="13">C</text>
<rect x="230" y="476" width="76" height="26" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="254.0" y="494" class="f-sm" fill="#556274" font-size="13">C 끝</text>
<text x="16" y="540" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">사라진 조각이 있는 B만 기다리고, A와 C는 먼저 끝난다</text>
</svg>
