<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="실무 지도. 브라우저 보관함의 쿠키 한 줄은 이름·값·도메인·경로 칸으로 나뉜다. 이름 칸에는 ③ 남과 겹치지 않는 이름이, 값 칸에는 ④ 로그인 쿠키에 번호만 담을지와 ⑤ URL 인코딩, ⑥ 서명만 할지 서버에 둘지가, 도메인 칸에는 ② 하위 사이트끼리 나눌지가, 맡기는 응답과 지우는 응답에는 ① 같은 범위를 쓰는지가 있다">
