<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="실무 지도. 주문 서버 안에는 ① 연결 시간 제한과 읽기 시간 제한, ② 거절과 무응답을 가르는 재시도 규칙, ③ 커넥션 풀이 쓰지 않는 연결을 들고 있는 시간이 있다. 오래 붙는 웹소켓 연결에는 ④ keepalive와 하트비트 가운데 무엇으로 살았는지 볼지가, 로드 밸런서와 배포 사이에는 ⑤ 서버를 내리는 순서가 있다">
