<text x="334" y="370" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">2</text>
<text x="354" y="370" class="f-t" fill="#0f172a" font-size="13">거절은 다른 서버로, 무응답은 간격</text>
<circle cx="34" cy="391" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="34" y="396" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">3</text>
<text x="54" y="396" class="f-t" fill="#0f172a" font-size="13">안 쓰는 연결은 방화벽 시간보다 짧게</text>
<circle cx="334" cy="391" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="334" y="396" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">4</text>
<text x="354" y="396" class="f-t" fill="#0f172a" font-size="13">keepalive냐 하트비트냐</text>
<circle cx="34" cy="417" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="34" y="422" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">5</text>
<text x="54" y="422" class="f-t" fill="#0f172a" font-size="13">배포 때 서버를 내리는 순서</text>
