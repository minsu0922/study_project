<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-label="사다리 그림. 브라우저가 HTTPS로 요청을 보내면 로드 밸런서가 TLS를 풀어 평문으로 앱에 넘긴다. 헤더를 보지 않는 앱은 HTTP 요청으로 보고 HTTPS로 넘기라는 301을 돌려준다. 브라우저가 다시 HTTPS로 보내도 같은 일이 되풀이된다">
<defs><marker id="tls-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="30" y="10" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="72.0" y="32" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">브라우저</text>
<line x1="100" y1="60" x2="100" y2="470" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="260" y="10" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="290.9" y="32" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">로드 밸런서</text>
<text x="295.4" y="51" class="f-sm" fill="#556274" font-size="13">TLS를 푼다</text>
<line x1="330" y1="60" x2="330" y2="470" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="480" y="10" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="524.9" y="32" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">앱 서버</text>
<text x="503.5" y="51" class="f-sm" fill="#556274" font-size="13">헤더를 안 본다</text>
<line x1="550" y1="60" x2="550" y2="470" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M100 90 L322 112" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tls-loop)"/>
<text x="152.0" y="84" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">HTTPS GET /cart</text>
<path d="M330 168 L542 190" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tls-loop)"/>
<text x="385.4" y="162" class="f-t" fill="#0f172a" font-size="14">평문 GET /cart</text>
<path d="M550 246 L338 268" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tls-loop)"/>
<text x="356.0" y="240" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">301 https://.../cart</text>
<text x="348.6" y="288" class="f-sm" fill="#556274" font-size="13">평문이니 HTTP로 보고 넘긴다</text>
<path d="M330 324 L108 346" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tls-loop)"/>
<text x="177.8" y="318" class="f-t" fill="#0f172a" font-size="14">301 그대로</text>
<path d="M100 402 L322 424" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tls-loop)"/>
<text x="152.0" y="396" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">HTTPS GET /cart</text>
<text x="128.4" y="444" class="f-sm" fill="#556274" font-size="13">처음과 같은 요청이 또 간다</text>
<text x="16" y="486" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">브라우저가 넘기기 횟수 한도에 닿아 오류를 띄울 때까지 되풀이된다</text>
</svg>
