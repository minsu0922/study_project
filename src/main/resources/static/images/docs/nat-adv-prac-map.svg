<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="실무 지도. 사설 서버들이 NAT 게이트웨이를 거쳐 외부 API를 부르는 길에 ① 연결을 다시 쓸지와 ② HTTP 클라이언트 객체를 하나로 둘지가 있다. 집 공유기 뒤 개발 PC에는 ③ 포트 포워딩과 터널 가운데 무엇으로 보여 줄지가, 두 브라우저 사이에는 ④ 직접 잇기와 TURN 중계 가운데 무엇을 쓸지가 있다">
