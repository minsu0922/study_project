<text x="498" y="290" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">직접 잇기 → 안 되면 TURN</text>
<circle cx="34" cy="325" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
