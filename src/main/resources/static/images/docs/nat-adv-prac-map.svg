<text x="54" y="330" class="f-t" fill="#0f172a" font-size="13">연결을 다시 쓸지 (바깥 포트 아끼기)</text>
<circle cx="334" cy="325" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
