<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="실무 지도. 요청이 지나는 프록시에는 ④ 응답 압축, ⑤ 헤더 크기 한도, ⑥ 로그에 남길 헤더가 있다. 앱의 컨트롤러에는 ③ Content-Type이 다른 본문을 거절할지가, 응답을 만드는 자리에는 ① CSV를 청크로 흘려보낼지와 ⑦ 내려받기 파일 이름을 인코딩할지가 있다. 앱이 외부 API를 부르는 자리에는 ② 응답을 닫는지가 있다">
