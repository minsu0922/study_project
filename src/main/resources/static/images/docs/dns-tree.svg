<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="이름 나무. 맨 위 루트 아래에 com과 kr 갈래가 있고, com 아래에 example.com, 그 아래에 shop과 api가 있다. 위층은 다음 층이 어디 있는지만 알고, IP 주소는 맨 아래 example.com의 장부에만 있다">
<line x1="200" y1="60" x2="120" y2="110" class="f-line" stroke="#0f172a" stroke-width="1.5"/>
<line x1="200" y1="60" x2="300" y2="110" class="f-line" stroke="#0f172a" stroke-width="1.5"/>
<line x1="120" y1="150" x2="120" y2="200" class="f-line" stroke="#0f172a" stroke-width="1.5"/>
<line x1="120" y1="240" x2="70" y2="290" class="f-line" stroke="#0f172a" stroke-width="1.5"/>
<line x1="120" y1="240" x2="210" y2="290" class="f-line" stroke="#0f172a" stroke-width="1.5"/>
<rect x="140" y="20" width="120" height="40" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="154" y="46" class="f-b" fill="#0f172a" font-size="15" font-weight="700">루트</text>
<rect x="70" y="110" width="100" height="40" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="84" y="136" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">com</text>
<rect x="250" y="110" width="100" height="40" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="264" y="136" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">kr</text>
<rect x="40" y="200" width="170" height="40" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="54" y="226" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">example.com</text>
<rect x="20" y="290" width="100" height="40" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="34" y="316" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">shop</text>
<rect x="160" y="290" width="100" height="40" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="174" y="316" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">api</text>
<text x="20" y="362" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">203.0.113.10</text>
<text x="20" y="382" class="f-sm" fill="#556274" font-size="13">shop의 IP 주소</text>
<text x="380" y="36" class="f-b" fill="#0f172a" font-size="15" font-weight="700">루트 서버</text>
<text x="380" y="58" class="f-sm" fill="#556274" font-size="13">com 서버가 어디 있는지만 안다</text>
<text x="380" y="126" class="f-b" fill="#0f172a" font-size="15" font-weight="700">com 서버</text>
<text x="380" y="148" class="f-sm" fill="#556274" font-size="13">example.com 장부가 어디 있는지 안다</text>
<rect x="372" y="196" width="258" height="120" rx="4" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="386" y="220" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">example.com 권한 서버의 장부</text>
<text x="386" y="248" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">shop</text>
<text x="450" y="248" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">→ 203.0.113.10</text>
<text x="386" y="274" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">api</text>
<text x="450" y="274" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">→ 203.0.113.20</text>
<text x="386" y="300" class="f-sm" fill="#556274" font-size="13">IP 주소는 여기에만 있다</text>
<text x="380" y="362" class="f-sm" fill="#556274" font-size="13">이름은 오른쪽 끝(com)부터</text>
<text x="380" y="382" class="f-sm" fill="#556274" font-size="13">나무를 따라 내려가며 읽는다</text>
</svg>
