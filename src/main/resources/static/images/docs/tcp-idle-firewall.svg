<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="장면과 막대. 정산 서버가 10분 넘게 쉰 연결로 요청을 보내자, 기록을 이미 지운 방화벽이 알리지 않고 버려 은행 API에 닿지 않는다. 정산 서버는 30초 기다리다 실패한다. 방화벽은 10분 쉰 연결을 지우는데 풀은 30분까지 들고 있었고, 풀을 5분으로 줄이면 방화벽보다 먼저 닫는다">
