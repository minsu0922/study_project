<text x="268" y="318" class="f-new" fill="#4f46e5" font-size="13" font-weight="700">5분</text>
<path d="M320 216 V332" class="f-cloud" fill="none" stroke="#556274" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="320" y="366" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">방화벽이 지우기 전에 풀이 먼저 닫아야 침묵만 들리는 통화가 없다</text>
