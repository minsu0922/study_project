<text x="586" y="120" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">은행 API</text>
<text x="586" y="142" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">요청이 닿지 않음</text>
<text x="24" y="202" class="f-b" fill="#0f172a" font-size="15" font-weight="700">쉰 연결을 얼마나 들고 있나</text>
<text x="24" y="238" class="f-t" fill="#0f172a" font-size="13">방화벽이 지우는 때</text>
