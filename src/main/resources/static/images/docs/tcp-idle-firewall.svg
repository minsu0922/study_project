<text x="300" y="156" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">알리지 않고 버린다</text>
<rect x="352" y="30" width="172" height="80" rx="4" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="364" y="52" class="f-sm" fill="#556274" font-size="12">방화벽 장부</text>
