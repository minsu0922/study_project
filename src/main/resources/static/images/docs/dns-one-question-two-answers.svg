<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-label="안내 데스크 그림. 묻는 쪽이 UDP로 네임 서버의 53번 포트에 'shop.example.com의 IP는?'이라는 질문 하나를 보낸다. 네임 서버의 답은 두 가지뿐이다. 답 ①은 '이 이름은 203.0.113.10이다', 답 ②는 '다음은 com 서버에 물어라'다. 답이 너무 길면 TCP 53으로 다시 묻는다">
<defs><marker id="dns-one-question-two-answers-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="16" y="56" width="112" height="96" rx="8" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="72" y="100" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">묻는 쪽</text>
<text x="72" y="124" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">리졸버 등</text>
<rect x="146" y="40" width="270" height="76" rx="4" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="160" y="64" class="f-sm" fill="#556274" font-size="13">질문 · UDP · 받는 포트 53</text>
<text x="160" y="96" class="f-b" fill="#0f172a" font-size="15" font-weight="700">shop.example.com의 IP는?</text>
<path d="M420 78 H462" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#dns-one-question-two-answers-head)"/>
<rect x="468" y="40" width="156" height="128" rx="8" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="546" y="70" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">네임 서버</text>
<text x="546" y="92" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">안내 데스크</text>
<line x1="490" y1="110" x2="602" y2="110" class="f-line" stroke="#0f172a" stroke-width="1"/>
<line x1="490" y1="130" x2="602" y2="130" class="f-line" stroke="#0f172a" stroke-width="1"/>
<text x="546" y="156" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">자기 층 장부만 본다</text>
<text x="16" y="218" class="f-acc" fill="#4f46e5" font-size="15" font-weight="700">답은 둘 중 하나다</text>
<path d="M500 172 C470 230 450 250 430 256" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#dns-one-question-two-answers-head)"/>
<path d="M580 172 C560 300 470 318 430 322" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#dns-one-question-two-answers-head)"/>
<rect x="16" y="232" width="408" height="50" rx="6" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<rect x="22" y="238" width="396" height="38" rx="4" class="f-hl" fill="#eef2ff"/>
<text x="34" y="263" class="f-new" fill="#4f46e5" font-size="15" font-weight="700">답 ①  이 이름은 203.0.113.10이다</text>
<rect x="16" y="298" width="408" height="50" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="34" y="329" class="f-b" fill="#0f172a" font-size="15" font-weight="700">답 ②  다음은 com 서버에 물어라</text>
<text x="624" y="362" class="f-sm" fill="#556274" font-size="13" text-anchor="end">답이 너무 길면 TCP 53으로 다시 묻는다</text>
</svg>
