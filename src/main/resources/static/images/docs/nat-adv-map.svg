<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="경비실 장부의 한 줄 하나에서 세 가지 문제가 갈라진다. 칸이 모자라고, 줄이 없고, 줄이 엉뚱한 곳을 가리킨다">
<defs><marker id="nat-adv-map-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker><marker id="nat-adv-map-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-bad" fill="#dc2626"/></marker></defs>
<g transform="translate(40 30) scale(1.4)"><path d="M0 18 L30 2 L60 18 Z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="6" y="18" width="48" height="34" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="14" y="25" width="32" height="14" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/></g>
<text x="82" y="122" class="f-b" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">공유기 = 경비실</text>
<rect x="150" y="34" width="450" height="82" rx="8" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="166" y="58" class="f-acc" fill="#4f46e5" font-size="14" text-anchor="start" font-weight="700">장부(변환 표)의 한 줄</text>
<rect x="166" y="70" width="418" height="32" rx="4" class="f-hl" fill="#eef2ff" stroke="none" stroke-width="0"/>
<text x="178" y="91" class="f-mono" fill="#0f172a" font-size="13" text-anchor="start" font-family="ui-monospace, Consolas, monospace">바깥 40001번  →  안쪽 192.168.0.12:51000 (1203호)</text>
<path d="M375 118 L116 168" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#nat-adv-map-head)"/>
<rect x="20" y="172" width="192" height="136" rx="10" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="34" y="200" class="f-acc" fill="#4f46e5" font-size="16" text-anchor="start" font-weight="700">① 칸이 모자란다</text>
<text x="34" y="228" class="f-b" fill="#0f172a" font-size="14" text-anchor="start" font-weight="700">행사 날 결제가</text>
<text x="34" y="248" class="f-b" fill="#0f172a" font-size="14" text-anchor="start" font-weight="700">줄줄이 실패</text>
<text x="34" y="292" class="f-sm" fill="#556274" font-size="13" text-anchor="start">→ 번호표가 바닥난다</text>
<path d="M375 118 L323 168" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#nat-adv-map-head)"/>
<rect x="227" y="172" width="192" height="136" rx="10" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="241" y="200" class="f-acc" fill="#4f46e5" font-size="16" text-anchor="start" font-weight="700">② 줄이 없다</text>
<text x="241" y="228" class="f-b" fill="#0f172a" font-size="14" text-anchor="start" font-weight="700">친구와 영상통화가</text>
<text x="241" y="248" class="f-b" fill="#0f172a" font-size="14" text-anchor="start" font-weight="700">직접 안 이어진다</text>
<text x="241" y="292" class="f-sm" fill="#556274" font-size="13" text-anchor="start">→ 먼저 보낸 적이 없다</text>
<path d="M375 118 L530 168" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#nat-adv-map-head)"/>
<rect x="434" y="172" width="192" height="136" rx="10" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="448" y="200" class="f-acc" fill="#4f46e5" font-size="16" text-anchor="start" font-weight="700">③ 줄이 엉뚱한 곳</text>
<text x="448" y="228" class="f-b" fill="#0f172a" font-size="14" text-anchor="start" font-weight="700">어제 되던 포워딩이</text>
<text x="448" y="248" class="f-b" fill="#0f172a" font-size="14" text-anchor="start" font-weight="700">오늘 안 된다</text>
<text x="448" y="292" class="f-sm" fill="#556274" font-size="13" text-anchor="start">→ 주소가 바뀌거나 겹친다</text>
</svg>