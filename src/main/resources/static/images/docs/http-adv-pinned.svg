<rect x="0" y="0" width="640" height="230" rx="8" class="f-panel" fill="#f1f5f9"/><text x="16" y="28" class="f-b" fill="#0f172a" font-size="15" font-weight="700">① L4 로드 밸런서: 연결 두 개가 A와 B에 붙는다</text>
