<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" role="img" aria-label="두 컷 그림. L4 로드 밸런서는 연결 단위로 서버를 고르므로, 클라이언트의 연결 두 개가 서버 A와 B에 붙은 채 모든 요청이 그 둘로만 간다. 새로 늘린 C와 D는 논다. L7 로드 밸런서는 요청마다 서버를 골라 네 대에 고르게 나눈다">
