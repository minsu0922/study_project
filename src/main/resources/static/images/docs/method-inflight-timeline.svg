<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-label="시간 막대 두 컷. 고치기 전에는 첫 요청이 결제사 답을 4초 기다리는 동안 키를 적지 않아, 3초에 온 재시도가 키 목록이 비어 있다고 보고 결제를 한 번 더 해 결제가 2건이 된다. 고친 뒤에는 첫 요청이 0초에 키를 처리 중으로 적어, 3초에 온 재시도는 409로 끝나고 결제는 1건이다">
<defs><marker id="method-inflight-timeline-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="24" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">고치기 전 · 끝난 뒤에야 키를 적는다</text>
<text x="16" y="60" class="f-sm" fill="#556274" font-size="12">요청 1</text>
<text x="16" y="96" class="f-sm" fill="#556274" font-size="12">재시도</text>
<rect x="100" y="44" width="336" height="24" rx="4" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="110" y="61" class="f-t" fill="#0f172a" font-size="12">결제사 답을 기다림 4초</text>
<rect x="352" y="80" width="168" height="24" rx="4" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="362" y="97" class="f-bad" fill="#dc2626" font-size="12" font-weight="700">결제 한 번 더</text>
<path d="M100 120 H520" class="f-cloud" fill="none" stroke="#556274" stroke-width="1.2"/>
<text x="100" y="136" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">0초</text>
<text x="184" y="136" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">1초</text>
<text x="268" y="136" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">2초</text>
<text x="352" y="136" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">3초</text>
<text x="436" y="136" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">4초</text>
<text x="520" y="136" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">5초</text>
<path d="M352 36 V124" class="f-cloud" fill="none" stroke="#556274" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="352" y="158" class="f-bad" fill="#dc2626" font-size="12" font-weight="700" text-anchor="middle">3초: 키 목록이 비어 있다 → 처음 보는 키로 판단</text>
<text x="548" y="76" class="f-bad" fill="#dc2626" font-size="15" font-weight="700">결제 2건</text>
<text x="16" y="200" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">고친 뒤 · 처리 중부터 적는다</text>
<text x="16" y="236" class="f-sm" fill="#556274" font-size="12">요청 1</text>
<text x="16" y="272" class="f-sm" fill="#556274" font-size="12">재시도</text>
<rect x="100" y="220" width="336" height="24" rx="4" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="110" y="237" class="f-t" fill="#0f172a" font-size="12">처리 중으로 적고 결제 4초</text>
<rect x="352" y="256" width="34" height="24" rx="4" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="394" y="273" class="f-new" fill="#4f46e5" font-size="12" font-weight="700">409로 끝</text>
<path d="M100 296 H520" class="f-cloud" fill="none" stroke="#556274" stroke-width="1.2"/>
<text x="100" y="312" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">0초</text>
<text x="184" y="312" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">1초</text>
<text x="268" y="312" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">2초</text>
<text x="352" y="312" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">3초</text>
<text x="436" y="312" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">4초</text>
<text x="520" y="312" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">5초</text>
<path d="M352 212 V300" class="f-cloud" fill="none" stroke="#556274" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="352" y="334" class="f-new" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">3초: 키가 '처리 중' → 일을 하지 않는다</text>
<text x="548" y="252" class="f-new" fill="#4f46e5" font-size="15" font-weight="700">결제 1건</text>
</svg>
