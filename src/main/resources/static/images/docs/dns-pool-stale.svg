<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-label="커넥션 풀 그림. 주문 앱의 풀에 연결 20개가 있다. 22시 10분에 멈춘 주 DB와 맺은 옛 연결들은 이름을 다시 묻지 않고, 응답 없는 DB를 30초씩 기다리다 끊긴다. 새로 맺은 연결만 이름을 다시 물어 대기 DB로 간다. 22시 11분에 리졸버는 새 답을 주지만, 옛 연결이 모두 바뀐 22시 18분에야 오류가 그친다">
