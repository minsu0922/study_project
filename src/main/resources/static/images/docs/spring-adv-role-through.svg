<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="요청 본문의 nickname 길동이 아래에 role ADMIN이 끼어 있다. @RequestBody Member로 Member 객체에 role ADMIN이 채워지고, save로 회원 테이블 7번 줄의 role이 USER에서 ADMIN으로 바뀌며, 관리자 화면 접근이 허용된다. 화살표 어디에도 칸을 걸러 내는 자리가 없다">
<defs><marker id="spring-adv-role-through-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="160" y="28" class="f-acc" fill="#4f46e5" font-size="12" text-anchor="middle" font-weight="700" font-family="ui-monospace, Consolas, monospace">@RequestBody Member</text>
<text x="320" y="28" class="f-acc" fill="#4f46e5" font-size="12" text-anchor="middle" font-weight="700" font-family="ui-monospace, Consolas, monospace">save</text>
<rect x="15" y="46" width="130" height="196" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="80" y="72" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="700">손님 주문서</text>
<text x="80" y="92" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">요청 본문</text>
<rect x="175" y="46" width="130" height="196" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="240" y="72" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="700">재료 상자</text>
<text x="240" y="92" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">Member 객체</text>
<rect x="335" y="46" width="130" height="196" rx="6" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="400" y="72" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="700">창고 장부 7번 줄</text>
<text x="400" y="92" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">회원 테이블</text>
<rect x="495" y="46" width="130" height="196" rx="6" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="560" y="72" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle" font-weight="700">관리자 화면</text>
<text x="560" y="92" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">접근 결과</text>
<text x="80" y="130" class="f-mono" fill="#0f172a" font-size="12" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">nickname:</text>
<text x="80" y="150" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">길동이</text>
<rect x="25" y="172" width="110" height="46" rx="6" class="f-hl" fill="#eef2ff"/>
<text x="80" y="192" class="f-sm" fill="#556274" font-size="11" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">role:</text>
<text x="80" y="209" class="f-new" fill="#4f46e5" font-size="13" text-anchor="middle" font-weight="700" font-family="ui-monospace, Consolas, monospace">ADMIN</text>
<text x="240" y="130" class="f-mono" fill="#0f172a" font-size="12" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">nickname:</text>
<text x="240" y="150" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">길동이</text>
<rect x="185" y="172" width="110" height="46" rx="6" class="f-hl" fill="#eef2ff"/>
<text x="240" y="192" class="f-sm" fill="#556274" font-size="11" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">role:</text>
<text x="240" y="209" class="f-new" fill="#4f46e5" font-size="13" text-anchor="middle" font-weight="700" font-family="ui-monospace, Consolas, monospace">ADMIN</text>
<text x="400" y="130" class="f-sm" fill="#556274" font-size="12" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">role:</text>
<text x="400" y="152" class="f-mono" fill="#0f172a" font-size="14" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">USER</text>
<path d="M378 147 H422" class="f-strike" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
<rect x="345" y="172" width="110" height="46" rx="6" class="f-hl" fill="#eef2ff"/>
<text x="400" y="201" class="f-new" fill="#4f46e5" font-size="14" text-anchor="middle" font-weight="700" font-family="ui-monospace, Consolas, monospace">ADMIN</text>
<text x="560" y="140" class="f-bad" fill="#dc2626" font-size="15" text-anchor="middle" font-weight="700">접근 허용</text>
<text x="560" y="166" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">길동이가</text>
<text x="560" y="186" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">관리자가 된다</text>
<path d="M147 62 H173" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#spring-adv-role-through-head)"/>
<path d="M307 62 H333" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#spring-adv-role-through-head)"/>
<path d="M467 62 H493" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#spring-adv-role-through-head)"/>
<text x="320" y="282" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">화살표 어디에도 칸을 걸러 내는 자리가 없다</text>
<text x="320" y="304" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">role은 모양을 바꾸지 않고 마지막 칸까지 내려간다</text>
</svg>
