<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="카페 장면. 사용자가 카페 와이파이에서 로그인할 때 비밀번호는 HTTPS로 잠겨 간다. 이어서 상품 목록을 HTTP로 열자 로그인 쿠키 sid가 평문으로 실려 가고, 같은 와이파이의 공격자가 그 쿠키를 읽어 자기 브라우저에 넣고 주문한다. 고친 뒤에는 모든 화면이 HTTPS이고 쿠키에 Secure를 붙인다">
<defs><marker id="tls-prac-cookie-leak-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<g transform="translate(30 60) scale(1.3)"><rect x="8" y="2" width="44" height="30" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="13" y="7" width="34" height="20" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><path d="M2 36 h56 l-4 6 h-48 z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="68" y="136" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">사용자</text>
<g transform="translate(540 50) scale(1.0)"><rect x="4" y="2" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="12" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="25" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="35" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="48" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="58" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="570" y="136" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">쇼핑몰</text>
<path d="M120 84 H530" class="f-line" fill="none" stroke="#0f172a" stroke-width="7"/>
<g transform="translate(310 58) scale(1.2)"><path d="M4 9 V6 a5 5 0 0 1 10 0 V9" class="f-line" fill="none" stroke="#0f172a" stroke-width="2"/><rect x="1" y="9" width="16" height="12" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/></g>
<text x="325" y="108" class="f-new" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">① https · 로그인 · 비밀번호 잠김</text>
<path d="M120 170 H530" class="f-line" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="325" y="160" class="f-bad" fill="#dc2626" font-size="12" font-weight="700" text-anchor="middle">② http · 상품 목록 · Cookie: sid=9f2c7a</text>
<g transform="translate(290 210) scale(1.1)"><rect x="8" y="2" width="44" height="30" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="13" y="7" width="34" height="20" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><path d="M2 36 h56 l-4 6 h-48 z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="323" y="276" class="f-bad" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">같은 와이파이의 공격자</text>
<path d="M325 176 V206" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#tls-prac-cookie-leak-head)"/>
<text x="16" y="316" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700">고친 뒤: 모든 화면을 HTTPS로 · 쿠키에 Secure · HSTS로 다음부터 처음부터 HTTPS</text>
<text x="420" y="236" class="f-sm" fill="#556274" font-size="12">쿠키를 자기 브라우저에 넣고</text>
<text x="420" y="254" class="f-bad" fill="#dc2626" font-size="12" font-weight="700">비밀번호 없이 주문</text>
</svg>
