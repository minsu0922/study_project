<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="선 그래프. 결제사로 가는 요청 수는 평소 초당 100건이다. 2분부터 4분까지 결제사가 점검하자, 곧바로 세 번 다시 보내는 쪽은 초당 400건으로 뛰고 점검이 끝난 뒤에도 실패와 회복을 오가 14분에야 가라앉는다. Retry-After를 지키는 쪽은 점검 동안 100건을 넘지 않고, 4분에 잠깐 늘었다가 6분에 평소로 돌아온다">
