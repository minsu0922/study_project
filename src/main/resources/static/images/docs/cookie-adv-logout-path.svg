<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="세 컷 그림. 브라우저 보관함에 remember 쿠키가 경로 /app으로 저장돼 있다. 로그아웃 응답은 remember를 경로 /로 지우라고 보내, 브라우저는 맞는 쿠키를 찾지 못하고 아무것도 지우지 않는다. 다음 사람이 정산 화면을 열자 /app 요청에 remember 쿠키가 실려 앞 사람으로 다시 로그인된다">
<defs><marker id="cookie-adv-logout-path-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="30" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">① 로그인 때 맡김</text>
<rect x="16" y="44" width="188" height="250" rx="8" class="f-panel" fill="#f1f5f9"/>
<text x="226" y="30" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">② 로그아웃 응답</text>
<rect x="226" y="44" width="188" height="250" rx="8" class="f-panel" fill="#f1f5f9"/>
<text x="436" y="30" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">③ 다음 사람이 연다</text>
<rect x="436" y="44" width="188" height="250" rx="8" class="f-panel" fill="#f1f5f9"/>
<text x="30" y="74" class="f-sm" fill="#556274" font-size="12">브라우저 보관함</text>
<rect x="28" y="86" width="164" height="54" rx="6" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="40" y="108" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">remember</text>
<text x="40" y="128" class="f-mono" fill="#0f172a" font-size="13" font-family="ui-monospace, Consolas, monospace">Path=/app</text>
<text x="30" y="170" class="f-sm" fill="#556274" font-size="12">맡긴 쪽: 로그인 코드</text>
<text x="30" y="190" class="f-t" fill="#0f172a" font-size="13">본관 3층 12번 열쇠</text>
<rect x="238" y="86" width="164" height="54" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="250" y="108" class="f-mono" fill="#0f172a" font-size="13" font-family="ui-monospace, Consolas, monospace">remember=;</text>
<text x="250" y="128" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace">Max-Age=0; Path=/</text>
<text x="240" y="170" class="f-sm" fill="#556274" font-size="12">Path=/인 remember를</text>
<text x="240" y="188" class="f-bad" fill="#dc2626" font-size="13" font-weight="700">찾았지만 없다</text>
<text x="240" y="220" class="f-t" fill="#0f172a" font-size="13">"본관 12번 버리세요"</text>
<text x="240" y="240" class="f-sm" fill="#556274" font-size="12">→ 그런 열쇠 없음</text>
<rect x="28" y="228" width="164" height="54" rx="6" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="40" y="250" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">remember</text>
<text x="40" y="270" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700">Path=/app 그대로</text>
<text x="30" y="218" class="f-sm" fill="#556274" font-size="12">로그아웃 뒤에도</text>
<path d="M196 255 H232" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#cookie-adv-logout-path-head)"/>
<rect x="448" y="70" width="164" height="90" rx="5" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<rect x="448" y="70" width="164" height="22" rx="5" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<circle cx="460" cy="81" r="3" class="f-dot" fill="#4f46e5"/>
<circle cx="471" cy="81" r="3" class="f-dot" fill="#4f46e5"/>
<circle cx="482" cy="81" r="3" class="f-dot" fill="#4f46e5"/>
<text x="530" y="124" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">정산 화면</text>
<text x="450" y="186" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace">GET /app/settle</text>
<text x="450" y="206" class="f-mono" fill="#0f172a" font-size="11" font-family="ui-monospace, Consolas, monospace">Cookie: remember=r-7f…</text>
<text x="450" y="240" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">앞 사람 계정으로</text>
<text x="450" y="260" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">다시 로그인된다</text>
<text x="320" y="330" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">지울 때 적은 층(경로)이 맡길 때와 달라, 브라우저는 다른 열쇠를 지우라는 말로 들었다</text>
</svg>
