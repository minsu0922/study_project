<text x="354" y="270" class="f-t" fill="#0f172a" font-size="13">HTTP/2면 요청 단위 L7</text>
<circle cx="34" cy="291" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
