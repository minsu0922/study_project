<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" role="img" aria-label="홀 직원(컨트롤러)이 OrderDetailResponse 접시를 손님에게 낸다. 첫째 줄은 orderId 1024와 totalPrice 39000이다. 접시 위에는 Member 재료 상자가 통째로 얹혀 있어 buyer.name, buyer.email, buyer.password, buyer.memo가 함께 나가고, 손님이 buyer.password 칸을 가리킨다">
