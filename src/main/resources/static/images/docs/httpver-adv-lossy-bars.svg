<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-label="묶음 막대 그래프. 메뉴 화면 표시 시간(상위 95%)이 와이파이에서는 HTTP/1.1 0.8초, HTTP/2 0.5초, HTTP/3 0.5초다. 조각 2%가 사라지는 지하철 LTE에서는 HTTP/1.1 1.2초, HTTP/2 2.1초, HTTP/3 1.1초로, HTTP/2만 거꾸로 느려진다">
<defs><marker id="httpver-adv-lossy-bars-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="30" class="f-b" fill="#0f172a" font-size="14" font-weight="700">메뉴 화면 표시 시간 (상위 95%)</text>
<rect x="330" y="18" width="18" height="16" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="354" y="31" class="f-sm" fill="#556274" font-size="12">HTTP/1.1</text>
<rect x="430" y="18" width="18" height="16" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="454" y="31" class="f-sm" fill="#556274" font-size="12">HTTP/2</text>
<rect x="530" y="18" width="18" height="16" rx="2" class="f-dot" fill="#4f46e5"/>
<text x="554" y="31" class="f-sm" fill="#556274" font-size="12">HTTP/3</text>
<rect x="80" y="202.0" width="50" height="88.0" rx="3" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="105" y="194.0" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">0.8초</text>
<rect x="146" y="235.0" width="50" height="55.0" rx="3" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="171" y="227.0" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">0.5초</text>
<rect x="212" y="235.0" width="50" height="55.0" rx="3" class="f-dot" fill="#4f46e5"/>
<text x="237" y="227.0" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">0.5초</text>
<text x="171" y="314" class="f-b" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">와이파이</text>
<rect x="370" y="158.0" width="50" height="132.0" rx="3" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="395" y="150.0" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">1.2초</text>
<rect x="436" y="59.0" width="50" height="231.0" rx="3" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="461" y="51.0" class="f-bad" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">2.1초</text>
<rect x="502" y="169.0" width="50" height="121.0" rx="3" class="f-dot" fill="#4f46e5"/>
<text x="527" y="161.0" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">1.1초</text>
<text x="461" y="314" class="f-b" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">지하철 LTE · 조각 2% 손실</text>
<path d="M50 290 H600" class="f-line" fill="none" stroke="#0f172a" stroke-width="1.5"/>
<text x="320" y="340" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">조각이 자주 사라지는 망에서는, 한 연결에 모두 실은 HTTP/2만 거꾸로 느려진다</text>
</svg>
