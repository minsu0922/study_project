<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-label="시간표. 위 줄 스레드 1(나에서 친구로)은 t1에 1001번 락을 획득하고 t3부터 2002번 락 앞에서 대기한다. 아래 줄 스레드 2(친구에서 나로)는 t2에 2002번 락을 획득하고 t4부터 1001번 락 앞에서 대기한다. t4 뒤로 두 대기 띠가 끝나지 않고 이어진다">
<defs><marker id="deadlock-timeline-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker><marker id="deadlock-timeline-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-bad" fill="#dc2626"/></marker></defs>
<path d="M180 46 V250" class="f-cloud" fill="none" stroke="#556274" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="180" y="270" class="f-t" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">t1</text>
<path d="M280 46 V250" class="f-cloud" fill="none" stroke="#556274" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="280" y="270" class="f-t" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">t2</text>
<path d="M380 46 V250" class="f-cloud" fill="none" stroke="#556274" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="380" y="270" class="f-t" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">t3</text>
<path d="M480 46 V250" class="f-cloud" fill="none" stroke="#556274" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="480" y="270" class="f-t" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">t4</text>
<path d="M150 252 H620" class="f-line" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="620" y="290" class="f-sm" fill="#556274" font-size="12" text-anchor="end">시간 →</text>
<text x="16" y="82" class="f-t" fill="#0f172a" font-size="14" font-weight="700">스레드 1</text>
<text x="16" y="102" class="f-sm" fill="#556274" font-size="12">나 → 친구</text>
<text x="16" y="182" class="f-t" fill="#0f172a" font-size="14" font-weight="700">스레드 2</text>
<text x="16" y="202" class="f-sm" fill="#556274" font-size="12">친구 → 나</text>
<rect x="180" y="60" width="440" height="24" rx="4" class="f-hl" fill="#eef2ff"/>
<text x="190" y="77" class="f-new" fill="#4f46e5" font-size="13" font-weight="700">1001번 락 쥠</text>
<rect x="380" y="92" width="240" height="24" rx="4" class="f-house" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="390" y="109" class="f-t" fill="#0f172a" font-size="13">2002번 락 대기</text>
<rect x="280" y="160" width="340" height="24" rx="4" class="f-hl" fill="#eef2ff"/>
<text x="290" y="177" class="f-new" fill="#4f46e5" font-size="13" font-weight="700">2002번 락 쥠</text>
<rect x="480" y="192" width="140" height="24" rx="4" class="f-house" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="490" y="209" class="f-t" fill="#0f172a" font-size="13">1001번 락 대기</text>
<path d="M600 104 H632" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#deadlock-timeline-head)"/>
<path d="M600 204 H632" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#deadlock-timeline-head)"/>
<text x="320" y="26" class="f-bad" fill="#dc2626" font-size="13" text-anchor="middle" font-weight="700">t4 뒤로 회색 대기 띠 두 줄이 끝나지 않는다</text>
</svg>
