<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-label="두 칸 그림. TTL이 86400초면 리졸버는 권한 서버에 하루 1번만 묻지만, 주소를 바꾸면 옛 답이 최대 24시간 남는다. TTL이 30초면 옛 답은 30초 뒤 사라지지만, 리졸버가 하루 2,880번 묻는다">
