<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="두 줄 비교 그림. 앞단에서 TLS를 끝내면 브라우저와 로드 밸런서 사이만 잠기고, 로드 밸런서와 앱 서버 사이는 평문이며 로드 밸런서가 X-Forwarded-Proto: https 꼬리표를 붙인다. 앱 서버까지 TLS를 이으면 두 구간이 모두 잠기고 앱이 원래 프로토콜을 직접 안다">
<defs><marker id="tls-adv-termination-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="24" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">앞단에서 TLS 종료</text>
<g transform="translate(24 54) scale(1.0)"><rect x="8" y="2" width="44" height="30" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="13" y="7" width="34" height="20" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><path d="M2 36 h56 l-4 6 h-48 z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="54" y="116" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">브라우저</text>
