<text x="315" y="82" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">로드 밸런서</text>
<g transform="translate(536 38) scale(0.8)"><rect x="4" y="2" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="12" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="25" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="35" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="48" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="58" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="560" y="116" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">앱 서버</text>
<path d="M90 77 H246" class="f-line" fill="none" stroke="#0f172a" stroke-width="6"/>
<g transform="translate(158 50) scale(1.1)"><path d="M4 9 V6 a5 5 0 0 1 10 0 V9" class="f-line" fill="none" stroke="#0f172a" stroke-width="2"/><rect x="1" y="9" width="16" height="12" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/></g>
<path d="M384 77 H530" class="f-line" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="456" y="66" class="f-bad" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">평문</text>
<rect x="388" y="88" width="140" height="26" rx="4" class="f-hl" fill="#eef2ff"/>
<text x="458" y="106" class="f-mono" fill="#0f172a" font-size="11" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">X-Forwarded-Proto</text>
<text x="458" y="136" class="f-acc" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">꼬리표로만 안다</text>
<text x="16" y="180" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">앱 서버까지 TLS</text>
<g transform="translate(24 210) scale(1.0)"><rect x="8" y="2" width="44" height="30" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="13" y="7" width="34" height="20" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><path d="M2 36 h56 l-4 6 h-48 z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="54" y="272" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">브라우저</text>
