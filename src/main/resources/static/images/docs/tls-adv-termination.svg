<text x="560" y="272" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">앱 서버</text>
<path d="M90 233 H246" class="f-line" fill="none" stroke="#0f172a" stroke-width="6"/>
<g transform="translate(158 206) scale(1.1)"><path d="M4 9 V6 a5 5 0 0 1 10 0 V9" class="f-line" fill="none" stroke="#0f172a" stroke-width="2"/><rect x="1" y="9" width="16" height="12" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/></g>
<path d="M384 233 H530" class="f-line" fill="none" stroke="#0f172a" stroke-width="6"/>
<g transform="translate(448 206) scale(1.1)"><path d="M4 9 V6 a5 5 0 0 1 10 0 V9" class="f-line" fill="none" stroke="#0f172a" stroke-width="2"/><rect x="1" y="9" width="16" height="12" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/></g>
<text x="456" y="278" class="f-new" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">잠겨 있다 · 직접 안다</text>
<text x="320" y="318" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">경비가 상자를 어디서 여느냐에 따라, 안쪽 직원이 보는 것이 달라진다</text>
