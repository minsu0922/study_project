<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="막대 그림. 주문 다섯 건을 처리할 때, 주문마다 연결을 새로 열면 건마다 인사 150ms와 요청 160ms로 310ms씩 든다. 커넥션 풀로 연결을 다시 쓰면 첫 주문만 310ms이고 나머지 네 건은 160ms씩이다">
