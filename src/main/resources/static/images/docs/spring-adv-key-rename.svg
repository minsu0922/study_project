<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img" aria-label="세 단계 그림. 첫째 상태는 장부와 접시 이름표가 nickname이고 앱에 닉네임이 보인다. 칸 이름 변경을 배포한 둘째 상태는 장부가 display_name, 접시 이름표가 displayName이고 서버 오류는 0건이다. 다음 날 앱을 실행한 셋째 상태는 앱이 nickname 이름표를 찾지 못해 빈 접시를 본다. from 한 줄로 nickname 키를 복구하면 첫째 상태로 돌아간다">
<defs><marker id="spring-adv-key-rename-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="209" y="26" class="f-acc" fill="#4f46e5" font-size="12" text-anchor="middle" font-weight="700">칸 이름 변경 배포</text>
