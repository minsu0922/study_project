<text x="240" y="112" class="f-mono" fill="#0f172a" font-size="13" font-family="ui-monospace, Consolas, monospace">display_name</text>
<text x="240" y="142" class="f-sm" fill="#556274" font-size="12">접시 이름표</text>
<text x="240" y="162" class="f-new" fill="#4f46e5" font-size="13" font-weight="700" font-family="ui-monospace, Consolas, monospace">displayName</text>
<text x="240" y="192" class="f-sm" fill="#556274" font-size="12">서버</text>
<rect x="236" y="200" width="158" height="56" rx="6" class="f-hl" fill="#eef2ff"/>
<text x="315" y="233" class="f-acc" fill="#4f46e5" font-size="13" text-anchor="middle" font-weight="700">서버 오류 0건</text>
