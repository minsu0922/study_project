<text x="454" y="92" class="f-sm" fill="#556274" font-size="12">창고 장부 품목</text>
<text x="454" y="112" class="f-mono" fill="#0f172a" font-size="13" font-family="ui-monospace, Consolas, monospace">display_name</text>
<text x="454" y="142" class="f-sm" fill="#556274" font-size="12">접시 이름표</text>
