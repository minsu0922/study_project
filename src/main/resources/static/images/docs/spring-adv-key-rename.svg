<text x="26" y="142" class="f-sm" fill="#556274" font-size="12">접시 이름표</text>
<text x="26" y="162" class="f-mono" fill="#0f172a" font-size="13" font-family="ui-monospace, Consolas, monospace">nickname</text>
<text x="26" y="192" class="f-sm" fill="#556274" font-size="12">앱 화면</text>
<rect x="22" y="200" width="158" height="56" rx="6" class="f-hl" fill="#eef2ff"/>
<text x="101" y="233" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">닉네임 길동이</text>
