<text x="315" y="306" class="f-acc" fill="#4f46e5" font-size="13" text-anchor="middle" font-weight="700">from 한 줄로 nickname 키 복구</text>
<text x="320" y="350" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">②에서 서버는 멀쩡했고, 고장은 ③의 앱 화면에서만 드러났다</text>
</svg>
