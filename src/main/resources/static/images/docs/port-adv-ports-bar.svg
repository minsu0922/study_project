<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="가로 막대 그림. 같은 목적지로 요청마다 새 연결을 열면 60초 동안 묶이는 임시 포트가 30,000개로, 운영체제가 빌려줄 수 있는 28,232개를 넘는다. 연결 50개를 열어 두고 돌려 쓰면 묶이는 포트는 50개라 막대가 거의 보이지 않는다">
<defs><marker id="port-adv-ports-bar-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="30" class="f-b" fill="#0f172a" font-size="14" font-weight="700">60초 뒤 묶여 있는 임시 포트 · 초당 500건</text>
<text x="16" y="94" class="f-t" fill="#0f172a" font-size="13">요청마다 새 연결</text>
<rect x="170.0" y="70.0" width="360.0" height="36.0" rx="3" class="f-dot" fill="#dc2626"/>
<text x="538.0" y="94" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">30,000</text>
<text x="16" y="164" class="f-t" fill="#0f172a" font-size="13">빌려줄 수 있는 수</text>
<rect x="170" y="140" width="338.784" height="36" rx="3" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="516.784" y="164" class="f-sm" fill="#556274" font-size="14">28,232</text>
<text x="16" y="234" class="f-t" fill="#0f172a" font-size="13">연결 50개 돌려 쓰기</text>
<rect x="170.0" y="210.0" width="3.0" height="36.0" rx="3" class="f-dot" fill="#4f46e5"/>
<text x="181" y="234" class="f-new" fill="#4f46e5" font-size="14" font-weight="700">50</text>
<path d="M508.8 60 V250" class="f-line" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="508.784" y="270" class="f-bad" fill="#dc2626" font-size="12" font-weight="700" text-anchor="end">여기를 넘으면 새 연결이 실패한다</text>
</svg>
