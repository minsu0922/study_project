<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="두 줄 그림. 고치기 전에는 + 버튼이 POST increase를 보내고, 답을 잃어 재시도하면 수량이 1에서 2, 다시 3이 된다. 고친 뒤에는 앱이 계산한 결과 값 quantity 2를 PUT으로 보내, 재시도해도 수량은 2로 남는다">
<defs><marker id="method-prac-cart-retry-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="24" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">고치기 전 · 하나 늘려 달라고 부탁한다</text>
<g transform="translate(20 44) scale(1.1)"><rect x="3" y="2" width="24" height="46" rx="5" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="7" y="8" width="16" height="30" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="15" cy="43" r="2" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="37" y="116" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">+ 한 번</text>
<rect x="150" y="52" width="110" height="64" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="205" y="44" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">처음</text>
<text x="205" y="96" class="f-b" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">수량 1</text>
<rect x="310" y="52" width="110" height="64" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="365" y="44" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">첫 요청</text>
<text x="365" y="96" class="f-b" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">수량 2</text>
<path d="M264 84 H304" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#method-prac-cart-retry-head)"/>
<rect x="470" y="52" width="110" height="64" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="525" y="44" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">재시도</text>
<text x="525" y="96" class="f-bad" fill="#dc2626" font-size="17" font-weight="700" text-anchor="middle">수량 3</text>
<path d="M424 84 H464" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#method-prac-cart-retry-head)"/>
<text x="150" y="140" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace">POST …/increase</text>
<text x="16" y="176" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">고친 뒤 · 결과 값을 통째로 보낸다</text>
<g transform="translate(20 196) scale(1.1)"><rect x="3" y="2" width="24" height="46" rx="5" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="7" y="8" width="16" height="30" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="15" cy="43" r="2" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="37" y="268" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">+ 한 번</text>
<rect x="150" y="204" width="110" height="64" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="205" y="196" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">처음</text>
<text x="205" y="248" class="f-b" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">수량 1</text>
<rect x="310" y="204" width="110" height="64" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="365" y="196" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">첫 요청</text>
<text x="365" y="248" class="f-b" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">수량 2</text>
<path d="M264 236 H304" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#method-prac-cart-retry-head)"/>
<rect x="470" y="204" width="110" height="64" rx="8" class="f-hl" fill="#eef2ff"/>
<text x="525" y="196" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">재시도</text>
<text x="525" y="248" class="f-new" fill="#4f46e5" font-size="17" font-weight="700" text-anchor="middle">수량 2</text>
<path d="M424 236 H464" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#method-prac-cart-retry-head)"/>
<text x="150" y="292" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace">PUT {"quantity": 2}</text>
<text x="320" y="330" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">재시도 코드는 그대로다. 요청에 결과 값을 실은 것만으로 같은 재시도가 안전해졌다</text>
</svg>
