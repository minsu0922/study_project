<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-label="장면과 그래프. 결제 서버가 이름을 다시 물을 때마다 꺼진 첫 리졸버 10.0.0.2에 먼저 묻고 5초를 기다린 뒤, 둘째 리졸버 10.0.0.3에서 답을 받는다. 자바가 답을 30초 저장하므로, 결제 응답 시간 그래프가 30초마다 5초씩 튀어 톱니 모양이 된다">
