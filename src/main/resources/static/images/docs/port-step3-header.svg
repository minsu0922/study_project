<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="패킷 앞머리는 두 층이다. 바깥 IP 앞머리에는 보내는 IP와 받는 IP가 적혀 컴퓨터를 찾고, 그 안의 TCP·UDP 앞머리에는 보내는 포트와 받는 포트가 적혀 프로그램을 찾는다. 그 안에 실제 데이터가 든다">
<defs><marker id="port-step3-header-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="10" y="14" width="420" height="330" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="26" y="42" class="f-b" fill="#0f172a" font-size="15" font-weight="700">IP 앞머리</text>
<text x="26" y="70" class="f-sm" fill="#556274" font-size="13">보내는 IP</text>
<text x="116" y="70" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">192.168.0.10</text>
<text x="26" y="94" class="f-sm" fill="#556274" font-size="13">받는 IP</text>
<text x="116" y="94" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">203.0.113.7</text>
<rect x="26" y="114" width="388" height="214" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="42" y="142" class="f-b" fill="#0f172a" font-size="15" font-weight="700">TCP·UDP 앞머리</text>
<rect x="40" y="156" width="360" height="26" rx="3" class="f-hl" fill="#eef2ff"/>
<text x="48" y="174" class="f-sm" fill="#556274" font-size="13">보내는 쪽 번호</text>
<text x="160" y="174" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">51000</text>
<rect x="40" y="188" width="360" height="26" rx="3" class="f-hl" fill="#eef2ff"/>
<text x="48" y="206" class="f-sm" fill="#556274" font-size="13">받는 쪽 번호</text>
<text x="160" y="206" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">80</text>
<rect x="42" y="230" width="356" height="82" rx="4" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="220" y="266" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">데이터</text>
<text x="220" y="290" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">웹 페이지 요청 내용</text>
<path d="M432 82 H470" class="f-line" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M416 190 H470" class="f-line" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="478" y="76" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">컴퓨터를 찾는 칸</text>
<text x="478" y="98" class="f-sm" fill="#556274" font-size="13">= 단지 주소</text>
<text x="478" y="184" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">프로그램을 찾는 칸</text>
<text x="478" y="206" class="f-sm" fill="#556274" font-size="13">= 동·호수</text>
<text x="478" y="266" class="f-sm" fill="#556274" font-size="13">운영체제는</text>
<text x="478" y="286" class="f-sm" fill="#556274" font-size="13">받는 쪽 번호를 보고</text>
<text x="478" y="306" class="f-sm" fill="#556274" font-size="13">넘길 곳을 정한다</text>
</svg>
