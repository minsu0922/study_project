<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="송금 요청이 왼쪽에서 들어와 오른쪽 응답으로 나가는 길. 길 위에 차례로 락 순서 기준(계좌 번호 또는 해시값과 동점 처리), 락 종류(synchronized 또는 ReentrantLock tryLock), 락 안의 호출, DB 연결 빌리기와 풀 크기, 행 잠금 순서, 롤백 오류(재시도 또는 실패 반환)가 놓인다. 길 위쪽 옆에서 건강 검사가 스레드를 주기적으로 살핀다. 두 갈래로 갈라지는 곳은 세 곳이다">
