<text x="475.0" y="277.0" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">shop-123.host.example</text>
<rect x="16" y="220" width="220" height="80" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
