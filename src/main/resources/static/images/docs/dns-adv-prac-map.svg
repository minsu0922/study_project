<text x="344.0" y="141.0" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">url: db.internal</text>
<circle cx="410" cy="90" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="410" y="95" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">2</text>
