<text x="54" y="336" class="f-t" fill="#0f172a" font-size="13">레코드 TTL을 몇 초로 둘지</text>
<circle cx="334" cy="331" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="334" y="336" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">2</text>
<text x="354" y="336" class="f-t" fill="#0f172a" font-size="13">설정에 IP를 적을지 이름을 적을지</text>
<circle cx="34" cy="357" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="34" y="362" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">3</text>
<text x="54" y="362" class="f-t" fill="#0f172a" font-size="13">업체 서버에 CNAME으로 붙일지</text>
<circle cx="334" cy="357" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="334" y="362" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">4</text>
<text x="354" y="362" class="f-t" fill="#0f172a" font-size="13">JVM DNS 캐시와 연결 최대 수명</text>
