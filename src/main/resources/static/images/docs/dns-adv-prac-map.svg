<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="실무 지도. 권한 서버의 장부 줄에는 ① TTL을 몇 초로 둘지가 있다. 앱의 설정 파일에는 ② 접속 주소를 IP로 적을지 이름으로 적을지가, 업체가 운영하는 서버와 내 이름 사이에는 ③ CNAME으로 붙일지가, 자바 앱 안에는 ④ JVM DNS 캐시와 커넥션 풀 연결 수명이 있다">
<defs><marker id="dns-adv-prac-map-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="16" y="40" width="200" height="110" rx="8" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
