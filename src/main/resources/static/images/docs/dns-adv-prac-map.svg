<text x="264" y="62" class="f-b" fill="#0f172a" font-size="14" font-weight="700">자바 앱</text>
<rect x="264" y="76" width="160" height="96" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
