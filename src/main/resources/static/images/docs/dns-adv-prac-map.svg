<text x="523.0" y="141.0" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">DNS 캐시 · 커넥션 풀</text>
<circle cx="596" cy="90" r="13" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="596" y="95" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700" text-anchor="middle">4</text>
<path d="M264 140 C230 140 220 120 220 110" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#dns-adv-prac-map-head)"/>
<text x="120" y="172" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">이름을 묻는다</text>
<rect x="330" y="220" width="290" height="80" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
