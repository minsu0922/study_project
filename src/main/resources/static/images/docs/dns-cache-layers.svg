<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="두 컷 그림. 브라우저 캐시에 답이 있으면 질문은 거기서 끝나 운영체제·리졸버·권한 서버까지 가지 않는다. ipconfig /flushdns로 운영체제 캐시를 지운 뒤에는 질문이 리졸버까지 가고, 리졸버가 남은 180초를 붙여 저장한 답을 준다. 권한 서버에는 묻지 않는다">
