<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="90일 시간 막대. 0일에 받은 인증서는 60일째부터 갱신을 시도하지만, 80번 포트가 막혀 매일 실패하고 실패 메일은 퇴사자 메일함으로 간다. 바깥에서 만료일을 쟀다면 남은 날이 21일이 되는 69일째에 경보가 울렸다. 실제로는 아무도 모른 채 90일째 새벽 3시 12분에 만료됐다">
