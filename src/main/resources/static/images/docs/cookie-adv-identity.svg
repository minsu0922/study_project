<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-label="브라우저 보관함에 이름이 sid로 같은 쿠키가 두 개 있다. 하나는 경로 /, 다른 하나는 경로 /app이다. /app 아래 요청에는 두 쿠키가 함께 실려 Cookie: sid=new; sid=old로 가고, 서버가 앞의 것만 읽으면 어느 값이 먼저 올지 알 수 없다">
<defs><marker id="cookie-id-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="16" y="20" width="608" height="150" rx="8" class="f-house" fill="#f1f5f9" stroke="#556274" stroke-width="1.5"/>
<text x="32" y="46" class="f-b" fill="#0f172a" font-size="15" font-weight="700">브라우저 보관함 · www.example.com</text>
<text x="40" y="76" class="f-sm" fill="#556274" font-size="13">이름</text>
<text x="150" y="76" class="f-sm" fill="#556274" font-size="13">값</text>
<text x="260" y="76" class="f-sm" fill="#556274" font-size="13">도메인</text>
<text x="470" y="76" class="f-sm" fill="#556274" font-size="13">경로</text>
<rect x="30" y="82" width="580" height="30" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="40" y="104" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">sid</text>
<text x="150" y="104" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">old</text>
<text x="260" y="104" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">example.com</text>
<text x="470" y="104" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">/</text>
<rect x="30" y="116" width="580" height="30" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="40" y="138" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">sid</text>
<text x="150" y="138" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">new</text>
<text x="260" y="138" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">example.com</text>
<text x="470" y="138" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">/app</text>
<path d="M320 176 V222" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#cookie-id-head)"/>
<text x="340" y="206" class="f-sm" fill="#556274" font-size="13">GET /app/home 요청</text>
<rect x="16" y="228" width="608" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="32" y="259" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">Cookie: sid=new; sid=old</text>
<text x="16" y="310" class="f-sm" fill="#556274" font-size="13">경로 칸이 달라 둘 다 남고, 두 범위에 모두 맞는 요청에는 둘 다 실린다</text>
<text x="16" y="334" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">서버가 첫 값만 읽으면 어느 쪽이 먼저 올지에 따라 결과가 갈린다</text>
</svg>
