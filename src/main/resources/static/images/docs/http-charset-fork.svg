<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="갈라지는 그림. 송장에 Content-Type: text/plain만 있고 charset 칸이 비어 있다. 같은 본문 바이트를 관리 화면은 UTF-8로 읽어 &#x27;무선 마우스&#x27;로 보이고, 자바 17로 윈도우에서 도는 정산 배치는 MS949로 읽어 알아볼 수 없는 글자가 된다">
