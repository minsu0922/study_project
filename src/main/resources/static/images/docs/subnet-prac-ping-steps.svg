<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="가까운 곳부터 차례로 ping을 보내는 그림. 빌드 서버 10.0.1.50에서 같은 층 PC는 응답한다. 게이트웨이 10.0.1.1도 응답한다. 게이트웨이 너머 바깥 코드 저장소만 응답이 없으니, 서버 설정이 아니라 게이트웨이 너머의 방화벽을 확인한다">
<defs><marker id="subnet-prac-ping-steps-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<g transform="translate(24 90) scale(1.0)"><rect x="4" y="2" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="12" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="25" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="35" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="48" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="58" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="54" y="180" class="f-b" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">빌드 서버</text>
<text x="54" y="200" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">10.0.1.50 /24</text>
<text x="54" y="220" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">gw 10.0.1.1</text>
<rect x="140" y="92" width="120" height="70" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="200" y="118" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">① 같은 층 PC</text>
<text x="200" y="140" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">10.0.1.23</text>
<path d="M192 190 L197.3 195.6 L208 183.6" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="220" class="f-new" fill="#4f46e5" font-size="13" font-weight="700" text-anchor="middle">응답</text>
<rect x="290" y="92" width="120" height="70" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="350" y="118" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">② 게이트웨이</text>
<text x="350" y="140" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">10.0.1.1</text>
<path d="M342 190 L347.3 195.6 L358 183.6" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="220" class="f-new" fill="#4f46e5" font-size="13" font-weight="700" text-anchor="middle">응답</text>
<rect x="450" y="92" width="120" height="70" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="510" y="118" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">③ 코드 저장소</text>
<text x="510" y="140" class="f-mono" fill="#0f172a" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">바깥</text>
<path d="M501 181 L519 199 M519 181 L501 199" class="f-strike" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<text x="510" y="220" class="f-bad" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">응답 없음</text>
<path d="M88 126 H136" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#subnet-prac-ping-steps-head)"/>
<path d="M264 126 H286" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#subnet-prac-ping-steps-head)"/>
<path d="M414 126 H446" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#subnet-prac-ping-steps-head)"/>
<path d="M432 70 V250" class="f-line" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="436" y="64" class="f-sm" fill="#556274" font-size="12">게이트웨이 너머</text>
<text x="320" y="284" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">③에서만 끊기면 서버가 아니라 게이트웨이 너머의 방화벽을 묻는다</text>
</svg>
