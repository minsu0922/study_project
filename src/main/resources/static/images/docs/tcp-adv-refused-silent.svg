<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 618" role="img" aria-label="두 컷 그림. 거절은 SYN에 RST가 바로 돌아와 왕복 한 번 만에 끝난다. 무응답은 SYN이 방화벽에서 사라지고, 클라이언트가 1초, 2초, 4초로 간격을 늘려 SYN을 다시 보내며 기다린다">
<rect x="0" y="0" width="640" height="260" rx="8" class="f-panel" fill="#f1f5f9"/><text x="16" y="28" class="f-b" fill="#0f172a" font-size="15" font-weight="700">① 거절: 포트에 프로그램이 없으면 RST가 바로 온다</text>
<g transform="translate(0 34)">
<defs><marker id="tcp-ref" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="80" y="6" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="115.0" y="28" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">클라이언트</text>
<line x1="150" y1="56" x2="150" y2="200" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="420" y="6" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="476.0" y="28" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">서버</text>
<text x="460.2" y="47" class="f-sm" fill="#556274" font-size="13">포트 닫힘</text>
<line x1="490" y1="56" x2="490" y2="200" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M150 86 L482 108" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tcp-ref)"/>
<text x="307.4" y="80" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">SYN</text>
<path d="M490 148 L158 170" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tcp-ref)"/>
<text x="307.4" y="142" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">RST</text>
<text x="205.6" y="190" class="f-sm" fill="#556274" font-size="13">왕복 한 번 만에 ConnectException</text>
</g>
<rect x="0" y="272" width="640" height="346" rx="8" class="f-panel" fill="#f1f5f9"/><text x="16" y="300" class="f-b" fill="#0f172a" font-size="15" font-weight="700">② 무응답: 답이 없어 간격을 늘려 SYN을 다시 보낸다</text>
<g transform="translate(0 306)">
<defs><marker id="tcp-sil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="40" y="6" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="75.0" y="28" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">클라이언트</text>
<line x1="110" y1="56" x2="110" y2="276" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="250" y="6" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="299.0" y="28" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">방화벽</text>
<text x="285.4" y="47" class="f-sm" fill="#556274" font-size="13">SYN을 버림</text>
<line x1="320" y1="56" x2="320" y2="276" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="460" y="6" width="140" height="50" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="516.0" y="28" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">서버</text>
<text x="517.0" y="47" class="f-sm" fill="#556274" font-size="13">꺼짐</text>
<line x1="530" y1="56" x2="530" y2="276" class="f-line" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M110 86 L320.0 104" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
<line transform="rotate(45 328.0 108)" x1="318.0" y1="108" x2="338.0" y2="108" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 328.0 108)" x1="318.0" y1="108" x2="338.0" y2="108" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<text x="202.4" y="80" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">SYN</text>
<path d="M110 136 L320.0 154" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
<line transform="rotate(45 328.0 158)" x1="318.0" y1="158" x2="338.0" y2="158" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 328.0 158)" x1="318.0" y1="158" x2="338.0" y2="158" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<text x="158.6" y="130" class="f-t" fill="#0f172a" font-size="14">1초 뒤 SYN 다시</text>
<path d="M110 186 L320.0 204" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
<line transform="rotate(45 328.0 208)" x1="318.0" y1="208" x2="338.0" y2="208" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 328.0 208)" x1="318.0" y1="208" x2="338.0" y2="208" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<text x="158.6" y="180" class="f-t" fill="#0f172a" font-size="14">2초 뒤 SYN 다시</text>
<path d="M110 236 L320.0 254" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
<line transform="rotate(45 328.0 258)" x1="318.0" y1="258" x2="338.0" y2="258" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 328.0 258)" x1="318.0" y1="258" x2="338.0" y2="258" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<text x="158.6" y="230" class="f-t" fill="#0f172a" font-size="14">4초 뒤 SYN 다시</text>
<text x="16" y="290" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">그동안 스레드는 connect 안에서 멈춰 있다</text>
</g>
</svg>
