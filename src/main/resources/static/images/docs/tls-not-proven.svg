<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="피싱 문자의 주소 parcel-check.example.net을 열면 자물쇠가 뜨고 인증서도 진짜다. 인증서는 이 주소를 다루는 서버와 잠근 통로로 이야기한다는 것만 증명한다. 택배 회사인지, 믿을 만한 사이트인지, 주소 철자가 맞는지는 증명하지 않는다">
<defs><marker id="tls-not-proven-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="24" y="20" width="150" height="300" rx="18" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
