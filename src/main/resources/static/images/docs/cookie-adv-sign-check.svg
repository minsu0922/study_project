<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="세 줄 검사 그림. 서버가 맡긴 진짜 값 welcome=unused와 서명은 검사를 통과한다. 사용자가 값을 used에서 unused로 고친 쿠키는 서명이 맞지 않아 거절된다. 예전에 받아 둔 진짜 쿠키를 다시 보내면 서명도 진짜라 통과한다. 서명은 고친 값만 막는다">
