<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="갈림길 그림. 도착한 프레임은 링크 헤더의 종류 표시로 IP에 넘어가고, IP 헤더의 프로토콜 번호 6으로 TCP에 넘어간다. TCP 헤더의 포트 번호가 443이면 웹 서버 프로그램, 3306이면 MySQL 프로그램에 닿는다. 다른 표시나 번호는 다른 규칙으로 간다">
<defs><marker id="packet-adv-demux-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="16" y="130" width="110" height="60" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="71.0" y="165.0" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">프레임</text>
<rect x="176" y="130" width="90" height="60" rx="8" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="221.0" y="165.0" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">IP</text>
<rect x="316" y="130" width="90" height="60" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="361.0" y="165.0" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">TCP</text>
<rect x="470" y="60" width="150" height="56" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="545.0" y="85.0" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">웹 서버</text>
<text x="545.0" y="105.0" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">포트 443</text>
<rect x="470" y="204" width="150" height="56" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="545.0" y="229.0" class="f-b" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">MySQL</text>
<text x="545.0" y="249.0" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">포트 3306</text>
<path d="M130 160 H170" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#packet-adv-demux-head)"/>
<path d="M270 160 H310" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#packet-adv-demux-head)"/>
<path d="M410 150 C440 140 440 88 464 88" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#packet-adv-demux-head)"/>
<path d="M410 170 C440 180 440 232 464 232" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#packet-adv-demux-head)"/>
<text x="150" y="116" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">종류 표시</text>
<text x="290" y="116" class="f-sm" fill="#556274" font-size="12" text-anchor="middle">번호 6</text>
<text x="150" y="222" class="f-acc" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">링크 헤더가</text>
<text x="290" y="222" class="f-acc" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">IP 헤더가</text>
<text x="430" y="290" class="f-acc" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">TCP 헤더가</text>
<text x="320" y="310" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">층마다 그 층 헤더의 칸 하나가 다음 받는 이를 고른다</text>
</svg>
