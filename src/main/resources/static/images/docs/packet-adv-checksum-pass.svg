<text x="452" y="185" class="f-sm" fill="#556274" font-size="12">TCP 체크섬 통과</text>
<rect x="16" y="196" width="296" height="70" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="30" y="222" class="f-b" fill="#0f172a" font-size="13" font-weight="700">석 달 뒤 복구 연습</text>
<text x="30" y="246" class="f-bad" fill="#dc2626" font-size="13" font-weight="700">"데이터가 손상됐다" · 압축 해제 실패</text>
<rect x="330" y="196" width="294" height="70" rx="6" class="f-hl" fill="#eef2ff"/>
<text x="344" y="222" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700">해시를 맞춰 봤다면</text>
<text x="344" y="246" class="f-new" fill="#4f46e5" font-size="13" font-weight="700">받은 날 sha256 불일치 → 다시 받음</text>
<text x="320" y="300" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">구간 검사값은 구간마다 새로 만들고, 16비트 합은 드물게 같은 값을 낸다</text>
<text x="320" y="324" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">끝에서 끝까지 내용을 확인하는 것은 앱의 해시뿐이다</text>
</svg>
