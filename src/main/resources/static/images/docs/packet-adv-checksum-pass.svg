<text x="210" y="150" class="f-bad" fill="#dc2626" font-size="12" font-weight="700" text-anchor="middle">장비 안에서 비트 하나 바뀜</text>
<path d="M293 150 L297.7 154.9 L307 144.4" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
