<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="브라우저 보관함에 쿠키 셋이 있다. shop.example.com/events/sale로 가는 요청에는 cart와 seen이 실린다. shop.example.com/cart로 가는 요청에는 cart만 실린다. seen은 /events 아래 주소에만 보낸다. lang은 blog.example.com에서 맡긴 쿠키라 어느 요청에도 실리지 않는다">
