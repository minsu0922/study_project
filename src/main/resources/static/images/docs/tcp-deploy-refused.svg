<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="배포 장면과 시간 줄. 서버 2가 15시 00분 00초에 포트를 닫았지만, 로드 밸런서는 다음 확인인 15시 00분 07초까지 서버 2로 새 연결을 보낸다. 그 사이 SYN에는 RST가 돌아와 요청이 실패한다. 고친 순서는 명단에서 빼기, 하던 요청 끝내기, 포트 닫기다">
