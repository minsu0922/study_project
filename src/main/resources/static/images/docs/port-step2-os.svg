<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="컴퓨터에 들어온 패킷은 네트워크 장치를 거쳐 운영체제가 먼저 받는다. 운영체제는 브라우저·메신저·음악 앱 가운데 누구에게 줄지 정해야 하는데, IP 주소에는 그 정보가 없다">
