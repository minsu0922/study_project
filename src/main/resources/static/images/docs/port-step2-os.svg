<rect x="0" y="312" width="640" height="64" rx="8" class="f-panel" fill="#f1f5f9"/>
<text x="16" y="338" class="f-b" fill="#0f172a" font-size="15" font-weight="700">프로세스는 패킷을 직접 받지 못하고 운영체제가 나눠 준다.</text>
<text x="16" y="362" class="f-sm" fill="#556274" font-size="13">그런데 받은 패킷만 봐서는 몇 호(어느 프로그램)인지 모른다.</text>
