<text x="252" y="106" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">랜카드</text>
<path d="M252 122 V160" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#port-step2-os-head)"/>
