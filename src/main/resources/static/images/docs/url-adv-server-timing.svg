<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="쌓인 막대 두 줄. 고치기 전 상품 페이지 첫 바이트 1.03초는 길 60ms, DB 40ms, 재고 API 870ms, 화면 만들기 60ms로 나뉜다. CDN으로 줄일 수 있는 것은 길 60ms뿐이다. 재고 값을 30초 저장해 쓰자 재고 칸이 1ms 아래로 줄어 첫 바이트가 0.16초가 된다">
<defs><marker id="url-adv-server-timing-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="30" class="f-b" fill="#0f172a" font-size="14" font-weight="700">상품 페이지 첫 바이트 · Server-Timing으로 나눈 칸</text>
<text x="40" y="72" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700">고치기 전 · 1.03초</text>
<rect x="40" y="84" width="30.0" height="40" rx="3" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<rect x="70.0" y="84" width="20.0" height="40" rx="3" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<rect x="90.0" y="84" width="435.0" height="40" rx="3" class="f-dot" fill="#dc2626"/>
<text x="307.5" y="72" class="f-bad" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">재고 API 870ms</text>
<rect x="525.0" y="84" width="30.0" height="40" rx="3" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="40" y="192" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700">재고 30초 저장 · 0.16초</text>
<rect x="40" y="204" width="30.0" height="40" rx="3" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<rect x="70.0" y="204" width="20.0" height="40" rx="3" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<rect x="90.0" y="204" width="2.0" height="40" rx="3" class="f-dot" fill="#dc2626"/>
<rect x="92.0" y="204" width="30.0" height="40" rx="3" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<rect x="40" y="140" width="16" height="14" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="62" y="152" class="f-sm" fill="#556274" font-size="12">길 · CDN이 줄이는 몫</text>
<rect x="220" y="140" width="16" height="14" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="242" y="152" class="f-sm" fill="#556274" font-size="12">DB 40 · 화면 만들기 60</text>
<rect x="420.0" y="140" width="16.0" height="14" rx="3" class="f-dot" fill="#dc2626"/>
<text x="442" y="152" class="f-sm" fill="#556274" font-size="12">재고 API</text>
<text x="160" y="230" class="f-new" fill="#4f46e5" font-size="13" font-weight="700">재고 칸이 1ms 아래로 줄었다</text>
<text x="320" y="314" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">늦은 곳은 길이 아니라 인쇄소 안, 재고를 묻는 칸이었다</text>
</svg>
