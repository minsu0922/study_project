<g transform="translate(16 52) scale(1.2)"><rect x="8" y="2" width="44" height="30" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="13" y="7" width="34" height="20" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><path d="M2 36 h56 l-4 6 h-48 z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="16" y="126" class="f-b" fill="#0f172a" font-size="15" font-weight="700">관리팀 PC</text>
<text x="16" y="144" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">10.0.9.20</text>
<g transform="translate(206 50) scale(1.0)"><path d="M18 18 L12 2 M62 18 L68 2" class="f-line" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/><rect x="2" y="18" width="76" height="28" rx="6" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><circle cx="16" cy="32" r="3" class="f-dot" fill="#4f46e5"/><circle cx="28" cy="32" r="3" class="f-dot" fill="#4f46e5"/><circle cx="40" cy="32" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="206" y="114" class="f-b" fill="#0f172a" font-size="15" font-weight="700">관리망 라우터</text>
<text x="206" y="132" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">10.0.2.1</text>
<g transform="translate(470 150) scale(1.1)"><rect x="4" y="2" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="12" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="25" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="35" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="48" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="58" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="398" y="196" class="f-b" fill="#0f172a" font-size="15" font-weight="700">DB 서버</text>
<text x="560" y="168" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">eth1</text>
<text x="548" y="186" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">10.0.2.15</text>
<text x="560" y="226" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">eth0</text>
<text x="548" y="244" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">10.0.1.15</text>
<path d="M104 82 H200" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#subnet-asym-head)"/>
<path d="M290 82 H502 V144" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#subnet-asym-head)"/>
<text x="300" y="70" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">① 요청이 eth1로 들어온다</text>
<path d="M502 232 V330 H306" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#subnet-asym-head)"/>
<text x="316" y="290" class="f-t" fill="#0f172a" font-size="14">② 응답은 기본 게이트웨이</text>
