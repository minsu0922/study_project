<text x="214" y="376" class="f-b" fill="#0f172a" font-size="15" font-weight="700">서비스망 방화벽</text>
<line transform="rotate(45 264 330)" x1="250" y1="330" x2="278" y2="330" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 264 330)" x1="250" y1="330" x2="278" y2="330" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<text x="16" y="412" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">③ 연결 시작을 본 적 없는 응답이라 버린다</text>
<path d="M486 144 V104 H296" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#subnet-asym-head)"/>
<text x="330" y="128" class="f-sm" fill="#556274" font-size="13">정적 라우트를 더하면 이 길로</text>
</svg>
