<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="관리팀 PC의 요청은 관리망 라우터를 거쳐 DB 서버의 eth1로 들어온다. 응답은 받는 쪽 주소가 두 서브넷 어디에도 맞지 않아 기본 게이트웨이 규칙을 타고 eth0으로 나가고, 서비스망 방화벽이 시작을 본 적 없는 응답이라며 버린다">
