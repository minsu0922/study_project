<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-label="갈라지는 그림. 서버가 cert.pem으로 사이트 인증서 하나만 보낸다. 운영자의 브라우저는 예전에 본 중간 인증서로 빈자리를 채워 자물쇠를 띄운다. 제휴사의 자바는 받은 인증서만으로 뿌리까지 잇지 못해 PKIX path building failed 오류로 멈춘다">
