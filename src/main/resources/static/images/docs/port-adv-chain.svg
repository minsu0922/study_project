<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="사용자 요청이 방화벽 443, 로드 밸런서 443을 지나 서버의 호스트 포트 8081로 가고, 컨테이너 포트 8080을 거쳐 0.0.0.0:8080에 바인드한 앱에 닿는다. 헬스 체크는 따로 8081의 /health로 간다. 칸 하나만 다른 번호여도 길이 끊긴다">
<defs><marker id="port-chain-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="10" y="20" width="180" height="92" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="24" y="46" class="f-b" fill="#0f172a" font-size="15" font-weight="700">방화벽</text><text x="24" y="72" class="f-sm" fill="#556274" font-size="13">허용</text><text x="90" y="72" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">443</text>
<rect x="230" y="20" width="180" height="92" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="244" y="46" class="f-b" fill="#0f172a" font-size="15" font-weight="700">로드 밸런서</text><text x="244" y="72" class="f-sm" fill="#556274" font-size="13">받기</text><text x="310" y="72" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">443</text><text x="244" y="94" class="f-sm" fill="#556274" font-size="13">넘기기</text><text x="310" y="94" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">8081</text>
<rect x="450" y="20" width="180" height="92" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="464" y="46" class="f-b" fill="#0f172a" font-size="15" font-weight="700">서버 호스트</text><text x="464" y="72" class="f-sm" fill="#556274" font-size="13">받기</text><text x="530" y="72" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">8081</text><text x="464" y="94" class="f-sm" fill="#556274" font-size="13">넘기기</text><text x="530" y="94" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">8080</text>
<rect x="450" y="180" width="180" height="92" rx="6" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="464" y="206" class="f-b" fill="#0f172a" font-size="15" font-weight="700">컨테이너 안 앱</text><text x="464" y="232" class="f-sm" fill="#556274" font-size="13">바인드</text><text x="530" y="232" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">0.0.0.0</text><text x="464" y="254" class="f-sm" fill="#556274" font-size="13">포트</text><text x="530" y="254" class="f-new" fill="#4f46e5" font-size="14" font-weight="700" font-family="ui-monospace, Consolas, monospace">8080</text>
<path d="M192 66 H224" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#port-chain-head)"/>
<path d="M412 66 H444" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#port-chain-head)"/>
<path d="M540 114 V174" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#port-chain-head)"/>
<path d="M320 114 V226 H444" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#port-chain-head)"/>
<text x="240" y="214" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">헬스 체크</text>
<text x="240" y="248" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">8081 /health</text>
<text x="10" y="150" class="f-sm" fill="#556274" font-size="13">사용자 요청</text>
<text x="10" y="170" class="f-sm" fill="#556274" font-size="13">→ 443으로 들어온다</text>
<text x="10" y="300" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">화살표 앞뒤 번호가 하나만 달라도 그 길이 끊긴다</text>
</svg>
