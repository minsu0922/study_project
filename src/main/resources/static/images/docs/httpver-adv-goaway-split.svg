<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="번호 줄 그림. 서버가 GOAWAY에 마지막 번호 57을 적어 보낸다. 51부터 57까지의 스트림은 서버가 받아 끝까지 처리하고, 연결은 그 뒤에 닫힌다. 59와 61은 서버가 손대지 않았으니 클라이언트가 다른 서버와의 새 연결로 다시 보내며, POST여도 두 번 처리되지 않는다">
<defs><marker id="httpver-adv-goaway-split-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="16" y="30" class="f-b" fill="#0f172a" font-size="15" font-weight="700">GOAWAY · 마지막 번호 57</text>
<rect x="40" y="70" width="72" height="52" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="76" y="103" class="f-b" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">51</text>
<rect x="136" y="70" width="72" height="52" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="172" y="103" class="f-b" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">53</text>
<rect x="232" y="70" width="72" height="52" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="268" y="103" class="f-b" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">55</text>
<rect x="328" y="70" width="72" height="52" rx="8" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="364" y="103" class="f-b" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">57</text>
<rect x="424" y="70" width="72" height="52" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="460" y="103" class="f-b" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">59</text>
<rect x="520" y="70" width="72" height="52" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="556" y="103" class="f-b" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">61</text>
<path d="M413 56 V138" class="f-line" fill="none" stroke="#0f172a" stroke-width="2.5"/>
<text x="419" y="54" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700">57</text>
<rect x="40" y="150" width="360" height="80" rx="8" class="f-hl" fill="#eef2ff"/>
<text x="56" y="176" class="f-new" fill="#4f46e5" font-size="14" font-weight="700">57번까지: 서버가 끝까지 처리한다</text>
<text x="56" y="200" class="f-sm" fill="#556274" font-size="12">주방이 "여기까지는 만들어 드린다"고 약속한 주문</text>
<text x="56" y="218" class="f-sm" fill="#556274" font-size="12">다 끝난 뒤에 연결을 닫는다</text>
<rect x="424" y="150" width="192" height="80" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="438" y="176" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">59·61: 새 연결로</text>
<text x="438" y="200" class="f-sm" fill="#556274" font-size="12">서버가 손대지 않았다</text>
<text x="438" y="218" class="f-sm" fill="#556274" font-size="12">POST여도 안전하다</text>
<text x="320" y="284" class="f-sm" fill="#556274" font-size="13" text-anchor="middle">번호 하나로, 다시 보내도 되는 요청과 기다려야 하는 요청이 갈린다</text>
</svg>
