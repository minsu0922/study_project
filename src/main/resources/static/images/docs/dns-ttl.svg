<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="시간 줄 그림. 13시에 장부를 새 번호로 고친다. 12시 50분에 물은 리졸버 A는 13시 50분까지 옛 번호를 내주고, 13시 01분에 처음 물은 리졸버 B는 바로 새 번호를 내준다. 14시가 지나면 모두 새 번호다">
