<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="IPv4 헤더 칸 그림. 한 줄이 32비트다. 첫 줄은 버전, 헤더 길이, 서비스 종류, 전체 길이다. 둘째 줄은 식별 번호, 플래그, 조각 위치다. 셋째 줄은 TTL, 프로토콜 번호, 헤더 체크섬이다. 넷째 줄은 보낸 주소, 다섯째 줄은 받는 주소다. 헤더 길이, TTL, 프로토콜 번호 칸을 강조했다">
<defs><marker id="packet-adv-ipv4-rows-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<text x="40.0" y="34" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">0</text>
<text x="180.0" y="34" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">8</text>
<text x="320.0" y="34" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">16</text>
<text x="460.0" y="34" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">24</text>
<text x="600.0" y="34" class="f-sm" fill="#556274" font-size="11" text-anchor="middle">32</text>
<rect x="40.0" y="44" width="70.0" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="75.0" y="69" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">버전</text>
<rect x="110.0" y="44" width="70.0" height="40" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="145.0" y="69" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700" text-anchor="middle">헤더 길이</text>
<rect x="180.0" y="44" width="140.0" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="250.0" y="69" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">서비스 종류</text>
<rect x="320.0" y="44" width="280.0" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="460.0" y="69" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">전체 길이</text>
<rect x="40.0" y="90" width="280.0" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="180.0" y="115" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">식별 번호</text>
<rect x="320.0" y="90" width="52.5" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="346.25" y="115" class="f-t" fill="#0f172a" font-size="11" text-anchor="middle">플래그</text>
<rect x="372.5" y="90" width="227.5" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="486.25" y="115" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">조각 위치</text>
<rect x="40.0" y="136" width="140.0" height="40" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="110.0" y="161" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700" text-anchor="middle">TTL</text>
<rect x="180.0" y="136" width="140.0" height="40" rx="2" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="250.0" y="161" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700" text-anchor="middle">프로토콜 번호</text>
<rect x="320.0" y="136" width="280.0" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="460.0" y="161" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">헤더 체크섬</text>
<rect x="40.0" y="182" width="560.0" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="320.0" y="207" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">보낸 주소</text>
<rect x="40.0" y="228" width="560.0" height="40" rx="2" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="320.0" y="253" class="f-t" fill="#0f172a" font-size="13" text-anchor="middle">받는 주소</text>
<text x="40" y="290" class="f-sm" fill="#556274" font-size="12">옵션이 붙으면 다섯째 줄 밑으로 줄이 늘고, 헤더 길이 칸 값이 5보다 커진다</text>
<text x="40" y="314" class="f-acc" fill="#4f46e5" font-size="13" font-weight="700">헤더 길이 칸 × 4 = 헤더 바이트 수 (기본 5 × 4 = 20)</text>
</svg>
