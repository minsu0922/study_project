<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="3층 PC가 마스크를 /16으로 잘못 적어, 4층 서버 192.168.1.20을 같은 서브넷으로 보고 ARP로 부른다. ARP 질문은 3층 안에서만 퍼지고 라우터를 넘지 못해, 4층 서버는 듣지 못하고 답하지 않는다">
<defs><marker id="wrong-mask-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-dot" fill="#4f46e5"/></marker></defs>
<rect x="12" y="34" width="296" height="290" rx="10" class="f-house" fill="#f1f5f9" stroke="#556274" stroke-width="1.5"/>
<text x="26" y="58" class="f-sm" fill="#556274" font-size="13">3층 192.168.0.0/24</text>
<rect x="372" y="34" width="256" height="290" rx="10" class="f-house" fill="#f1f5f9" stroke="#556274" stroke-width="1.5"/>
<text x="386" y="58" class="f-sm" fill="#556274" font-size="13">4층 192.168.1.0/24</text>
<g transform="translate(28 150) scale(1.2)"><rect x="8" y="2" width="44" height="30" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><rect x="13" y="7" width="34" height="20" rx="1" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><path d="M2 36 h56 l-4 6 h-48 z" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/></g>
<text x="26" y="222" class="f-b" fill="#0f172a" font-size="15" font-weight="700">내 PC</text>
<text x="26" y="240" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">192.168.0.10</text>
<text x="26" y="260" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">마스크를 /16으로 적음</text>
<rect x="110" y="76" width="186" height="50" rx="8" class="f-paper" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="122" y="98" class="f-t" fill="#0f172a" font-size="14">ARP: 192.168.1.20</text>
<text x="122" y="118" class="f-t" fill="#0f172a" font-size="14">누구세요?</text>
<path d="M150 150.0 A 40 40 0 0 1 150 190.0" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M180 135.0 A 70 70 0 0 1 180 205.0" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M210 120.0 A 100 100 0 0 1 210 220.0" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 5"/>
<g transform="translate(300 156) scale(1.0)"><path d="M18 18 L12 2 M62 18 L68 2" class="f-line" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/><rect x="2" y="18" width="76" height="28" rx="6" class="f-screen" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><circle cx="16" cy="32" r="3" class="f-dot" fill="#4f46e5"/><circle cx="28" cy="32" r="3" class="f-dot" fill="#4f46e5"/><circle cx="40" cy="32" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="298" y="222" class="f-b" fill="#0f172a" font-size="15" font-weight="700">라우터</text>
<text x="296" y="240" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">192.168.0.1</text>
<line transform="rotate(45 290 176)" x1="278" y1="176" x2="302" y2="176" class="f-strike" stroke="#dc2626" stroke-width="2"/><line transform="rotate(-45 290 176)" x1="278" y1="176" x2="302" y2="176" class="f-strike" stroke="#dc2626" stroke-width="2"/>
<text x="176" y="300" class="f-bad" fill="#dc2626" font-size="14" font-weight="700">ARP는 라우터를 넘지 못한다</text>
<g transform="translate(470 110) scale(1.0)"><rect x="4" y="2" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="12" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="25" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="35" r="3" class="f-dot" fill="#4f46e5"/><rect x="4" y="48" width="52" height="20" rx="3" class="f-dev" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="46" cy="58" r="3" class="f-dot" fill="#4f46e5"/></g>
<text x="452" y="200" class="f-b" fill="#0f172a" font-size="15" font-weight="700">옆 층 서버</text>
<text x="446" y="218" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">192.168.1.20</text>
<text x="446" y="240" class="f-sm" fill="#556274" font-size="13">질문이 닿지 않아</text>
<text x="446" y="258" class="f-sm" fill="#556274" font-size="13">답하지 않는다</text>
<rect x="12" y="340" width="616" height="70" rx="4" class="f-ledger" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="28" y="366" class="f-t" fill="#0f172a" font-size="14">/16이면 앞 두 칸(192.168)만 견줘 옆 층도 "같은 서브넷"으로 본다</text>
<text x="28" y="392" class="f-acc" fill="#4f46e5" font-size="14" font-weight="700">/24로 바로 적으면 다른 서브넷으로 보고 라우터에 맡겨 닿는다</text>
</svg>
