<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="개발 PC 한 대에 앱 8080, 확인용 앱 8081, MySQL 3306, Redis 6379가 저마다 기다리는 번호를 하나씩 쥔다. 두 앱이 MySQL에 접속할 때는 운영체제가 빌려준 임시 포트 51200과 51310을 써서 겹치지 않는다">
