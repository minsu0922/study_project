<text x="312" y="226" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">51310 → 3306</text>
<text x="26" y="318" class="f-sm" fill="#556274" font-size="13">서버로 띄우는 쪽만 번호를 나누면 된다. 접속하는 쪽은 번호를 빌려 써서 겹치지 않는다.</text>
<rect x="0" y="350" width="640" height="46" rx="8" class="f-panel" fill="#f1f5f9"/>
<text x="16" y="378" class="f-b" fill="#0f172a" font-size="15" font-weight="700">8080이 이미 있으니 확인용 앱은 --server.port=8081로 띄운다</text>
