<text x="192" y="192" class="f-mono" fill="#0f172a" font-size="14" font-family="ui-monospace, Consolas, monospace">51200 → 3306</text>
<path d="M470 160 L170 222" class="f-arrow" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#port-dev-pc-head)"/>
