<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="두 칸 그림. 왼쪽: 서버를 옮겨 번호가 203.0.113.10에서 198.51.100.20으로 바뀌어도 간판의 이름 shop.example.com은 그대로라 사용자는 같은 이름으로 찾아온다. 오른쪽: 이름 하나가 번호 둘 203.0.113.10과 203.0.113.20을 가리킨다. 이름만 봐서는 서버가 몇 대인지 모른다">
