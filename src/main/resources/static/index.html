<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 — csquiz</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="nav"></header>

<main class="container">
  <!-- ═══ 비로그인: 처음 온 사람에게는 여전히 히어로가 맞다 ═══
       무엇을 하는 곳인지 모르는 사람에게 "오늘 할 일"을 보여 줄 수는 없다.
       로그인하면 이 자리가 통째로 오늘 화면으로 바뀐다. -->
  <section class="hero" id="intro" hidden>
    <h1>CS 면접, <span class="accent">매일 조금씩</span></h1>
    <p>매일 나에게 맞춘 10문제 — 틀린 건 잊어버릴 때쯤 다시 만나요.</p>
    <div>
      <a href="/signup.html" class="btn btn-lg">무료로 시작하기 🚀</a>
      <div class="note">가입하면 매일 아침 "오늘의 퀴즈"가 준비돼요 ·
        <a href="/quiz.html">가입 없이 둘러보기</a></div>
    </div>
  </section>

  <!-- ═══ 로그인: 오늘 할 일 ═══ -->
  <section id="today" hidden>
    <h1>오늘</h1>
    <div id="tasks"></div>
    <div class="stat-row" id="stats"></div>

    <div class="section-label">더 하고 싶다면</div>
    <section class="quick-grid">
      <a class="quick-card" href="/problems.html">
        <div class="icon">🗂️</div>
        <h3>문제 고르기</h3>
        <p>안 푼 것·틀린 것을 걸러 하나씩 고르고 싶을 때</p>
      </a>
      <a class="quick-card" href="/quiz.html">
        <div class="icon">🎲</div>
        <h3>무작위 10문제</h3>
        <p>고르기도 귀찮고 그냥 풀고 싶을 때</p>
      </a>
      <a class="quick-card" href="/documents.html">
        <div class="icon">📚</div>
        <h3>개념 문서</h3>
        <p>문제보다 개념 정리를 먼저 읽고 싶을 때</p>
      </a>
    </section>
  </section>
</main>

<script src="/js/api.js"></script>
<script>
/* 첫 화면 — 2026-08-29에 "홈"에서 "오늘"로 바꿨다.
 *
 * [왜 바꿨나]
 * 예전 홈은 큰 문구 + 시작 버튼 + 바로가기 카드였다. 처음 온 사람에게는 친절하지만
 * <매일 오는 사람에게는 매일 같은 광고>다. 이 앱은 1인용이고 약속이 "매일 조금씩"이라
 * 첫 화면이 답해야 하는 질문은 "이게 뭐 하는 곳인가"가 아니라 <오늘 뭐부터 하지>다.
 *
 * [할 일이 없으면 조용해진다]
 * 오늘 것을 다 했으면 줄이 하나도 안 뜨고 "오늘 몫은 끝났습니다" 한 줄만 남는다.
 * 화면이 비는 것 자체가 정보다 — 뭔가 늘 떠 있으면 그게 할 일인지 장식인지 구별이 안 된다.
 *
 * [필요한 데이터는 이미 다 있었다]
 * 진행률은 오늘의 퀴즈 API, 복습 대기·이번 주·정답률은 문제 목록 화면을 만들며 붙인
 * study-summary가 그대로 준다. 새로 만든 서버 코드는 없다.
 *
 * [실패해도 화면은 남는다]
 * 둘 중 하나가 실패해도 나머지는 그린다. 첫 화면이 통째로 비면 앱이 죽은 것처럼 보인다. */
renderNav("today");

if (!isLoggedIn()) {
  document.getElementById("intro").hidden = false;
} else {
  document.getElementById("today").hidden = false;
  loadToday();
  loadStats();
}

/**
 * 오늘 할 일 줄 — 있는 것만 그린다.
 *
 * <p>순서는 <b>급한 것부터</b>다: 복습은 "잊을 때가 됐다"는 시한이 붙은 일이고,
 * 데일리는 오늘 안에 하면 되는 일이다. 둘 다 없으면 끝났다는 한 줄만 남는다.
 *
 * <p>이 화면을 여는 것이 곧 {@code GET /api/me/daily-quiz}라, 그날 첫 방문이 세트를
 * 만든다(지연 생성, docs/12). 예전 홈과 같은 동작이다.
 */
async function loadToday() {
  const box = document.getElementById("tasks");
  const rows = [];

  // ① 복습 — 시한이 붙은 일이라 맨 위
  try {
    const due = await api("/api/me/reviews/today?size=1");   // 개수만 필요
    if (due.totalElements > 0) {
      rows.push(`<a class="task due" href="/review.html">
          <span class="what">복습 ${due.totalElements}문제가 오늘 차례입니다</span>
          <span class="go">복습하러 가기 →</span></a>`);
    }
  } catch (e) { /* 조용히 넘어간다 — 아래 데일리 줄은 그려야 한다 */ }

  // ② 오늘의 퀴즈 — 세 상태
  try {
    const d = await api("/api/me/daily-quiz");
    const { total, solved } = d.progress;
    if (!d.completed) {
      rows.push(`<a class="task" href="/daily.html">
          <span class="what">오늘의 퀴즈 ${solved > 0 ? `· ${solved} / ${total}` : `· ${total}문제`}</span>
          <span class="go">${solved > 0 ? "이어서 풀기" : "시작하기"} →</span></a>`);
    }
  } catch (e) {
    // 세트를 못 불러와도 입구는 남긴다 — 이 앱에서 매일 하는 행동이라 링크가 사라지면 안 된다.
    rows.push(`<a class="task" href="/daily.html">
        <span class="what">오늘의 퀴즈</span><span class="go">가기 →</span></a>`);
  }

  box.innerHTML = rows.length
    ? rows.join("")
    : `<div class="task done">오늘 몫은 끝났습니다 · 더 풀고 싶으면 아래에서 골라 보세요</div>`;
}

/**
 * 통계 세 칸 — 문제 목록 화면과 <같은 API·같은 규칙>을 쓴다.
 *
 * <p>정답률이 null이면 "0%"로 채우지 않는다. 0%는 "다 틀렸다"는 뜻이라 아직 시작도 안 한
 * 사람에게 정반대 신호를 준다(대시보드·문제 목록에서 이미 정한 규칙).
 *
 * <p>"이번 주"가 스트릭 자리를 대신한다. 연속 일수는 하루만 쉬어도 0이 되어, 주 3회 페이스를
 * 지키는 사람에게 매주 실패를 알렸다(docs/12의 제거 절).
 */
async function loadStats() {
  let s;
  try {
    s = (await api("/api/me/study-summary")).stats;
  } catch (e) {
    return;   // 통계는 부가 정보다 — 못 불러오면 자리를 비운다
  }
  const cards = [
    [String(s.solvedTotal), "푼 문제"],
    [s.correctRate === null ? null : s.correctRate + "%", "정답률"],
    [String(s.solvedThisWeek), "이번 주"],
  ];
  document.getElementById("stats").innerHTML = cards.map(([v, label]) => `
    <div class="stat">
      <div class="num${v === null ? " none" : ""}">${v === null ? "아직 기록 없음" : escapeHtml(v)}</div>
      <div class="label">${label}</div>
    </div>`).join("");
}
</script>
</body>
</html>
