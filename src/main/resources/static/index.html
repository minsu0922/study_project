<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다 — 이 화면들에서 유일하게 인라인인 코드다.
   shell.js는 <body> 끝에서 도는데 거기서 붙이면 다크를 고른 사람도 첫 그림이 라이트로
   한 번 번쩍인다(FOUC). 눈에 확실히 보이는 결함이라 예외를 하나만 만들었다.
   나머지 테마 코드(전환 UI·저장·기기 설정 감지)는 전부 shell.js와 style.css에 있다. */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container">
  <!-- ═══ 비로그인: 소개 화면 ═══
       무엇을 하는 곳인지 모르는 사람에게 "오늘 할 일"을 보여 줄 수는 없다.
       로그인하면 이 자리가 통째로 오늘 화면으로 바뀐다 — 같은 주소에서 갈린다. -->
  <section id="intro" hidden>
    <div class="hero">
      <h1>CS 면접, <span class="accent">매일 조금씩</span></h1>
      <p class="lead">매일 나에게 맞춘 10문제 — 틀린 건 잊어버릴 때쯤 다시 만나요.</p>
      <!-- 두 버튼이 가르는 것은 <가입하느냐 마느냐> 하나다(2026-09-08).
           예전 문구는 "무료로 시작하기 / 가입 없이 풀어보기"였는데, 둘 다 "공짜"라고 말하는
           바람에 무엇이 다른지가 안 보였다 — 첫 버튼이 가입 화면으로 간다는 사실이 어디에도
           없었다. 지금은 한쪽만 "가입"을 말하고 다른 쪽은 "가입 없이"를 말한다.
           "무료"를 뺀 이유: 유료 상품이 없으니 그건 정보가 아니라 광고 문구다. -->
      <div class="cta">
        <a href="/signup.html" class="btn btn-lg">가입하고 시작하기</a>
        <a href="/quiz.html" class="btn btn-outline btn-lg">가입 없이 풀어보기</a>
      </div>
      <!-- 가입을 권하면서 그 대가를 안 적으면 "왜 가입해야 하지"가 남는다.
           <채점>은 여기 적지 않는다 — 아래 견본은 가입 없이도 채점된다(QuizService.check).
           로그인이 실제로 여는 것은 매일 오는 세트·복습 사다리·기록 셋이고, 그것만 적는다.
           화면이 못 지킬 말을 하면 그 사실을 가입하기 전에 들킨다. -->
      <p class="note">가입하면 매일 10문제가 준비되고, 틀린 문제는 복습으로 돌아옵니다.</p>
    </div>

    <div class="landing-points">
      <div class="card">
        <div class="ic" aria-hidden="true">📅</div><b>매일 10문제</b>
        <p class="meta">아침마다 새로 준비됩니다. 10분이면 끝나요.</p>
      </div>
      <div class="card">
        <div class="ic" aria-hidden="true">🔁</div><b>잊을 때쯤 다시</b>
        <p class="meta">틀린 문제는 하루·사흘·일주일 뒤에 다시 나옵니다.</p>
      </div>
      <div class="card">
        <div class="ic" aria-hidden="true">📚</div><b>개념도 같이</b>
        <p class="meta">틀린 자리에서 바로 읽을 개념 문서가 붙어 있어요.</p>
      </div>
    </div>

    <div class="landing-sample">
      <div class="section-label"><span>이런 문제가 나옵니다</span></div>
      <div class="card" id="sampleProblem" hidden></div>
      <p class="meta" id="statsLine" style="text-align:center"></p>
    </div>
  </section>

  <!-- ═══ 로그인: 오늘 할 일 ═══
       세 덩이다 — 히어로(오늘 할 일) / 통계 넷 / 분야별 진도 여섯.
       그 아래 최근 개념 문서는 "가만히 둬도 늘어나는 것"이라 새 소식 자리로 남긴다. -->
  <section id="today" hidden>
    <!-- 히어로가 통째로 상황을 말한다(할 일 있음 / 오늘 몫 끝 / 첫날).
         화면 제목 <h1>도 이 안에 있다 — 상황마다 문구가 달라지기 때문이다. -->
    <div id="hero"></div>

    <!-- 첫날에는 감춘다. 0이 넷 뜨는 것보다 히어로 안의 "여기 있는 것"이 맞는 정보다. -->
    <div class="stat-row" id="stats" hidden></div>

    <div class="section-label" id="progLabel" hidden>
      <span>분야별 진도</span>
      <a href="/me.html">전체 보기 →</a>
    </div>
    <div class="progress-grid" id="progList" hidden></div>

    <div class="section-label" id="docLabel" hidden><span>최근 개념 문서</span></div>
    <div id="docList"></div>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 첫 화면 — "홈"이 아니라 "오늘"이다(2026-08-29에 바꿨고, 2026-09-06에 다시 짰다).
 *
 * [왜 광고가 아닌가]
 * 예전 홈은 큰 문구 + 시작 버튼 + 바로가기 카드였다. 처음 온 사람에게는 친절하지만
 * <매일 오는 사람에게는 매일 같은 광고>다. 이 앱의 약속이 "매일 조금씩"이라
 * 첫 화면이 답해야 하는 질문은 "이게 뭐 하는 곳인가"가 아니라 <오늘 뭐부터 하지>다.
 * 개편 시안에서 색이 찬 큰 판이 후보로 올라왔을 때 그것을 접은 근거도 이 문단이다.
 *
 * [세 덩이로 합쳤다]
 * 예전에는 컴포넌트가 넷이었다 — 할 일 줄, 첫 방문 안내, 분야 추천 줄, 통계 세 칸.
 * 넷이 "누가 어느 자리를 차지하나"를 서로 조건문으로 나눠 갖고 있었다.
 * 지금은 히어로 하나 / 통계 넷 / 진도 여섯이고, 앞의 둘은 히어로의 세 얼굴이 됐다.
 * "무엇을 보여 줄까"의 판단이 renderHero 한 곳에 모인다.
 *
 * [요청 둘을 나란히 보낸다]
 * 오늘의 퀴즈와 학습 요약은 히어로가 함께 봐야 해서 같이 보내고, 먼저 오는 쪽을
 * 기다리지 않는다(Promise.allSettled). 하나가 실패해도 나머지는 그린다 —
 * 첫 화면이 통째로 비면 앱이 죽은 것처럼 보인다.
 *
 * [진도의 분모는 이번에 서버에 생겼다]
 * study-summary의 domains[].total. 뒤집은 판단이라 사연이 길다 — StudySummaryResponse
 * 주석 참고. 화면 쪽 결론만 적으면 <절대값이 주인공이고 퍼센트는 안 쓴다>. */
// 폰 상단 바의 화면 이름도 로그인 여부로 갈린다 — 기둥 메뉴가 "소개"로 뜨는데
// 상단 바만 "오늘"이면 같은 화면을 두 이름으로 부르게 된다(shell.js ANON_LABELS).
renderShell({ active: "today", title: isLoggedIn() ? "오늘" : "소개" });

if (!isLoggedIn()) {
  document.getElementById("intro").hidden = false;
  loadLanding();
} else {
  document.getElementById("today").hidden = false;
  loadHome();
  loadRecentDocs();
}

/**
 * 랜딩 — 실제 문제 한 개와 집계 한 줄을 채운다.
 *
 * <p><b>왜 {@code /api/quiz}인가.</b> 목록 API({@code /api/problems})는 인증이 필요하다 —
 * 그 화면이 내 풀이 기록을 함께 보여 주기 때문이다. 여기서 필요한 건 "아무 문제 하나"뿐이라
 * 공개 API인 자유 퀴즈 조회를 쓴다. 이 프로젝트가 세운 "화면과 문제는 누구나, 채점만
 * 로그인"이라는 원칙이 여기서 값어치를 한다.
 *
 * <p><b>왜 숫자를 서버에서 받나.</b> "문제 296개"를 HTML에 글로 박으면 배치가 도는 다음 날
 * 거짓말이 된다. 게다가 이 숫자를 보는 사람은 가입할지 말지 정하는 중이라, 여기서 틀린
 * 말을 하면 서비스 전체가 대충 만든 것으로 읽힌다.
 *
 * <p><b>둘 다 실패해도 랜딩은 선다.</b> 히어로와 설명 카드 셋은 서버가 없어도 그려진다 —
 * 정작 가입을 권해야 하는 자리가 비어 버리면 안 된다. 못 채운 칸은 <b>비워 둔다</b>.
 * 거짓 숫자나 가짜 문제를 띄우느니 그 줄이 없는 편이 낫다.
 */
async function loadLanding() {
  try {
    // 초급을 먼저 청한다(2026-09-08). 예전에는 난이도를 안 걸어 무작위였는데, 고급이 걸리면
    // 상황 지문 네 줄짜리가 첫 인상이 된다 — 바로 위에서 "10분이면 끝나요"라고 해 놓고
    // 그 아래에 <읽는 데만 1분 걸리는 문제>를 세우는 셈이다. 견본의 일은 자랑이 아니라
    // "들어와도 되겠다"를 보여 주는 것이다. 난이도 배지가 초급이라고 적으므로 속이지도 않는다.
    // 초급이 하나도 없으면(새 DB) 조건을 풀어 다시 청한다 — 견본 칸이 비는 것보다는 낫다.
    //
    // 유형도 객관식으로 못 박는다. sampleChoices가 짝짓기·순서·OX의 보기를 일부러 안 그리는데
    // (조작해야 뜻이 보이는 유형이라) 그런 문제가 걸리면 견본 카드가 <지문 한 줄과 빈자리>가
    // 된다. 실제로 짝짓기가 뽑혀 "각 구역과 설명을 연결하시오"만 덩그러니 뜬 화면을 봤다 —
    // "이런 문제가 나옵니다"라고 해 놓고 문제를 안 보여 준 셈이다. 뽑을 때 걸러야 할 조건을
    // 그리는 쪽에서만 알고 있었던 것이 원인이다.
    const pick = async q => (await api(`/api/quiz?size=1${q}`)).problems[0];
    const p = (await pick("&level=BEGINNER&type=MULTIPLE_CHOICE"))
      ?? (await pick("&type=MULTIPLE_CHOICE"))
      ?? (await pick(""));
    if (p) {
      const box = document.getElementById("sampleProblem");
      box.innerHTML = `
        <div class="meta">${escapeHtml(domainLabel(p.domain))} · ${escapeHtml(typeLabel(p.type))}
          ${difficultyBadge(p.difficulty)}</div>
        <div class="q-text" style="font-size:var(--fs-3);margin:var(--sp-2) 0 0">
          ${escapeHtml(p.question)}</div>
        ${sampleChoices(p)}
        <div class="meta" id="sampleHint" style="margin-top:var(--sp-3)">하나 골라 보세요. 가입 없이 채점됩니다.</div>`;
      box.hidden = false;
      wireSample(p);
    }
  } catch (e) { /* 문제를 못 가져오면 그 카드만 없다 */ }

  try {
    const s = await api("/api/stats");
    document.getElementById("statsLine").textContent =
      `문제 ${s.problemCount}개 · 개념 문서 ${s.documentCount}편 · ${s.domainCount}개 분야`;
  } catch (e) { /* 못 세면 그 줄만 비운다 — 거짓 숫자를 띄우느니 안 띄운다 */ }
}

/**
 * 미리보기 문제의 보기 — 객관식일 때만 그린다.
 *
 * <p>짝짓기·순서 배열은 <b>조작해야 뜻이 보이는</b> 유형이라 견본으로 세워 두면 무슨
 * 문제인지 알 수 없다. OX는 보기가 "O / X" 두 개뿐이라 보여 줘도 정보가 없다.
 * 그런 유형이 걸리면 지문만 보여 준다 — 지문 하나로도 난이도와 결은 전해진다.
 */
function sampleChoices(p) {
  if (p.type !== "MULTIPLE_CHOICE" || !p.choices || p.choices.length === 0) return "";
  // div가 아니라 button이다 — 누를 수 있게 됐으니(2026-09-08) 생김새가 아니라 <요소>가
  // 그 사실을 말해야 한다. 키보드 탭 순서와 Enter, 스크린리더의 "버튼" 안내가 공짜로 따라온다.
  return `<div class="sample-choices">${p.choices.map(c => `
    <button type="button" class="sample-choice" data-id="${c.id}">
      <span>${c.seq}</span><span>${escapeHtml(c.text)}</span>
    </button>`).join("")}</div>`;
}

/**
 * 견본 문제를 <b>실제로 풀 수 있게</b> 만든다 — 2026-09-08.
 *
 * <p><b>왜 고쳤나.</b> 보기 넷이 버튼처럼 생겨 있는데 눌러도 아무 일이 없었다. 처음 온 사람은
 * 그것을 "가입해야 하는구나"로 읽지 않는다 — <b>고장으로</b> 읽는다. 게다가 바로 위 버튼이
 * "가입 없이 풀어보기"라고 말하고 있어서, 화면이 스스로 한 약속을 같은 화면에서 어긴 셈이었다.
 *
 * <p><b>정답을 공짜로 보여 주면 가입할 이유가 줄지 않나.</b> 반대라고 봤다. 여기서 파는 것은
 * 정답 한 개가 아니라 <b>매일 오는 습관과 복습</b>이고, 그건 한 문제를 풀어 본 사람에게 훨씬
 * 잘 팔린다. 그래서 채점 뒤 안내 문구도 "채점을 보려면"이 아니라 <b>"기록이 남으려면"</b>으로
 * 바꿔 적는다 — 로그인이 실제로 여는 것이 그것이다({@code QuizService.check} 주석).
 *
 * <p>채점은 기록을 남기지 않는 공개 API를 쓴다. 실패하면 <b>조용히 원래대로</b> 둔다 —
 * 첫 화면에서 빨간 오류 상자를 만나는 것보다 아무 일도 안 일어나는 편이 낫다.
 */
function wireSample(p) {
  const buttons = [...document.querySelectorAll("#sampleProblem .sample-choice")];
  const hint = document.getElementById("sampleHint");
  if (buttons.length === 0) return;

  buttons.forEach(btn => btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    buttons.forEach(b => b.disabled = true);
    try {
      const r = await api(`/api/quiz/${p.id}/check`, {
        method: "POST",
        body: JSON.stringify({ userAnswer: btn.dataset.id }),
      });
      // 고른 것과 정답을 <함께> 칠한다. 틀렸을 때 "내가 뭘 골랐더라"를 다시 찾게 하지 않는다.
      const correctId = String((r.choices || []).find(c => c.correct)?.id ?? "");
      buttons.forEach(b => {
        if (b.dataset.id === correctId) b.classList.add("is-correct");
        else if (b === btn) b.classList.add("is-wrong");
      });
      hint.innerHTML = `<b class="${r.correct ? "sample-ok" : "sample-no"}">${r.correct ? "정답입니다" : "아쉽네요"}</b>
        ${r.explanation ? `<div style="margin-top:var(--sp-2)">${escapeHtml(r.explanation)}</div>` : ""}
        <div style="margin-top:var(--sp-2)">가입하면 이런 문제가 매일 10개 오고, 틀린 것은 복습으로 돌아옵니다.</div>`;
    } catch (e) {
      buttons.forEach(b => b.disabled = false);   // 다시 눌러 볼 수 있게 되돌린다
    }
  }));
}

/** 오늘 화면의 세 덩이를 그린다. 두 요청을 나란히 보내고 결과를 나눠 쓴다. */
async function loadHome() {
  const [dailyRes, summaryRes] = await Promise.allSettled([
    api("/api/me/daily-quiz"),
    api("/api/me/study-summary"),
  ]);
  const daily = dailyRes.status === "fulfilled" ? dailyRes.value : null;
  const summary = summaryRes.status === "fulfilled" ? summaryRes.value : null;

  renderHero(daily, summary);
  if (summary) {
    // 첫날에는 통계를 감춘다. 히어로가 이미 "여기 있는 것"(문제 N개·분야 M개·문서 K편)을
    // 말하고 있는데 그 아래에 0이 넷 더 뜨면, 같은 화면이 "많다"와 "없다"를 동시에 말한다.
    if (summary.stats.attemptedTotal > 0) renderStats(summary.stats);
    renderProgress(summary.domains);
  }
}

/**
 * 히어로 — 상황이 문구·색·버튼을 다 정한다.
 *
 * <p>[왜 한 함수가 세 얼굴을 다 그리나] 셋은 <같은 자리에 번갈아> 뜬다. 함수를 셋으로
 * 나누면 "지금 어느 것이 떠 있나"를 부르는 쪽이 관리하게 되고, 둘이 동시에 뜨거나
 * 하나도 안 뜨는 상태가 생길 자리가 만들어진다. 한 함수가 innerHTML을 통째로 쓰면
 * 그런 상태 자체가 있을 수 없다.
 *
 * <p>[순서가 곧 우선순위다] 첫날 → 오늘 몫 끝 → 할 일 있음 → 못 불러옴.
 * 첫날이 맨 앞인 이유: 기록이 0인 사람에게는 "6문제 남았어요"보다 "여기가 뭐 하는
 * 곳인지"가 먼저다. 이 화면을 여는 것이 곧 세트 생성이라(지연 생성, docs/12)
 * 첫날에도 daily는 정상적으로 온다 — 그래서 데이터로는 안 갈리고 순서로 갈라야 한다.
 */
function renderHero(daily, summary) {
  const el = document.getElementById("hero");
  const due = summary ? summary.stats.reviewDue : 0;
  const reviewBtn = due > 0
    ? `<a class="btn btn-outline" href="/review.html">복습 ${due}개 ↻</a>` : "";

  /* ① 첫날 — 아직 아무 기록이 없다
   *
   * <attemptedTotal>으로 가른다. 예전에는 solvedTotal(맞힌 수)을 봤는데, 그러면
   * 한 문제를 풀고 틀린 사람에게 이 문구가 뜬다 — 오늘의 퀴즈는 "1 / 10"이라 하고
   * 오답노트에는 그 문제가 들어가 있는데도 홈만 "첫 문제를 풀어볼까요"라고 한다.
   * 방금 한 일이 없던 일이 되고, 초보자일수록 첫 문제를 틀린다. */
  if (summary && summary.stats.attemptedTotal === 0) {
    el.innerHTML = heroHtml({
      eyebrow: todayLabel(),
      title: "첫 문제를 풀어볼까요",
      lead: "오늘의 퀴즈 10문제면 첫 기록이 남고, 내일부터 복습이 붙습니다.",
      actions: `<a class="btn" href="/daily.html">오늘의 퀴즈 시작 →</a>`,
    });
    renderFacts(summary.domains.length);
    return;
  }

  // ② 오늘 몫을 끝낸 날 — 색과 문구가 함께 바뀐다(✓는 색으로만 알리지 않기 위한 것이다)
  if (daily && (daily.completed || daily.progress.solved >= daily.progress.total)) {
    el.innerHTML = heroHtml({
      cls: "done",
      eyebrow: todayLabel(),
      title: "오늘 몫은 끝났어요 ✓",
      lead: `${daily.progress.total}문제 전부 · 내일 아침에 새 문제가 준비돼요`,
      actions: `<a class="btn btn-outline" href="/quiz.html">더 풀어보기</a>${reviewBtn}`,
    });
    return;
  }

  // ③ 할 일이 남았다
  if (daily) {
    const total = daily.progress.total;
    const solved = daily.progress.solved;
    const left = Math.max(total - solved, 0);
    el.innerHTML = heroHtml({
      eyebrow: `${todayLabel()} · 오늘의 퀴즈`,
      title: `${left}문제 남았어요`,
      lead: "10분이면 끝나요.",
      bar: total > 0 ? Math.round(solved / total * 100) : 0,
      barNow: solved,
      barMax: total,
      actions: `<a class="btn" href="/daily.html">${solved > 0 ? "이어서 풀기" : "시작하기"} →</a>${reviewBtn}`,
    });
    return;
  }

  // ④ 오늘 세트를 못 불러왔다 — 그래도 들어갈 문은 남긴다.
  //    이 앱에서 매일 하는 행동이라 링크가 사라지면 화면이 고장 난 것으로 읽힌다.
  el.innerHTML = heroHtml({
    eyebrow: todayLabel(),
    title: "오늘의 퀴즈",
    lead: "지금은 진행 상황을 불러오지 못했어요.",
    actions: `<a class="btn" href="/daily.html">오늘의 퀴즈로</a>${reviewBtn}`,
  });
}

/** 히어로 마크업 한 벌. bar가 있으면 진행 바를 함께 그린다. */
function heroHtml({ cls = "", eyebrow, title, lead, bar, barNow, barMax, actions }) {
  return `<div class="hero-card ${cls}">
    <div class="eyebrow">${escapeHtml(eyebrow)}</div>
    <h1>${escapeHtml(title)}</h1>
    <p class="lead">${escapeHtml(lead)}</p>
    ${bar === undefined ? "" : `<div class="bar" role="progressbar"
         aria-label="오늘의 퀴즈 진행률"
         aria-valuenow="${barNow}" aria-valuemin="0" aria-valuemax="${barMax}"
      ><i style="width:${bar}%"></i></div>`}
    <div class="actions">${actions}</div>
  </div>`;
}

/**
 * 첫날 히어로 안의 "여기 있는 것" 숫자 — 문제 N개 · 분야 M개 · 문서 K편.
 *
 * <p><b>왜 필요한가.</b> 통계는 "0 / 0 / 아직 기록 없음"으로 시작한다. 숫자로는 맞지만
 * 처음 온 사람에게 0 셋은 <이 앱에 아무것도 없다>로 읽힌다. 실제로는 문제 백 개가
 * 이미 있다. 그래서 첫날에는 "내가 쌓은 것"이 아니라 "여기 있는 것"을 센다.
 *
 * <p>예전에는 목록 API 둘을 {@code size=1}로 불러 {@code totalElements}만 빌려 썼다.
 * 이번 개편에서 랜딩용으로 만든 {@code GET /api/stats}가 같은 숫자를 한 번에 주므로
 * 요청 둘이 하나가 됐다 — 세는 것만을 위한 API를 새로 만든 게 아니라 이미 만든 것을
 * 여기서도 쓴다.
 *
 * <p>실패하면 이 줄만 안 뜬다. 히어로 본문은 이미 그려져 있다.
 */
async function renderFacts(domainCount) {
  try {
    const s = await api("/api/stats");
    const facts = [
      [s.problemCount, "문제"],
      [domainCount || s.domainCount, "분야"],
      [s.documentCount, "편의 개념 문서"],
    ];
    const card = document.querySelector("#hero .hero-card");
    if (!card) return;
    card.insertAdjacentHTML("beforeend",
      `<div class="facts">${facts.map(([v, label]) =>
        `<div><b>${v}</b>${escapeHtml(label)}</div>`).join("")}</div>`);
  } catch (e) { /* 숫자를 못 세면 그 줄만 없다 */ }
}

/**
 * 통계 넷 — 푼 문제 / 정답률 / 이번 주 / 복습 대기.
 *
 * <p>정답률이 null이면 "0%"로 채우지 않는다. 0%는 "다 틀렸다"는 뜻이라 아직 시작도 안 한
 * 사람에게 정반대 신호를 준다(대시보드·문제 목록에서 이미 정한 규칙).
 *
 * <p>"이번 주"가 스트릭 자리를 대신한다. 연속 일수는 하루만 쉬어도 0이 되어, 주 3회
 * 페이스를 지키는 사람에게 매주 실패를 알렸다(docs/12의 제거 절).
 *
 * <p>복습 대기만 색을 쓴다 — 넷 중 <시한이 붙은> 유일한 값이다. 0이면 색을 빼서
 * "할 일 없음"이 조용히 남는다. 색으로만 알리지 않게 라벨이 "복습 대기"라고 직접 말한다.
 *
 * <p>라벨을 숫자 <위>에 둔 것은 개편에서 뒤집은 것이다. 예전에는 큰 숫자가 먼저였는데,
 * 넷이 나란히 서면 숫자만 눈에 들어오고 그것이 무엇의 숫자인지 매번 아래를 봐야 했다.
 */
function renderStats(s) {
  const cards = [
    // "푼 문제"는 제출한 수다. 맞힌 수는 아래 분야별 진도가 말한다 —
    // 두 값이 다른 질문에 답하므로 한 화면에 나란히 있어도 어긋나지 않는다.
    [String(s.attemptedTotal), "푼 문제", ""],
    [s.correctRate === null ? null : s.correctRate + "%", "정답률", ""],
    [String(s.solvedThisWeek), "이번 주", ""],
    [String(s.reviewDue), "복습 대기", s.reviewDue > 0 ? " due" : ""],
  ];
  const box = document.getElementById("stats");
  box.innerHTML = cards.map(([v, label, extra]) => `
    <div class="stat">
      <div class="label">${label}</div>
      <div class="num${v === null ? " none" : extra}">${v === null ? "아직 기록 없음" : escapeHtml(v)}</div>
    </div>`).join("");
  box.hidden = false;
}

/**
 * 분야별 진도 — 여섯 줄.
 *
 * <p><b>왜 여섯만.</b> 분야가 열둘인데 홈에 다 깔면 스크롤이 한 판 더 는다. 홈이 답해야
 * 하는 질문은 "오늘 뭐부터 하지"이지 "나 얼마나 왔지"가 아니다. 뒤쪽 질문은 내 기록
 * 화면이 맡고, 여기에는 [전체 보기 →]만 둔다.
 *
 * <p><b>왜 많이 푼 순인가.</b> 적게 푼 순도 후보였다("다음에 뭘 할까"에 답한다). 그런데
 * 그러면 <매일 0에 가까운 분야가 첫 줄>이라 화면이 매일 똑같다 — 숫자가 바뀌는 것이
 * 이 목록의 값어치인데 그게 사라진다. "다음에 뭘 할까"는 내 기록 화면의 "약한 곳"이 맡는다.
 *
 * <p>첫날에는 전부 0이라 정렬이 무의미한데, 자바스크립트 sort는 안정 정렬이라 서버가
 * 준 순서(Domain enum 선언 순서 = 기초부터 쌓이는 순서)가 그대로 남는다.
 */
function renderProgress(domains) {
  if (!domains || domains.length === 0) return;

  // 문제가 아직 한 개도 없는 분야는 뺀다. "0 / 0"은 진도가 아니라 <빈 서랍>이라,
  // 홈처럼 여섯 자리뿐인 곳에서는 실제로 풀 수 있는 분야의 자리를 빼앗는다.
  // (내 기록 화면은 열둘을 다 보여 준다 — 거기는 "여기가 아직 비어 있다"도 정보다.)
  const usable = domains.filter(d => d.total > 0);
  if (usable.length === 0) return;

  const top = usable.sort((a, b) => b.solved - a.solved).slice(0, 6);

  document.getElementById("progList").innerHTML = top.map(d => {
    // 분모가 0이면 막대를 0으로 둔다. 0으로 나누면 NaN이 style에 들어가 막대가 사라진다.
    const pct = d.total > 0 ? Math.round(d.solved / d.total * 100) : 0;
    return `<div class="progress-item">
      <div class="row">
        <span class="name">${escapeHtml(d.label)}</span>
        <span class="num">${d.solved} <span class="of">/ ${d.total}</span></span>
      </div>
      <div class="bar" role="progressbar" aria-label="${escapeHtml(d.label)} 진도"
           aria-valuenow="${d.solved}" aria-valuemin="0" aria-valuemax="${d.total}"
        ><i style="width:${pct}%"></i></div>
    </div>`;
  }).join("");

  document.getElementById("progLabel").hidden = false;
  document.getElementById("progList").hidden = false;
}

/** "9월 6일 토요일" — 히어로 맨 윗줄. 매일 오는 화면이라 날짜가 바뀌는 것 자체가 정보다. */
function todayLabel() {
  return new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
}

/**
 * 최근 개념 문서 세 편.
 *
 * <p>이 앱에서 가만히 둬도 늘어나는 것은 문서뿐이라(4일에 한 편, 배치가 만든다) 첫 화면에
 * "새 소식" 자리가 하나 필요하다. 그게 없으면 매일 같은 화면이 뜬다.
 *
 * <p>날짜는 {@code updatedAt}을 쓴다. 목록 API가 주는 날짜가 이것뿐이고, 문서는 만들어진
 * 뒤 거의 고쳐지지 않아 사실상 올라온 날과 같다. 그래서 "올라온 날"이라고 <단정하지 않고>
 * 날짜만 적는다 — 나중에 문서를 손보면 어긋날 표기라 문구로 약속하지 않는다.
 */
async function loadRecentDocs() {
  let docs;
  try {
    docs = (await api("/api/documents?size=3")).content;   // 기본 정렬이 createdAt 내림차순
  } catch (e) {
    return;   // 부가 정보 — 실패하면 자리를 비운다
  }
  if (!docs || docs.length === 0) return;

  const today = new Date().toISOString().substring(0, 10);
  document.getElementById("docList").innerHTML = docs.map(d => {
    const day = (d.updatedAt || "").substring(0, 10);
    // 편(입문/심화)을 함께 찍는다 — 2026-09-08. 한 주제는 두 편으로 만들어지고 제목이
    // <글자까지 같다>. 편을 안 그리면 이 세 줄짜리 새 소식 자리에 같은 제목이 연달아
    // 두 번 뜬다(실제로 그렇게 나왔다). 그러면 새 소식이 셋이 아니라 둘이고, 읽는 사람은
    // 목록이 고장 났다고 본다. 서버는 <짝이 실제로 있을 때만> edition을 채우므로
    // 짝이 없는 문서에는 아무것도 안 붙는다(DocumentListItem).
    return `<a class="doc-line ${day === today ? "fresh" : ""}" href="/document.html?slug=${encodeURIComponent(d.slug)}">
      <span class="dm">${escapeHtml(d.domainLabel)}</span>
      <span class="ti">${escapeHtml(d.title)}${d.edition ? " " + editionBadge(d.edition) : ""}</span>
      <span class="dt">${day === today ? "오늘" : escapeHtml(shortDay(day))}</span>
    </a>`;
  }).join("");
  document.getElementById("docLabel").hidden = false;
}

/** "2026-08-25" → "8월 25일". 첫 화면에서는 연도가 정보가 아니라 소음이다. */
function shortDay(day) {
  const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(day);
  return m ? `${Number(m[1])}월 ${Number(m[2])}일` : day;
}
</script>
