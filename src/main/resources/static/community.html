<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다(이유는 review.html의 같은 자리 주석). */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container side-page">
  <h1>커뮤니티</h1>
  <!-- 글쓰기 버튼이 여기 없는 이유를 미리 말한다. 글은 문제의 토론방에 쓰는데,
       이 화면만 본 사람은 어디서 쓰는지 알 길이 없다. -->
  <p class="meta">문제마다 토론방이 있습니다. 여기에는 모든 토론방의 글이 모입니다.
    글은 문제를 푼 뒤 그 문제의 토론방에서 씁니다.</p>

  <!-- 탭 셋. 분야와 말머리는 탭이 아니라 아래 걸러 보기로 둔다 — 분야만 11개라 탭으로 두면 줄이 넘친다.
       탭은 <무엇을 보러 왔는가>로 나눈다: 다 보기 / 방으로 들어가기 / 내 것 보기.

       [뺀 탭 — 2026-10-05] "답변 기다리는 글"(댓글이 없는 글)을 뒀다가 뺐다. 글쓴이는 내 활동에서
       자기 글을 보면 되고, 답해 줄 사람에게도 정렬과 말머리 걸러 보기로 충분했다. 같은 목록을
       두 군데에 두는 셈이었다. -->
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" class="tab-btn" role="tab" data-tab="all">전체</button>
    <button type="button" class="tab-btn" role="tab" data-tab="rooms">토론방</button>
    <button type="button" class="tab-btn" role="tab" data-tab="mine">내 활동</button>
  </div>

  <!-- 찾기·정렬·분야·말머리. 조건은 주소(?tab=&q=&sort=&domain=&category=)에 남긴다 — 글을 읽고 뒤로 돌아왔을 때
       찾던 목록이 그대로 있어야 하고, 찾은 목록을 남에게 보낼 수도 있어야 한다.
       탭마다 쓰는 칸이 다르다(아래 TABS). 안 쓰는 칸은 감춘다 — 눌러도 아무 일 없는 칸을 두지 않는다. -->
  <!-- 옆 기둥은 문제 목록과 같은 모양이다(.pl-side). 분야는 글 수와 함께 여기서 고른다(필터 줄에서 뺐다).
       아래 "최근 글이 달린 방"은 좁은 화면에서 감춘다 — 목록 위에 다섯 줄이 더 서면 글이 화면 밖으로 밀린다 -->
  <div class="pl-body">
  <aside class="pl-side" aria-label="분야와 토론방">
    <h2>분야 <span class="pl-unit">글 수</span></h2>
    <div class="pl-domains" id="domains"></div>
    <div class="pl-side-extra">
      <h2 class="second">최근 글이 달린 방</h2>
      <div class="pl-rooms" id="sideRooms"></div>
    </div>
  </aside>

  <div class="pl-main">
  <form class="filters community-filters" id="filterForm" role="search">
    <!-- 필터 줄은 모든 목록이 같은 모양이다(api.js wireFilterBar): 검색 → 고르기 → 필터 지우기.
         치기를 멈추면 찾으므로 찾기 단추는 없다 -->
    <div class="field field-search" data-control="q">
      <label for="q">검색 <span class="meta">(제목·본문)</span></label>
      <input type="search" id="q" maxlength="50" placeholder="예: 캐시, 502" enterkeyhint="search">
    </div>
    <div class="field" data-control="category">
      <label for="categoryFilter">말머리</label>
      <select id="categoryFilter"></select>
    </div>
    <div class="field" data-control="sort">
      <label for="sortSelect">정렬</label>
      <select id="sortSelect">
        <option value="latest">최신순</option>
        <option value="comments">댓글 많은 순</option>
        <option value="likes">추천 많은 순</option>
      </select>
    </div>
    <div class="field" data-control="kind">
      <label for="kindSelect">보기</label>
      <select id="kindSelect">
        <option value="written">내가 쓴 글</option>
        <option value="commented">내가 댓글 단 글</option>
        <option value="comments">내가 쓴 댓글</option>
      </select>
    </div>
    <div class="field field-reset"><label>&nbsp;</label>
      <button type="button" id="filterResetBtn" class="btn-outline">필터 지우기</button></div>
  </form>

  <div id="message" role="alert"></div>
  <!-- 무엇으로 걸러 본 목록인지 한 줄. 결과가 0건일 때 "글이 없다"와 "조건에 맞는 글이 없다"를 가른다. -->
  <p class="meta" id="resultInfo" hidden></p>
  <div id="list"></div>

  <div class="pager" id="pager" hidden></div>
  </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 커뮤니티 — 탭 셋이 한 화면을 나눠 쓴다.
 *   전체                     GET /api/quiz/posts?q=&sort=&domain=&category=&page=     (공개)
 *   토론방                   GET /api/quiz/rooms?domain=&page=                        (공개)
 *   내 활동                  GET /api/me/posts?kind=&page=                            (로그인)
 *                            GET /api/me/comments?page=   (보기가 "내가 쓴 댓글"일 때)
 * 한 쪽은 20건이다. */
renderShell({ active: "community", title: "커뮤니티" });

const qInput = document.getElementById("q");
/** 옆 기둥에 적을 분야별 글 수(GET /api/quiz/post-domains). 못 받으면 수 없이 이름만 적는다 */
let domainCounts = null;
const categoryFilter = document.getElementById("categoryFilter");
const sortSelect = document.getElementById("sortSelect");
const kindSelect = document.getElementById("kindSelect");

/* 탭마다 쓰는 조건 칸. 여기 없는 칸은 그 탭에서 감추고, 주소에도 적지 않는다. */
const TABS = {
  all:        { controls: ["q", "domain", "category", "sort"] },
  rooms:      { controls: ["domain"] },
  mine:       { controls: ["kind"] },
};

/* 지금 조건. 주소에서 읽어 시작하고, 바뀔 때마다 주소에 다시 적는다. */
const state = { tab: "all", q: "", domain: "", category: "", sort: "latest", kind: "written", page: 0 };

function uses(control) { return TABS[state.tab].controls.includes(control); }

function readStateFromUrl() {
  const p = new URLSearchParams(location.search);
  state.tab = TABS[p.get("tab")] ? p.get("tab") : "all";
  state.q = (p.get("q") || "").trim();
  state.domain = p.get("domain") || "";
  state.category = POST_CATEGORIES.some(c => c[0] === p.get("category")) ? p.get("category") : "";
  state.sort = ["comments", "likes"].includes(p.get("sort")) ? p.get("sort") : "latest";
  state.kind = ["commented", "comments"].includes(p.get("kind")) ? p.get("kind") : "written";
  state.page = Math.max(Number(p.get("page")) || 0, 0);
  syncControls();
}

/* 조건을 화면의 탭과 칸에 비춘다. */
function syncControls() {
  qInput.value = state.q;
  renderSideDomains();
  categoryFilter.value = state.category;
  sortSelect.value = state.sort;
  kindSelect.value = state.kind;
  document.querySelectorAll("#tabs .tab-btn").forEach(b => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll("#filterForm [data-control]").forEach(el => {
    el.hidden = !uses(el.dataset.control);
  });
}

/* 옆 기둥의 분야. 내 활동 탭은 분야로 거르지 않으므로 눌린 것을 두지 않는다. */
function renderSideDomains() {
  const counts = new Map((domainCounts ?? []).map(d => [d.domain, d.count]));
  document.getElementById("domains").innerHTML = DOMAINS.map(([code, label]) => {
    const on = uses("domain") && state.domain === code;
    const n = domainCounts ? `<span class="n">${counts.get(code) ?? 0}</span>` : "";
    return `<button type="button" class="pl-domain" data-domain="${code}" aria-pressed="${on}">
      <span class="row"><span class="name">${escapeHtml(label)}</span>${n}</span></button>`;
  }).join("");
}

/* 최근 글이 달린 방 다섯. 토론방 탭의 첫 다섯 줄과 같은 목록이다. */
async function loadSideRooms() {
  const box = document.getElementById("sideRooms");
  try {
    const data = await api("/api/quiz/rooms?size=5");
    box.innerHTML = data.rooms.length
      ? data.rooms.map(r => `<a class="pl-room" href="/discussion.html?problemId=${r.problemId}">
          <span class="name">${escapeHtml(r.problemTitle)}</span>
          <span class="meta">${escapeHtml(domainLabel(r.domain))} · 글 ${r.postCount}</span></a>`).join("")
      : `<span class="meta">아직 열린 방이 없습니다</span>`;
  } catch (e) {
    box.innerHTML = "";   // 곁들이는 정보라 실패를 따로 알리지 않는다
  }
}

/* 기본값과 이 탭이 안 쓰는 조건은 주소에 적지 않는다 — 아무것도 안 고른 주소가
   /community.html 그대로여야 하고, 토론방 탭의 주소에 검색어가 따라다니면 안 된다. */
function stateToParams() {
  const p = new URLSearchParams();
  if (state.tab !== "all") p.set("tab", state.tab);
  if (uses("q") && state.q) p.set("q", state.q);
  if (uses("domain") && state.domain) p.set("domain", state.domain);
  if (uses("category") && state.category) p.set("category", state.category);
  if (uses("sort") && state.sort !== "latest") p.set("sort", state.sort);
  if (uses("kind") && state.kind !== "written") p.set("kind", state.kind);
  if (state.page > 0) p.set("page", state.page);
  return p;
}

/* 글 한 줄. 링크가 둘이다: 글 제목은 글로, 문제 이름은 그 문제의 토론방으로 간다.
 * 그래서 줄 전체를 링크로 감싸지 않는다 — 링크 안에 링크를 넣을 수 없다. */
function postRow(p) {
  return `<div class="list-row">
    <a class="list-row-title" href="/post.html?id=${p.id}">${postCategoryChip(p.category, p.categoryLabel)}${escapeHtml(p.title)}${
      p.commentCount ? ` <span class="list-row-count">${icon("message")} ${p.commentCount}</span>` : ""}${
      p.likeCount ? ` <span class="list-row-count">${icon("thumb")} ${p.likeCount}</span>` : ""}</a>
    <span class="meta">
      <span class="list-row-domain">${escapeHtml(domainLabel(p.domain))}</span>
      <a class="list-row-sub" href="/discussion.html?problemId=${p.problemId}">${escapeHtml(p.problemTitle)}</a>
      · ${escapeHtml(p.nickname || "탈퇴한 사용자")} · ${shortDay(p.createdAt)}
    </span>
  </div>`;
}

/* 내가 쓴 댓글 한 줄. 댓글 본문이 주인공이고, 어느 글에 쓴 것인지는 아래 작은 글씨로 둔다.
 * 줄 전체가 그 글로 가는 링크다. */
function myCommentRow(c) {
  const body = c.body.length > 120 ? c.body.slice(0, 120) + "…" : c.body;
  return `<a class="list-row" href="/post.html?id=${c.postId}">
    <span class="list-row-title">${c.hidden ? `<span class="badge gray">가려짐</span> ` : ""}${escapeHtml(body)}</span>
    <span class="meta">${escapeHtml(c.postTitle)} · ${shortDay(c.createdAt)}</span>
  </a>`;
}

/* 토론방 한 줄. 줄 전체가 그 방으로 가는 링크다. */
function roomRow(r) {
  return `<a class="list-row" href="/discussion.html?problemId=${r.problemId}">
    <span class="list-row-title">${escapeHtml(r.problemTitle)}</span>
    <span class="meta">
      <span class="list-row-domain">${escapeHtml(domainLabel(r.domain))}</span>
      글 ${r.postCount}개 · 최근 글 ${shortDay(r.lastPostAt)}
    </span>
  </a>`;
}

function filtered() {
  return (uses("q") && !!state.q) || (uses("domain") && !!state.domain)
      || (uses("category") && !!state.category);
}

/* 탭마다 다른 주소를 부르고, 같은 모양({hasNext, rows, rowHtml})으로 맞춰 돌려준다. */
async function fetchTab() {
  if (state.tab === "rooms") {
    const data = await api("/api/quiz/rooms?" + new URLSearchParams({ domain: state.domain, page: state.page }));
    return { hasNext: data.hasNext, rows: data.rooms, rowHtml: roomRow };
  }
  if (state.tab === "mine" && state.kind === "comments") {
    const data = await api("/api/me/comments?" + new URLSearchParams({ page: state.page }));
    return { hasNext: data.hasNext, rows: data.comments, rowHtml: myCommentRow };
  }
  if (state.tab === "mine") {
    const data = await api("/api/me/posts?" + new URLSearchParams({ kind: state.kind, page: state.page }));
    return { hasNext: data.hasNext, rows: data.posts, rowHtml: postRow };
  }
  const data = await api("/api/quiz/posts?" + new URLSearchParams({
    q: state.q, domain: state.domain, category: state.category, sort: state.sort, page: state.page }));
  return { hasNext: data.hasNext, rows: data.posts, rowHtml: postRow };
}

/* 목록이 비었을 때의 말. "글이 없다"와 "조건에 맞는 글이 없다"와 "여기는 원래 이런 곳이다"를 가른다. */
function emptyText() {
  if (state.page > 0) return "이 쪽에는 더 없습니다.";
  if (filtered()) return "조건에 맞는 것이 없습니다. 검색어를 줄이거나 분야를 바꿔 보세요.";
  if (state.tab === "rooms") return "아직 열린 토론방이 없습니다. 문제를 풀고 첫 글을 쓰면 그 문제의 방이 열립니다.";
  if (state.tab === "mine") {
    if (state.kind === "comments") return "아직 쓴 댓글이 없습니다.";
    return state.kind === "written" ? "아직 쓴 글이 없습니다." : "아직 댓글을 단 글이 없습니다.";
  }
  return `아직 글이 없습니다. <a href="/problems.html">문제</a>를 풀고 첫 글을 남겨 보세요.`;
}

async function load() {
  const list = document.getElementById("list");
  const info = document.getElementById("resultInfo");

  // 내 활동은 로그인해야 본다. 요청을 보내 401을 받는 대신 먼저 말한다 —
  // 401은 공용 처리에서 "세션이 끝났다"로 다뤄져 엉뚱한 안내가 된다.
  if (state.tab === "mine" && !isLoggedIn()) {
    info.hidden = true;
    pager.hide();
    list.innerHTML = `<div class="card meta"><a href="/login.html">로그인</a>하면 내가 쓴 글과
      내가 댓글 단 글을 여기서 모아 볼 수 있습니다.</div>`;
    return;
  }

  showLoading(list);
  let tab;
  try {
    tab = await fetchTab();
  } finally {
    clearLoading(list);   // 실패하면 알림은 show()가 다른 칸에 그린다. 이 줄이 남으면 안 된다
  }
  const { hasNext, rows, rowHtml } = tab;

  info.hidden = !filtered();
  if (filtered()) {
    const parts = [];
    if (uses("q") && state.q) parts.push(`"${state.q}"`);
    if (uses("domain") && state.domain) parts.push(domainLabel(state.domain));
    if (uses("category") && state.category) {
      parts.push(POST_CATEGORIES.find(c => c[0] === state.category)[1]);
    }
    const clear = stateToParams();
    ["q", "domain", "category", "page"].forEach(k => clear.delete(k));
    const clearHref = clear.toString() ? "?" + clear : location.pathname;
    info.innerHTML = `${escapeHtml(parts.join(" · "))} 조건으로 걸러 본 목록입니다.
      <a href="${clearHref}">조건 지우기</a>`;
  }

  if (rows.length) list.innerHTML = rows.map(rowHtml).join("");
  else showEmpty(list, emptyText());

  pager.update({ page: state.page, hasNext });
}

function show() {
  document.getElementById("message").innerHTML = "";
  load().catch(e => {
    showErrorAlert(document.getElementById("message"), e);
  });
}

/* 조건을 바꾸면 주소에 한 칸 쌓고 다시 읽는다. 뒤로 가기가 조건을 하나씩 되돌린다. */
function apply(changes, { replace = false } = {}) {
  Object.assign(state, changes);
  syncControls();
  const query = stateToParams().toString();
  // 검색어는 치는 동안 여러 번 바뀐다. 그때마다 쌓으면 뒤로 가기를 글자 수만큼 눌러야 한다
  history[replace ? "replaceState" : "pushState"](null, "", query ? "?" + query : location.pathname);
  show();
}

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest("[data-tab]");
  // 탭을 옮겨도 분야는 들고 간다. "보안"으로 보다가 토론방으로 넘어가면 보안의 토론방이
  // 나오는 것이 자연스럽다. 쪽은 처음으로 돌린다.
  if (btn && btn.dataset.tab !== state.tab) apply({ tab: btn.dataset.tab, page: 0 });
});
document.getElementById("filterForm").addEventListener("submit", e => e.preventDefault());
wireSearchInput("q", q => apply({ q, page: 0 }, { replace: true }));
// 이 탭이 쓰는 조건을 모두 기본값으로. 탭은 그대로 둔다(무엇을 보러 왔는지는 조건이 아니다)
document.getElementById("filterResetBtn").addEventListener("click", () =>
  apply({ q: "", domain: "", category: "", sort: "latest", kind: "written", page: 0 }));
// 고르는 것은 누르는 즉시 적용한다. 고르고 나서 "찾기"를 또 누르게 하면 한 번이 헛걸음이다.
// 기둥의 분야를 누르면 거른다. 같은 것을 다시 누르면 풀린다. 내 활동 탭에서 누르면 전체 탭으로 간다
document.getElementById("domains").addEventListener("click", e => {
  const btn = e.target.closest(".pl-domain");
  if (!btn) return;
  const tab = uses("domain") ? state.tab : "all";
  const domain = tab === state.tab && state.domain === btn.dataset.domain ? "" : btn.dataset.domain;
  apply({ tab, domain, q: qInput.value.trim(), page: 0 });
});
categoryFilter.addEventListener("change", () => apply({ category: categoryFilter.value, q: qInput.value.trim(), page: 0 }));
sortSelect.addEventListener("change", () => apply({ sort: sortSelect.value, q: qInput.value.trim(), page: 0 }));
kindSelect.addEventListener("change", () => apply({ kind: kindSelect.value, page: 0 }));
const pager = mountPager(document.getElementById("pager"), p => apply({ page: p }));
window.addEventListener("popstate", () => { readStateFromUrl(); show(); });

fillSelect(categoryFilter, POST_CATEGORIES, "전체");
readStateFromUrl();
show();
loadSideRooms();
// 분야 이름은 서버 값으로 다시 그린다(api.js domainsReady). 수는 목록과 따로 받는다
(async () => {
  await domainsReady;
  try { domainCounts = await api("/api/quiz/post-domains"); } catch (e) { /* 수 없이 이름만 */ }
  renderSideDomains();
})();
</script>
</body>
</html>
