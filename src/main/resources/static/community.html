<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 — csquiz</title>
<script>
/* 저장된 테마를 CSS가 오기 전에 <html>에 붙인다(이유는 wrong-answers.html의 같은 자리 주석). */
try {
  var t = localStorage.getItem("csquiz_theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="shell"></div>

<main class="container">
  <h1>커뮤니티</h1>
  <!-- 글쓰기 버튼이 여기 없는 이유를 미리 말한다. 글은 문제의 토론방에 쓰는데,
       이 화면만 본 사람은 어디서 쓰는지 알 길이 없다. -->
  <p class="meta">문제마다 토론방이 있습니다. 여기에는 모든 토론방의 글이 모입니다.
    글은 문제를 푼 뒤 그 문제의 토론방에서 씁니다.</p>

  <!-- 탭 셋. 분야와 말머리는 탭이 아니라 아래 걸러 보기로 둔다 — 분야만 11개라 탭으로 두면 줄이 넘친다.
       탭은 <무엇을 보러 왔는가>로 나눈다: 다 보기 / 방으로 들어가기 / 내 것 보기.

       [뺀 탭 — 2026-10-05] "답변 기다리는 글"(댓글이 없는 글)을 뒀다가 뺐다. 글쓴이는 내 활동에서
       자기 글을 보면 되고, 답해 줄 사람에게도 정렬과 말머리 걸러 보기로 충분했다. 같은 목록을
       두 군데에 두는 셈이었다. -->
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" class="tab-btn" role="tab" data-tab="all">전체</button>
    <button type="button" class="tab-btn" role="tab" data-tab="rooms">토론방</button>
    <button type="button" class="tab-btn" role="tab" data-tab="mine">내 활동</button>
  </div>

  <!-- 찾기·정렬·분야·말머리. 조건은 주소(?tab=&q=&sort=&domain=&category=)에 남긴다 — 글을 읽고 뒤로 돌아왔을 때
       찾던 목록이 그대로 있어야 하고, 찾은 목록을 남에게 보낼 수도 있어야 한다.
       탭마다 쓰는 칸이 다르다(아래 TABS). 안 쓰는 칸은 감춘다 — 눌러도 아무 일 없는 칸을 두지 않는다. -->
  <form class="filters community-filters" id="filterForm" role="search">
    <div class="field" data-control="q">
      <label for="q">제목·본문에서 찾기</label>
      <!-- type="text"다. search로 두면 공용 입력 칸 스타일이 안 걸려 브라우저 기본 모양의 작은 칸이 된다.
           검색이라는 뜻은 폼의 role="search"와 enterkeyhint가 전한다. -->
      <!-- 버튼을 칸 바로 옆에 붙인다. 폼 끝에 두면 좁은 화면에서 줄이 접혀 정렬 칸 옆으로 떨어진다. -->
      <div class="search-row">
        <input type="text" id="q" maxlength="50" placeholder="예: 캐시, 502" enterkeyhint="search">
        <button type="submit">찾기</button>
      </div>
    </div>
    <div class="field" data-control="domain">
      <label for="domainFilter">분야</label>
      <select id="domainFilter"></select>
    </div>
    <div class="field" data-control="category">
      <label for="categoryFilter">말머리</label>
      <select id="categoryFilter"></select>
    </div>
    <div class="field" data-control="sort">
      <label for="sortSelect">정렬</label>
      <select id="sortSelect">
        <option value="latest">최신순</option>
        <option value="comments">댓글 많은 순</option>
      </select>
    </div>
    <div class="field" data-control="kind">
      <label for="kindSelect">보기</label>
      <select id="kindSelect">
        <option value="written">내가 쓴 글</option>
        <option value="commented">내가 댓글 단 글</option>
      </select>
    </div>
  </form>

  <div id="message" role="alert"></div>
  <!-- 무엇으로 걸러 본 목록인지 한 줄. 결과가 0건일 때 "글이 없다"와 "조건에 맞는 글이 없다"를 가른다. -->
  <p class="meta" id="resultInfo" hidden></p>
  <div id="list"></div>

  <div class="pager" id="pager" hidden></div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
/* 커뮤니티 — 탭 셋이 한 화면을 나눠 쓴다.
 *   전체                     GET /api/quiz/posts?q=&sort=&domain=&category=&page=     (공개)
 *   토론방                   GET /api/quiz/rooms?domain=&page=                        (공개)
 *   내 활동                  GET /api/me/posts?kind=&page=                            (로그인)
 * 한 쪽은 20건이다. */
renderShell({ active: "community", title: "커뮤니티" });

const qInput = document.getElementById("q");
const domainFilter = document.getElementById("domainFilter");
const categoryFilter = document.getElementById("categoryFilter");
const sortSelect = document.getElementById("sortSelect");
const kindSelect = document.getElementById("kindSelect");

/* 탭마다 쓰는 조건 칸. 여기 없는 칸은 그 탭에서 감추고, 주소에도 적지 않는다. */
const TABS = {
  all:        { controls: ["q", "domain", "category", "sort"] },
  rooms:      { controls: ["domain"] },
  mine:       { controls: ["kind"] },
};

/* 지금 조건. 주소에서 읽어 시작하고, 바뀔 때마다 주소에 다시 적는다. */
const state = { tab: "all", q: "", domain: "", category: "", sort: "latest", kind: "written", page: 0 };

function uses(control) { return TABS[state.tab].controls.includes(control); }

function readStateFromUrl() {
  const p = new URLSearchParams(location.search);
  state.tab = TABS[p.get("tab")] ? p.get("tab") : "all";
  state.q = (p.get("q") || "").trim();
  state.domain = p.get("domain") || "";
  state.category = POST_CATEGORIES.some(c => c[0] === p.get("category")) ? p.get("category") : "";
  state.sort = p.get("sort") === "comments" ? "comments" : "latest";
  state.kind = p.get("kind") === "commented" ? "commented" : "written";
  state.page = Math.max(Number(p.get("page")) || 0, 0);
  syncControls();
}

/* 조건을 화면의 탭과 칸에 비춘다. */
function syncControls() {
  qInput.value = state.q;
  domainFilter.value = state.domain;
  categoryFilter.value = state.category;
  sortSelect.value = state.sort;
  kindSelect.value = state.kind;
  document.querySelectorAll("#tabs .tab-btn").forEach(b => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll("#filterForm [data-control]").forEach(el => {
    el.hidden = !uses(el.dataset.control);
  });
}

/* 기본값과 이 탭이 안 쓰는 조건은 주소에 적지 않는다 — 아무것도 안 고른 주소가
   /community.html 그대로여야 하고, 토론방 탭의 주소에 검색어가 따라다니면 안 된다. */
function stateToParams() {
  const p = new URLSearchParams();
  if (state.tab !== "all") p.set("tab", state.tab);
  if (uses("q") && state.q) p.set("q", state.q);
  if (uses("domain") && state.domain) p.set("domain", state.domain);
  if (uses("category") && state.category) p.set("category", state.category);
  if (uses("sort") && state.sort !== "latest") p.set("sort", state.sort);
  if (uses("kind") && state.kind !== "written") p.set("kind", state.kind);
  if (state.page > 0) p.set("page", state.page);
  return p;
}

/* 글 한 줄. 링크가 둘이다: 글 제목은 글로, 문제 이름은 그 문제의 토론방으로 간다.
 * 그래서 줄 전체를 링크로 감싸지 않는다 — 링크 안에 링크를 넣을 수 없다. */
function postRow(p) {
  return `<div class="post-row">
    <a class="post-row-title" href="/post.html?id=${p.id}">${postCategoryChip(p.category, p.categoryLabel)}${escapeHtml(p.title)}${
      p.commentCount ? ` <span class="post-row-count">💬 ${p.commentCount}</span>` : ""}</a>
    <span class="meta">
      <span class="post-row-domain">${escapeHtml(domainLabel(p.domain))}</span>
      <a class="post-row-room" href="/discussion.html?problemId=${p.problemId}">${escapeHtml(p.problemTitle)}</a>
      · ${escapeHtml(p.nickname || "탈퇴한 사용자")} · ${formatDate(p.createdAt)}
    </span>
  </div>`;
}

/* 토론방 한 줄. 줄 전체가 그 방으로 가는 링크다. */
function roomRow(r) {
  return `<a class="post-row" href="/discussion.html?problemId=${r.problemId}">
    <span class="post-row-title">${escapeHtml(r.problemTitle)}</span>
    <span class="meta">
      <span class="post-row-domain">${escapeHtml(domainLabel(r.domain))}</span>
      글 ${r.postCount}개 · 최근 글 ${formatDate(r.lastPostAt)}
    </span>
  </a>`;
}

function filtered() {
  return (uses("q") && !!state.q) || (uses("domain") && !!state.domain)
      || (uses("category") && !!state.category);
}

/* 탭마다 다른 주소를 부르고, 같은 모양({hasNext, rows, rowHtml})으로 맞춰 돌려준다. */
async function fetchTab() {
  if (state.tab === "rooms") {
    const data = await api("/api/quiz/rooms?" + new URLSearchParams({ domain: state.domain, page: state.page }));
    return { hasNext: data.hasNext, rows: data.rooms, rowHtml: roomRow };
  }
  if (state.tab === "mine") {
    const data = await api("/api/me/posts?" + new URLSearchParams({ kind: state.kind, page: state.page }));
    return { hasNext: data.hasNext, rows: data.posts, rowHtml: postRow };
  }
  const data = await api("/api/quiz/posts?" + new URLSearchParams({
    q: state.q, domain: state.domain, category: state.category, sort: state.sort, page: state.page }));
  return { hasNext: data.hasNext, rows: data.posts, rowHtml: postRow };
}

/* 목록이 비었을 때의 말. "글이 없다"와 "조건에 맞는 글이 없다"와 "여기는 원래 이런 곳이다"를 가른다. */
function emptyText() {
  if (state.page > 0) return "이 쪽에는 더 없습니다.";
  if (filtered()) return "조건에 맞는 것이 없습니다. 검색어를 줄이거나 분야를 바꿔 보세요.";
  if (state.tab === "rooms") return "아직 열린 토론방이 없습니다. 문제를 풀고 첫 글을 쓰면 그 문제의 방이 열립니다.";
  if (state.tab === "mine") {
    return state.kind === "written" ? "아직 쓴 글이 없습니다." : "아직 댓글을 단 글이 없습니다.";
  }
  return `아직 글이 없습니다. <a href="/problems.html">문제</a>를 풀고 첫 글을 남겨 보세요.`;
}

async function load() {
  const list = document.getElementById("list");
  const info = document.getElementById("resultInfo");

  // 내 활동은 로그인해야 본다. 요청을 보내 401을 받는 대신 먼저 말한다 —
  // 401은 공용 처리에서 "세션이 끝났다"로 다뤄져 엉뚱한 안내가 된다.
  if (state.tab === "mine" && !isLoggedIn()) {
    info.hidden = true;
    pager.hide();
    list.innerHTML = `<div class="card meta"><a href="/login.html">로그인</a>하면 내가 쓴 글과
      내가 댓글 단 글을 여기서 모아 볼 수 있습니다.</div>`;
    return;
  }

  const { hasNext, rows, rowHtml } = await fetchTab();

  info.hidden = !filtered();
  if (filtered()) {
    const parts = [];
    if (uses("q") && state.q) parts.push(`"${state.q}"`);
    if (uses("domain") && state.domain) parts.push(domainLabel(state.domain));
    if (uses("category") && state.category) {
      parts.push(POST_CATEGORIES.find(c => c[0] === state.category)[1]);
    }
    const clear = stateToParams();
    ["q", "domain", "category", "page"].forEach(k => clear.delete(k));
    const clearHref = clear.toString() ? "?" + clear : location.pathname;
    info.innerHTML = `${escapeHtml(parts.join(" · "))} 조건으로 걸러 본 목록입니다.
      <a href="${clearHref}">조건 지우기</a>`;
  }

  list.innerHTML = rows.length ? rows.map(rowHtml).join("") : `<div class="card meta">${emptyText()}</div>`;

  pager.update({ page: state.page, hasNext });
}

function show() {
  document.getElementById("message").innerHTML = "";
  load().catch(e => {
    showErrorAlert(document.getElementById("message"), e);
  });
}

/* 조건을 바꾸면 주소에 한 칸 쌓고 다시 읽는다. 뒤로 가기가 조건을 하나씩 되돌린다. */
function apply(changes) {
  Object.assign(state, changes);
  syncControls();
  const query = stateToParams().toString();
  history.pushState(null, "", query ? "?" + query : location.pathname);
  show();
}

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest("[data-tab]");
  // 탭을 옮겨도 분야는 들고 간다. "보안"으로 보다가 토론방으로 넘어가면 보안의 토론방이
  // 나오는 것이 자연스럽다. 쪽은 처음으로 돌린다.
  if (btn && btn.dataset.tab !== state.tab) apply({ tab: btn.dataset.tab, page: 0 });
});
document.getElementById("filterForm").addEventListener("submit", e => {
  e.preventDefault();
  apply({ q: qInput.value.trim(), page: 0 });
});
// 고르는 것은 누르는 즉시 적용한다. 고르고 나서 "찾기"를 또 누르게 하면 한 번이 헛걸음이다.
domainFilter.addEventListener("change", () => apply({ domain: domainFilter.value, q: qInput.value.trim(), page: 0 }));
categoryFilter.addEventListener("change", () => apply({ category: categoryFilter.value, q: qInput.value.trim(), page: 0 }));
sortSelect.addEventListener("change", () => apply({ sort: sortSelect.value, q: qInput.value.trim(), page: 0 }));
kindSelect.addEventListener("change", () => apply({ kind: kindSelect.value, page: 0 }));
const pager = mountPager(document.getElementById("pager"), p => apply({ page: p }));
window.addEventListener("popstate", () => { readStateFromUrl(); show(); });

fillSelect(domainFilter, DOMAINS, "전체 분야");
fillSelect(categoryFilter, POST_CATEGORIES, "전체 말머리");
readStateFromUrl();
show();
</script>
</body>
</html>
