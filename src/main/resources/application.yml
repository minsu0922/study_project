spring:
  application:
    name: csquiz

  datasource:
    url: jdbc:mysql://localhost:3306/csquiz?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USERNAME:csquiz}
    password: ${DB_PASSWORD:csquiz1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway가 스키마 소유. JPA는 검증만 (엔티티↔테이블 불일치 시 부팅 실패).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # N+1 완화 (로드맵1에서 QueryDSL로 본격 처리)
    open-in-view: false                  # 지연로딩 경계를 서비스 계층으로 명확히
    show-sql: true

  # 관리자 문서 업로드(문제 생성 근거)용 상한. 기본값(파일 1MB)에 기대지 않고 명시한다 —
  # 기본값은 조용히 바뀔 수 있고, 이 값은 "요금이 걸린 입구"라 눈에 보이는 곳에 있어야 한다.
  # 글자 수 상한(20,000자)은 UploadedDocumentReader가 따로 잰다. 여기서 재는 것은 전송량이고
  # 거기서 재는 것은 요금이라 기준이 다르다 — 한글은 UTF-8에서 글자당 3바이트라 여유를 둔다.
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

  flyway:
    enabled: true
    baseline-on-migrate: true            # 기존 DB에도 안전하게 적용
    # out-of-order는 껐다(기본값 false로 복귀). 이 옵션은 V2_1(누락된 시드 보충)을
    # 이미 V3~V6가 적용된 DB에 끼워 넣으려고 켰던 것인데, 그 V2_1과 시드 마이그레이션을
    # 통째로 걷어내면서 필요가 사라졌다(docs/11).
    # 켜 둘 이유가 없으면 꺼야 한다 — "낮은 버전을 나중에 적용"을 허용한다는 건
    # 환경마다 적용 순서가 달라질 수 있다는 뜻이고, 그러면 "마이그레이션만으로 상태를
    # 재현한다"는 전제가 조용히 무너진다.

  # 목록 API 페이징 기본값/상한 (docs/03: 기본 20, 최대 100)
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100               # size 초과 요청은 100으로 잘림(과도한 조회 방지)
    # Redis (로드맵 2): 문서 캐시 + refresh 토큰 저장소.
    # 로컬은 WSL의 redis-server(또는 docker compose의 redis).
    # host를 localhost가 아니라 127.0.0.1로 명시한 이유: JVM이 localhost를 IPv6(::1)로
    # 해석할 수 있는데, WSL2의 포트 중계는 IPv4 쪽만 안정적이라 연결이 실패했다(실측).
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 캐시는 "빨리 실패"가 원칙: 네트워크가 이상하면 2초 안에 포기하고 DB로 간다.
      # (기본 60초를 그대로 두면 Redis가 어중간하게 죽었을 때 요청이 분 단위로 매달린다 — 실측)
      timeout: 2000ms          # 명령 응답 대기 한도
      connect-timeout: 2000ms  # 연결 수립 한도

springdoc:
  swagger-ui:
    path: /swagger-ui.html               # http://localhost:8080/swagger-ui.html

# 커스텀 JWT 설정 (로드맵 2에서 refresh 토큰 도입 — ADR-0001의 예고 이행)
#
# [기본값을 일부러 두지 않았다]
# 전에는 ${JWT_SECRET:local-dev-secret-...} 처럼 기본값이 있었다. 저장소가 공개된 지금
# 그 값은 누구나 읽을 수 있고, 서명 키를 아는 사람은 {"role":"ADMIN"} 토큰을 직접 만들어
# 로그인 없이 관리자 API 전체를 열 수 있다 — 비밀번호를 아무리 바꿔도 소용이 없다.
# 그래서 기본값을 없앤다. 값이 없으면 앱이 아예 뜨지 않는다:
# <b>키를 잊은 채 뜨는 것보다 안 뜨는 편이 안전하다</b>(빠른 실패).
#
# 로컬 실행(bootRun)은 build.gradle이 개발용 값을 넣어 주므로 그대로 돌아가고,
# 테스트는 src/test/resources/application.properties가 준다. 둘 다 jar 실행에는 끼어들지
# 않으므로, 운영 배포는 반드시 JWT_SECRET을 받아야 한다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 3600         # 1시간 (짧게 — 탈취 피해 시간 제한)
  refresh-token-validity-seconds: 1209600     # 14일 (Redis TTL로 자동 만료)

# 초기 관리자 계정 (AdminAccountInitializer가 ADMIN 부재 시 생성)
# 요청 제한 (로드맵 3) — 토큰 버킷. 설계는 docs/09, 결정 배경은 ADR-0003.
# capacity = 순간 버스트 허용량, refill-tokens/refill-period-seconds = 장기 평균 속도.
ratelimit:
  enabled: true                  # 부하 테스트·디버깅 시 false로 임시 해제 가능
  auth:                          # 로그인/회원가입/재발급 — IP당. 무차별 대입 방어가 목적
    capacity: 5
    refill-tokens: 5
    refill-period-seconds: 60    # = 분당 5회
  api:                           # 그 외 /api/** — 사용자당(비로그인은 IP당). 폭주만 걸러내는 상한
    capacity: 60
    refill-tokens: 60
    refill-period-seconds: 60    # = 분당 60회

# 초기 관리자 계정 — AdminAccountInitializer가 ADMIN이 하나도 없을 때 만든다.
#
# [비밀번호에 기본값이 없는 이유]
# 전에는 admin1234가 기본값이었다. 운영 DB는 비어 있는 채로 시작하므로 환경변수를 넣지
# 않으면 <b>공개된 아이디·비밀번호로 관리자 로그인이 되는 상태</b>로 배포된다.
# 로그인은 분당 5회로 제한되지만, 정답을 아는 사람에게는 1회면 충분하다.
# jwt.secret과 같은 판단으로 기본값을 없앴다.
#
# username은 비밀이 아니라 기본값을 남긴다 — 아이디를 감춘다고 지켜지는 것은 없고,
# 값이 없으면 부팅이 막혀 얻는 것 없이 불편만 는다.
admin:
  # V12에서 로그인 아이디가 이메일 → username으로 바뀌었다.
  # 기존 계정(admin@csquiz.local)은 마이그레이션이 @ 앞부분을 따 "admin"으로 만들어 둔다.
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}

# LLM 문제 생성 (B안) — 설계 docs/13, 자동화 docs/14, 결정 ADR-0006(개정).
# API 키는 여기 두지 않는다: SDK가 ANTHROPIC_API_KEY 환경변수를 직접 읽는다(코드/설정 유출 방지).
# 일일 배치는 더 이상 앱 안에서 돌지 않는다 — GitHub Actions가 매일 생성해 저장소에 커밋하고,
# 이 앱은 기동할 때 그 파일을 검수 대기함으로 흡수한다(DraftImportRunner).
# 앱 내부 @Scheduled를 버린 이유: 개인 PC에서 도는 앱이라 06시에 PC가 꺼져 있으면
# 그날 배치가 통째로 사라졌다(실제로 겪음 — docs/14 "왜 옮겼나").
llm:
  generation:
    # opus-4-8 → opus-5: 입력 $5 / 출력 $25 per 1M로 가격이 동일한데 성능만 올라가서
    # 바꾸지 않을 이유가 없다(비용 증가 0). 모델은 언젠가 은퇴하는데, 이제는 매일 도는
    # 생성 워크플로가 실패하면서 메일이 오므로 별도 감시 테스트가 필요 없다.
    # 이 값은 워크플로(DraftGeneratorCli)도 그대로 읽는다 — 설정의 단일 출처.
    model: claude-opus-5

    # 중단 스위치. false면 워크플로가 돌더라도 DraftGeneratorCli가 API를 부르지 않고
    # 즉시 정상 종료한다(요금 0, 실패 아님 → 알림 메일도 안 옴).
    #
    # 급히 멈출 거면 GitHub Actions의 "Disable workflow" 버튼이 더 빠르다. 이 설정을 따로
    # 둔 이유는 다르다 — 버튼은 GitHub 화면 깊숙한 곳에 숨어 있어서, 몇 주 뒤 "왜 요즘 문제가
    # 안 들어오지?" 할 때 원인을 찾기 어렵다. 여기 적어 두면 설정 파일만 봐도 알 수 있고,
    # 껐다는 사실이 커밋 이력에도 남는다(언제·왜 껐는지가 추적된다).
    # 꺼 둔 상태에서 한 번만 생성하려면 워크플로 수동 실행의 force 입력을 true로 준다 —
    # 설정을 true로 바꿨다가 되돌리는 것을 잊어 "끈 줄 알았는데 계속 도는" 사고를 막기 위함.
    #
    # [2026-08-16 꺼 둠 → 2026-08-17 다시 켬]
    # 껐던 이유: 프롬프트 점검에서 13건이 나왔고, 그중 하나는 그대로 돌면 그날 치가 통째로
    # 버려졌다 — 그 주기의 근거 문서(documents/2026-08-15.json)에 중급이 지목하는 두 절이
    # 둘 다 없었는데(절 이름을 문서 생성 뒤에 바꿔서, 2a5538c) 폴백도 안 걸렸다.
    #
    # 켜면서 고친 것:
    #  - 그 구멍 자체: 오늘 난이도가 캘 절이 문서에 없으면 폴백으로 간다(hasMaterialFor).
    #  - 난이도 재정의: 초급을 밀어 올리던 규칙 셋을 걷어냈다. 실측으로 확인 —
    #    초급 지문 평균 112자→38자, 배경 서술 4/5→0/3, 세 난이도의 지문 길이 범위가
    #    이제 서로 겹치지 않는다(38 / 204 / 226).
    #  - 셀 수 있는 규칙을 검증기로: 해설 분량, 초급 지문 길이, 문서 지칭, 보기 번호 지칭,
    #    보기 길이 편향, 마크다운. 문서 쪽은 필수 절·설계 근거 소제목·본론·깨지는 항목 개수.
    #  - 평가 하네스(evalPrompt): 프롬프트를 고쳤을 때 나아졌는지를 하루가 아니라 몇 분 만에
    #    잰다. 켜기 전에 네 번 돌려 위 숫자를 확인했다.
    #
    # 남은 것 하나: 보기 길이 편향(정답이 넷 중 가장 긴 문항)은 프롬프트로 크게 줄지 않았다.
    # 정답 위치 편향과 같은 종류인데 그건 내보낼 때 섞어 없앴고 길이는 섞을 수가 없다.
    # 검증기가 세고 검수자가 정답에서 한 줄 덜어내는 것으로 간다.
    #
    # 급히 멈출 거면 이 값을 false로 되돌린다. 반대로 꺼 둔 채 하루치가 필요하면
    # 워크플로 수동 실행의 force=true로 이 스위치만 건너뛸 수 있다.
    batch-enabled: true

    # 무엇을 만들지 — auto | problem | document (docs/15)
    #
    #   auto(기본) : 4일 주기 그대로. 0일차에 개념 문서 1편, 1·2·3일차에 그 문서를 근거로
    #                초급·중급·고급 문제. 문서와 문제가 하루에 하나씩 번갈아 나온다.
    #   problem    : 문서일에도 문제를 만든다. 주의 — 문서를 안 만들면 근거로 삼을 문서가
    #                안 생겨 배치가 계속 폴백으로 돌고, 결국 문제들이 서로 남남이던
    #                2단계 이전 상태로 돌아간다(그게 문서를 도입한 이유였다).
    #   document   : 문서일에만 문서를 만들고 나머지 사흘은 아무것도 안 한다(요금 0).
    #                "매일 문서"가 아닌 이유는 요금이 네 배가 되기 때문 — 매일 원하면
    #                주기 길이를 바꿔야 하고 그건 이 스위치의 몫이 아니다.
    #
    # 워크플로 수동 실행의 type 입력이 이 설정보다 우선한다. 사람이 "오늘 문서 뽑아"라고
    # 눌렀는데 설정이 막으면 버그처럼 보이고, 수동 실행은 그 한 번만 유효해서
    # 되돌리는 것을 잊는 사고도 없다(force 스위치와 같은 판단).
    # 모르는 값(오타)이 오면 auto로 본다 — 오타 하나로 배치가 통째로 멈추는 것보다 낫다.
    batch-type: auto

    batch-count: 5               # 배치 1회당 생성 문제 수(그날의 칸 대상)
    # 배치가 "알아서 고를" 때의 후보 도메인. 이 프로젝트의 목적은 백엔드 면접 대비인데
    # (Domain.java 주석: "사용자(백엔드 개발자)의 주력 스택") 전체 11개를 균등하게 채우면
    # 매일 나오는 문제의 상당수가 관심 밖 영역이 된다 — 8개로 좁혀 24칸을 24일에 한 바퀴 돈다.
    # 제외: CLOUD_INFRA, FRONTEND_CS, INTEGRATED.
    # 여기서 빠진 도메인도 관리자 화면에서 "직접 지정"하면 그대로 생성된다(제한은 자동 선택에만 적용).
    # 이 목록의 순서가 곧 날짜 순환 순서다(GenerationSchedule) — 순서를 바꾸면 그날 나올 칸이 바뀐다.
    batch-domains: NETWORK,OS,DATABASE,DS_ALGORITHM,SYSTEM_DESIGN,SECURITY,LANGUAGE_RUNTIME,BACKEND_FRAMEWORK

  # 생성 결과 파일 흡수 (docs/14) — 앱 기동 시 generated/*.json을 검수 대기 초안으로 가져온다.
  import:
    enabled: true
    # 저장소 루트 기준 상대 경로. GitHub Actions가 커밋하는 위치와 반드시 같아야 한다.
    # 앱을 다른 작업 디렉터리에서 띄운다면 절대 경로로 바꿔야 파일을 찾는다.
    dir: generated

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace   # 바인딩 파라미터 값 출력 (개발용)
