# 테스트 전용 설정 — 운영 필수값을 여기서 채운다.
#
# [왜 이 파일이 생겼나]
# 2026-08-20 보안 점검에서 application.yml의 jwt.secret·admin.password 기본값을 없앴다.
# 저장소가 공개라 거기 적힌 서명 키는 곧 "누구나 아는 값"이고, 그 키를 아는 사람은
# 로그인 없이 관리자 토큰을 만들 수 있기 때문이다. 값이 없으면 앱이 뜨지 않게 했는데,
# 그러면 @SpringBootTest도 컨텍스트를 못 띄운다. 그 자리를 이 파일이 메운다.
#
# [왜 application.yml이 아니라 .properties인가]
# 테스트 클래스패스에 같은 이름(application.yml)을 두면 본체 설정을 <b>통째로 가린다</b> —
# DB·Redis·요청 제한 같은 나머지 설정이 전부 사라진다. 이름이 다르면 둘 다 읽히고,
# 겹치는 키만 .properties가 이긴다. 그래서 "덮어쓸 값만" 여기 적을 수 있다.
#
# [여기 값이 공개돼도 되는 이유]
# 이 파일은 테스트 클래스패스에만 있다. 빌드된 jar에는 들어가지 않으므로 운영에서 쓰일
# 길이 없고, 이 키로 서명된 토큰은 이 키를 쓰는 서버(=테스트 JVM)에서만 통한다.

# HS384 서명에 쓰이므로 384비트(48바이트) 이상이어야 한다 — 짧으면 컨텍스트 로딩이 실패한다.
jwt.secret=csquiz-test-only-signing-key-never-used-outside-tests-0123456789abcdef
admin.password=test-admin-password
# docker-compose.yml·ci-cd.yml이 띄우는 MySQL의 비밀번호
spring.datasource.password=csquiz1234

# 테스트는 개발 DB(csquiz)가 아니라 csquiz_test에 붙는다. 롤백되지 않는 테스트가 남기는 행이
# 개발 데이터에 섞이지 않고, 개발 데이터가 달라져도 테스트 결과가 흔들리지 않는다.
# 스키마는 Flyway가 처음 붙을 때 만든다. DB 자체는 미리 있어야 한다(docs/07).
spring.datasource.url=jdbc:mysql://localhost:3306/csquiz_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true

# 스냅샷 파일도 저장소의 generated/가 아니라 build/ 아래에 쓴다. 앱은 뜰 때 DB를 읽어
# generated/_*.json을 다시 쓰는데, 테스트 DB는 비어 있어 그대로 두면 배치가 읽는 주제 대기열과
# 기존 문제 목록이 빈 파일로 덮인다. build/는 git이 보지 않는다.
llm.import.dir=build/test-generated

# 테스트는 Redis의 1번 칸을 쓴다. 0번은 개발 앱이 쓰는데, 같이 쓰면 테스트가 남긴 refresh 토큰과
# 요청 제한 버킷이 개발 앱의 것과 섞인다.
spring.data.redis.database=1

# 처리 기록(V35)은 테스트에서 끈다. 롤백되지 않는 테스트(일괄 승인 등)가 관리 API를 부르면
# admin_audit_log에 테스트 계정 이름이 쌓인다. 기록을 재는 테스트만 스스로 켠다
# (AdminAuditAndRevisionIntegrationTest).
admin.audit.enabled=false
